name: Refresh data

on:
  schedule:
    - cron: "0 6 * * 1"      # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ingest/requirements.txt
      - run: python ingest/ingest.py
      # A failed fetch keeps the last good copy, so the catalogue should never
      # shrink. If it does, something is badly wrong: stop before committing,
      # so the site keeps the data it has instead of losing indicators.
      - name: Refuse to shrink the catalogue
        run: |
          python - <<'PY'
          import json, subprocess, sys
          new = json.load(open("data/bundle.json"))
          old = json.loads(subprocess.run(["git", "show", "HEAD:data/bundle.json"],
                                          capture_output=True, text=True, check=True).stdout)
          a, b = len(old["series"]), len(new["series"])
          lost = sorted({s["id"] for s in old["series"]} - {s["id"] for s in new["series"]})
          print(f"series: {a} before, {b} after; kept from an earlier fetch: {new['meta'].get('stale', [])}")
          if b < a - 3:
              print(f"::error::refresh would drop {a - b} series ({', '.join(lost[:20])}); not committing")
              sys.exit(1)
          PY
      # the plain pages search engines read: one per indicator, topic and question, and the sitemap
      - run: python ingest/pages.py
      - name: Commit if changed
        run: |
          git config user.name  "polyoptic-bot"
          git config user.email "bot@users.noreply.github.com"
          # data/ not data/bundle.json — the area files under data/areas/ are
          # rebuilt by the same run, and staging only the bundle would leave
          # the explorer's local detail frozen at whenever it was last built
          # by hand.
          # q/ and index.html too: pages.py rewrites every question's answer
          # and the homepage's list of question links from the new figures;
          # data.html carries a copy of the Verify table for readers without JS
          git add data indicator topic q index.html data.html sitemap.xml
          git diff --staged --quiet || git commit -m "data: scheduled refresh"
          git push
