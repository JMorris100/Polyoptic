name: Refresh data

on:
  schedule:
    - cron: "0 6 * * 1"      # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ingest/requirements.txt
      - run: python ingest/ingest.py
      - name: Commit if changed
        run: |
          git config user.name  "polyoptic-bot"
          git config user.email "bot@users.noreply.github.com"
          # data/ not data/bundle.json — the area files under data/areas/ are
          # rebuilt by the same run, and staging only the bundle would leave
          # the explorer's local detail frozen at whenever it was last built
          # by hand.
          git add data
          git diff --staged --quiet || git commit -m "data: scheduled refresh"
          git push
