<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Build the share images — Polyoptic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EDEFF1;color:#0F1419;font-family:"Public Sans",system-ui,sans-serif;
  font-size:15px;line-height:1.6}
.wrap{max-width:1000px;margin:0 auto;padding:34px 26px 70px}
h1{font-family:Archivo,sans-serif;font-size:27px;margin:0 0 6px;letter-spacing:-0.02em}
p{max-width:70ch;color:#5C6672}
code{font-family:"IBM Plex Mono";font-size:13px;background:#F4F2FA;border:1px solid #D8D2EC;
  padding:1px 6px;border-radius:2px;color:#4633A8}
button{font-family:"IBM Plex Mono";font-size:13px;padding:9px 16px;border-radius:2px;cursor:pointer;
  border:1px solid #4633A8;background:#4633A8;color:#fff}
button.ghost{background:#fff;color:#4633A8}
.card{background:#fff;border:1px solid #D3D8DD;border-radius:3px;padding:16px;margin:16px 0}
.card h2{font-family:"IBM Plex Mono";font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  color:#5C6672;margin:0 0 10px;display:flex;align-items:center;gap:12px}
canvas{width:100%;height:auto;display:block;border:1px solid #D3D8DD}
#status{font-family:"IBM Plex Mono";font-size:13px;color:#4633A8}
</style>
</head>
<body>
<div class="wrap">
  <h1>Share images</h1>
  <p>Eight 1200×630 cards, drawn here because this machine has no image tooling.
    Click <b>Download all</b>, then move the files into <code>og/</code> next to this page.
    The filenames already match the <code>og:image</code> tags on each page — don't rename them.</p>
  <p><button id="all">Download all</button>
     <span id="status">waiting for fonts…</span></p>
  <div id="out"></div>
</div>

<script>
const W=1200,H=630,PURPLE="#4633A8",INK="#0F1419",MUTED="#5C6672",RULE="#D3D8DD",
      S1="#6D4AE0",S2="#0E9384";

/* Brand cards get the purple ground; comparison cards stay white so the chart
   is the loudest thing on them — a chart at thumbnail size is unreadable, and
   summary_large_image only helps if there is something worth enlarging. */
const BRAND=[
  {file:"home",   t:"UK statistics, made comparable",
   s:"75 official series, charted together — with the caveats the headlines leave out."},
  {file:"explore",t:"Build the chart yourself",
   s:"Fourteen chart types, local-authority detail, and the working behind every figure."},
  {file:"verify", t:"Check every figure",
   s:"Each series with its release, licence, fetch date and the endpoint it came from."},
  {file:"about",  t:"An honesty layer over official statistics",
   s:"Built by Josh Morris. Polyoptic publishes no data of its own."},
];
const QS=[
  {file:"have-rents-outrun-pay",       q:"Have rents outrun pay?",                   ids:["rents","pay"],   from:2015,to:2026,geo:"UK"},
  {file:"what-does-the-debt-cost-to-carry", q:"What does the debt cost to carry?",   ids:["psnd","debtint"],from:1993,to:2026,geo:"UK"},
  {file:"has-pay-kept-up-with-prices", q:"Has pay kept up with prices?",             ids:["pay","cpih"],    from:2000,to:2026,geo:"UK"},
  {file:"did-lost-schooling-widen-the-gap", q:"Did lost schooling widen the attainment gap?", ids:["absence","gap"], from:2010,to:2026,geo:"England"},
];

function wrap(ctx,text,max){
  const words=String(text).split(" "); const lines=[]; let line="";
  for(const w of words){
    const t=line?line+" "+w:w;
    if(ctx.measureText(t).width>max&&line){lines.push(line);line=w;} else line=t;
  }
  if(line) lines.push(line);
  return lines;
}
function mark(ctx,x,y,scale,colour){
  /* the polyoptic eye, same path as the favicon */
  ctx.save(); ctx.translate(x,y); ctx.scale(scale,scale);
  const p=new Path2D("M10 50 Q50 -10 90 50 Q50 102 10 50 Z");
  ctx.strokeStyle=colour; ctx.lineWidth=5; ctx.lineJoin="round"; ctx.stroke(p);
  ctx.save(); ctx.clip(p); ctx.fillStyle=colour;
  [[29.75,46.56,18.72],[41.25,36.48,28.8],[52.75,42.6,22.68],[64.25,30.72,34.56]]
    .forEach(([bx,by,bh])=>ctx.fillRect(bx,by,6,bh));
  ctx.restore(); ctx.restore();
}
function wordmark(ctx,x,y,colour,size){
  ctx.font=`800 ${size}px Archivo, sans-serif`; ctx.fillStyle=colour;
  ctx.fillText("poly",x,y);
  const w=ctx.measureText("poly").width;
  ctx.font=`500 ${size}px Archivo, sans-serif`;
  ctx.globalAlpha=.85; ctx.fillText("optic",x+w,y); ctx.globalAlpha=1;
}

function drawBrand(ctx,c){
  ctx.fillStyle=PURPLE; ctx.fillRect(0,0,W,H);
  mark(ctx,74,60,0.66,"#fff");
  wordmark(ctx,148,116,"#fff",34);
  ctx.font="800 68px Archivo, sans-serif"; ctx.fillStyle="#fff";
  const lines=wrap(ctx,c.t,W-148);
  lines.forEach((l,i)=>ctx.fillText(l,74,290+i*76));
  ctx.font="400 27px 'Public Sans', system-ui, sans-serif";
  ctx.globalAlpha=.82;
  wrap(ctx,c.s,W-190).forEach((l,i)=>ctx.fillText(l,74,300+lines.length*76+i*38));
  ctx.globalAlpha=1;
  ctx.font="400 21px 'IBM Plex Mono', monospace";
  ctx.globalAlpha=.7; ctx.fillText("polyoptic.co",74,H-52); ctx.globalAlpha=1;
}

function drawQ(ctx,c,db){
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,W,H);
  ctx.fillStyle=PURPLE; ctx.fillRect(0,0,W,10);
  mark(ctx,74,44,0.42,PURPLE);
  wordmark(ctx,122,80,PURPLE,22);

  ctx.font="800 52px Archivo, sans-serif"; ctx.fillStyle=INK;
  const lines=wrap(ctx,c.q,W-148);
  lines.forEach((l,i)=>ctx.fillText(l,74,168+i*58));

  const sets=c.ids.map((id,i)=>{
    const s=db.series.find(x=>x.id===id); if(!s) return null;
    const pts=s.values.map((v,k)=>[s.start+k,v])
      .filter(q=>q[0]>=c.from&&q[0]<=c.to&&q[1]!=null);
    if(pts.length<2) return null;
    const base=pts[0][1];
    return {name:s.name,colour:i?S2:S1,pts:pts.map(([y,v])=>[y,v/base*100])};
  }).filter(Boolean);

  const top=190+lines.length*58, bot=H-104, L=74, R=W-74;
  if(sets.length<2){
    ctx.font="400 24px 'Public Sans', system-ui, sans-serif"; ctx.fillStyle=MUTED;
    ctx.fillText("Rebuild data/bundle.json to draw this card.",L,top+40);
  } else {
    const vals=sets.flatMap(s=>s.pts.map(q=>q[1]));
    let mn=Math.min(...vals),mx=Math.max(...vals);
    const pad=(mx-mn)*0.14; mn-=pad; mx+=pad;
    const xs=sets.flatMap(s=>s.pts.map(q=>q[0]));
    const x0=Math.min(...xs),x1=Math.max(...xs);
    const PX=y=>L+((y-x0)/Math.max(1,x1-x0))*(R-L-70);
    const PY=v=>top+(1-(v-mn)/(mx-mn))*(bot-top);
    ctx.strokeStyle=RULE; ctx.lineWidth=1;
    for(let i=0;i<=3;i++){const y=top+i*(bot-top)/3;
      ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(R-70,y);ctx.stroke();}
    ctx.lineWidth=4.5; ctx.lineJoin="round"; ctx.lineCap="round";
    sets.forEach(s=>{
      ctx.strokeStyle=s.colour; ctx.beginPath();
      s.pts.forEach((q,i)=>i?ctx.lineTo(PX(q[0]),PY(q[1])):ctx.moveTo(PX(q[0]),PY(q[1])));
      ctx.stroke();
      const last=s.pts[s.pts.length-1];
      ctx.font="500 20px 'IBM Plex Mono', monospace"; ctx.fillStyle=s.colour;
      ctx.fillText(Math.round(last[1]),PX(last[0])+12,PY(last[1])+7);
    });
    ctx.font="400 19px 'IBM Plex Mono', monospace"; ctx.fillStyle=MUTED;
    ctx.fillText(x0,L,bot+30); ctx.textAlign="right"; ctx.fillText(x1,R-70,bot+30);
    ctx.textAlign="left";
    let lx=L;
    ctx.font="500 20px 'Public Sans', system-ui, sans-serif";
    sets.forEach(s=>{
      ctx.fillStyle=s.colour; ctx.fillRect(lx,H-72,13,13);
      ctx.fillStyle=INK; ctx.fillText(s.name,lx+21,H-60);
      lx+=ctx.measureText(s.name).width+58;
    });
  }
  ctx.font="400 19px 'IBM Plex Mono', monospace"; ctx.fillStyle=MUTED;
  ctx.textAlign="right";
  ctx.fillText(`${c.from}–${c.to} · ${c.geo} · polyoptic.co`,W-74,H-24);
  ctx.textAlign="left";
}

const made=[];
function panel(file,draw){
  const box=document.createElement("div"); box.className="card";
  box.innerHTML=`<h2>${file}.png <button class="ghost" data-f="${file}">Download</button></h2>`;
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  box.appendChild(cv); document.getElementById("out").appendChild(box);
  draw(cv.getContext("2d"));
  made.push({file,cv});
  box.querySelector("button").onclick=()=>save(file,cv);
}
function save(file,cv){
  cv.toBlob(b=>{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(b); a.download=file+".png"; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  },"image/png");
}

const status=document.getElementById("status");
Promise.all([
  document.fonts.ready,
  fetch("../data/bundle.json",{cache:"no-cache"}).then(r=>r.ok?r.json():Promise.reject())
]).then(([,db])=>{
  /* Fonts must be loaded before anything is drawn — canvas silently falls back
     to a system face and the card ships in the wrong typeface. */
  BRAND.forEach(c=>panel(c.file,ctx=>drawBrand(ctx,c)));
  QS.forEach(c=>panel(c.file,ctx=>drawQ(ctx,c,db)));
  status.textContent=`${made.length} cards ready`;
  document.getElementById("all").onclick=()=>{
    made.forEach((m,i)=>setTimeout(()=>save(m.file,m.cv),i*450));
    status.textContent="downloading…";
  };
}).catch(()=>{status.textContent="data/bundle.json isn't being served — run this from the dev server.";});
</script>
</body>
</html>
