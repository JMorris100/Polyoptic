/* ══════════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════════ */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function buildSets(p){
  const sets=p.sel.map((id,i)=>{
    const s=S(id); if(!s) return null;
    return {id,name:s.name,meta:s,colour:PAL(i),unit:unitLabel(s,p),pts:transform(s,p)};
  }).filter(Boolean);
  return p.trans==="rel"&&!AREA_CHARTS.has(p.chart) ? relSets(p,sets) : sets;
}

/* "Relative to last series": every other series divided by the last one,
   both rebased to the shared base year first, so 100 means "moved in step
   since the base year". One line answers "has A outrun B" without the reader
   comparing two slopes. Each derived set carries both series' metadata so
   sources and breaks still credit the denominator. */
function relSets(p,sets){
  if(sets.length<2) return sets;
  const den=sets[sets.length-1], dm=new Map(den.pts.map(q=>[q[0],q[1]]));
  const b=indexBase(p);
  return sets.slice(0,-1).map(s=>({
    id:s.id, name:`${s.name} ÷ ${den.name}`, meta:s.meta, metas:[s.meta,den.meta], den:den.name, colour:s.colour,
    unit:`index ÷ index, ${b==null?"first year":Math.floor(b)}=100`,
    pts:s.pts.map(([y,v])=>{const d=dm.get(y);return [y,(v!=null&&d)?v/d*100:null];})
  }));
}

/* auto titles join with "and" — "×" reads as multiplication */
const autoTitle=sets=>{const n=sets.map(s=>s.name);
  return n.length<2?(n[0]||""):n.slice(0,-1).join(", ")+" and "+n[n.length-1];};

/* The x range actually drawn. It starts at the first year with data rather
   than at an empty 1997, and on a rebased chart at the shared base year, so
   every line starts from 100 together. A gap chart runs only over the years
   both series cover. The area views keep the panel's own range. */
function viewOf(p,sets){
  if(!sets.length||p.chart==="scatter"||p.chart==="slope"||AREA_CHARTS.has(p.chart)) return p;
  const yrs=s=>s.pts.filter(q=>q[1]!=null).map(q=>q[0]);
  let x0=null,x1=null;
  if(p.chart==="gap"&&sets.length===2){
    const b=new Set(yrs(sets[1])), sh=yrs(sets[0]).filter(y=>b.has(y));
    if(sh.length){x0=sh[0];x1=sh[sh.length-1];}
  }
  if(x0==null){
    const all=sets.flatMap(yrs); if(!all.length) return p;
    x0=Math.min(...all); x1=Math.max(...all);
    if(p.trans==="index"||p.trans==="rel"){const b=indexBase(p); if(b!=null) x0=Math.max(x0,b);}
  }
  x0=Math.max(p.from,Math.floor(x0)); x1=Math.min(p.to,Math.ceil(x1));
  return x1-x0>=1 ? {...p,from:x0,to:x1} : p;
}
const clipSets=(sets,v)=>sets.map(s=>({...s,pts:s.pts.filter(q=>q[0]>=v.from&&q[0]<=v.to)}));

/* Headline numbers for a gap chart: how far each series moved over the
   years drawn, so the reader doesn't have to work it out from the axis. */
function statsData(p,sets){
  if(p.chart!=="gap"||sets.length!==2||p.trans==="yoy") return [];
  return sets.map(s=>{const ok=s.pts.filter(q=>q[1]!=null); if(ok.length<2||!ok[0][1]) return null;
    const ch=(ok[ok.length-1][1]/ok[0][1]-1)*100;
    return {s, pct:`${ch>=0?"+":"−"}${Math.abs(ch).toFixed(Math.abs(ch)<10?1:0)}%`,
      span:`${Math.floor(ok[0][0])}–${Math.floor(ok[ok.length-1][0])}`};}).filter(Boolean);
}
function statsFor(p,sets){
  const st=statsData(p,sets);
  return st.length?`<div class="stats">${st.map(d=>`<div class="stat"><b>${d.pct}</b>
      <span><span class="d" style="background:${d.s.colour}"></span>${esc(d.s.name)}, ${d.span}</span></div>`).join("")}</div>`:"";
}

/* Draw a panel's chart: trim to the view, size the margins, render. Used by
   the panel and by live resizing, so both draw the same thing. */
function drawChart(p,sets){
  const v=viewOf(p,sets), vs=clipSets(sets,v);
  setLayout(v,vs);
  const chart=chartFor(v,vs);
  /* drawn straight after the chart, with the same margins, so it lines up */
  const rib = RIBBONS.has(p.era)&&BANDED.has(p.chart)
    ? CK.ribbon({mode:p.era,x0:v.from,x1:v.to,sx:y=>px(v,y),l:M.l,r:W-M.r,W,eras:DB.eras,pms:DB.pms}) : "";
  const evRib = p.ev==="ribbon"&&BANDED.has(p.chart)
    ? CK.eventRibbon({x0:v.from,x1:v.to,sx:y=>px(v,y),l:M.l,r:W-M.r,W}) : "";
  return statsFor(v,vs)+chart+rib+evRib;
}

function warningsFor(p,sets){
  const w=[];
  /* The area view is a cross-section, so most of the warnings below are about
     things it does not do. It gets its own set instead. */
  if(AREA_CHARTS.has(p.chart)){
    const set=areaSet(sets);
    if(!set) return w;
    if(sets.length>1)
      w.push({html:`<b>Showing ${esc(set.name)} only.</b> The area views draw one indicator; the other ${sets.length>2?"indicators are":"indicator is"} still on the chart's other views.`});
    if(p.trans!=="none")
      w.push({html:`<b>Figures as published.</b> Rebasing, year-on-year and the per-person transforms describe movement over time and are not applied here.`});
    const ix=AREAIX, d=AREADATA.get(set.id);
    if(ix&&ix!=="error"&&d&&d!=="error"){
      const lvl=areaLevel(p,set.id);
      if(p.chart==="areas"||p.chart==="map"){
        const {year,end}=areaRows(p,d,ix,lvl);
        if(year!==Math.min(p.to,end))
          w.push({html:`<b>Showing ${year}.</b> No area at this level carries a figure for ${p.to}; ${year} is the most recent that does.`});
      } else if(p.chart==="arrow"||p.chart==="range"){
        const {y0,y1}=areaPair(p,d,ix,lvl);
        if(y0!==Math.min(p.from,p.to)||y1!==Math.max(p.from,p.to))
          w.push({html:`<b>Comparing ${y0} with ${y1}.</b> The years asked for are not both published at this level, so the nearest that are have been used.`});
        w.push({html:`<b>Two moments, not a trend.</b> Everything between the two years is left out, so an area that rose and fell back looks unchanged.`});
      }
      w.push({html:`<b>Areas as they are drawn today.</b> Local authorities merge and split, and ONS restates the back series onto current boundaries — so a long run for one area is a run for the ground it now covers, not for the council that used to run it.`});
    }
    return w;
  }
  /* A one- or two-year indicator has no trend to draw. Say so, and offer the
     view it was published for. */
  const snap=sets.find(s=>s.meta.snapshot);
  if(snap){
    const ys=snap.meta.values.map((v,i)=>v==null?null:snap.meta.start+i).filter(y=>y!=null);
    w.push({html:`<b>${esc(snap.meta.name)} is a snapshot.</b> It is published for ${ys.length>1?`${ys[0]} and ${ys[ys.length-1]}`:ys[0]} only, so there is no trend to draw — it reads best as a map of areas.`,act:"tomap",id:snap.id});
  }
  if(p.gran!=="years"&&sets.length)
    w.push({html:`<b>Interpolated detail.</b> These series are published annually. The ${esc(p.gran)} view estimates points between the annual figures — the shape is real, the fine detail is not.`});
  const geos=[...new Set(metasOf(sets).map(m=>m.geography))];
  if(geos.length>1) w.push({html:`<b>Different geographies.</b> Comparing ${esc(geos.join(" with "))}. These cover different populations and are not like for like.`});
  const bases=[...new Set(metasOf(sets).map(m=>m.year_basis))];
  if(bases.length>1) w.push({html:`<b>Different year bases.</b> Mixing ${esc(bases.join(", "))} years. Academic and financial years plot at their starting calendar year, so a point can be up to twelve months out.`});
  const units=[...new Set(sets.map(s=>s.unit))];
  if(units.length>1&&p.trans!=="index"&&p.trans!=="yoy")
    w.push({html:`<b>Different units.</b> Each series is on its own axis, which can make any two lines appear to move together.`,act:"rebase"});
  /* The base is a panel-wide fact and it is frequently not the year the reader
     typed into the range box, so say so. Silence here is what made two lines
     rebased a decade apart look like a like-for-like comparison. */
  if((p.trans==="index"||p.trans==="rel")&&sets.length){
    const b=indexBase(p);
    if(b==null)
      w.push({html:`<b>Nothing to rebase on.</b> These series never overlap inside this range, so each one is set to 100 at its own first year and the two lines are not comparable. Narrow the selection or widen the range.`});
    else if(Math.floor(b)!==p.from)
      w.push({html:`<b>Rebased to ${Math.floor(b)}, not ${p.from}.</b> That is the first year every series on this chart has a figure — the earliest point they can honestly share a base.`});
  }
  const skipped=sets.filter(s=>["real","percap","pctgdp"].includes(p.trans)&&!applies(p.trans,s.meta));
  if(skipped.length) w.push({html:`<b>Transform skipped for ${esc(skipped.map(s=>s.name).join(", "))}.</b> Already a rate, ratio or index — deflating or dividing by population would be meaningless.`});
  /* A break warning that only states the problem leaves the reader holding it.
     Cutting the range at the break is the honest chart, and it is one click. */
  metasOf(sets).flatMap(m=>(m.discontinuities||[])
        .filter(d=>d.year>=p.from&&d.year<=p.to).map(d=>({s:m.name,id:m.id,...d})))
      .forEach(d=>w.push({
        html:`<b>Break in ${esc(d.s)} at ${d.year}.</b> ${esc(d.note)}`,
        act:"cut", year:d.year, id:d.id, name:d.s}));
  return w;
}

function chartFor(p,sets){
  if(AREA_CHARTS.has(p.chart)) return renderAreaChart(p,sets);
  if(p.chart==="slope") return renderSlope(p,sets);
  if(p.chart==="colstack") return sets.length>=2 ? renderColStack(p,sets)
    : `<div class="blank"><h3>Stacking needs at least two</h3><div>Add another indicator to stack them.</div></div>`;
  if(p.chart==="scatter") return sets.length===2 ? renderScatter(p,sets)
    : `<div class="blank"><h3>Scatter needs exactly two</h3><div>Points are coloured by the government of the day.</div></div>`;
  if(p.chart==="small") return renderSmall(p,sets);
  if(p.chart==="gap"&&sets.length!==2) return `<div class="blank"><h3>Gap needs exactly two</h3><div>The space between the two lines is shaded.</div></div>`;
  if(p.chart==="bar") return renderBar(p,sets);
  if(p.chart==="stack") return sets.length>=2 ? renderStack(p,sets)
    : `<div class="blank"><h3>Stacking needs at least two</h3><div>Add another indicator to stack them.</div></div>`;
  return renderLine(p,sets,p.chart);
}

/* The area views' table: the published figure for every area, as ranked.
   The time charts use Check the numbers (verifyHtml) instead. */
function tableFor(p,sets){
  if(AREA_CHARTS.has(p.chart)){
    const a=areaPrep(p,sets);
    if(a.err) return a.err;
    const {rows,year}=areaRows(p,a.d,a.ix,a.lvl);
    if(!rows.length) return `<div class="blank"><h3>Nothing at this level</h3><div>No areas here carry a figure.</div></div>`;
    const o=p.asort==="name"||p.asort==="asc"?p.asort:"desc";
    rows.sort(o==="name"?(x,y)=>x[1].localeCompare(y[1]):o==="asc"?(x,y)=>x[2]-y[2]:(x,y)=>y[2]-x[2]);
    const sb=(k,label,on)=>`<button class="thsort${on?" on":""}" data-act="tsort" data-k="${k}">${label}</button>`;
    return `<table class="ptable"><thead><tr><th>${sb("name","Area"+(o==="name"?" ↓ A–Z":""),o==="name")}</th><th>Code</th>
      <th class="num">${sb(o==="desc"?"asc":"desc",`${year} · ${esc(a.set.meta.unit)} ${o==="asc"?"↑":o==="desc"?"↓":""}`,o!=="name")}</th></tr></thead><tbody>${
      rows.map(r=>`<tr><td>${esc(r[1])}</td><td class="mono">${esc(r[0])}</td><td class="num">${fmt(r[2])}</td></tr>`).join("")
    }</tbody></table>`;
  }
  return "";
}

/* ══════════════════════════════════════════════
   CHECK THE NUMBERS — the fetch log, inside a chart
   Every year on the chart, from the figure as published to the number
   plotted, with the arithmetic in between written out — the whole-chart
   version of the working a single click shows. Values are worked from the
   same transform() the chart uses, so the "On chart" column is the plotted
   number, not a re-derivation that could drift from it.
   ══════════════════════════════════════════════ */
const REF_NAME={deflator:"GDP deflator",population:"Population",gdp:"GDP"};
const TRANS_REF={real:"deflator",percap:"population",pctgdp:"gdp"};
/* enough decimals that the sums can be checked by hand */
const vfmt=n=>n==null?"–":n.toLocaleString("en-GB",{maximumFractionDigits:Math.abs(n)>=1000?1:Math.abs(n)>=1?2:4});
const rawAt=(s,y)=>{const i=y-s.start;return (i>=0&&i<s.values.length)?s.values[i]:null;};

const baseYr=p=>{const b=indexBase(p); return b==null?null:Math.floor(b);};
function methodText(p,ids){
  const by=baseYr(p)??p.from, t=p.trans, last=ids.length?S(ids[ids.length-1]).name:"";
  return ({
    none:"Values are plotted exactly as published.",
    index:`Rebased: each value ÷ that series' ${by} value × 100. ${by} is the first year every series has data.`,
    rel:`Each series is rebased to ${by} = 100, then divided by the rebased ${esc(last)} and × 100. Above 100 means it grew faster.`,
    yoy:"Year-on-year: (this year ÷ last year − 1) × 100.",
    roll3:"3-year average: the mean of this year and the two before it.",
    real:"Real terms: value × 2024 GDP deflator ÷ that year's deflator, so every year is in 2024 prices.",
    percap:"Per person: value ÷ UK population that year.",
    pctgdp:"% of GDP: value ÷ nominal GDP that year × 100."
  })[t]||"";
}

/* the arithmetic for one cell, using the same inputs transform() used */
function howFor(s,p,y){
  const t=p.trans==="rel"?"index":p.trans, r=rawAt(s,y);
  if(r==null||t==="none") return "";
  if(t==="index"){const by=baseYr(p)??p.from;
    const b=yearsOf(s).find(x=>x>=by&&rawAt(s,x)!=null); if(b==null) return "";
    return `${vfmt(r)} ÷ ${vfmt(rawAt(s,b))} × 100`;}
  if(t==="yoy"){const q=rawAt(s,y-1); return q?`(${vfmt(r)} ÷ ${vfmt(q)} − 1) × 100`:"no previous year";}
  if(t==="roll3"){const w=[y-2,y-1,y].map(x=>rawAt(s,x)).filter(v=>v!=null); return `mean of ${w.map(fmt).join(", ")}`;}
  if(!applies(t,s)) return "not applied to a rate or index";
  if(t==="real") return `${vfmt(r)} × ${vfmt(refAt("deflator",2024))} ÷ ${vfmt(refAt("deflator",y))}`;
  if(t==="percap") return `${vfmt(r)} ÷ ${vfmt(refAt("population",y))}`;
  if(t==="pctgdp") return `${vfmt(r)} ÷ ${vfmt(refAt("gdp",y))} × 100`;
  return "";
}

function verifyHtml(p){
  const yp={...p,gran:"years"};
  const ids=p.sel.filter(id=>S(id)), ser=ids.map(S);
  if(!ser.length) return "";
  const plotted=buildSets(yp), view=viewOf(yp,plotted);
  const rel=p.trans==="rel", transformed=p.trans!=="none";
  /* each series transformed on its own — for rel this is the rebased index */
  const own=ser.map(s=>new Map(transform(s,rel?{...yp,trans:"index"}:yp).map(q=>[q[0],q[1]])));
  const ratio=rel?plotted.map(s=>new Map(s.pts.map(q=>[q[0],q[1]]))):[];
  const ref=TRANS_REF[p.trans];
  const brk=new Map(); ser.forEach(s=>(s.discontinuities||[]).forEach(d=>brk.set(s.id+"|"+d.year,d)));
  const years=[]; for(let y=view.from;y<=view.to;y++) years.push(y);
  const ownUnit=s=>rel?unitLabel(s,{...p,trans:"index"}):unitLabel(s,p);

  const head1=`<th rowspan="2" class="vy">Year</th>${ref?`<th rowspan="2">${REF_NAME[ref]}</th>`:""}`+
    ser.map((s,i)=>`<th colspan="${transformed?2:1}" class="vser"><span class="d" style="background:${PAL(i)}"></span>${esc(s.name)}</th>`).join("")+
    (rel?plotted.map(s=>`<th rowspan="2" class="vser">${esc(s.name)}<span class="vu">on chart</span></th>`).join(""):"");
  const head2=ser.map(s=>`<th>Published<span class="vu">${esc(s.unit)}</span></th>`+
    (transformed?`<th>${rel?"Rebased":"On chart"}<span class="vu">${esc(ownUnit(s))}</span></th>`:"")).join("");

  const rows=years.map(y=>{
    const marks=ser.map(s=>brk.get(s.id+"|"+y)).filter(Boolean);
    const cells=ser.map((s,i)=>{
      const r=rawAt(s,y), v=own[i].get(y), b=brk.get(s.id+"|"+y);
      const pub=`<td class="vn${b?" vbrk":""}"${b?` title="${esc(b.note)}"`:""}>${r==null?'<span class="vnone">no data</span>':vfmt(r)}</td>`;
      if(!transformed) return pub;
      const how=howFor(s,p,y);
      return pub+`<td class="vn vout">${v==null?'<span class="vnone">–</span>':vfmt(v)}${how?`<span class="vhow">${esc(how)}</span>`:""}</td>`;
    }).join("");
    const den=own[own.length-1];
    const rc=rel?ratio.map((m,k)=>{const v=m.get(y),a=own[k].get(y),d=den.get(y);
      return `<td class="vn vout">${v==null?'<span class="vnone">–</span>':vfmt(v)}${v!=null?`<span class="vhow">${vfmt(a)} ÷ ${vfmt(d)} × 100</span>`:""}</td>`;}).join(""):"";
    return `<tr data-y="${y}"${p.vy===y?' class="sel"':""}><th class="vy">${y}${marks.length?` <span class="vtag" title="${esc(marks.map(d=>d.note).join(" "))}">break</span>`:""}</th>`+
      (ref?`<td class="vn">${vfmt(refAt(ref,y))}</td>`:"")+cells+rc+`</tr>`;
  }).join("");

  const srcs=ser.map((s,i)=>`<div class="vsrc"><span class="d" style="background:${PAL(i)}"></span><b>${esc(s.name)}</b>
      ${s.source_url?`<a href="${esc(s.source_url)}" target="_blank" rel="noopener">Source release ↗</a>`:""}
      ${s.source_api?`<a href="${esc(s.source_api)}" target="_blank" rel="noopener">API endpoint ↗</a>`:""}
      <a href="data.html#${esc(s.id)}" target="_blank" rel="noopener">Every value in the fetch log ↗</a>
      <span class="vfetch">checked ${esc(ukDate(s.fetched)||"—")}</span></div>`).join("");

  const notes=[
    DB.meta.provenance==="placeholder"?`<b>Placeholder data.</b> These are not real statistics.`:"",
    p.gran!=="years"?`Checked against the published annual figures. The ${esc(p.gran)} detail on the chart is interpolated between them.`:"",
    ref?`${REF_NAME[ref]} comes from the ONS reference series listed in the fetch log.`:""
  ].filter(Boolean);

  return `<div class="verify">
    <div class="vhd"><div><h3>Check the numbers</h3>
      <p>${methodText(p,ids)} Click a point on the chart to see its working and jump to its year.</p></div>
      <button class="vx" data-act="tabletoggle" aria-label="Close">×</button></div>
    ${notes.map(n=>`<p class="vnote">${n}</p>`).join("")}
    <div class="vscroll"><table class="vtbl"><thead><tr>${head1}</tr>${transformed?`<tr>${head2}</tr>`:`<tr></tr>`}</thead><tbody>${rows}</tbody></table></div>
    <div class="vsrcs">${srcs}</div>
    <div class="vfoot">Published values are annual. Where a source publishes monthly or quarterly, each year is the average, the last month or the total, whichever the measure calls for, and the working above says which. Compare against that figure in the source.
      <button class="vcsv" data-act="csv">${IC.csv} Download chart data (CSV)</button></div>
  </div>`;
}

function panelHtml(p,i){
  const sets=buildSets(p);
  const anyApplies=t=>p.sel.some(id=>applies(t,S(id)));
  const open = state.openCfg===p.key;
  const menuOpen = state.openMenu===p.key;
  const lk = lockedKeys.has(p.key);

  const sel=(act,opts,cur,disFn)=>`<div class="dd"><select data-act="${act}" aria-label="${act}">${
    opts.map(([k,l])=>`<option value="${k}"${cur===k?" selected":""}${disFn&&disFn(k)?" disabled":""}>${l}</option>`).join("")
  }</select></div>`;

  /* Level and order only exist for the area view, and the level list is the
     one this particular indicator publishes — no offering districts for a
     series that stops at regions. */
  const aset=AREA_CHARTS.has(p.chart)?areaSet(sets):null;
  const alvls=aset?areaLevels(aset.id):[];
  const areaCtrl = !aset||!alvls.length ? "" :
    `<span class="plabel">Level</span>${sel("lvl",alvls.map(k=>[k,((AREAIX||{}).levelNames||{})[k]||k]),areaLevel(p,aset.id))}
     <span class="plabel">Order</span>${sel("asort",AREA_SORTS,p.asort)}`;

  /* Why a type is unavailable belongs on the tile, not in a silent disable —
     "Scatter needs exactly two" is the answer to the question the greyed-out
     tile provokes. */
  const chartWhy = k =>
      k==="scatter" && p.sel.length!==2                      ? "Scatter needs exactly two indicators"
    : k==="gap" && p.sel.length!==2                          ? "Gap needs exactly two indicators"
    : (k==="stack"||k==="colstack") && p.sel.length<2        ? "Stacking needs at least two indicators"
    : AREA_CHARTS.has(k) && p.sel.length && !areaSet(sets)   ? "No local figures for these indicators"
    : "";
  const picker = CHART_GROUPS.map(([head,items])=>
    `<div class="ctgroup"><span class="ctghead">${head}</span><div class="ctgrid">${
      items.map(([k,label])=>{ const why=chartWhy(k);
        return `<button class="ct${p.chart===k?" on":""}" data-act="charttile" data-v="${k}"`+
          `${why?` disabled title="${esc(why)}"`:""} aria-pressed="${p.chart===k}">`+
          `${CHART_ICON[k]}<span>${esc(label)}</span></button>`;
      }).join("")}</div></div>`).join("");

  const ctrl=`<div class="cfgpanel" ${open?"":"hidden"}>
    ${picker}
    <div class="cfgrule"></div>
    <span class="plabel">Transform</span>${sel("trans",TRANSFORMS,p.trans,k=>(p.sel.length&&!anyApplies(k))||(k==="rel"&&p.sel.length<2))}
    ${areaCtrl}
    <div class="cfgrule"></div>
    <span class="plabel">Government</span>${sel("era",ERA_MODES,p.era)}
    <span class="plabel">Events</span>${sel("ev",EVENT_MODES,p.ev)}
    <span class="plabel">Sources</span>${sel("src",SRC_STYLES,p.src)}
    <span class="plabel">Range</span><div class="rng">
      <input type="number" data-act="from" value="${p.from}" min="1980" max="2026" aria-label="From year"> — <input type="number" data-act="to" value="${p.to}" min="1980" max="2026" aria-label="To year">
    </div>
  </div>`;

  let body,foot="",legend="";
  if(!sets.length){
    body=`<div class="blank"><h3>Nothing on this chart</h3>
      <div>Pick indicators from the left, or start with a pairing:</div>
      <div class="sug">
        <button class="sg" data-act="pair" data-v="rents,pay">Rents × pay</button>
        <button class="sg" data-act="pair" data-v="absence,gap">Absence × attainment gap</button>
        <button class="sg" data-act="pair" data-v="psnd,debtint">Net debt × debt interest</button>
      </div></div>`;
  } else {
    const chart=drawChart(p,sets);
    /* A ranking is as tall as the number of areas, which at local-authority
       level is a few hundred rows. The panel's height becomes the window onto
       it rather than a cap on what is drawn — the PNG export still gets the
       whole thing, because it reads the SVG and not the scrolled view. */
    const tall=AREA_CHARTS.has(p.chart);
    body = p.table&&tall
      ? `<div class="tbar"><span>Exactly the numbers plotted — same transform, same rounding as the axis.</span>
           <button data-act="csv">${IC.csv} Download CSV</button></div>
         <div class="pbody scrolls" style="max-height:${p.h}px">${tableFor(p,sets)}</div>`
      : p.chart==="map" ? `<div class="pbody">${chart}</div>`
      : `<div class="pbody${tall?" scrolls":""}"${tall?` style="max-height:${p.h}px"`:""}>${chart}</div>`;
    /* The area view draws one series and ignores the transform, so it gets a
       legend that says so. Left to the general one it would caption a chart of
       published pounds as "index, 1997=100" — the chart and its own key
       disagreeing, which is the failure this site exists to avoid. */
    const lgSets = aset ? [{...aset, unit:aset.meta.unit}] : sets;
    /* The area views draw one series with no line-end label, so they keep a
       key. The time charts name their lines directly and do not need one. */
    legend = AREA_CHARTS.has(p.chart)
      ? `<div class="legend">${lgSets.map(s=>`<span class="lg"><span class="d" style="background:${s.colour}"></span>${esc(s.name)} <span class="u">${esc(s.unit)}</span></span>`).join("")}</div>`
      : "";
    /* Two lines with two jobs: where the numbers come from, in plain
       sentence case, then the facts about this view, quieter underneath. */
    const lines=srcLines(sets,p.src);
    const geos=[...new Set(metasOf(sets).map(m=>m.geography))].join(", ");
    const meta=[`Open Government Licence v3.0`, geos,
                p.trans!=="none"&&!AREA_CHARTS.has(p.chart)?TRANSFORMS.find(t=>t[0]===p.trans)[1]:null,
                DB.meta.generated?`data updated ${ukDate(DB.meta.generated)}`:null]
               .filter(Boolean).join(" · ");
    const ph = DB.meta.provenance==="placeholder" ? `<div class="phnote">Placeholder data, not real statistics</div>` : "";
    foot = p.src==="off"
      ? (ph?`<div class="pfoot">${ph}</div>`:"")
      : `<div class="pfoot">${ph}
          <div class="psrc">${p.src==="harvard"
            ? lines.map(c=>`<span class="cite">${esc(c)}</span>`).join("")
            : `<b>Source:</b> ${esc(lines[0])}`}</div>
          <div class="pmeta">${esc(meta)}</div>
        </div>`;
  }

  /* The working, or an invitation to open one. The hint sits in the same slot
     so the card does not jump when a point is clicked. */
  const wh=sets.length?(AREA_CHARTS.has(p.chart)?(dockOn()?"":workingHtml(p,sets)):yearWorkingHtml(p,buildSets(p))):"";
  const docked = dockOn()&&AREA_CHARTS.has(p.chart)&&state.probe&&state.probe.key===p.key;
  const work = wh || (!docked&&sets.length&&PROBEABLE.has(p.chart)
    ? `<div class="workhint">${AREA_CHARTS.has(p.chart)?"Click an area to show the working":"Click anywhere on the chart to show the working for that year"}</div>` : "");

  const warns=warningsFor(p,sets).map(w=>
    `<div class="warn">${w.html}${
      w.act==="rebase" ? `<button data-act="rebase">Rebase</button>` :
      w.act==="tomap"  ? `<button data-act="tomap" data-v="${esc(w.id)}">Show on a map</button>` :
      w.act==="cut"    ? `<button data-act="cutbefore" data-v="${w.year}">Stop at ${w.year-1}</button>`+
                         `<button data-act="cutafter" data-v="${w.year}">Start at ${w.year}</button>`+
                         (w.id?`<a class="wlink" href="data.html#${esc(w.id)}" target="_blank" rel="noopener">Full caveat ↗</a>`:"")
                       : ""}</div>`).join("");

  return `<div class="pcard ${state.focus===i?"is-focus":""} ${lk?"locked":""}" style="--span:${p.w}" data-i="${i}" data-key="${p.key}">
    <div class="pbar">
      <span class="grip" data-act="grip" tabindex="0" role="button" title="${lk?"Locked — unlock to move":"Drag to move this chart (or use the arrow keys)"}" aria-label="Move chart ${i+1}"><svg viewBox="0 0 16 16" fill="currentColor"><circle cx="5.5" cy="3.5" r="1.4"/><circle cx="10.5" cy="3.5" r="1.4"/><circle cx="5.5" cy="8" r="1.4"/><circle cx="10.5" cy="8" r="1.4"/><circle cx="5.5" cy="12.5" r="1.4"/><circle cx="10.5" cy="12.5" r="1.4"/></svg></span>
      <button class="pi ${open?"on":""}" data-act="cfg" aria-expanded="${open}" title="Chart settings" aria-label="Chart settings">${IC.sliders}</button>
      <button class="pi ${lk?"on":""}" data-act="lock" aria-pressed="${lk}" title="${lk?"Unlock — let this chart move":"Lock this chart in place"}" aria-label="${lk?"Unlock chart":"Lock chart"}">${lk?IC.lock:IC.unlock}</button>
      <button class="pi ${p.table?"on":""}" data-act="tabletoggle" aria-pressed="${!!p.table}" title="${p.table?"Hide the numbers":"Check the numbers behind this chart"}" aria-label="Check the numbers">${IC.table}</button>
      <span class="pnum">Chart ${i+1}</span>
      ${state.renaming===p.key
        ? `<input class="ptitle-in" data-act="title" value="${esc(p.title??autoTitle(sets))}" maxlength="90" aria-label="Chart title">`
        : `<h2 class="ptitle" data-act="rename" title="Click to rename">${esc(p.title??(sets.length?autoTitle(sets):"Empty chart"))}</h2>
           <button class="pi pen" data-act="rename" title="Rename this chart" aria-label="Rename this chart">${IC.pen}</button>`}
      <div class="pacts">
        <button class="pi ${menuOpen?"on":""}" data-act="menu" aria-expanded="${menuOpen}" title="More actions" aria-label="More actions for this chart">${IC.kebab}</button>
      </div>
    </div>
    <div class="menupanel" ${menuOpen?"":"hidden"}>
      <button class="mi" data-act="csv">${IC.csv} Download CSV</button>
      <button class="mi" data-act="png">${IC.png} Download PNG</button>
      <button class="mi" data-act="tabletoggle">${IC.table} ${p.table?"Hide the numbers":"Check the numbers"}</button>
      <div class="msep"></div>
      <button class="mi" data-act="dup">${IC.dup} Duplicate chart</button>
      <button class="mi danger" data-act="del">${IC.del} Remove chart</button>
    </div>
    ${ctrl}${warns}<div class="pmain${wh?" has-work":""}">${body}${work}</div>${legend}${p.table&&sets.length&&!AREA_CHARTS.has(p.chart)?verifyHtml(p):""}${foot}
    <div class="rgrip" data-act="rgrip" title="Drag to change height"></div>
    <div class="cgrip" data-act="cgrip" title="Drag to change width and height"></div>
    <span class="hpill">${wLabel(p.w)} · ${p.h}px</span>
  </div>`;
}

function renderPanels(){
  const stack=document.getElementById("stack");
  /* a long list of areas keeps its place when a click redraws it */
  const keep=new Map([...stack.querySelectorAll(".pcard")].map(c=>{
    const b=c.querySelector(".pbody.scrolls"); return [c.dataset.key, b?[b.scrollTop,b.scrollLeft]:null];}));
  stack.innerHTML = state.panels.length
    ? state.panels.map(panelHtml).join("")
    : `<div class="stackempty"><h3>No charts</h3>
       <div>Add one below, or pick an indicator on the left and we'll start a chart for you.</div></div>`;
  stack.querySelectorAll(".pcard").forEach(c=>{
    const k=keep.get(c.dataset.key), b=c.querySelector(".pbody.scrolls");
    if(k&&b){ b.scrollTop=k[0]; b.scrollLeft=k[1]; }
  });
}

function renderSidebar(){
  /* which chart am I editing */
  document.getElementById("pswitch").innerHTML =
    state.panels.length
      ? state.panels.map((p,i)=>{
          const label = p.title ? (p.title.length>22?p.title.slice(0,21)+"…":p.title) : "Chart "+(i+1);
          return `<button class="ps" data-sw="${i}" aria-pressed="${i===state.active}" title="${esc(p.title||"Chart "+(i+1))}">${esc(label)}</button>`;
        }).join("")
      : `<span class="trayempty">No charts yet.</span>`;
  document.querySelectorAll("[data-sw]").forEach(b=>b.onclick=()=>{
    state.active=+b.dataset.sw; state.focus=state.active; render();
    document.querySelector(`.pcard[data-i="${state.active}"]`)?.scrollIntoView({behavior:"smooth",block:"nearest"});
  });

  /* selected tray — independent of the topic filter */
  const p=P0();
  const tray=document.getElementById("tray");
  tray.innerHTML = !p ? `<div class="trayempty">No chart yet — pick an indicator and one appears.</div>`
    : p.sel.length
    ? p.sel.map((id,i)=>{const s=S(id); if(!s) return "";
        return `<div class="trayitem"><span class="sw" style="background:${PAL(i)}"></span>
          <span class="nm" title="${esc(s.name)}">${esc(s.name)}</span>
          <button class="x" data-drop="${id}" aria-label="Remove ${esc(s.name)}">×</button></div>`;}).join("")
    : `<div class="trayempty">Nothing selected yet.</div>`;
  tray.querySelectorAll("[data-drop]").forEach(b=>b.onclick=()=>{
    const q=P0(); if(!q) return; q.sel=q.sel.filter(x=>x!==b.dataset.drop); render();
  });

  /* filters: what it's about, and what it covers. "Local areas" picks the
     series that also break down below national level, which is what the
     By area views need. Each option's count is what picking it would give,
     given the other filter and the search. */
  const inMode=catalogue();
  const q=state.q.toLowerCase();
  const okQ=s=>!q||[s.name,s.source,s.unit,s.geography].join(" ").toLowerCase().includes(q);
  const okTopic=(s,t)=>t==="all"||s.topics.includes(t);
  const okGeo=(s,g)=>g==="all"||(g==="local"?!!s.areas:s.geography===g);
  /* the eight topics the homepage names, in its order */
  const topics=["all",...TOPICS.map(t=>t[0]).filter(k=>inMode.some(s=>s.topics.includes(k))),
    ...[...new Set(inMode.flatMap(s=>s.topics))].filter(k=>!TOPICS.some(t=>t[0]===k))];
  /* broadest first */
  const GEO_ORDER=["UK","Great Britain","England and Wales","England & Wales","England","Wales","Scotland","Northern Ireland"];
  const geos=[...new Set(inMode.map(s=>s.geography))].sort((a,b)=>
    (GEO_ORDER.indexOf(a)+1||99)-(GEO_ORDER.indexOf(b)+1||99));
  const geoOpts=[["all","All"],...geos.map(g=>[g,g])].concat(inMode.some(s=>s.areas)?[["local","Local areas"]]:[]);
  const icon=(attr,k)=>attr==="topic"?CK.topicIcon(k,"fic"):k==="all"?CK.topicIcon("all","fic"):k==="local"?CK.topicIcon("local","fic"):CK.geoIcon(k,"fic geo");
  const chip=(attr,k,label,on,n)=>`<button class="f" data-${attr}="${esc(k)}" aria-pressed="${on}"${n===0&&!on?" disabled":""}>${icon(attr,k)}${esc(label)}${k!=="all"?` <i>${n}</i>`:""}</button>`;
  document.getElementById("filters").innerHTML=
    `<div class="frow"><span class="flabel">Topic</span>${topics.map(t=>chip("topic",t,topicName(t),state.topic===t,
        inMode.filter(s=>okQ(s)&&okGeo(s,state.geo)&&okTopic(s,t)).length)).join("")}</div>`+
    `<div class="frow"><span class="flabel">Covers</span>${geoOpts.map(([k,l])=>chip("geo",k,l,state.geo===k,
        inMode.filter(s=>okQ(s)&&okTopic(s,state.topic)&&okGeo(s,k)).length)).join("")}</div>`;
  document.querySelectorAll("#filters [data-topic]").forEach(b=>b.onclick=()=>{state.topic=b.dataset.topic;state.drawer=true;renderSidebar();});
  document.querySelectorAll("#filters [data-geo]").forEach(b=>b.onclick=()=>{state.geo=b.dataset.geo;state.drawer=true;renderSidebar();});

  /* catalogue: in the panel only while searching; browsing happens in the
     drawer, a topic at a time */
  const list=inMode.filter(s=>okTopic(s,state.topic)&&okGeo(s,state.geo)&&okQ(s));
  const cat=document.getElementById("cat");
  if(q){
    cat.innerHTML=list.length?list.map(s=>{
      const i=p?p.sel.indexOf(s.id):-1, on=i>=0, end=s.start+s.values.length-1;
      return `<div class="ci" data-id="${s.id}" aria-selected="${on}" title="${esc(s.name)} — ${esc(s.unit)}">
        <span class="sw" style="${on?`background:${PAL(i)};border-color:${PAL(i)}`:""}"></span>
        <span class="body"><span class="cn">${esc(s.name)}</span>
        <span class="cm">${esc(s.geography)}<span class="sep">·</span>${s.snapshot?`${end}, single year`:`${s.start}–${end}`}${s.areas?`<span class="sep">·</span>local figures`:""}</span>
        </span></div>`;}).join("") : `<div class="empty">Nothing matches that.</div>`;
    cat.querySelectorAll(".ci").forEach(el=>el.onclick=()=>pickSeries(el.dataset.id));
  } else {
    const label=state.topic==="all"?"All indicators":topicName(state.topic);
    cat.innerHTML=`<div class="browse"><button type="button" data-open-drawer>${label}<span>${list.length} →</span></button>
      <div class="bhint">Pick a topic above to see its indicators side by side, or search by name.</div></div>`;
    cat.querySelector("[data-open-drawer]").onclick=()=>{ state.drawer=true; renderSidebar(); };
  }
  renderDrawer(inMode,okTopic,okGeo,okQ);
  document.getElementById("count").textContent = p
    ? `${p.sel.length} of 4 on Chart ${state.active+1} · ${inMode.length} indicators available`
    : `${inMode.length} indicators available`;
}

/* Put an indicator on the chart being edited, or take it off. */
function pickSeries(id){
  if(!P0()){ addPanel([id]); return; }          /* no charts yet — start one */
  const q=P0(), i=q.sel.indexOf(id);
  /* the first pick on an empty chart: a snapshot opens it as a map */
  if(i<0&&!q.sel.length&&(S(id)||{}).snapshot&&(S(id)||{}).areas&&!AREA_CHARTS.has(q.chart)) q.chart="map";
  if(i>=0) q.sel.splice(i,1);
  else if(q.sel.length<4) q.sel.push(id);
  else { q.sel.shift(); q.sel.push(id); }
  render();
}

const GEO_RANK=["UK","Great Britain","England and Wales","England & Wales","England","Wales","Scotland","Northern Ireland"];
function renderDrawer(inMode,okTopic,okGeo,okQ){
  const el=document.getElementById("drawer");
  if(!state.drawer){ el.hidden=true; return; }
  const p=P0(), t=state.topic, list=inMode.filter(s=>okTopic(s,t)&&okGeo(s,state.geo)&&okQ(s));
  /* grouped by what each covers, broadest first; "all topics" groups by topic */
  const groups=new Map();
  const key=s=>t==="all"?(s.topics[0]||"other"):s.geography;
  [...list].sort((a,b)=>a.name.localeCompare(b.name)).forEach(s=>{ const k=key(s); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(s); });
  const order=t==="all"?TOPICS.map(x=>x[0]):GEO_RANK;
  const keys=[...groups.keys()].sort((a,b)=>(order.indexOf(a)+1||99)-(order.indexOf(b)+1||99));
  const card=s=>{
    const i=p?p.sel.indexOf(s.id):-1, on=i>=0, end=s.start+s.values.length-1;
    return `<button type="button" class="dcard" data-pick="${s.id}" aria-pressed="${on}" title="${esc(s.name)} — ${esc(s.unit)}">
      <span class="sw" style="${on?`background:${PAL(i)};border-color:${PAL(i)}`:""}"></span>
      <span><span class="cn">${esc(s.name)}</span>
      <span class="cm">${s.snapshot?`${end} only`:`${s.start}–${end}`}${t==="all"?` · ${esc(s.geography)}`:""}${
        s.snapshot?`<span class="tag">single year</span>`:""}${s.areas?`<span class="tag">map</span>`:""}</span></span></button>`;
  };
  const gh=k=>t==="all"
    ? `${CK.topicIcon(k)}${esc(topicName(k))}`
    : `${CK.geoIcon(k)}${esc(k)}`;
  const geoLabel=state.geo==="all"?"every coverage":state.geo==="local"?"with local figures":esc(state.geo);
  el.innerHTML=`<div class="dhead"><span class="dico">${CK.topicIcon(t)}</span>
      <div><h3>${t==="all"?"All indicators":esc(topicName(t))}</h3><div class="dsub">${list.length} indicator${list.length===1?"":"s"} · ${geoLabel}${state.q?` · matching “${esc(state.q)}”`:""}</div></div>
      <button class="dx" type="button" data-close-drawer aria-label="Close">×</button></div>
    <div class="dbody">${keys.length?keys.map(k=>`<div class="dgrp"><div class="dgh">${gh(k)} <i>${groups.get(k).length}</i></div>
      <div class="dgrid">${groups.get(k).map(card).join("")}</div></div>`).join("")
      :`<div class="empty">Nothing here with these filters.</div>`}</div>
    <div class="dfoot"><span>${p?`${p.sel.length} of 4 on Chart ${state.active+1}`:"Picking one starts a chart"}</span><span>Esc to close</span></div>`;
  const body=el.querySelector(".dbody"), keep=el.hidden?0:(el.dataset.scroll&&el.dataset.key===t+"|"+state.geo?+el.dataset.scroll:0);
  el.hidden=false;
  body.scrollTop=keep; el.dataset.key=t+"|"+state.geo;
  body.onscroll=()=>{ el.dataset.scroll=body.scrollTop; };
  el.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>pickSeries(b.dataset.pick));
  el.querySelector("[data-close-drawer]").onclick=()=>{ state.drawer=false; el.dataset.scroll=0; el.hidden=true; };
}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&state.drawer){ state.drawer=false; document.getElementById("drawer").hidden=true; }
});
/* a click on the charts closes it; clicks in the panel or the drawer do not */
document.addEventListener("pointerdown",e=>{
  if(!state.drawer||e.target.closest("#drawer")||e.target.closest(".side")) return;
  state.drawer=false; document.getElementById("drawer").hidden=true;
});

/* Provenance detail, inline. The fetch log has all of this, but the moment
   someone doubts a number is while they are looking at the chart — sending
   them to another page to check is where the checking stops happening. Same
   content as a fetch log row, scoped to what is on screen. */
const srcOpen=new Set();
const FLAG_LABEL={discontinued:"Discontinued",definition:"Definition changed",
  partial:"Partial period",provisional:"Provisional",development:"In development",geography:"Sub-UK coverage"};
const flagChips=m=>(m.flags||[]).filter(f=>FLAG_LABEL[f])
  .map(f=>`<span class="fchip f-${f}">${FLAG_LABEL[f]}</span>`).join("");

function srcDetail(m){
  const end=m.start+m.values.length-1;
  const obs=m.values.filter(v=>v!=null).length;
  const notes=[...(m.notes||[]).map(n=>esc(n)),
    ...(m.discontinuities||[]).map(d=>`<b>Break at ${d.year}.</b> ${esc(d.note)}`)];
  const brk=new Set((m.discontinuities||[]).map(d=>d.year));
  const vals=m.values.map((v,i)=>{
    const y=m.start+i;
    return `<span class="rv${v==null?" gap":""}${brk.has(y)?" brk":""}"><i>${y}</i><b>${v==null?"–":fmt(v)}</b></span>`;
  }).join("");
  return `<div class="srcdet">
    ${notes.length?`<div class="sdnote">${notes.join("<br>")}</div>`:""}
    <div class="sdmeta"><span>${m.start}–${end}</span><span>${obs} of ${m.values.length} years published</span></div>
    <div class="sdvals">${vals}</div>
    <div class="sdlinks">
      <a href="data.html#${esc(m.id)}">Full record in the fetch log ↗</a>
      ${m.source_api?`<a href="${esc(m.source_api)}" target="_blank" rel="noopener">API endpoint ↗</a>`:""}
    </div>
  </div>`;
}

/* Where the active chart's numbers come from: one entry per series, the
   release it's from (linked), then the facts a reader needs to judge it,
   each labelled. "Published as" is the unit the publisher used, which can
   differ from what the chart shows after a transform. How the chart credits
   its sources is set in its own settings, not here. */
function renderSources(){
  const p=P0(), el=document.getElementById("srcs");
  const sets=p&&!AREA_CHARTS.has(p.chart)?buildSets(p):p?buildSets(p).slice(0,1):[];
  const head=(sub,btn)=>`<div class="srchd"><div><h3 class="srctitle">Sources</h3>${sub?`<div class="srcsub">${sub}</div>`:""}</div>${btn||""}</div>`;
  if(!sets.length){
    el.innerHTML=head("")+`<div class="trayempty">Pick an indicator to see where its numbers come from.</div>`;
    return;
  }
  const ms=metasOf(sets);
  const dot=m=>{const i=p.sel.indexOf(m.id); return `<span class="d" style="background:${i>=0?PAL(i):"var(--muted)"}"></span>`;};
  const ph=DB.meta.provenance==="placeholder"?'<span class="ph">Placeholder</span>':'';
  const yb={calendar:"Calendar years",financial:"Financial years (Apr–Mar)",academic:"Academic years (Sep–Aug)"};
  const fact=(k,v)=>v?`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`:"";
  const body=ms.map(m=>{
    const open=srcOpen.has(m.id), url=m.source_url||m.source_api||"";
    const src=url?`<a class="srclink" href="${esc(url)}" target="_blank" rel="noopener">${esc(m.source)}</a>`:esc(m.source);
    return `<div class="srcitem${open?" open":""}">
      <div class="srcwho"><div class="srcname">${dot(m)}${esc(m.name)} ${ph}</div>
        <div class="srcfrom">${src}${m.publisher_full?` · ${esc(m.publisher_full)}`:""}</div>
        ${(m.flags||[]).some(f=>FLAG_LABEL[f])?`<div class="srcflags">${flagChips(m)}</div>`:""}
        <button class="srcx" data-srcx="${esc(m.id)}" aria-expanded="${open}">${open?"Hide":"Show"} every published value</button></div>
      <dl class="srcfacts">${fact("Coverage",m.geography)}${fact("Published as",m.unit)}${fact("Years",yb[m.year_basis]||m.year_basis)}${fact("Licence",m.licence)}${fact("Checked",ukDate(m.fetched))}</dl>
      ${open?srcDetail(m):""}
    </div>`;}).join("");
  const off=p.src==="off"?`<p class="srcoff">This chart's source line is switched off, on screen and in its exports. The data is still under the Open Government Licence v3.0, which asks for a source statement when you republish it.</p>`:"";
  el.innerHTML=head(`For chart ${state.active+1}: ${esc(p.title??autoTitle(sets))}`,
    `<button class="copycite" id="copyCite">Copy citations</button>`)+off+body;
  document.querySelectorAll("[data-srcx]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.srcx;
    srcOpen.has(id)?srcOpen.delete(id):srcOpen.add(id);
    renderSources();
  });
  const cp=document.getElementById("copyCite");
  if(cp) cp.onclick=()=>{
    const text=srcLines(sets,"harvard").join("\n");
    if(!text) return;
    navigator.clipboard?.writeText(text).then(()=>{
      cp.textContent="Copied"; setTimeout(()=>{cp.textContent="Copy citations";},1400);
    });
  };
}

/* With the side panel shut, the sources sit in a column on the right, and an
   area's card goes there too: the map keeps its width, and the card sits
   beside the sources it cites. */
const dockOn=()=>document.body.classList.contains("side-collapsed")&&matchMedia("(min-width:1041px)").matches;
function renderDock(){
  const el=document.getElementById("dock"), pr=state.probe;
  const p=pr&&state.panels.find(x=>x.key===pr.key);
  el.innerHTML = dockOn()&&p&&AREA_CHARTS.has(p.chart) ? workingHtml(p,buildSets(p)) : "";
}
document.getElementById("dock").addEventListener("click",e=>{
  if(e.target.closest('[data-act="unprobe"]')){ state.probe=null; render(); }
});
function render(){ chartWidth(); renderPanels(); renderSidebar(); renderSources(); renderDock(); writeHash(); }
/* crossing the width where the right column appears moves the card */
matchMedia("(min-width:1041px)").addEventListener("change",()=>{ if(typeof DB!=="undefined"&&DB) render(); });

/* ══════════════════════════════════════════════
   PANEL ACTIONS
   ══════════════════════════════════════════════ */
/* bring a year's row into the middle of the numbers table */
function scrollToYear(p){
  const box=document.querySelector(`.pcard[data-key="${p.key}"] .vscroll`);
  const row=box&&box.querySelector(`tr[data-y="${p.vy}"]`);
  if(!row) return;
  const head=box.querySelector("thead").offsetHeight;
  box.scrollTop=row.offsetTop-head-(box.clientHeight-head)/2+row.offsetHeight/2;
}

function addPanel(sel=[]){
  const snap=sel.length&&sel.every(id=>(S(id)||{}).snapshot&&(S(id)||{}).areas);
  state.panels.push(mkPanel(sel,snap?{chart:"map"}:{}));
  state.active=state.panels.length-1;
  state.focus=state.active;
  render();
  document.querySelector(`.pcard[data-i="${state.active}"]`)?.scrollIntoView({behavior:"smooth",block:"center"});
}
document.getElementById("addBottom").onclick=()=>addPanel();

document.getElementById("stack").addEventListener("click",e=>{
  const card=e.target.closest(".pcard"); if(!card) return;
  const i=+card.dataset.i, p=state.panels[i];
  /* A data point beats the generic card click: clicking a mark should open its
     working, not just focus the panel. */
  const mark=e.target.closest("[data-probe]");
  if(mark){
    const id=mark.dataset.probe, code=mark.dataset.area, x=mark.dataset.x;
    /* a search result always selects; clicking a selected mark again clears it */
    const same = !mark.classList.contains("mfhit") && state.probe && state.probe.key===p.key && state.probe.id===id &&
                 (code ? state.probe.code===code : state.probe.x===+x);
    state.probe = same ? null : (code ? {key:p.key,id,code} : {key:p.key,id,x:+x});
    /* with the numbers table open, the click also finds that year in it */
    if(!code) p.vy = same ? null : Math.floor(+x);
    state.active=i; state.focus=i; render();
    if(!code&&p.table&&p.vy!=null) scrollToYear(p);
    return;
  }

  /* clicks land on the SVG inside icon buttons, so resolve to the button */
  const actEl=e.target.closest("[data-act]");
  const act=actEl?actEl.dataset.act:undefined;

  if(act==="pick"){
    /* nearest period to the click, snapped to the chart's granularity */
    const r=actEl.getBoundingClientRect(), d=actEl.dataset;
    const x=(e.clientX-r.left)*(W/r.width), per=+d.per||1;
    const raw=+d.from+(x-(+d.l))/(W-(+d.l)-(+d.r))*(+d.to-(+d.from));
    const xk=+(Math.round(raw*per)/per).toFixed(4);
    state.active=i; state.focus=i;
    if(xk<+d.from||xk>+d.to){ render(); return; }
    const same=state.probe&&state.probe.key===p.key&&state.probe.x===xk;
    state.probe=same?null:{key:p.key,x:xk};
    p.vy=same?null:Math.floor(xk);
    render();
    if(!same&&p.table) scrollToYear(p);
    return;
  }
  if(!act){ state.active=i; state.focus=i; render(); return; }
  state.active=i; state.focus=i;

  /* selects and inputs inside the settings popover are handled on change */
  if(["chart","trans","era","ev","src","from","to","title","mapq"].includes(act)) return;

  if(act==="cfg"){ state.openCfg = state.openCfg===p.key ? null : p.key; state.openMenu=null; }
  else if(act==="menu"){ state.openMenu = state.openMenu===p.key ? null : p.key; state.openCfg=null; }
  else if(act==="lock"){ lockedKeys.has(p.key) ? lockedKeys.delete(p.key) : lockedKeys.add(p.key); }
  else if(act==="tabletoggle"){ p.table=!p.table; state.openMenu=null;
    if(AREA_CHARTS.has(p.chart)) state.probe=null; }
  else if(act==="rename"){
    state.renaming=p.key; state.openCfg=null; state.openMenu=null;
    render();
    const inp=document.querySelector('.ptitle-in'); if(inp){ inp.focus(); inp.select(); }
    return;
  }
  else if(act==="rebase") p.trans="index";
  else if(act==="tomap"){ const v=actEl.dataset.v; p.sel=[v,...p.sel.filter(x=>x!==v)]; p.chart="map"; }
  /* Truncate at the break, either side of it. The range controls could do this
     by hand; the point is that the warning offers it at the moment it matters. */
  else if(act==="cutbefore"){ p.to=Math.max(p.from, +actEl.dataset.v-1); state.probe=null; }
  else if(act==="cutafter"){ p.from=Math.min(p.to, +actEl.dataset.v); state.probe=null; }
  else if(act==="unprobe") state.probe=null;
  else if(act==="tsort") p.asort=actEl.dataset.k;
  else if(act==="charttile") p.chart=actEl.dataset.v;
  else if(act==="pair") p.sel=actEl.dataset.v.split(",");
  else if(act==="dup"){ state.openMenu=null; state.panels.splice(i+1,0,mkPanel(p.sel,{chart:p.chart,trans:p.trans,from:p.from,to:p.to,era:p.era,ev:p.ev,src:p.src,gran:p.gran,h:p.h,w:p.w,lvl:p.lvl,asort:p.asort,title:p.title?p.title+" (copy)":null})); state.active=i+1; }
  else if(act==="del"){ state.openMenu=null; state.panels.splice(i,1); lockedKeys.delete(p.key); if(state.openCfg===p.key) state.openCfg=null; state.active=Math.max(0,Math.min(state.active,state.panels.length-1)); state.focus=null; }
  else if(act==="csv"){ state.openMenu=null; exportCsv(i); render(); return; }
  else if(act==="png"){ state.openMenu=null; exportPng(i); render(); return; }
  render();
});
/* a faint line follows the pointer across a time chart, snapped to the period

/* ── drag to reorder ──
   The lifted card follows the pointer; a dashed slot shows exactly where it
   will land. Locked charts are skipped as landing targets and keep their
   position in the stack when everything else moves around them. */
let drag=null;

function orderAfterDrop(movingKey, targetSlot){
  const keys=state.panels.map(p=>p.key);
  const lockedAt=new Map(); keys.forEach((k,i)=>{ if(lockedKeys.has(k)) lockedAt.set(i,k); });
  const movers=keys.filter(k=>!lockedKeys.has(k)&&k!==movingKey);
  const freeSlots=keys.map((_,i)=>i).filter(i=>!lockedAt.has(i));
  const at=Math.max(0,freeSlots.indexOf(targetSlot));
  movers.splice(at,0,movingKey);
  const next=[]; let mi=0;
  for(let i=0;i<keys.length;i++) next.push(lockedAt.has(i)?lockedAt.get(i):movers[mi++]);
  state.panels = next.map(k=>state.panels.find(p=>p.key===k));
  state.active = state.panels.findIndex(p=>p.key===movingKey);
}

document.getElementById("stack").addEventListener("pointerdown",e=>{
  if(e.target.dataset.act!=="grip") return;
  const card=e.target.closest(".pcard");
  const key=+card.dataset.key;
  if(lockedKeys.has(key)) return;
  e.preventDefault();
  e.target.setPointerCapture(e.pointerId);
  const r=card.getBoundingClientRect();
  drag={key, el:card, started:false, x0:e.clientX, y0:e.clientY,
        offX:e.clientX-r.left, offY:e.clientY-r.top, w:r.width, h:r.height,
        index:+card.dataset.i, target:{kind:"pos", i:+card.dataset.i}, slot:null};
});

document.addEventListener("pointermove",e=>{
  if(!drag) return;
  if(!drag.started){
    if(Math.hypot(e.clientX-drag.x0, e.clientY-drag.y0)<5) return;
    drag.started=true;
    state.openCfg=null; state.openMenu=null;
    const slot=document.createElement("div");
    slot.className="dropslot";
    slot.style.setProperty("--span", state.panels[drag.index].w);
    slot.style.height=drag.h+"px";
    slot.textContent="Drop here";
    drag.el.parentNode.insertBefore(slot, drag.el);
    drag.slot=slot;
    drag.el.classList.add("drag-live");
    drag.el.style.width=drag.w+"px";
    document.body.classList.add("dragging");
  }
  drag.el.style.left=(e.clientX-drag.offX)+"px";
  drag.el.style.top =(e.clientY-drag.offY)+"px";

  /* two kinds of landing target:
     — a position another chart occupies (swap into its place), or
     — the empty grid space beside a part-width chart, so dragging next to a
       half-width chart snaps in 50/50 instead of being pushed to a new row */
  const keys=state.panels.map(p=>p.key);
  const free=keys.map((_,i)=>i).filter(i=>!lockedKeys.has(keys[i]));
  const stackR=document.getElementById("stack").getBoundingClientRect();
  let best=null, bestD=Infinity;

  free.forEach(i=>{
    const node = i===drag.index ? drag.slot : document.querySelector(`.pcard[data-i="${i}"]`);
    if(!node) return;
    const rr=node.getBoundingClientRect();
    const d=Math.hypot(e.clientX-(rr.left+rr.width/2), e.clientY-(rr.top+rr.height/2));
    if(d<bestD){ bestD=d; best={kind:"pos", i}; }
  });

  /* gap targets: rows whose spans don't add to 12 leave space on the right */
  const statics=[...document.querySelectorAll(".pcard:not(.drag-live)")];
  statics.forEach(node=>{
    const i=+node.dataset.i, rr=node.getBoundingClientRect();
    /* span used by this visual row = every static card sharing this row's top */
    const rowSpan = statics.reduce((a,n2)=>{
      const r2=n2.getBoundingClientRect();
      return Math.abs(r2.top-rr.top)<12 ? a+(+state.panels[+n2.dataset.i].w||12) : a;
    },0);
    const gap = 12-rowSpan;
    if(gap<4) return;                                   /* nothing usable left in the row */
    const rightmost = statics.filter(n2=>Math.abs(n2.getBoundingClientRect().top-rr.top)<12)
      .sort((a2,b2)=>b2.getBoundingClientRect().right-a2.getBoundingClientRect().right)[0];
    if(rightmost!==node) return;                        /* only offer the gap once per row */
    const gx=(rr.right+stackR.right)/2, gy=rr.top+rr.height/2;
    const d=Math.hypot(e.clientX-gx, e.clientY-gy)*0.9; /* slight bias: filling a gap is usually the intent */
    if(d<bestD){ bestD=d; best={kind:"gap", i, span:gap, h:rr.height}; }
  });

  /* The drop slot stands for wherever the chart will land, not where it
     started. Nearest-to-the-slot therefore means "keep the current target";
     reading it as "back to the start" undid every drag on release. */
  if(best && best.kind==="pos" && best.i===drag.index) best=drag.target;
  if(best && JSON.stringify(best)!==JSON.stringify(drag.target)){
    drag.target=best;
    if(best.kind==="pos"){
      const ref = best.i===drag.index ? null : document.querySelector(`.pcard[data-i="${best.i}"]`);
      if(ref) ref.parentNode.insertBefore(drag.slot, best.i>drag.index ? ref.nextSibling : ref);
      const tp = state.panels[best.i];
      drag.slot.style.setProperty("--span", tp.w);
      drag.slot.style.height = (ref?ref.getBoundingClientRect().height:drag.h)+"px";
    } else {
      const ref=document.querySelector(`.pcard[data-i="${best.i}"]`);
      if(ref) ref.parentNode.insertBefore(drag.slot, ref.nextSibling);
      drag.slot.style.setProperty("--span", best.span);
      drag.slot.style.height = best.h+"px";
    }
  }
});

function placeAfter(movingKey, afterKey){
  const idx=state.panels.findIndex(pp=>pp.key===movingKey);
  const [mv]=state.panels.splice(idx,1);
  const at=state.panels.findIndex(pp=>pp.key===afterKey);
  state.panels.splice(at+1,0,mv);
  state.active=state.panels.findIndex(pp=>pp.key===movingKey);
}

document.addEventListener("pointerup",()=>{
  if(!drag) return;
  const wasDrag=drag.started, key=drag.key, target=drag.target, from=drag.index;
  if(wasDrag){
    drag.el.classList.remove("drag-live");
    drag.el.style.cssText="";
    drag.slot?.remove();
    document.body.classList.remove("dragging");
    if(target && target.kind==="gap"){
      /* slot into the empty space beside that chart, at the gap's width,
         matching its height so the pair tiles as one row */
      const beside=state.panels[target.i];
      placeAfter(key, beside.key);
      const mv=state.panels.find(pp=>pp.key===key);
      if(mv){ mv.w=target.span; mv.h=beside.h; }
    } else if(target && target.kind==="pos"){
      const adoptW = target.i!==from && state.panels[target.i] ? state.panels[target.i].w : null;
      orderAfterDrop(key, target.i);
      if(adoptW!==null){ const mv=state.panels.find(pp=>pp.key===key); if(mv) mv.w=adoptW; }
    }
  }
  drag=null;
  if(wasDrag) render();
});

/* ── drag to change height ──
   Width used to be draggable from the same corner: five snap points, a live
   preview and a feedback pill, all discoverable only by trying it. Most people
   want a standard arrangement rather than a bespoke one, so widths are now set
   declaratively from the layout presets and this gesture does height only. */
let rz=null;
document.getElementById("stack").addEventListener("pointerdown",e=>{

  rz={i,mode,y0:e.clientY,x0:e.clientX,h0:state.panels[i].h,w0:state.panels[i].w,card};
  card.classList.add("is-resizing");
  document.body.classList.add("resizing");

});
let rzRaf=0;
document.addEventListener("pointermove",e=>{
  if(!rz) return;
  const p=state.panels[rz.i];
  p.h=Math.max(H_MIN,Math.min(H_MAX,Math.round((rz.h0+(e.clientY-rz.y0))/10)*10));
  if(rzRaf) return;                      /* one chart rebuild per frame, not per event */
  rzRaf=requestAnimationFrame(()=>{ rzRaf=0; });

  const card=document.querySelector(`.pcard[data-i="${rz.i}"]`);
  if(!card) return;

  /* the corner also sets width, snapped to the widths the grid tiles at */
  if(rz.mode==="cgrip"){
    const stackW=document.getElementById("stack").getBoundingClientRect().width;
    const want=Math.max(3,Math.min(12,(rz.w0/12*stackW + (e.clientX-rz.x0)) / stackW * 12));
    let w=W_SNAPS[0];
    W_SNAPS.forEach(s=>{ if(Math.abs(s-want)<Math.abs(w-want)) w=s; });
    if(w!==p.w){ p.w=w; card.style.setProperty("--span",w); }
  }

  const sets=buildSets(p);
  if(sets.length){
    const holder=card.querySelector(".pbody");
    const chart=drawChart(p,sets);
    if(chart&&holder) holder.innerHTML=chart;
  }
  const pill=card.querySelector(".hpill"); if(pill) pill.textContent=wLabel(p.w)+" · "+p.h+"px";
});
document.addEventListener("pointerup",()=>{
  if(!rz) return;
  const wasWidth = rz.mode==="cgrip" && state.panels[rz.i] && state.panels[rz.i].w!==rz.w0;
  document.querySelector(`.pcard[data-i="${rz.i}"]`)?.classList.remove("is-resizing");
  document.body.classList.remove("resizing");
  rz=null;
  if(wasWidth) render(); else writeHash();   /* a width change redraws at the new size */
});

/* Moving without a pointer: the drag handle is focusable, and the arrow keys
   move its chart one place earlier or later. */
document.getElementById("stack").addEventListener("keydown",e=>{
  if(e.target.dataset.act!=="grip") return;
  const back=e.key==="ArrowUp"||e.key==="ArrowLeft", fwd=e.key==="ArrowDown"||e.key==="ArrowRight";
  if(!back&&!fwd) return;
  e.preventDefault();
  const i=+e.target.closest(".pcard").dataset.i, j=back?i-1:i+1, p=state.panels[i];
  if(j<0||j>=state.panels.length||lockedKeys.has(p.key)) return;
  state.panels.splice(j,0,state.panels.splice(i,1)[0]);
  state.active=j; state.focus=j; render();
  document.querySelector(`.pcard[data-i="${j}"] [data-act="grip"]`)?.focus();
});

/* ══════════════════════════════════════════════
   EXPORT — per chart, CSV and PNG
   ══════════════════════════════════════════════ */
const dl=(blob,name)=>{const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);};
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60)||"chart";

/* SVG text doesn't wrap, so a Harvard citation would run off the edge of an
   exported image. Break on words at a character budget — monospace at 10px
   is close enough to 6px a character to measure it that way. */
function wrapText(s,max){
  const out=[]; let cur="";
  /* a source URL is one unbreakable token and routinely longer than the
     line budget, so hard-break anything that can't fit on its own */
  const words=String(s).split(/\s+/).filter(Boolean).flatMap(w=>{
    if(w.length<=max) return [w];
    const bits=[]; for(let i=0;i<w.length;i+=max) bits.push(w.slice(i,i+max));
    return bits;
  });
  words.forEach(w=>{
    if(!cur) cur=w;
    else if((cur+" "+w).length<=max) cur+=" "+w;
    else { out.push(cur); cur=w; }
  });
  if(cur) out.push(cur);
  return out.length?out:[""];
}

/* The area export carries the area code as well as the name, because the name
   alone will not join to anything and a rankings CSV is exactly the file
   someone will want to join. Attribution follows SRCSTYLE like every other
   surface — see the note on SRC_STYLES. */
function exportAreaCsv(p,sets){
  const set=areaSet(sets), ix=AREAIX, d=set&&AREADATA.get(set.id);
  if(!set||!ix||ix==="error"||!d||d==="error") return;
  const lvl=areaLevel(p,set.id);
  const q=s=>`"${String(s).replace(/"/g,'""')}"`;
  const lines=srcLines([set],p.src);
  const attrib = lines.length
    ? lines.map(c=>`# ${p.src==="harvard"?"":"Sources: "}${c}\n`).join("")+
      `# Licence: OGL v3.0 — contains public sector information\n`
    : "";
  const head=(what)=>`# Polyoptic — ${set.name} by area, ${what}\n`+attrib+
    `# Level: ${(ix.levelNames||{})[lvl]||lvl}\n`+
    `# Areas are on current boundaries; ONS restates the back series when they change\n`;

  let body="", name="";
  /* Each view exports what it actually shows — a change view whose file held
     only the end year would not reproduce the chart it came from. */
  if(p.chart==="arrow"||p.chart==="range"){
    const {rows,y0,y1}=areaPair(p,d,ix,lvl);
    if(!rows.length) return;
    rows.sort(areaSortPair(p.chart==="arrow"&&p.asort==="desc"?"change":p.asort));
    body=head(`${y0} and ${y1}`)+
      `area_code,area_name,level,${y0},${y1},change\n`+
      rows.map(r=>`${r[0]},${q(r[1])},${lvl},${r[2]},${r[3]},${+r[4].toFixed(6)}`).join("\n");
    name=`${set.name}-by-area-${y0}-${y1}`;
  } else if(p.chart==="heat"){
    const len=Math.max(...Object.values(d.values).map(v=>v.length));
    const lo=Math.max(p.from,d.start), hi=Math.min(p.to,d.start+len-1);
    if(hi<lo) return;
    const years=[]; for(let y=lo;y<=hi;y++) years.push(y);
    const codes=Object.keys(d.values).filter(c=>(ix.areas[c]||{}).l===lvl).sort();
    body=head(`${lo} to ${hi}`)+
      `area_code,area_name,level,${years.join(",")}\n`+
      codes.map(c=>`${c},${q(areaName(ix,c))},${lvl},`+
        years.map(y=>{const v=d.values[c][y-d.start];return v==null?"":v;}).join(",")).join("\n");
    name=`${set.name}-by-area-${lo}-${hi}`;
  } else {
    const {rows,year}=areaRows(p,d,ix,lvl);
    if(!rows.length) return;
    rows.sort(p.asort==="name" ? (a,b)=>a[1].localeCompare(b[1])
            : p.asort==="asc"  ? (a,b)=>a[2]-b[2]
            :                    (a,b)=>b[2]-a[2]);
    body=head(String(year))+
      `area_code,area_name,level,year,${q(set.name+" ("+set.unit+")")}\n`+
      rows.map(r=>`${r[0]},${q(r[1])},${lvl},${year},${r[2]}`).join("\n");
    name=`${set.name}-by-area-${year}`;
  }
  dl(new Blob([body],{type:"text/csv"}), slug(name)+".csv");
}

function exportCsv(i){
  const p=state.panels[i], sets=buildSets(p);
  if(!sets.length) return;
  if(AREA_CHARTS.has(p.chart)) return exportAreaCsv(p,sets);
  const years=[...new Set(sets.flatMap(s=>s.pts.map(q=>q[0])))].sort();
  const head=["year",...sets.map(s=>`"${s.name} (${s.unit})"`)].join(",");
  const rows=years.map(y=>[y,...sets.map(s=>{const q=s.pts.find(q=>q[0]===y);return q&&q[1]!=null?q[1].toFixed(4):"";})].join(","));
  const warn=DB.meta.provenance==="placeholder"?"# WARNING: placeholder data, not real statistics\n":"";
  /* off strips the source and licence lines from the file as well as the
     screen — see the note on SRC_STYLES. */
  const lines=srcLines(sets,p.src);
  const attrib = lines.length
    ? lines.map(c=>`# ${p.src==="harvard"?"":"Sources: "}${c}\n`).join("")+
      `# Licence: OGL v3.0 — contains public sector information\n`
    : "";
  const csv=warn+`# Polyoptic — ${autoTitle(sets)}\n`+attrib+
    `# Geography: ${[...new Set(metasOf(sets).map(m=>m.geography))].join("; ")}\n`+
    head+"\n"+rows.join("\n");
  dl(new Blob([csv],{type:"text/csv"}), slug(sets.map(s=>s.name).join("-"))+".csv");
}

function exportPng(i){
  const p=state.panels[i], sets=buildSets(p);
  const card=document.querySelector(`.pcard[data-i="${i}"]`);
  if(!sets.length||!card) return;
  const svgs=[...card.querySelectorAll(".pbody svg")];
  if(!svgs.length) return;
  const TH = EXPORT_THEMES[document.documentElement.dataset.theme] || EXPORT_THEMES.light;

  const view=viewOf(p,sets), stats=statsData(view,clipSets(sets,view));
  /* line charts name their lines at the ends, so they need no key — the same
     rule as on screen; a key of long names also ran into itself */
  const keyed=!(isLineish(p)&&sets.every(x=>x.unit===sets[0].unit));
  const PAD=26, TOP=74+(stats.length?40:0), LEGEND=keyed?26:0, SCALE=2, CRED_LH=13;
  const inner=svgs.map(s=>{
    const vb=s.getAttribute("viewBox").split(/\s+/).map(Number);
    /* the map is drawn in boundary units; it goes into the image at a fixed
       height and its own width, rather than stretched to the chart width */
    if(s.classList.contains("mapsvg")) return {markup:s.innerHTML, w:vb[2], h:vb[3], dh:620, dw:620*vb[2]/vb[3], gap:8};
    return {markup:s.innerHTML, w:vb[2], h:vb[3], gap:s.classList.contains("areahd")?0:8};
  });
  const bodyH=inner.reduce((a,s)=>a+(s.dh||s.h)+s.gap,0);

  /* The credit block is measured before the canvas is sized: Harvard puts a
     full citation per series down there, so the image has to grow to fit it
     rather than clipping it. */
  const attribLines = p.src==="off" ? ["polyoptic.co"]
    : p.src==="harvard" ? [...srcLines(sets,p.src), "OGL v3.0 · polyoptic.co"]
    : [`Source: ${srcLines(sets,p.src)[0]} · OGL v3.0 · polyoptic.co`];
  const credit = (DB.meta.provenance==="placeholder"
      ? ["PLACEHOLDER DATA — NOT REAL STATISTICS"] : [])
    .concat(attribLines.flatMap(t=>wrapText(t, Math.max(40,Math.floor(W/6.3)))));
  const FOOT = 30 + Math.max(0,credit.length-1)*CRED_LH;

  const totalW=W+PAD*2, totalH=TOP+bodyH+LEGEND+FOOT+PAD;

  let y=TOP, parts="";
  inner.forEach(s=>{
    parts+=`<svg x="${PAD}" y="${y}" width="${s.dw||W}" height="${s.dh||s.h}" viewBox="0 0 ${s.w} ${s.h}">${s.markup}</svg>`;
    y+=(s.dh||s.h)+s.gap;
  });
  const legend=!keyed?"":sets.map((s,k)=>{
    const x=PAD+k*Math.min(300,(W)/sets.length);
    return `<rect x="${x}" y="${y+6}" width="13" height="3" fill="${s.colour}"/>`+
           `<text class="cred" x="${x+18}" y="${y+11}">${esc(s.name)} — ${esc(s.unit)}</text>`;
  }).join("");

  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${totalW}" height="${totalH}" viewBox="0 0 ${totalW} ${totalH}">
    <style>${exportCss(TH)}</style>
    <rect width="100%" height="100%" fill="${TH.bg}"/>
    <text class="ttl" x="${PAD}" y="${PAD+14}">${esc(p.title??autoTitle(sets))}</text>
    <text class="sub" x="${PAD}" y="${PAD+34}">${view.from}–${view.to} · ${esc(TRANSFORMS.find(x=>x[0]===p.trans)[1])} · ${esc([...new Set(metasOf(sets).map(m=>m.geography))].join(", "))}</text>
    ${stats.map((d,k)=>{const x=PAD+k*Math.min(320,W/2);
      return `<text class="stat" x="${x}" y="${PAD+64}" fill="${d.s.colour}">${d.pct}</text>`+
             `<text class="cred" x="${x}" y="${PAD+80}">${esc(d.s.name)}, ${d.span}</text>`;}).join("")}
    ${parts}${legend}
    ${credit.map((ln,k)=>`<text class="cred" x="${PAD}" y="${totalH-PAD+4-(credit.length-1-k)*CRED_LH}">${esc(ln)}</text>`).join("")}
  </svg>`;

  const img=new Image();
  img.onload=()=>{
    const c=document.createElement("canvas");
    c.width=totalW*SCALE; c.height=totalH*SCALE;
    const ctx=c.getContext("2d");
    ctx.fillStyle=TH.bg; ctx.fillRect(0,0,c.width,c.height);
    ctx.setTransform(SCALE,0,0,SCALE,0,0);
    ctx.drawImage(img,0,0);
    c.toBlob(b=>{ if(b) dl(b, slug(autoTitle(sets))+".png"); },"image/png");
  };
  img.onerror=()=>alert("Couldn't render the image in this browser.");
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}

function writeHash(){
  /* Fields are positional and append-only: lvl and asort go on the end so a
     link made before the area view existed still reads, and gets the
     defaults for the two it does not carry. */
  /* sourcing is per chart now, so it rides on the end of each panel */
  const enc=state.panels.map(p=>[p.sel.join(","),p.chart,p.trans,p.from,p.to,p.era,p.h,p.w,p.gran,encodeURIComponent(p.title||""),p.lvl,p.asort,p.table?1:0,p.src,p.ev].join("~")).join(";");
  /* the open topic rides along, so a copied link keeps the topic it was opened on */
  const t=state.drawer&&state.topic&&state.topic!=="all"?"&t="+encodeURIComponent(state.topic):"";
  history.replaceState(null,"","#p="+encodeURIComponent(enc)+"&a="+state.active+t);
}
function readHash(){
  if(!location.hash) return;
  const q=new URLSearchParams(location.hash.slice(1));
  /* a shared link carries the citation style, so the recipient sees the chart
     credited the way the person who sent it credited it. Older links carried
     one style for the whole page as &src=. */
  const pageSrc=SRC_STYLES.some(s=>s[0]===q.get("src"))?q.get("src"):SRCSTYLE;
  if(q.get("p")){
    const panels=decodeURIComponent(q.get("p")).split(";").map(chunk=>{
      const [sel,chart,trans,from,to,era,h,w,gran,ttl,lvl,asort,tbl,src,ev]=chunk.split("~");
      /* the oldest links stored the government setting as 1/0 */
      const eraMode = era==="0" ? "off" : ERA_MODES.some(m=>m[0]===era) ? era : "bands";
      return mkPanel((sel||"").split(",").filter(id=>S(id)),
        {chart:chart||"line",trans:trans||"index",from:+from||1997,to:+to||2026,
         era:eraMode,
         /* links made before key events existed open without them, as they were drawn */
         ev:EVENT_MODES.some(m=>m[0]===ev)?ev:"off",src:SRC_STYLES.some(x=>x[0]===src)?src:pageSrc,/* every series is published annually, so charts are always drawn in
            years; older links that asked for finer steps open in years */
         gran:"years",
         title:ttl?decodeURIComponent(ttl):null,
         lvl:lvl||"", asort:(AREA_SORTS.some(a=>a[0]===asort)?asort:"desc"), table:tbl==="1",
         h:Math.max(H_MIN,Math.min(H_MAX,+h||H_DEF)),w:(W_SNAPS.includes(+w)?+w:12)});
    });
    if(panels.length) state.panels=panels;
  }
  if(q.get("t")){                              /* a topic, on its own or with a chart */
    const topic=q.get("t");
    if(catalogue().some(s=>s.topics.includes(topic))){ state.topic=topic; state.drawer=true; }
  }
  state.active=Math.max(0,Math.min(+q.get("a")||0,state.panels.length-1));
}

let gAt=0;
const gEl=document.getElementById("guide");
const gSpot=document.getElementById("gspot");
const gArrow=document.getElementById("garrow");
const gArrowP=document.getElementById("garrowp");
let gTarget=null;

/* Below this width there is nowhere to stand beside anything, so the card goes
   back to being a card in the corner. */
const gRoomy=()=>innerWidth>=820;

function gFind(sels){
  for(const s of (sels||[])){ const el=document.querySelector(s); if(el) return el; }
  return null;
}

/* Card first, then ring, then arrow — each needs the one before it measured. */
function gPlace(){
  if(!gTarget||!gTarget.isConnected||!gRoomy()){
    gEl.classList.remove("anchored");
    gEl.style.left=gEl.style.top="";
    gSpot.classList.remove("on"); gArrow.classList.remove("on");
    return;
  }
  const t=gTarget.getBoundingClientRect();
  if(t.width===0&&t.height===0){ gSpot.classList.remove("on"); gArrow.classList.remove("on"); return; }

  const PAD=6;
  gSpot.style.left=(t.left-PAD)+"px"; gSpot.style.top=(t.top-PAD)+"px";
  gSpot.style.width=(t.width+PAD*2)+"px"; gSpot.style.height=(t.height+PAD*2)+"px";
  gSpot.classList.add("on");

  gEl.classList.add("anchored");
  const c=gEl.getBoundingClientRect(), GAP=34, M=14, vw=innerWidth, vh=innerHeight;
  const spots=[
    {k:"right",x:t.right+GAP,               y:t.top+t.height/2-c.height/2},
    {k:"left", x:t.left-GAP-c.width,        y:t.top+t.height/2-c.height/2},
    {k:"below",x:t.left+t.width/2-c.width/2,y:t.bottom+GAP},
    {k:"above",x:t.left+t.width/2-c.width/2,y:t.top-GAP-c.height},
  ];
  const fits=s=>s.x>=M&&s.y>=M&&s.x+c.width<=vw-M&&s.y+c.height<=vh-M;
  /* Fall back to whichever placement overflows least rather than to a fixed
     side — on a short window "below" can be the only survivor. */
  const over=s=>Math.max(0,M-s.x)+Math.max(0,M-s.y)+
                Math.max(0,s.x+c.width-(vw-M))+Math.max(0,s.y+c.height-(vh-M));
  const pick=spots.find(fits)||spots.reduce((a,b)=>over(a)<=over(b)?a:b);
  const x=Math.max(M,Math.min(pick.x,vw-M-c.width));
  const y=Math.max(M,Math.min(pick.y,vh-M-c.height));
  gEl.style.left=x+"px"; gEl.style.top=y+"px";

  /* Arrow from the card's edge to the ring, bowed slightly so it reads as a
     pointer rather than a table rule. */
  const cx=x+c.width/2, cy=y+c.height/2;
  const tx=t.left+t.width/2, ty=t.top+t.height/2;
  const dx=tx-cx, dy=ty-cy, len=Math.hypot(dx,dy)||1;
  const ux=dx/len, uy=dy/len;
  const sx=cx+ux*Math.min(c.width/2+6,len/2), sy=cy+uy*Math.min(c.height/2+6,len/2);
  const ex=tx-ux*(Math.min(t.width,120)/2+PAD+11), ey=ty-uy*(Math.min(t.height,80)/2+PAD+11);
  const mx2=(sx+ex)/2-uy*22, my2=(sy+ey)/2+ux*22;   /* perpendicular bow */
  const ah=Math.atan2(ey-my2,ex-mx2), A=9;
  gArrowP.setAttribute("d",
    `M${sx.toFixed(1)} ${sy.toFixed(1)} Q${mx2.toFixed(1)} ${my2.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}`+
    ` M${(ex-A*Math.cos(ah-0.42)).toFixed(1)} ${(ey-A*Math.sin(ah-0.42)).toFixed(1)}`+
    ` L${ex.toFixed(1)} ${ey.toFixed(1)}`+
    ` L${(ex-A*Math.cos(ah+0.42)).toFixed(1)} ${(ey-A*Math.sin(ah+0.42)).toFixed(1)}`);
  gArrow.classList.add("on");
}

function drawGuide(){
  const s=GUIDE[gAt];
  if(s.setup){ s.setup(); render(); }
  document.getElementById("gstep").textContent=`${gAt+1} of ${GUIDE.length}`;
  document.getElementById("gbody").innerHTML=
    `<h3>${s.t}</h3><ul>${s.li.map(([icon,txt])=>`<li>${icon||'<span class="gi"></span>'}<span>${txt}</span></li>`).join("")}</ul>`;
  document.getElementById("gdots").innerHTML=
    GUIDE.map((_,i)=>`<i class="${i===gAt?"on":""}" data-g="${i}" title="Step ${i+1}"></i>`).join("");
  document.getElementById("gback").disabled=gAt===0;
  document.getElementById("gnext").textContent=gAt===GUIDE.length-1?"Got it":"Next";
  document.querySelectorAll("#gdots i").forEach(d=>d.onclick=()=>{gAt=+d.dataset.g;drawGuide();});

  gTarget=gRoomy()?gFind(s.sel):null;
  if(gTarget){
    const r=gTarget.getBoundingClientRect();
    /* Bring the target into view first; the scroll handler re-places the card
       as it moves, so there is no wait-then-guess. */
    if(r.top<70||r.bottom>innerHeight-70)
      gTarget.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});
  }
  gPlace();
}
const gReflow=()=>{ if(gEl.classList.contains("on")) gPlace(); };
addEventListener("scroll",gReflow,{passive:true});
addEventListener("resize",gReflow);
function openGuide(at){ gAt=at||0; gEl.hidden=false; gEl.classList.add("on"); drawGuide(); }
/* hoisted, so it can be called from anywhere in the file */
function closeGuide(remember){
  gEl.classList.remove("on","anchored"); gEl.hidden=true;
  gEl.style.left=gEl.style.top="";
  gSpot.classList.remove("on"); gArrow.classList.remove("on"); gTarget=null;
  /* The tour opens popovers to point inside them; leaving one open after it
     ends would look like the page had been left mid-click. */
  if(state.openCfg!==null||state.openMenu!==null){ state.openCfg=null; state.openMenu=null; render(); }
  if(remember){ try{ localStorage.setItem(GUIDE_KEY,"seen"); }catch(e){} }
}
document.getElementById("gclose").onclick=()=>closeGuide(true);
document.getElementById("gback").onclick =()=>{ if(gAt>0){ gAt--; drawGuide(); } };
document.getElementById("gnext").onclick =()=>{
  if(gAt<GUIDE.length-1){ gAt++; drawGuide(); } else closeGuide(true);
};
document.getElementById("helpBtn").onclick=()=>
  gEl.classList.contains("on")?closeGuide(true):openGuide(0);
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&gEl.classList.contains("on")) closeGuide(true);
});
/* First visit only, and never over a chart someone was sent to: a shared
   link (#p=…) or a topic (#t=…) should open on what it points at. Nor on a
   phone, where the tour covers the whole screen. The ? button offers it. */
(function(){
  let seen=true;
  try{ seen=localStorage.getItem(GUIDE_KEY)==="seen"; }catch(e){}
  const linked=/^#(p|t)=/.test(location.hash), small=matchMedia("(max-width:760px)").matches;
  if(!seen&&!linked&&!small) openGuide(0);
})();

document.getElementById("copyLink").onclick=()=>{
  navigator.clipboard?.writeText(location.href);
  const b=document.getElementById("copyLink"), o=b.textContent;
  b.textContent="✓ Copied"; setTimeout(()=>b.textContent=o,1400);
};
document.getElementById("q").oninput=e=>{state.q=e.target.value;renderSidebar();};

/* ── logo ── */
(function(){
  const shape="M10 50 Q50 -10 90 50 Q50 102 10 50 Z";
  const bars=[[29.75,46.56,18.72],[41.25,36.48,28.80],[52.75,42.60,22.68],[64.25,30.72,34.56]]
    .map(([x,y,h])=>`<rect x="${x}" y="${y}" width="6" height="${h}"/>`).join("");
  document.getElementById("logo").innerHTML=
   `<svg viewBox="6.5 16.5 87 63"><defs><clipPath id="lg"><path d="${shape}"/></clipPath></defs>`+
   `<path d="${shape}" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>`+
   `<g clip-path="url(#lg)" fill="#fff">${bars}</g></svg>`;
})();

/* ── boot: prefer real data if the ingest has run ── */
/* no-cache means revalidate, not refetch — the browser still sends the ETag,
   so this costs a 304 and stops a rebuilt bundle sitting invisible behind a
   cached copy. */
fetch("data/bundle.json",{cache:"no-cache"}).then(r=>r.ok?r.json():Promise.reject()).then(d=>{DB=d;})
  .catch(()=>{}).finally(()=>{
    /* Brexit mode has gone; a stored choice of it is cleared */
    try{ localStorage.removeItem("polyoptic-mode"); }catch(e){}
    syncThemeBtn();
    readHash(); render();
  });
</script>
