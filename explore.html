<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%226.5%204.5%2087%2087%22%3E%3Cdefs%3E%3CclipPath%20id%3D%22c%22%3E%3Cpath%20d%3D%22M10%2050%20Q50%20-10%2090%2050%20Q50%20102%2010%2050%20Z%22%2F%3E%3C%2FclipPath%3E%3C%2Fdefs%3E%3Cpath%20d%3D%22M10%2050%20Q50%20-10%2090%2050%20Q50%20102%2010%2050%20Z%22%20fill%3D%22none%22%20stroke%3D%22%234633A8%22%20stroke-width%3D%225%22%20stroke-linejoin%3D%22round%22%2F%3E%3Cg%20clip-path%3D%22url%28%23c%29%22%20fill%3D%22%234633A8%22%3E%3Crect%20x%3D%2229.75%22%20y%3D%2246.56%22%20width%3D%226%22%20height%3D%2218.72%22%2F%3E%3Crect%20x%3D%2241.25%22%20y%3D%2236.48%22%20width%3D%226%22%20height%3D%2228.8%22%2F%3E%3Crect%20x%3D%2252.75%22%20y%3D%2242.6%22%20width%3D%226%22%20height%3D%2222.68%22%2F%3E%3Crect%20x%3D%2264.25%22%20y%3D%2230.72%22%20width%3D%226%22%20height%3D%2234.56%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#EDEFF1;--surface:#fff;--ink:#0F1419;--muted:#5C6672;--rule:#D3D8DD;
--purple:#4633A8;--purple-dk:#3A2A8C;--soft:#F4F2FA;--prule:#D8D2EC;
--warn:#B45309;--warnbg:#FFF8E6;--warnrule:#E8D9A8}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Public Sans",system-ui,sans-serif;font-size:15px;line-height:1.5}
h1,h2,h3,h4{font-family:"Archivo";margin:0;letter-spacing:-0.03em;line-height:1.05}
svg{display:block}
button{font-family:inherit}
body.dragging{user-select:none;cursor:grabbing}
body.resizing{user-select:none;cursor:ns-resize}

/* ── header ── */
header{position:sticky;top:0;z-index:40;background:var(--purple);color:#fff}
.hrow{max-width:1600px;margin:0 auto;padding:0 32px;height:70px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none}
.brand svg{width:36px;height:26px}
.wm{font-family:"Archivo";font-weight:800;font-size:21px;letter-spacing:-0.05em;color:#fff}
.wm .b{font-weight:500;color:rgba(255,255,255,.66)}
.crumb{font-family:"IBM Plex Mono";font-size:11px;color:rgba(255,255,255,.6);letter-spacing:.1em;text-transform:uppercase;margin-left:6px}
.hact{margin-left:auto;display:flex;gap:8px}
.hb{font-family:"IBM Plex Mono";font-size:11.5px;padding:8px 16px;border:1px solid rgba(255,255,255,.34);border-radius:2px;background:transparent;color:#fff;cursor:pointer;transition:.15s}
.hb:hover{background:#fff;color:var(--purple);border-color:#fff}
.hb.solid{background:#fff;color:var(--purple);border-color:#fff;font-weight:500}
.hb.solid:hover{background:#F1EEFA}

.shell{max-width:1600px;margin:0 auto;padding:26px 32px 90px;display:grid;grid-template-columns:308px 1fr;gap:22px;align-items:start}
@media(max-width:1040px){.shell{grid-template-columns:1fr;padding:20px 20px 60px}}

/* ── sidebar ── */
.side{position:sticky;top:96px}
@media(max-width:1040px){.side{position:static}}
.panelbox{background:var(--surface);border:1px solid var(--rule)}
.psec{padding:14px 16px;border-bottom:1px solid var(--rule)}
.psec:last-child{border-bottom:0}
.plabel{font-family:"IBM Plex Mono";font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}

/* which chart am I editing */
.pswitch{display:flex;gap:5px;flex-wrap:wrap}
.ps{font-family:"IBM Plex Mono";font-size:11px;padding:6px 11px;border:1px solid var(--rule);background:transparent;color:var(--muted);cursor:pointer;border-radius:2px;transition:.13s}
.ps:hover{border-color:var(--ink);color:var(--ink)}
.ps[aria-pressed="true"]{background:var(--purple);border-color:var(--purple);color:#fff}
.ps.add{color:var(--purple);border-color:var(--prule);background:var(--soft);font-weight:500}
.ps.add:hover{background:#EAE5F6}

/* selected tray — survives topic filtering */
.tray{display:flex;flex-direction:column;gap:6px}
.trayitem{display:flex;align-items:center;gap:9px;padding:7px 9px;background:var(--soft);border:1px solid var(--prule);border-radius:2px}
.trayitem .sw{width:11px;height:11px;flex-shrink:0;border-radius:2px}
.trayitem .nm{flex:1;min-width:0;font-size:12.5px;font-weight:500;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trayitem .x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:0 2px}
.trayitem .x:hover{color:var(--purple)}
.trayempty{font-size:12.5px;color:var(--muted);padding:4px 0}

#q{width:100%;padding:9px 11px;border:1px solid var(--rule);font-family:inherit;font-size:13.5px;background:var(--paper);border-radius:2px}
#q:focus{outline:2px solid var(--purple);outline-offset:-1px}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.f{font-family:"IBM Plex Mono";font-size:10.5px;padding:5px 10px;border:1px solid var(--rule);background:transparent;color:var(--muted);cursor:pointer;border-radius:2px}
.f[aria-pressed="true"]{background:var(--purple);border-color:var(--purple);color:#fff}
.cat{max-height:46vh;overflow-y:auto}
@media(max-width:1040px){.cat{max-height:300px}}
.ci{padding:12px 16px;border-bottom:1px solid #EEF0F2;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.ci:hover{background:#F8F8FA}
.ci[aria-selected="true"]{background:var(--soft)}
.ci .sw{width:11px;height:11px;flex-shrink:0;margin-top:3px;border:1.5px solid var(--rule);background:transparent;border-radius:2px}
.ci .body{flex:1;min-width:0}
.ci .cn{display:block;font-size:13.5px;font-weight:600;line-height:1.35;color:var(--ink)}
.ci .cm{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;align-items:center}
.ci .tag{font-family:"IBM Plex Mono";font-size:9.5px;color:var(--muted);background:var(--paper);border:1px solid var(--rule);padding:1px 6px;white-space:nowrap}
.ci .yr{font-family:"IBM Plex Mono";font-size:9.5px;color:var(--muted);padding:1px 2px}
.ci[aria-selected="true"] .tag{background:#fff;border-color:var(--prule)}
.empty{padding:18px 16px;font-size:13px;color:var(--muted)}
.foot{font-family:"IBM Plex Mono";font-size:10.5px;color:var(--muted)}

/* ── panels ── */
.stack{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;align-items:start}
.pcard{grid-column:span var(--span,12)}
@media(max-width:1040px){.pcard{grid-column:span 12}}
.pcard{background:var(--surface);border:1px solid var(--rule);position:relative;transition:border-color .15s,box-shadow .15s;min-width:0}
.pcard.is-focus{border-color:var(--purple);box-shadow:0 0 0 1px var(--purple)}
.pcard.drag-src{opacity:.42}
.pcard.drop-hint{border-top:3px solid var(--purple)}

.pbar{display:flex;align-items:center;gap:11px;padding:12px 16px;border-bottom:1px solid var(--rule)}
.grip{cursor:grab;color:var(--rule);font-size:15px;line-height:1;letter-spacing:-2px;padding:2px 3px;flex-shrink:0;touch-action:none}
.grip:hover{color:var(--muted)}
.pcard.is-focus .grip{color:var(--prule)}
.pnum{font-family:"IBM Plex Mono";font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.pcard.is-focus .pnum{color:var(--purple)}
.ptitle{font-size:16px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pacts{display:flex;gap:5px;flex-shrink:0}
.pa{font-family:"IBM Plex Mono";font-size:11px;padding:5px 9px;border:1px solid var(--rule);background:transparent;color:var(--muted);cursor:pointer;border-radius:2px}
.pa:hover{border-color:var(--purple);color:var(--purple)}
.pa.danger:hover{border-color:#B91C1C;color:#B91C1C}

.pctrl{display:flex;gap:22px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--rule);background:#FCFCFD}
.grp{display:flex;flex-direction:column;gap:7px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-family:"IBM Plex Mono";font-size:11px;padding:6px 12px;border:1px solid var(--rule);background:transparent;color:var(--muted);cursor:pointer;border-radius:2px;transition:.13s}
.chip:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--purple);border-color:var(--purple);color:#fff}
.chip:disabled{opacity:.34;cursor:not-allowed}
.rng{display:flex;align-items:center;gap:8px;font-family:"IBM Plex Mono";font-size:11px;color:var(--muted)}
.rng input{width:72px;padding:5px 7px;border:1px solid var(--rule);font-family:"IBM Plex Mono";font-size:11px;background:var(--surface);border-radius:2px}
.tog{display:flex;align-items:center;gap:7px;font-family:"IBM Plex Mono";font-size:11px;color:var(--muted);cursor:pointer}

.warn{background:var(--warnbg);border-bottom:1px solid var(--warnrule);padding:9px 16px;font-size:12.5px;color:#6B4A0A}
.warn b{color:#4A3306}
.warn button{margin-left:8px;font-family:"IBM Plex Mono";font-size:10.5px;background:transparent;border:1px solid var(--warnrule);padding:3px 8px;cursor:pointer;color:#6B4A0A;border-radius:2px}
.pbody{padding:14px 16px 6px}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:0 16px 12px}
.lg{display:flex;align-items:center;gap:7px;font-size:12.5px}
.lg .d{width:13px;height:3px;flex-shrink:0}
.lg .u{font-family:"IBM Plex Mono";font-size:10px;color:var(--muted)}
.pfoot{padding:10px 16px 12px;border-top:1px solid var(--rule);font-family:"IBM Plex Mono";font-size:10.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:5px 18px}

/* resize grip along the bottom edge */
.rgrip{height:12px;cursor:ns-resize;display:flex;align-items:center;justify-content:center;
  border-top:1px solid var(--rule);background:#FCFCFD;touch-action:none}
.rgrip:hover{background:var(--soft)}
.rgrip::after{content:"";width:34px;height:3px;border-radius:2px;background:var(--rule)}
.rgrip:hover::after{background:var(--purple)}
.cgrip{position:absolute;right:0;bottom:0;width:20px;height:20px;cursor:nwse-resize;touch-action:none;
  background:linear-gradient(135deg,transparent 46%,var(--rule) 46%,var(--rule) 56%,transparent 56%,
             transparent 68%,var(--rule) 68%,var(--rule) 78%,transparent 78%)}
.cgrip:hover{background:linear-gradient(135deg,transparent 46%,var(--purple) 46%,var(--purple) 56%,transparent 56%,
             transparent 68%,var(--purple) 68%,var(--purple) 78%,transparent 78%)}
.stackempty{grid-column:span 12;background:var(--surface);border:1px dashed var(--prule);
  padding:52px 24px;text-align:center;color:var(--muted)}
.stackempty h3{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:8px}
.hpill{position:absolute;right:12px;bottom:18px;font-family:"IBM Plex Mono";font-size:10px;
  background:var(--ink);color:#fff;padding:3px 7px;border-radius:2px;opacity:0;transition:opacity .15s;pointer-events:none}
.pcard.is-resizing .hpill{opacity:.9}

.gridline{stroke:var(--rule);stroke-width:1}
.axlabel{font-family:"IBM Plex Mono";font-size:10px;fill:var(--muted)}
.line{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.ribbon-t{font-family:"IBM Plex Mono";font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:10px 0 5px}
.era rect{opacity:.84}.era:hover rect{opacity:1}
.era text{font-family:"IBM Plex Mono";font-size:9px;fill:#fff;font-weight:500}
.pmtick{stroke:var(--ink);stroke-width:1;stroke-dasharray:2 2;opacity:.3}
.pmlabel{font-family:"IBM Plex Mono";font-size:8.5px;fill:var(--muted)}
.disc{stroke:var(--warn);stroke-width:1;stroke-dasharray:3 3;opacity:.6}
.sm-t{font-family:"IBM Plex Mono";font-size:10px;font-weight:500}

.blank{padding:56px 24px;text-align:center;color:var(--muted)}
.blank h3{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:8px}
.sug{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.sg{font-family:"IBM Plex Mono";font-size:11.5px;padding:8px 13px;border:1px solid var(--prule);background:var(--soft);color:var(--purple);cursor:pointer;border-radius:2px}
.sg:hover{background:#EAE5F6}

.addbar{display:flex;justify-content:center;padding:4px 0 0}
.addbtn{font-family:"IBM Plex Mono";font-size:12px;padding:11px 24px;border:1px dashed var(--prule);
  background:var(--surface);color:var(--purple);cursor:pointer;border-radius:2px;width:100%;transition:.14s}
.addbtn:hover{background:var(--soft);border-color:var(--purple);border-style:solid}

.srcpanel{background:var(--surface);border:1px solid var(--rule);padding:14px 16px;margin-top:16px}
.srcrow{font-size:12.5px;color:var(--muted);padding:7px 0;border-bottom:1px solid #EEF0F2;display:flex;gap:12px;flex-wrap:wrap}
.srcrow:last-child{border-bottom:0}
.srcrow b{color:var(--ink);font-weight:600}
.srcrow .mono{font-family:"IBM Plex Mono";font-size:10.5px}
.ph{display:inline-block;font-family:"IBM Plex Mono";font-size:9.5px;background:var(--warnbg);border:1px solid var(--warnrule);color:var(--warn);padding:1px 6px}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <a class="brand" href="index.html"><span id="logo"></span><span class="wm">poly<span class="b">optic</span></span></a>
    <span class="crumb">Explorer</span>
    <div class="hact">
      <button class="hb" id="copyLink">⧉ Copy link</button>
    </div>
  </div>
</header>

<div class="shell">
  <div class="side">
    <div class="panelbox">
      <div class="psec">
        <div class="plabel">Editing</div>
        <div class="pswitch" id="pswitch"></div>
      </div>
      <div class="psec">
        <div class="plabel">On this chart</div>
        <div class="tray" id="tray"></div>
      </div>
      <div class="psec">
        <div class="plabel">Indicators</div>
        <input id="q" placeholder="Search…" autocomplete="off">
        <div class="filters" id="filters"></div>
      </div>
      <div class="cat" id="cat"></div>
      <div class="psec" style="border-top:1px solid var(--rule)">
        <div class="foot" id="count"></div>
      </div>
    </div>
  </div>

  <div>
    <div class="stack" id="stack"></div>
    <div class="addbar"><button class="addbtn" id="addBottom">+ Add another chart</button></div>
    <div class="srcpanel" id="srcs"></div>
  </div>
</div>

     values:[29,29,25,26,22,21,23,24,26,28,30,31,31,44,49,48,49,49,45,48,54,50,48,39,71,111,94,105,110,112]}

/* ══════════════════════════════════════════════
   STATE — a list of panels, one of them active
   ══════════════════════════════════════════════ */
let DB = PLACEHOLDER;
const PALETTE = ["#4633A8","#C2410C","#0F766E","#A21CAF"];
const CHART_TYPES = [["line","Line"],["bar","Bars"],["area","Area"],["scatter","Scatter"],["small","Small multiples"]];
const TRANSFORMS = [["none","As published"],["index","Rebase to 100"],["yoy","Year-on-year %"],
                    ["roll3","3-year average"],["real","Real terms"],["percap","Per person"],["pctgdp","% of GDP"]];
const H_MIN=210, H_MAX=640, H_DEF=300;

let uid=0;
const mkPanel = (sel=[], over={}) =>
  ({key:++uid, sel:sel.slice(), chart:"line", trans:"index", from:1997, to:2026, ribbon:true, h:H_DEF, w:12, ...over});

const state = { panels:[ mkPanel(["hpe","realpay"]) ], active:0, focus:null, q:"", topic:"all" };
const P0 = () => state.panels[state.active] || null;
const S  = id => DB.series.find(s=>s.id===id);
const yearsOf = s => s.values.map((_,i)=>s.start+i);
const refAt = (ref,y) => { const r=DB.refs[ref]; if(!r) return null; const i=y-r.start; return (i>=0&&i<r.values.length)?r.values[i]:null; };

/* ── transforms ── */
const applies=(t,s)=>(t==="real"||t==="percap"||t==="pctgdp") ? (s.kind==="money_cash"||s.kind==="count") : true;
function transform(s,p){
  const t=p.trans;
  let pts = yearsOf(s).map((y,i)=>[y,s.values[i]]);
  if(t==="real"&&applies(t,s)){const base=refAt("deflator",2024);
    pts=pts.map(([y,v])=>{const d=refAt("deflator",y);return [y,d?v*base/d:null];});}
  if(t==="percap"&&applies(t,s)) pts=pts.map(([y,v])=>{const q=refAt("population",y);return [y,q?v/q:null];});
  if(t==="pctgdp"&&applies(t,s)) pts=pts.map(([y,v])=>{const g=refAt("gdp",y);return [y,g?v/g*100:null];});
  if(t==="yoy") pts=pts.map(([y,v],i)=>i===0?[y,null]:[y,pts[i-1][1]?(v/pts[i-1][1]-1)*100:null]);
  if(t==="roll3") pts=pts.map(([y,_],i)=>{const w=pts.slice(Math.max(0,i-2),i+1).map(q=>q[1]).filter(v=>v!=null);
    return [y,w.length?w.reduce((a,b)=>a+b,0)/w.length:null];});
  if(t==="index"){const b=pts.find(q=>q[0]>=p.from&&q[1]!=null);
    if(b) pts=pts.map(([y,v])=>[y,v!=null?v/b[1]*100:null]);}
  return pts.filter(q=>q[0]>=p.from&&q[0]<=p.to);
}
function unitLabel(s,p){
  const t=p.trans;
  if(t==="index") return `index, ${p.from}=100`;
  if(t==="yoy") return "% change on year";
  if(t==="real"&&applies(t,s)) return s.unit.replace(/,?\s*cash/,"")+", 2024 prices";
  if(t==="percap"&&applies(t,s)) return s.unit+" per person";
  if(t==="pctgdp"&&applies(t,s)) return "% of GDP";
  return s.unit;
}

/* ══════════════════════════════════════════════
   CHART ENGINE — height comes from the panel
   ══════════════════════════════════════════════ */
const W=940, M={t:16,r:66,b:26,l:58};
const px=(p,y)=>M.l+((y-p.from)/Math.max(1,p.to-p.from))*(W-M.l-M.r);
function scale(vals){
  const v=vals.filter(x=>x!=null);
  if(!v.length) return [0,1];
  let a=Math.min(...v),b=Math.max(...v);
  if(a===b){a-=1;b+=1;}
  const pad=(b-a)*0.12; return [a-pad,b+pad];
}
const fmt=n=>n==null?"–":Math.abs(n)>=1000?n.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,","):
             Math.abs(n)>=100?n.toFixed(0):Math.abs(n)>=10?n.toFixed(1):n.toFixed(2);

function frame(p,g,mn,mx,label){
  const H=p.h;
  for(let i=0;i<=4;i++){
    const y=M.t+i*(H-M.t-M.b)/4, val=mx-(mx-mn)*i/4;
    g.push(`<line class="gridline" x1="${M.l}" y1="${y}" x2="${W-M.r}" y2="${y}"/>`);
    g.push(`<text class="axlabel" x="${M.l-9}" y="${y+3.5}" text-anchor="end">${fmt(val)}</text>`);
  }
  const span=p.to-p.from, step=span>24?5:span>12?2:1;
  for(let yr=Math.ceil(p.from/step)*step;yr<=p.to;yr+=step)
    g.push(`<text class="axlabel" x="${px(p,yr)}" y="${H-6}" text-anchor="middle">${yr}</text>`);
  if(label) g.push(`<text class="axlabel" transform="translate(13 ${(M.t+(H-M.b))/2}) rotate(-90)" text-anchor="middle">${label}</text>`);
}
const wrapSvg=(p,g)=>`<svg viewBox="0 0 ${W} ${p.h}" style="width:100%;height:auto;overflow:visible" role="img" aria-label="Chart">${g.join("")}</svg>`;

function renderLine(p,sets,mode){
  const g=[],H=p.h;
  const shared=sets.every(s=>s.unit===sets[0].unit);
  let [mn,mx]=scale(sets.flatMap(s=>s.pts.map(q=>q[1])));
  frame(p,g,mn,mx,shared?sets[0].unit:"");
  sets.flatMap(s=>(s.meta.discontinuities||[])).forEach(d=>{
    if(d.year>=p.from&&d.year<=p.to)
      g.push(`<line class="disc" x1="${px(p,d.year)}" y1="${M.t}" x2="${px(p,d.year)}" y2="${H-M.b}"><title>${d.note}</title></line>`);});
  sets.forEach(s=>{
    let a=mn,b=mx;
    if(!shared) [a,b]=scale(s.pts.map(q=>q[1]));
    const Y=v=>M.t+(1-(v-a)/(b-a))*(H-M.t-M.b);
    if(mode==="area"){
      const seg=s.pts.filter(q=>q[1]!=null);
      if(seg.length) g.push(`<path d="M${px(p,seg[0][0])} ${H-M.b} ${seg.map(q=>`L${px(p,q[0])} ${Y(q[1])}`).join("")} L${px(p,seg[seg.length-1][0])} ${H-M.b} Z" fill="${s.colour}" opacity="0.13"/>`);
    }
    let d="",pen=false;
    s.pts.forEach(q=>{ if(q[1]==null){pen=false;return;} d+=(pen?"L":"M")+px(p,q[0]).toFixed(1)+" "+Y(q[1]).toFixed(1)+" "; pen=true; });
    g.push(`<path class="line" d="${d}" stroke="${s.colour}"/>`);
    const last=[...s.pts].reverse().find(q=>q[1]!=null);
    if(last) g.push(`<text class="sm-t" x="${W-M.r+7}" y="${Y(last[1])+3.5}" fill="${s.colour}">${fmt(last[1])}</text>`);
  });
  return wrapSvg(p,g);
}

function renderBar(p,sets){
  const g=[],H=p.h;
  const [mn0,mx]=scale(sets.flatMap(s=>s.pts.map(q=>q[1])));
  const mn=Math.min(0,mn0);
  frame(p,g,mn,mx,sets[0].unit);
  const Y=v=>M.t+(1-(v-mn)/(mx-mn))*(H-M.t-M.b);
  const years=sets[0].pts.map(q=>q[0]);
  const slot=(W-M.l-M.r)/Math.max(1,years.length), bw=Math.max(1.5,(slot*0.72)/sets.length);
  years.forEach((yr,yi)=>sets.forEach((s,si)=>{
    const v=s.pts[yi]&&s.pts[yi][1]; if(v==null)return;
    const x=M.l+yi*slot+slot*0.14+si*bw, y0=Y(Math.max(0,v)), y1=Y(Math.min(0,v));
    g.push(`<rect x="${x.toFixed(1)}" y="${y0.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0.5,y1-y0).toFixed(1)}" fill="${s.colour}" opacity="0.88"><title>${yr}: ${fmt(v)}</title></rect>`);
  }));
  return wrapSvg(p,g);
}

function renderScatter(p,sets){
  const g=[],H=p.h,[X,Yv]=sets,pairs=[];
  X.pts.forEach((q,i)=>{const r=Yv.pts[i]; if(q[1]!=null&&r&&r[1]!=null) pairs.push([q[0],q[1],r[1]]);});
  const [ax,bx]=scale(pairs.map(q=>q[1])), [ay,by]=scale(pairs.map(q=>q[2]));
  const PX=v=>M.l+((v-ax)/(bx-ax))*(W-M.l-M.r), PY=v=>M.t+(1-(v-ay)/(by-ay))*(H-M.t-M.b);
  for(let i=0;i<=4;i++){
    const y=M.t+i*(H-M.t-M.b)/4;
    g.push(`<line class="gridline" x1="${M.l}" y1="${y}" x2="${W-M.r}" y2="${y}"/>`);
    g.push(`<text class="axlabel" x="${M.l-9}" y="${y+3.5}" text-anchor="end">${fmt(by-(by-ay)*i/4)}</text>`);
  }
  for(let i=0;i<=4;i++)
    g.push(`<text class="axlabel" x="${M.l+i*(W-M.l-M.r)/4}" y="${H-6}" text-anchor="middle">${fmt(ax+(bx-ax)*i/4)}</text>`);
  pairs.forEach(([yr,vx,vy])=>{
    const era=DB.eras.find(e=>yr>=e.from&&yr<e.to);
    g.push(`<circle cx="${PX(vx).toFixed(1)}" cy="${PY(vy).toFixed(1)}" r="4.5" fill="${era?era.colour:"#5C6672"}" opacity="0.82"><title>${yr}\n${X.name}: ${fmt(vx)}\n${Yv.name}: ${fmt(vy)}</title></circle>`);
  });
  g.push(`<text class="axlabel" transform="translate(13 ${(M.t+(H-M.b))/2}) rotate(-90)" text-anchor="middle">${Yv.name}</text>`);
  g.push(`<text class="axlabel" x="${W-M.r}" y="${H-6}" text-anchor="end">${X.name} →</text>`);
  return wrapSvg(p,g);
}

function renderSmall(p,sets){
  const cols=Math.min(2,sets.length), rows=Math.ceil(sets.length/cols);
  const pw=W/cols, ph=Math.max(140,p.h/rows), g=[];
  sets.forEach((s,i)=>{
    const cx=(i%cols)*pw, cy=Math.floor(i/cols)*ph;
    const [a,b]=scale(s.pts.map(q=>q[1])), m={t:26,r:14,b:20,l:46};
    const PX=y=>cx+m.l+((y-p.from)/Math.max(1,p.to-p.from))*(pw-m.l-m.r);
    const PY=v=>cy+m.t+(1-(v-a)/(b-a))*(ph-m.t-m.b);
    g.push(`<text class="sm-t" x="${cx+m.l}" y="${cy+14}" fill="${s.colour}">${s.name}</text>`);
    [0,1,2].forEach(k=>{const y=cy+m.t+k*(ph-m.t-m.b)/2;
      g.push(`<line class="gridline" x1="${cx+m.l}" y1="${y}" x2="${cx+pw-m.r}" y2="${y}"/>`);
      g.push(`<text class="axlabel" x="${cx+m.l-6}" y="${y+3}" text-anchor="end" style="font-size:9px">${fmt(b-(b-a)*k/2)}</text>`);});
    let d="",pen=false;
    s.pts.forEach(q=>{ if(q[1]==null){pen=false;return;} d+=(pen?"L":"M")+PX(q[0]).toFixed(1)+" "+PY(q[1]).toFixed(1)+" "; pen=true;});
    g.push(`<path class="line" d="${d}" stroke="${s.colour}" stroke-width="2"/>`);
    g.push(`<text class="axlabel" x="${cx+m.l}" y="${cy+ph-6}" style="font-size:9px">${p.from}</text>`);
    g.push(`<text class="axlabel" x="${cx+pw-m.r}" y="${cy+ph-6}" text-anchor="end" style="font-size:9px">${p.to}</text>`);
  });
  return `<svg viewBox="0 0 ${W} ${rows*ph}" style="width:100%;height:auto" role="img" aria-label="Small multiples">${g.join("")}</svg>`;
}

function renderRibbon(p){
  if(!p.ribbon) return "";
  const g=[];
  DB.eras.forEach(e=>{
    const f=Math.max(e.from,p.from), t=Math.min(e.to,p.to);
    if(t<=f) return;
    const x=px(p,f), w=px(p,t)-px(p,f);
    g.push(`<g class="era"><title>${e.party} ${e.from}–${e.to}</title><rect x="${x}" y="0" width="${w}" height="16" fill="${e.colour}"/>`);
    if(w>78) g.push(`<text x="${x+w/2}" y="11.5" text-anchor="middle">${e.party.toUpperCase()}</text>`);
    g.push("</g>");
  });
  DB.pms.forEach(([y,n])=>{ if(y>=p.from&&y<=p.to)
    g.push(`<line class="pmtick" x1="${px(p,y)}" y1="16" x2="${px(p,y)}" y2="23"/><text class="pmlabel" x="${px(p,y)}" y="33" text-anchor="middle">${n}</text>`);});
  return `<div class="ribbon-t">Government in power</div><svg viewBox="0 0 ${W} 37" style="width:100%;height:auto" role="img" aria-label="Governing party by year">${g.join("")}</svg>`;
}

/* ══════════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════════ */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function buildSets(p){
  return p.sel.map((id,i)=>{
    const s=S(id); if(!s) return null;
    return {id,name:s.name,meta:s,colour:PALETTE[i%PALETTE.length],unit:unitLabel(s,p),pts:transform(s,p)};
  }).filter(Boolean);
}

function warningsFor(p,sets){
  const w=[];
  const geos=[...new Set(sets.map(s=>s.meta.geography))];
  if(geos.length>1) w.push({html:`<b>Different geographies.</b> Comparing ${esc(geos.join(" with "))}. These cover different populations and are not like for like.`});
  const bases=[...new Set(sets.map(s=>s.meta.year_basis))];
  if(bases.length>1) w.push({html:`<b>Different year bases.</b> Mixing ${esc(bases.join(", "))} years. Academic and financial years plot at their starting calendar year, so a point can be up to twelve months out.`});
  const units=[...new Set(sets.map(s=>s.unit))];
  if(units.length>1&&p.trans!=="index"&&p.trans!=="yoy")
    w.push({html:`<b>Different units.</b> Each series is on its own axis, which can make any two lines appear to move together.`,act:"rebase"});
  const skipped=sets.filter(s=>["real","percap","pctgdp"].includes(p.trans)&&!applies(p.trans,s.meta));
  if(skipped.length) w.push({html:`<b>Transform skipped for ${esc(skipped.map(s=>s.name).join(", "))}.</b> Already a rate, ratio or index — deflating or dividing by population would be meaningless.`});
  sets.flatMap(s=>(s.meta.discontinuities||[]).filter(d=>d.year>=p.from&&d.year<=p.to).map(d=>({s:s.name,...d})))
      .forEach(d=>w.push({html:`<b>Break in ${esc(d.s)} at ${d.year}.</b> ${esc(d.note)}`}));
  return w;
}

function panelHtml(p,i){
  const sets=buildSets(p);
  const anyApplies=t=>p.sel.some(id=>applies(t,S(id)));

  const ctrl=`<div class="pctrl">
    <div class="grp"><div class="plabel">Chart</div><div class="chips">${
      CHART_TYPES.map(([k,l])=>`<button class="chip" data-act="chart" data-v="${k}" aria-pressed="${p.chart===k}" ${k==="scatter"&&p.sel.length!==2?"disabled":""}>${l}</button>`).join("")
    }</div></div>
    <div class="grp"><div class="plabel">Transform</div><div class="chips">${
      TRANSFORMS.map(([k,l])=>`<button class="chip" data-act="trans" data-v="${k}" aria-pressed="${p.trans===k}" ${p.sel.length&&!anyApplies(k)?"disabled":""}>${l}</button>`).join("")
    }</div></div>
    <div class="grp"><div class="plabel">Range</div><div class="rng">
      <input type="number" data-act="from" value="${p.from}" min="1980" max="2026"> — <input type="number" data-act="to" value="${p.to}" min="1980" max="2026">
    </div></div>
    <div class="grp"><div class="plabel">Options</div>
      <label class="tog"><input type="checkbox" data-act="ribbon" ${p.ribbon?"checked":""}> Era ribbon</label></div>
  </div>`;

  let body,foot="",legend="";
  if(!sets.length){
    body=`<div class="blank"><h3>Nothing on this chart</h3>
      <div>Pick indicators from the left, or start with a pairing:</div>
      <div class="sug">
        <button class="sg" data-act="pair" data-v="completions,hpe">Supply × affordability</button>
        <button class="sg" data-act="pair" data-v="funding,gap">Funding × attainment gap</button>
        <button class="sg" data-act="pair" data-v="socialstock,tempacc">Social stock × temp accommodation</button>
      </div></div>`;
  } else {
    let chart;
    if(p.chart==="scatter") chart = sets.length===2 ? renderScatter(p,sets)
      : `<div class="blank"><h3>Scatter needs exactly two</h3><div>Points are coloured by the government of the day.</div></div>`;
    else if(p.chart==="small") chart=renderSmall(p,sets);
    else if(p.chart==="bar") chart=renderBar(p,sets);
    else chart=renderLine(p,sets,p.chart);
    const showRibbon = p.chart!=="scatter" && p.chart!=="small";
    body=`<div class="pbody">${chart}${showRibbon?renderRibbon(p):""}</div>`;
    legend=`<div class="legend">${sets.map(s=>`<span class="lg"><span class="d" style="background:${s.colour}"></span>${esc(s.name)} <span class="u">${esc(s.unit)}</span></span>`).join("")}</div>`;
    foot=`<div class="pfoot"><span>SOURCES · ${esc([...new Set(sets.map(s=>s.meta.source))].join(" · ")).toUpperCase()}</span>
      <span>LICENCE · OGL v3.0</span><span>DATA · ${DB.meta.provenance.toUpperCase()}</span></div>`;
  }

  const warns=warningsFor(p,sets).map(w=>
    `<div class="warn">${w.html}${w.act==="rebase"?`<button data-act="rebase">Rebase</button>`:""}</div>`).join("");

  return `<div class="pcard ${state.focus===i?"is-focus":""}" style="--span:${p.w}" data-i="${i}" data-key="${p.key}">
    <div class="pbar">
      <span class="grip" data-act="grip" title="Drag to reorder">⠿</span>
      <span class="pnum">Chart ${i+1}</span>
      <h2 class="ptitle">${sets.length?esc(sets.map(s=>s.name).join(" × ")):"Empty chart"}</h2>
      <div class="pacts">
        <button class="pa" data-act="csv" title="Download this chart as CSV">↓ CSV</button>
        <button class="pa" data-act="png" title="Download this chart as an image">↓ PNG</button>
        <button class="pa" data-act="dup" title="Duplicate">⧉</button>
        <button class="pa danger" data-act="del" title="Remove">✕</button>
      </div>
    </div>
    ${ctrl}${warns}${body}${legend}${foot}
    <div class="rgrip" data-act="rgrip" title="Drag to change height"></div>
    <div class="cgrip" data-act="cgrip" title="Drag to resize"></div>
    <span class="hpill">${p.w===12?"full":"half"} · ${p.h}px</span>
  </div>`;
}

function renderPanels(){
  const stack=document.getElementById("stack");
  stack.innerHTML = state.panels.length
    ? state.panels.map(panelHtml).join("")
    : `<div class="stackempty"><h3>No charts</h3>
       <div>Add one below, or pick an indicator on the left and we'll start a chart for you.</div></div>`;
}

function renderSidebar(){
  /* which chart am I editing */
  document.getElementById("pswitch").innerHTML =
    state.panels.length
      ? state.panels.map((p,i)=>`<button class="ps" data-sw="${i}" aria-pressed="${i===state.active}">Chart ${i+1}</button>`).join("")
      : `<span class="trayempty">No charts yet.</span>`;
  document.querySelectorAll("[data-sw]").forEach(b=>b.onclick=()=>{
    state.active=+b.dataset.sw; state.focus=state.active; render();
    document.querySelector(`.pcard[data-i="${state.active}"]`)?.scrollIntoView({behavior:"smooth",block:"nearest"});
  });

  /* selected tray — independent of the topic filter */
  const p=P0();
  const tray=document.getElementById("tray");
  tray.innerHTML = !p ? `<div class="trayempty">No chart yet — pick an indicator and one appears.</div>`
    : p.sel.length
    ? p.sel.map((id,i)=>{const s=S(id); if(!s) return "";
        return `<div class="trayitem"><span class="sw" style="background:${PALETTE[i%PALETTE.length]}"></span>
          <span class="nm" title="${esc(s.name)}">${esc(s.name)}</span>
          <button class="x" data-drop="${id}" aria-label="Remove ${esc(s.name)}">×</button></div>`;}).join("")
    : `<div class="trayempty">Nothing selected yet.</div>`;
  tray.querySelectorAll("[data-drop]").forEach(b=>b.onclick=()=>{
    const q=P0(); if(!q) return; q.sel=q.sel.filter(x=>x!==b.dataset.drop); render();
  });

  /* filters */
  const topics=["all",...new Set(DB.series.flatMap(s=>s.topics))];
  document.getElementById("filters").innerHTML=topics.map(t=>
    `<button class="f" data-topic="${t}" aria-pressed="${state.topic===t}">${t.charAt(0).toUpperCase()+t.slice(1)}</button>`).join("");
  document.querySelectorAll("[data-topic]").forEach(b=>b.onclick=()=>{state.topic=b.dataset.topic;renderSidebar();});

  /* catalogue */
  const q=state.q.toLowerCase();
  const list=DB.series.filter(s=>(state.topic==="all"||s.topics.includes(state.topic))&&
    (!q||s.name.toLowerCase().includes(q)||s.source.toLowerCase().includes(q)));
  const cat=document.getElementById("cat");
  cat.innerHTML=list.length?list.map(s=>{
    const i=p?p.sel.indexOf(s.id):-1, on=i>=0, end=s.start+s.values.length-1;
    return `<div class="ci" data-id="${s.id}" aria-selected="${on}">
      <span class="sw" style="${on?`background:${PALETTE[i%PALETTE.length]};border-color:${PALETTE[i%PALETTE.length]}`:""}"></span>
      <span class="body"><span class="cn">${esc(s.name)}</span>
      <span class="cm"><span class="tag">${esc(s.geography)}</span><span class="tag">${esc(s.unit)}</span><span class="yr">${s.start}–${end}</span></span>
      </span></div>`;}).join("") : `<div class="empty">Nothing matches that.</div>`;
  cat.querySelectorAll(".ci").forEach(el=>el.onclick=()=>{
    const id=el.dataset.id;
    if(!P0()){ addPanel([id]); return; }          /* no charts yet — start one */
    const q=P0(), i=q.sel.indexOf(id);
    if(i>=0) q.sel.splice(i,1);
    else if(q.sel.length<4) q.sel.push(id);
    else { q.sel.shift(); q.sel.push(id); }
    render();
  });
  document.getElementById("count").textContent = p
    ? `${p.sel.length} of 4 on Chart ${state.active+1} · ${DB.series.length} indicators available`
    : `${DB.series.length} indicators available`;
}

function renderSources(){
  const p=P0(), el=document.getElementById("srcs");
  const sets=p?buildSets(p):[];
  if(!sets.length){el.innerHTML=`<div class="plabel">Provenance</div><div class="trayempty">Select something to see where it came from.</div>`;return;}
  el.innerHTML=`<div class="plabel">Provenance · Chart ${state.active+1}</div>`+sets.map(s=>`
    <div class="srcrow"><b>${esc(s.name)}</b>
      <span class="mono">${esc(s.meta.source)}</span><span class="mono">${esc(s.meta.geography)}</span>
      <span class="mono">${esc(s.meta.year_basis)} years</span><span class="mono">${esc(s.meta.unit)}</span>
      <span class="mono">${esc(s.meta.licence)}</span>
      ${DB.meta.provenance==="placeholder"?'<span class="ph">PLACEHOLDER</span>':''}
    </div>`).join("");
}

function render(){ renderPanels(); renderSidebar(); renderSources(); writeHash(); }

/* ══════════════════════════════════════════════
   PANEL ACTIONS
   ══════════════════════════════════════════════ */
function addPanel(sel=[]){
  state.panels.push(mkPanel(sel));
  state.active=state.panels.length-1;
  state.focus=state.active;
  render();
  document.querySelector(`.pcard[data-i="${state.active}"]`)?.scrollIntoView({behavior:"smooth",block:"center"});
}
document.getElementById("addBottom").onclick=()=>addPanel();

document.getElementById("stack").addEventListener("click",e=>{
  const card=e.target.closest(".pcard"); if(!card) return;
  const i=+card.dataset.i, p=state.panels[i];
  const act=e.target.dataset.act;

  if(!act){ state.active=i; state.focus=i; render(); return; }
  state.active=i; state.focus=i;

  if(act==="chart") p.chart=e.target.dataset.v;
  else if(act==="trans") p.trans=e.target.dataset.v;
  else if(act==="rebase") p.trans="index";
  else if(act==="pair") p.sel=e.target.dataset.v.split(",");
  else if(act==="dup"){ state.panels.splice(i+1,0,mkPanel(p.sel,{chart:p.chart,trans:p.trans,from:p.from,to:p.to,ribbon:p.ribbon,h:p.h})); state.active=i+1; }
  else if(act==="del"){ state.panels.splice(i,1); state.active=Math.max(0,Math.min(state.active,state.panels.length-1)); state.focus=null; }
  else if(act==="csv"){ exportCsv(i); return; }
  else if(act==="png"){ exportPng(i); return; }
  render();
});
document.getElementById("stack").addEventListener("change",e=>{
  const card=e.target.closest(".pcard"); if(!card) return;
  const p=state.panels[+card.dataset.i], act=e.target.dataset.act;
  if(act==="from") p.from=+e.target.value;
  else if(act==="to") p.to=+e.target.value;
  else if(act==="ribbon") p.ribbon=e.target.checked;
  else return;
  render();
});

/* click outside any panel clears the selection outline */
document.addEventListener("pointerdown",e=>{
  if(e.target.closest(".pcard")||e.target.closest(".side")) return;
  if(state.focus!==null){ state.focus=null; renderPanels(); }
});

/* ── drag to reorder ── */
let drag=null;
document.getElementById("stack").addEventListener("pointerdown",e=>{
  if(e.target.dataset.act!=="grip") return;
  const card=e.target.closest(".pcard");
  drag={key:+card.dataset.key, el:card};
  card.classList.add("drag-src");
  document.body.classList.add("dragging");
  e.target.setPointerCapture(e.pointerId);
  e.preventDefault();
});
document.addEventListener("pointermove",e=>{
  if(!drag) return;
  const cards=[...document.querySelectorAll(".pcard")];
  const over=cards.find(c=>{const r=c.getBoundingClientRect();return e.clientY>=r.top&&e.clientY<=r.bottom;});
  cards.forEach(c=>c.classList.remove("drop-hint"));
  if(over&&over!==drag.el) over.classList.add("drop-hint");
});
document.addEventListener("pointerup",e=>{
  if(!drag) return;
  const cards=[...document.querySelectorAll(".pcard")];
  const over=cards.find(c=>{const r=c.getBoundingClientRect();return e.clientY>=r.top&&e.clientY<=r.bottom;});
  document.body.classList.remove("dragging");
  cards.forEach(c=>c.classList.remove("drop-hint","drag-src"));
  if(over&&over!==drag.el){
    const from=state.panels.findIndex(p=>p.key===drag.key);
    const to=+over.dataset.i;
    const [moved]=state.panels.splice(from,1);
    state.panels.splice(to,0,moved);
    state.active=to;
  }
  drag=null; render();
});

/* ── drag to resize ── */
let rz=null;
document.getElementById("stack").addEventListener("pointerdown",e=>{
  const mode=e.target.dataset.act;
  if(mode!=="rgrip"&&mode!=="cgrip") return;
  const card=e.target.closest(".pcard"), i=+card.dataset.i;
  rz={i,mode,y0:e.clientY,x0:e.clientX,h0:state.panels[i].h,w0:state.panels[i].w,card};
  card.classList.add("is-resizing");
  document.body.classList.add("resizing");
  e.target.setPointerCapture(e.pointerId);
  e.preventDefault();
});
document.addEventListener("pointermove",e=>{
  if(!rz) return;
  const p=state.panels[rz.i];
  p.h=Math.max(H_MIN,Math.min(H_MAX,Math.round((rz.h0+(e.clientY-rz.y0))/10)*10));

  const card=document.querySelector(`.pcard[data-i="${rz.i}"]`);
  if(!card) return;

  /* corner drag also sets width — snaps to half or full so the grid always tiles */
  if(rz.mode==="cgrip"){
    const stackW=document.getElementById("stack").getBoundingClientRect().width;
    const want=(rz.w0/12*stackW + (e.clientX-rz.x0)) / stackW;
    const w = want < 0.72 ? 6 : 12;
    if(w!==p.w){ p.w=w; card.style.setProperty("--span",w); }
  }
  const sets=buildSets(p);
  if(sets.length){
    const holder=card.querySelector(".pbody");
    let chart;
    if(p.chart==="scatter"&&sets.length===2) chart=renderScatter(p,sets);
    else if(p.chart==="small") chart=renderSmall(p,sets);
    else if(p.chart==="bar") chart=renderBar(p,sets);
    else if(p.chart!=="scatter") chart=renderLine(p,sets,p.chart);
    if(chart&&holder) holder.innerHTML=chart+((p.chart!=="scatter"&&p.chart!=="small")?renderRibbon(p):"");
  }
  const pill=card.querySelector(".hpill"); if(pill) pill.textContent=(p.w===12?"full":"half")+" · "+p.h+"px";
});
document.addEventListener("pointerup",()=>{
  if(!rz) return;
  const wasWidth = rz.mode==="cgrip" && state.panels[rz.i] && state.panels[rz.i].w!==rz.w0;
  document.querySelector(`.pcard[data-i="${rz.i}"]`)?.classList.remove("is-resizing");
  document.body.classList.remove("resizing");
  rz=null;
  if(wasWidth) render(); else writeHash();   /* width change needs a redraw at the new size */
});

/* ══════════════════════════════════════════════
   EXPORT — per chart, CSV and PNG
   ══════════════════════════════════════════════ */
const dl=(blob,name)=>{const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);};
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60)||"chart";

function exportCsv(i){
  const p=state.panels[i], sets=buildSets(p);
  if(!sets.length) return;
  const years=[...new Set(sets.flatMap(s=>s.pts.map(q=>q[0])))].sort();
  const head=["year",...sets.map(s=>`"${s.name} (${s.unit})"`)].join(",");
  const rows=years.map(y=>[y,...sets.map(s=>{const q=s.pts.find(q=>q[0]===y);return q&&q[1]!=null?q[1].toFixed(4):"";})].join(","));
  const warn=DB.meta.provenance==="placeholder"?"# WARNING: placeholder data, not real statistics\n":"";
  const csv=warn+`# Polyoptic — ${sets.map(s=>s.name).join(" x ")}\n`+
    `# Sources: ${[...new Set(sets.map(s=>s.meta.source))].join("; ")}\n`+
    `# Geography: ${[...new Set(sets.map(s=>s.meta.geography))].join("; ")}\n`+
    `# Licence: OGL v3.0 — contains public sector information\n`+head+"\n"+rows.join("\n");
  dl(new Blob([csv],{type:"text/csv"}), slug(sets.map(s=>s.name).join("-"))+".csv");
}

/* Styles have to travel with the SVG — a serialised node gets no page CSS,
   and web fonts don't load in a detached image, so fall back to system stacks. */
const EXPORT_CSS=`
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .gridline{stroke:#D3D8DD;stroke-width:1}
  .axlabel{font-size:10px;fill:#5C6672}
  .line{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
  .disc{stroke:#B45309;stroke-width:1;stroke-dasharray:3 3;opacity:.6}
  .sm-t{font-size:10px;font-weight:500}
  .era text{font-size:9px;fill:#fff;font-weight:500}
  .pmtick{stroke:#0F1419;stroke-width:1;stroke-dasharray:2 2;opacity:.3}
  .pmlabel{font-size:8.5px;fill:#5C6672}
  .ttl{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:700;font-size:19px;fill:#0F1419}
  .sub{font-size:11px;fill:#5C6672}
  .cred{font-size:10px;fill:#5C6672}`;

function exportPng(i){
  const p=state.panels[i], sets=buildSets(p);
  const card=document.querySelector(`.pcard[data-i="${i}"]`);
  if(!sets.length||!card) return;
  const svgs=[...card.querySelectorAll(".pbody svg")];
  if(!svgs.length) return;

  const PAD=26, TOP=74, LEGEND=26, FOOT=30, SCALE=2;
  const inner=svgs.map(s=>{
    const vb=s.getAttribute("viewBox").split(/\s+/).map(Number);
    return {markup:s.innerHTML, w:vb[2], h:vb[3]};
  });
  const bodyH=inner.reduce((a,s)=>a+s.h+8,0);
  const totalW=W+PAD*2, totalH=TOP+bodyH+LEGEND+FOOT+PAD;

  let y=TOP, parts="";
  inner.forEach(s=>{
    parts+=`<svg x="${PAD}" y="${y}" width="${W}" height="${s.h}" viewBox="0 0 ${s.w} ${s.h}">${s.markup}</svg>`;
    y+=s.h+8;
  });
  const legend=sets.map((s,k)=>{
    const x=PAD+k*Math.min(300,(W)/sets.length);
    return `<rect x="${x}" y="${y+6}" width="13" height="3" fill="${s.colour}"/>`+
           `<text class="cred" x="${x+18}" y="${y+11}">${esc(s.name)} — ${esc(s.unit)}</text>`;
  }).join("");

  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${totalW}" height="${totalH}" viewBox="0 0 ${totalW} ${totalH}">
    <style>${EXPORT_CSS}</style>
    <rect width="100%" height="100%" fill="#ffffff"/>
    <text class="ttl" x="${PAD}" y="${PAD+14}">${esc(sets.map(s=>s.name).join(" × "))}</text>
    <text class="sub" x="${PAD}" y="${PAD+34}">${p.from}–${p.to} · ${esc(TRANSFORMS.find(x=>x[0]===p.trans)[1])} · ${esc([...new Set(sets.map(s=>s.meta.geography))].join(", "))}</text>
    ${parts}${legend}
    <text class="cred" x="${PAD}" y="${totalH-PAD+4}">${DB.meta.provenance==="placeholder"?"PLACEHOLDER DATA — NOT REAL STATISTICS · ":""}Source: ${esc([...new Set(sets.map(s=>s.meta.source))].join("; "))} · OGL v3.0 · polyoptic.co</text>
  </svg>`;

  const img=new Image();
  img.onload=()=>{
    const c=document.createElement("canvas");
    c.width=totalW*SCALE; c.height=totalH*SCALE;
    const ctx=c.getContext("2d");
    ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height);
    ctx.setTransform(SCALE,0,0,SCALE,0,0);
    ctx.drawImage(img,0,0);
    c.toBlob(b=>{ if(b) dl(b, slug(sets.map(s=>s.name).join("-"))+".png"); },"image/png");
  };
  img.onerror=()=>alert("Couldn't render the image in this browser.");
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}

/* ══════════════════════════════════════════════
   PERMALINK
   ══════════════════════════════════════════════ */
function writeHash(){
  const enc=state.panels.map(p=>[p.sel.join(","),p.chart,p.trans,p.from,p.to,p.ribbon?1:0,p.h,p.w].join("~")).join(";");
  history.replaceState(null,"","#p="+encodeURIComponent(enc)+"&a="+state.active);
}
function readHash(){
  if(!location.hash) return;
  const q=new URLSearchParams(location.hash.slice(1));
  if(q.get("p")){
    const panels=decodeURIComponent(q.get("p")).split(";").map(chunk=>{
      const [sel,chart,trans,from,to,rib,h,w]=chunk.split("~");
      return mkPanel((sel||"").split(",").filter(id=>S(id)),
        {chart:chart||"line",trans:trans||"index",from:+from||1997,to:+to||2026,
         ribbon:rib!=="0",h:Math.max(H_MIN,Math.min(H_MAX,+h||H_DEF)),w:(+w===6?6:12)});
    });
    if(panels.length) state.panels=panels;
  } else if(q.get("t")){                       /* topic deep-link from the homepage tiles */
    const topic=q.get("t");
    if(DB.series.some(s=>s.topics.includes(topic))) state.topic=topic;
  }
  state.active=Math.max(0,Math.min(+q.get("a")||0,state.panels.length-1));
}

document.getElementById("copyLink").onclick=()=>{
  navigator.clipboard?.writeText(location.href);
  const b=document.getElementById("copyLink"), o=b.textContent;
  b.textContent="✓ Copied"; setTimeout(()=>b.textContent=o,1400);
};
document.getElementById("q").oninput=e=>{state.q=e.target.value;renderSidebar();};

/* ── logo ── */
(function(){
  const shape="M10 50 Q50 -10 90 50 Q50 102 10 50 Z";
  const bars=[[29.75,46.56,18.72],[41.25,36.48,28.80],[52.75,42.60,22.68],[64.25,30.72,34.56]]
    .map(([x,y,h])=>`<rect x="${x}" y="${y}" width="6" height="${h}"/>`).join("");
  document.getElementById("logo").innerHTML=
   `<svg viewBox="6.5 16.5 87 63"><defs><clipPath id="lg"><path d="${shape}"/></clipPath></defs>`+
   `<path d="${shape}" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>`+
   `<g clip-path="url(#lg)" fill="#fff">${bars}</g></svg>`;
})();

/* ── boot: prefer real data if the ingest has run ── */
fetch("data/bundle.json").then(r=>r.ok?r.json():Promise.reject()).then(d=>{DB=d;})
  .catch(()=>{}).finally(()=>{ readHash(); render(); });
</script>
