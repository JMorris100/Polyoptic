<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Explorer — Polyoptic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#4633A8;
  --purple-d:#2F2178;
  --purple-l:#EDE9F9;
  --purple-xl:#F7F5FD;
  --ink:#14121C;
  --muted:#6E6A80;
  --faint:#9A96AC;
  --rule:#E3E1EB;
  --rule-2:#F0EFF5;
  --bg:#FFFFFF;
  --panel:#FBFBFD;
  --warn:#8A5A00;
  --warn-bg:#FFF8E8;
  --warn-rule:#E9D5A3;
  --con:#0B6FB4;
  --lab:#C8102E;
  --coa:#5E9FD0;
  --r:0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  color:var(--ink);background:var(--bg);
  font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--purple);text-decoration:none}

/* ── header ─────────────────────────────────────────── */
header{border-bottom:1px solid var(--rule);background:var(--bg);position:sticky;top:0;z-index:40}
.hrow{display:flex;align-items:center;gap:16px;padding:10px 18px}
.brand{display:flex;align-items:center;gap:9px;color:var(--ink)}
#logo{width:26px;height:26px;display:block}
.wm{font-weight:600;letter-spacing:-.02em;font-size:16px}
.wm .b{color:var(--purple)}
.crumb{
  font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);
  padding-left:16px;border-left:1px solid var(--rule);
}
.hact{margin-left:auto;display:flex;gap:8px}
.hb{
  background:var(--bg);border:1px solid var(--rule);border-radius:var(--r);
  padding:6px 11px;font-size:12.5px;cursor:pointer;color:var(--ink);
  transition:border-color .12s,background .12s;
}
.hb:hover{border-color:var(--purple);background:var(--purple-xl)}
.hb:active{background:var(--purple-l)}

/* ── shell ──────────────────────────────────────────── */
.shell{display:grid;grid-template-columns:308px 1fr;min-height:calc(100vh - 47px)}
.panel{border-right:1px solid var(--rule);background:var(--panel);display:flex;flex-direction:column;
       max-height:calc(100vh - 47px);position:sticky;top:47px}
.main{padding:16px 20px 60px;min-width:0}

/* ── panel sections ─────────────────────────────────── */
.psec{padding:13px 14px;border-bottom:1px solid var(--rule)}
.plabel{
  font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted);margin-bottom:8px;
  display:flex;align-items:baseline;gap:8px;
}
.plabel .hint{
  font-family:'IBM Plex Sans';font-size:11px;letter-spacing:0;
  text-transform:none;color:var(--faint);margin-left:auto;
}
#q{
  width:100%;padding:7px 9px;border:1px solid var(--rule);border-radius:var(--r);
  background:var(--bg);outline:none;font-size:13px;
}
#q:focus{border-color:var(--purple);box-shadow:0 0 0 2px var(--purple-l)}

/* ── square pills (used for topics, chart, transform, geography) ── */
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pill{
  border:1px solid var(--rule);border-radius:var(--r);background:var(--bg);
  padding:5px 9px;font-size:12px;cursor:pointer;white-space:nowrap;
  transition:background .12s,border-color .12s,color .12s;
  display:inline-flex;align-items:center;gap:6px;
}
.pill:hover:not(.off){border-color:var(--purple);color:var(--purple-d)}
.pill.on{background:var(--purple);border-color:var(--purple);color:#fff}
.pill.on .n{color:rgba(255,255,255,.72)}
.pill .n{
  font-family:'IBM Plex Mono';font-size:10px;color:var(--faint);
}
.pill.off{
  opacity:.42;cursor:not-allowed;background:var(--rule-2);
  color:var(--faint);border-color:var(--rule-2);
}

/* ── geography ──────────────────────────────────────── */
.arealist{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.areachip{
  border:1px solid var(--rule);border-radius:var(--r);background:var(--bg);
  padding:4px 8px;font-size:11.5px;cursor:pointer;display:inline-flex;
  align-items:center;gap:6px;transition:.12s;
}
.areachip:hover{border-color:var(--purple)}
.areachip.on{background:var(--purple-l);border-color:var(--purple);color:var(--purple-d);font-weight:500}
.areachip .sw{width:8px;height:8px;border-radius:0;background:var(--rule);flex:none}
.areachip.on .sw{background:var(--purple)}

/* ── catalogue ──────────────────────────────────────── */
.cat{overflow-y:auto;flex:1;padding:4px 0 8px}
.catgroup{
  font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--muted);padding:11px 14px 5px;position:sticky;top:0;
  background:linear-gradient(var(--panel) 72%,rgba(251,251,253,0));
  display:flex;align-items:baseline;
}
.catgroup .c{margin-left:auto;color:var(--faint)}
.row{
  padding:8px 14px 9px;cursor:pointer;border-left:2px solid transparent;
  display:grid;grid-template-columns:14px 1fr;gap:9px;align-items:start;
  transition:background .1s;
}
.row:hover{background:var(--purple-xl)}
.row.on{background:var(--purple-l);border-left-color:var(--purple)}
.box{
  width:13px;height:13px;border:1px solid var(--rule);border-radius:0;background:var(--bg);
  margin-top:2px;flex:none;position:relative;
}
.row.on .box{background:var(--purple);border-color:var(--purple)}
.row.on .box::after{
  content:"";position:absolute;left:3.5px;top:.5px;width:4px;height:8px;
  border:solid #fff;border-width:0 1.6px 1.6px 0;transform:rotate(43deg);
}
.rname{font-size:13px;line-height:1.32;margin-bottom:3px}
.rmeta{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  font-family:'IBM Plex Mono';font-size:10px;color:var(--muted);line-height:1.5;
}
.rmeta .unit{color:var(--ink)}
.rmeta .dot{color:var(--faint)}
.tag{
  border:1px solid var(--rule);border-radius:0;padding:0 4px;font-size:9px;
  letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--bg);
}
.tag.brk{border-color:var(--warn-rule);background:var(--warn-bg);color:var(--warn)}
.tag.geo{border-color:var(--rule);color:var(--faint)}

.row.na{opacity:.4;cursor:not-allowed}
.row.na:hover{background:transparent}
.row.na .box{background:var(--rule-2);border-color:var(--rule-2)}
.narule{
  font-family:'IBM Plex Mono';font-size:9.5px;color:var(--faint);
  border:1px dashed var(--rule);border-radius:0;padding:0 4px;
}

.pfoot{padding:9px 14px;border-top:1px solid var(--rule);
  font-family:'IBM Plex Mono';font-size:10px;color:var(--muted);
  display:flex;align-items:center;gap:8px}
.pfoot button{
  margin-left:auto;background:none;border:none;color:var(--purple);
  cursor:pointer;font-family:'IBM Plex Mono';font-size:10px;padding:0;
}

/* ── control bar ────────────────────────────────────── */
.bar{
  display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start;
  padding:12px 14px;border:1px solid var(--rule);border-radius:var(--r);
  background:var(--panel);margin-bottom:12px;
}
.grp{min-width:0}
.rng{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.rng input{
  width:64px;padding:5px 7px;border:1px solid var(--rule);border-radius:var(--r);
  background:var(--bg);outline:none;font-family:'IBM Plex Mono';font-size:12px;
}
.rng input:focus{border-color:var(--purple)}
.tog{display:flex;align-items:center;gap:7px;font-size:12.5px;cursor:pointer;padding:4px 0}
.tog input{accent-color:var(--purple);width:14px;height:14px;border-radius:0}

/* ── view tabs ──────────────────────────────────────── */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--rule);margin-bottom:14px}
.tab{
  background:none;border:none;border-bottom:2px solid transparent;
  padding:8px 14px;cursor:pointer;font-size:13px;color:var(--muted);
  margin-bottom:-1px;transition:.12s;
}
.tab:hover:not(.off){color:var(--ink)}
.tab.on{color:var(--purple-d);border-bottom-color:var(--purple);font-weight:500}
.tab.off{opacity:.35;cursor:not-allowed}

/* ── warnings ───────────────────────────────────────── */
.warns{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.warn{
  border:1px solid var(--warn-rule);background:var(--warn-bg);border-radius:var(--r);
  padding:8px 11px;font-size:12.5px;color:#5C3D00;display:flex;gap:9px;align-items:flex-start;
}
.warn b{font-weight:600}
.warn .ic{font-family:'IBM Plex Mono';font-size:11px;color:var(--warn);flex:none;margin-top:1px}
.warn button{
  margin-left:auto;flex:none;background:var(--bg);border:1px solid var(--warn-rule);
  border-radius:var(--r);padding:3px 8px;font-size:11.5px;cursor:pointer;color:var(--warn);
}
.warn button:hover{background:#fff}
.note{
  border:1px solid var(--rule);background:var(--panel);border-radius:var(--r);
  padding:8px 11px;font-size:12.5px;color:var(--muted);
}

/* ── chart card ─────────────────────────────────────── */
.card{border:1px solid var(--rule);border-radius:var(--r);background:var(--bg);overflow:hidden}
.chead{padding:13px 16px 11px;border-bottom:1px solid var(--rule-2)}
.ctitle{font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.csub{font-family:'IBM Plex Mono';font-size:11px;color:var(--muted);margin-top:4px}
.cbody{padding:8px 10px 4px}
.cfoot{
  padding:10px 16px;border-top:1px solid var(--rule-2);display:flex;gap:14px;
  flex-wrap:wrap;font-family:'IBM Plex Mono';font-size:10.5px;color:var(--muted);
}
.legend{display:flex;flex-wrap:wrap;gap:14px;padding:2px 16px 12px}
.lg{display:flex;align-items:center;gap:7px;font-size:12px}
.lg .sw{width:11px;height:3px;border-radius:0;flex:none}
.lg .lu{font-family:'IBM Plex Mono';font-size:10px;color:var(--muted)}

svg{display:block;width:100%;height:auto;overflow:visible}
.gridline{stroke:var(--rule-2);stroke-width:1}
.axis{stroke:var(--rule);stroke-width:1}
.tick{font-family:'IBM Plex Mono';font-size:10px;fill:var(--muted)}
.axname{font-family:'IBM Plex Mono';font-size:10px;fill:var(--faint)}

/* ── map ────────────────────────────────────────────── */
.maprow{display:grid;grid-template-columns:1fr 240px;gap:20px}
@media(max-width:900px){.maprow{grid-template-columns:1fr}}
.hex{cursor:pointer;transition:opacity .12s}
.hex:hover{opacity:.82}
.hexlbl{font-family:'IBM Plex Mono';font-size:9.5px;pointer-events:none;font-weight:500}
.hexval{font-family:'IBM Plex Mono';font-size:11px;pointer-events:none;font-weight:600}
.scale{display:flex;flex-direction:column;gap:3px;margin-top:12px}
.scalerow{display:flex;align-items:center;gap:8px;font-family:'IBM Plex Mono';font-size:10.5px;color:var(--muted)}
.scalesw{width:16px;height:12px;border-radius:0;flex:none;border:1px solid rgba(0,0,0,.06)}
.yearline{display:flex;align-items:center;gap:12px;padding:0 6px 10px}
.yearline input[type=range]{flex:1;accent-color:var(--purple)}
.yearval{font-family:'IBM Plex Mono';font-size:15px;font-weight:600;min-width:48px}

/* ── table ──────────────────────────────────────────── */
.tblwrap{overflow:auto;max-height:64vh}
table{border-collapse:collapse;width:100%;font-family:'IBM Plex Mono';font-size:11.5px}
th,td{padding:5px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--rule-2)}
th{position:sticky;top:0;background:var(--bg);text-align:right;font-weight:500;
   color:var(--muted);border-bottom:1px solid var(--rule);z-index:2}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--bg)}
th:first-child{z-index:3}
tbody tr:hover td{background:var(--purple-xl)}

/* ── sources ────────────────────────────────────────── */
.src{border:1px solid var(--rule);border-radius:var(--r);padding:13px 15px;margin-bottom:9px;background:var(--bg)}
.srcname{font-weight:600;font-size:13.5px;margin-bottom:5px}
.srcgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 18px;
  font-family:'IBM Plex Mono';font-size:11px;color:var(--muted);margin-top:8px}
.srcgrid b{display:block;color:var(--faint);font-size:9.5px;letter-spacing:.09em;
  text-transform:uppercase;font-weight:500;margin-bottom:1px}
.srcgrid span{color:var(--ink)}

.empty{padding:52px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:15px;color:var(--ink);margin-bottom:6px}

.ph{
  background:var(--warn-bg);border:1px solid var(--warn-rule);color:var(--warn);
  border-radius:var(--r);padding:7px 11px;font-size:12px;margin-bottom:12px;
  font-family:'IBM Plex Mono';
}
@media(max-width:820px){
  .shell{grid-template-columns:1fr}
  .panel{position:static;max-height:none;border-right:none;border-bottom:1px solid var(--rule)}
  .cat{max-height:320px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <a class="brand" href="index.html">
      <svg id="logo" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M1.5 17.5C5 8 11 3.5 17.5 3.5c7 0 11.5 5 13 11.5-3 9-9.5 13.5-16 13.5C8 28.5 3.5 24 1.5 17.5Z"
              fill="none" stroke="#4633A8" stroke-width="2.1" stroke-linejoin="round"/>
        <rect x="10.2" y="15.5" width="2.4" height="5.4" fill="#4633A8"/>
        <rect x="14"   y="12.2" width="2.4" height="8.7" fill="#4633A8"/>
        <rect x="17.8" y="14"   width="2.4" height="6.9" fill="#4633A8"/>
        <rect x="21.6" y="10.4" width="2.4" height="10.5" fill="#4633A8"/>
      </svg>
      <span class="wm">poly<span class="b">optic</span></span>
    </a>
    <span class="crumb">Explorer</span>
    <div class="hact">
      <button class="hb" id="copyLink">Copy link</button>
      <button class="hb" id="dlCsv">Download CSV</button>
    </div>
  </div>
</header>

<div class="shell">

  <!-- ══ LEFT PANEL ══ -->
  <div class="panel">

    <div class="psec">
      <div class="plabel">Geography <span class="hint" id="geohint"></span></div>
      <div class="pills" id="geolevels"></div>
      <div class="arealist" id="areas"></div>
    </div>

    <div class="psec">
      <div class="plabel">Indicators <span class="hint" id="selhint"></span></div>
      <input id="q" placeholder="Search indicators…" autocomplete="off">
      <div class="pills" id="filters" style="margin-top:9px"></div>
    </div>

    <div class="cat" id="cat"></div>

    <div class="pfoot">
      <span id="count"></span>
      <button id="clear">Clear selection</button>
    </div>
  </div>

  <!-- ══ MAIN ══ -->
  <div class="main">

    <div class="ph" id="ph">Placeholder data — every figure below is invented. Metadata is real.</div>

    <div class="bar">
      <div class="grp">
        <div class="plabel">Chart type</div>
        <div class="pills" id="ctype"></div>
      </div>
      <div class="grp">
        <div class="plabel">Transform</div>
        <div class="pills" id="ctrans"></div>
      </div>
      <div class="grp">
        <div class="plabel">Range</div>
        <div class="rng">
          <input id="from" type="number" min="1980" max="2025"> <span>to</span>
          <input id="to" type="number" min="1980" max="2025">
        </div>
      </div>
      <div class="grp">
        <div class="plabel">Options</div>
        <label class="tog"><input type="checkbox" id="ribbon" checked> Era ribbon</label>
      </div>
    </div>

    <div class="tabs" id="tabs"></div>
    <div class="warns" id="warns"></div>
    <div id="view"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   PLACEHOLDER DATA
   Replaced at build time by data/bundle.json, written by ingest.py.
   Values invented; names, units, sources, year bases, geographic
   coverage and discontinuities are as published.

/* ── url hash ──────────────────────────────────────────────────── */
function readHash(){
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("s")) st.sel   = h.get("s").split(",").filter(id => byId[id]);
  if (h.get("g")) st.geo   = h.get("g");
  if (h.get("a")) st.areas = h.get("a").split(",").filter(c => areaBy[c]);
  if (h.get("c")) st.chart = h.get("c");
  if (h.get("t")) st.trans = h.get("t");
  if (h.get("f")) st.from  = +h.get("f");
  if (h.get("to"))st.to    = +h.get("to");
  if (h.get("v")) st.view  = h.get("v");
  if (h.get("r")) st.ribbon= h.get("r") === "1";
  if (h.get("y")) st.mapYear = +h.get("y");
}
function writeHash(){
  const h = new URLSearchParams();
  h.set("s", st.sel.join(","));
  h.set("g", st.geo);
  h.set("a", st.areas.join(","));
  h.set("c", st.chart);
  h.set("t", st.trans);
  h.set("f", st.from);
  h.set("to", st.to);
  h.set("r", st.ribbon ? "1" : "0");
  h.set("v", st.view);
  if (st.view === "map") h.set("y", st.mapYear);
  history.replaceState(null, "", "#" + h.toString());
}

/* ── availability ──────────────────────────────────────────────── */
/* a series covers a level if its own `geo` is at least that granular */
const RANK = {uk:0, nation:1, region:2};
function availableAt(s, level){ return RANK[s.geo] >= RANK[level]; }
function seriesAreas(s){ return Object.keys(s.d); }
function valueAt(s, area, year){
  let arr = s.d[area];
  if (!arr){                       // fall back up the hierarchy
    const a = areaBy[area];
    if (a && a.parent && s.d[a.parent]) arr = s.d[a.parent];
    else arr = s.d.UK;
  }
  if (!arr) return null;
  const i = year - s.start;
  return (i >= 0 && i < arr.length) ? arr[i] : null;
}
function transformOK(t, s){
  const def = TRANSFORMS.find(x => x.id === t);
  if (!def || !def.kinds) return true;
  return def.kinds.includes(s.kind);
}

/* ── transforms ────────────────────────────────────────────────── */

function applyTransform(pts, s, area){
  const t = st.trans;
  if (t === "none" || !transformOK(t, s)) return {pts, unit:s.unit, skipped:t !== "none"};

  if (t === "index"){
    const base = pts.find(p => p.v != null);
    if (!base) return {pts, unit:s.unit};
    return {pts: pts.map(p => ({y:p.y, v:p.v == null ? null : p.v / base.v * 100})),
            unit:`Index ${base.y}=100`};
  }
  if (t === "yoy"){
    return {pts: pts.map((p,i) => ({y:p.y, v:(i === 0 || pts[i-1].v == null || p.v == null || pts[i-1].v === 0)
      ? null : (p.v / pts[i-1].v - 1) * 100})), unit:"% change on year earlier"};
  }
  if (t === "ma3"){
    return {pts: pts.map((p,i) => {
      const w = pts.slice(Math.max(0,i-2), i+1).map(x => x.v).filter(v => v != null);
      return {y:p.y, v:w.length ? w.reduce((a,b)=>a+b,0)/w.length : null};
    }), unit:s.unit + ", 3-year average"};
  }
  if (t === "real" && REF.def){
    const baseDef = valueAt(REF.def, "UK", END);
    return {pts: pts.map(p => {
      const d = valueAt(REF.def, "UK", p.y);
      return {y:p.y, v:(p.v == null || !d) ? null : p.v * baseDef / d};
    }), unit:s.unit.replace(/£(bn|m)?/, m => m) + ` (${END} prices)`};
  }
  if (t === "percap" && REF.pop){
    return {pts: pts.map(p => {
      const pop = valueAt(REF.pop, area, p.y);
      return {y:p.y, v:(p.v == null || !pop) ? null : p.v / (pop * 1000) * 1000};
    }), unit:"Per 1,000 people"};
  }
  if (t === "pctgdp" && REF.gdp){
    return {pts: pts.map(p => {
      const g = valueAt(REF.gdp, area, p.y);
      return {y:p.y, v:(p.v == null || !g) ? null : p.v / g * 100};
    }), unit:"% of GDP"};
  }
  return {pts, unit:s.unit};
}

/* ── build the plotted lines: series × area ────────────────────── */
function buildLines(){
  const out = [];
  for (const id of st.sel){
    const s = byId[id];
    if (!s) continue;
    const areas = st.geo === "uk" ? ["UK"]
                : st.areas.filter(a => availableAt(s, st.geo) || a === "UK");
    for (const a of (areas.length ? areas : ["UK"])){
      const pts = [];
      for (let y = st.from; y <= st.to; y++) pts.push({y, v:valueAt(s, a, y)});
      if (!pts.some(p => p.v != null)) continue;
      const tr = applyTransform(pts, s, a);
      out.push({
        s, area:a,
        label: s.name + (st.geo === "uk" ? "" : " · " + areaBy[a].name),
        pts: tr.pts, unit: tr.unit,
        skipped: st.trans !== "none" && !transformOK(st.trans, s),
      });
    }
  }
  return out.slice(0, 8).map((l,i) => ({...l, c:LINE_COLOURS[i % LINE_COLOURS.length]}));
}

/* ── formatting ────────────────────────────────────────────────── */
function fmt(v){
  if (v == null) return "—";
  const a = Math.abs(v);
  if (a >= 1e6) return (v/1e6).toFixed(2) + "m";
  if (a >= 1e4) return Math.round(v).toLocaleString("en-GB");
  if (a >= 100) return v.toFixed(0);
  if (a >= 10)  return v.toFixed(1);
  return v.toFixed(2);
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ══════════════════════════════════════════════════════════════
   PANEL RENDERING
   ══════════════════════════════════════════════════════════════ */
function renderGeo(){
  document.getElementById("geolevels").innerHTML = GEO_LEVELS.map(g => {
    const n = S.filter(s => availableAt(s, g.id)).length;
    return `<button class="pill ${st.geo===g.id?"on":""}" data-geo="${g.id}">
      ${g.label}<span class="n">${n}</span></button>`;
  }).join("");

  const lvl = GEO_LEVELS.find(g => g.id === st.geo);
  document.getElementById("geohint").textContent =
    st.geo === "uk" ? "" : `${st.areas.length} selected`;

  const box = document.getElementById("areas");
  if (st.geo === "uk"){
    box.innerHTML = `<div style="font-size:11.5px;color:var(--faint);padding:2px 0">${lvl.note}</div>`;
    return;
  }
  const codes = st.geo === "nation"
    ? AREAS.filter(a => a.lvl === 1).map(a => a.code)
    : AREAS.filter(a => a.lvl === 2).map(a => a.code);
  box.innerHTML = codes.map(c => {
    const a = areaBy[c], on = st.areas.includes(c);
    return `<button class="areachip ${on?"on":""}" data-area="${c}">
      <span class="sw"></span>${esc(a.short)}</button>`;
  }).join("");
}

function filteredSeries(){
  const q = st.q.trim().toLowerCase();
  return S.filter(s => {
    if (st.topic !== "All" && s.topic !== st.topic) return false;
    if (q && !(s.name + " " + s.topic + " " + s.source).toLowerCase().includes(q)) return false;
    return true;
  });
}

function renderFilters(){
  const topics = ["All", ...[...new Set(S.map(s => s.topic))].sort()];
  document.getElementById("filters").innerHTML = topics.map(t => {
    const n = t === "All" ? S.length : S.filter(s => s.topic === t).length;
    return `<button class="pill ${st.topic===t?"on":""}" data-topic="${esc(t)}">
      ${esc(t)}<span class="n">${n}</span></button>`;
  }).join("");
}

function renderCat(){
  const list = filteredSeries();
  const groups = {};
  for (const s of list) (groups[s.topic] ||= []).push(s);

  let html = "";
  for (const topic of Object.keys(groups).sort()){
    const rows = groups[topic];
    const nAvail = rows.filter(s => availableAt(s, st.geo)).length;
    html += `<div class="catgroup">${esc(topic)}
      <span class="c">${nAvail} of ${rows.length}</span></div>`;
    for (const s of rows){
      const ok  = availableAt(s, st.geo);
      const on  = st.sel.includes(s.id);
      const brk = s.disc.length;
      const geoTag = {uk:"UK only", nation:"Nations", region:"Regions"}[s.geo];
      html += `<div class="row ${on?"on":""} ${ok?"":"na"}" data-id="${s.id}"
                 ${ok?"":'title="Not published below '+ (s.geo==="uk"?"UK":"nation") +' level"'}>
        <div class="box"></div>
        <div>
          <div class="rname">${esc(s.name)}</div>
          <div class="rmeta">
            <span class="unit">${esc(s.unit)}</span>
            <span class="dot">·</span><span>${esc(s.source)}</span>
            <span class="dot">·</span><span>${s.start}–${END}</span>
            <span class="tag geo">${geoTag}</span>
            ${s.basis !== "calendar" ? `<span class="tag">${s.basis} year</span>` : ""}
            ${brk ? `<span class="tag brk">${brk} break${brk>1?"s":""}</span>` : ""}
            ${ok ? "" : `<span class="narule">no ${st.geo} data</span>`}
          </div>
        </div>
      </div>`;
    }
  }
  document.getElementById("cat").innerHTML = html || `<div class="empty">Nothing matches that search.</div>`;
  document.getElementById("count").textContent =
    `${list.length} shown · ${st.sel.length} selected`;
  document.getElementById("selhint").textContent =
    st.sel.length ? `${st.sel.length} selected` : "";
}

function renderBar(){
  document.getElementById("ctype").innerHTML = CHART_TYPES.map(c => {
    let off = false;
    if (c.id === "scatter" && buildLines().length < 2) off = true;
    return `<button class="pill ${st.chart===c.id?"on":""} ${off?"off":""}"
      data-chart="${c.id}" ${off?'aria-disabled="true" tabindex="-1" title="Needs at least two lines"':""}>${c.label}</button>`;
  }).join("");

  const sel = st.sel.map(id => byId[id]).filter(Boolean);
  document.getElementById("ctrans").innerHTML = TRANSFORMS.map(t => {
    const off = sel.length > 0 && !sel.some(s => transformOK(t.id, s));
    const kinds = sel.length ? [...new Set(sel.map(s => KIND_LABEL[s.kind]))].join(", ") : "";
    return `<button class="pill ${st.trans===t.id?"on":""} ${off?"off":""}"
      data-trans="${t.id}"
      ${off?`aria-disabled="true" tabindex="-1" title="Not meaningful for a ${kinds}"`:""}>${t.label}</button>`;
  }).join("");

  document.getElementById("from").value = st.from;
  document.getElementById("to").value   = st.to;
  document.getElementById("ribbon").checked = st.ribbon;

  const mapOff = st.geo === "uk";
  document.getElementById("tabs").innerHTML =
    [["chart","Chart"],["map","Map"],["table","Table"],["sources","Sources"]]
    .map(([id,label]) => {
      const off = id === "map" && mapOff;
      return `<button class="tab ${st.view===id?"on":""} ${off?"off":""}" data-view="${id}"
        ${off?'title="Choose Nations or Regions to use the map"':""}>${label}</button>`;
    }).join("");
}

/* ══════════════════════════════════════════════════════════════
   WARNINGS — the honesty layer
   ══════════════════════════════════════════════════════════════ */
function renderWarns(lines){
  const w = [];
  const sel = st.sel.map(id => byId[id]).filter(Boolean);

  const units = new Set(lines.map(l => l.unit));
  if (units.size > 1)
    w.push({t:"Different units", b:`These lines are measured in ${units.size} different units, so each is drawn against its own scale. Two lines can be made to look related by scaling alone.`, act:["Rebase everything to 100","index"]});

  const ukOnly = sel.filter(s => !availableAt(s, st.geo));
  if (ukOnly.length && st.geo !== "uk")
    w.push({t:"Repeated across areas", b:`${ukOnly.map(s => s.name).join(", ")} ${ukOnly.length>1?"are":"is"} published for the UK as a whole. The same national figure is drawn against every area you have selected, so any apparent regional pattern is coming from the other series.`});

  const bases = new Set(sel.map(s => s.basis));
  if (bases.size > 1)
    w.push({t:"Different year bases", b:`Mixing ${[...bases].join(", ")} years. Each point is plotted at the calendar year the period starts, so two points on the same vertical can be up to twelve months apart.`});

  const skipped = lines.filter(l => l.skipped);
  if (skipped.length){
    const names = [...new Set(skipped.map(l => l.s.name))];
    const kinds = [...new Set(skipped.map(l => KIND_LABEL[l.s.kind]))].join(" or ");
    w.push({t:"Transform not applied", b:`${names.join(", ")} left untransformed — this is a ${kinds}, and the transform would not mean anything applied to it.`});
  }

  for (const s of sel)
    for (const d of s.disc)
      if (d.y >= st.from && d.y <= st.to)
        w.push({t:`Break in ${s.name}`, b:`${d.note} (${d.y}). Figures either side are not on the same basis; the chart marks the break rather than drawing through it.`});

  if (st.geo !== "uk" && st.areas.length > 1 &&
      st.areas.some(a => ["SCT","WLS","NIR","SCT2","WLS2","NIR2"].includes(a)) &&
      sel.some(s => ["Education","Health"].includes(s.topic)))
    w.push({t:"Not comparable across the UK", b:"Education and health statistics are collected separately by each administration. Scottish qualifications, and NHS waiting-time definitions in each nation, are not the same measure. Compare the trend within a nation, not the level between them."});

  document.getElementById("warns").innerHTML = w.map(x =>
    `<div class="warn"><span class="ic">!</span><div><b>${esc(x.t)}.</b> ${esc(x.b)}</div>
     ${x.act ? `<button data-act="${x.act[1]}">${esc(x.act[0])}</button>` : ""}</div>`
  ).join("");
}

/* ══════════════════════════════════════════════════════════════
   CHART
   ══════════════════════════════════════════════════════════════ */
const W = 900, H = 420, M = {t:16, r:22, b:34, l:56};

function scaleFor(lines, shared){
  if (shared){
    let lo = Infinity, hi = -Infinity;
    for (const l of lines) for (const p of l.pts)
      if (p.v != null){ lo = Math.min(lo, p.v); hi = Math.max(hi, p.v); }
    if (lo === Infinity) return null;
    if (lo > 0 && lo / hi > 0.55) lo = lo * 0.92; else if (lo > 0) lo = 0;
    return {lo, hi:hi + (hi - lo) * 0.06};
  }
  return null;
}
function niceTicks(lo, hi, n = 5){
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1,2,2.5,5,10].map(m => m*mag).find(s => s >= raw) || mag*10;
  const out = [];
  for (let v = Math.ceil(lo/step)*step; v <= hi; v += step) out.push(v);
  return out;
}

function eraBand(x){
  if (!st.ribbon) return "";
  const R = W - M.r;
  let out = `<g>`;
  for (const e of ERAS){
    const a = Math.max(e.from, st.from), b = Math.min(e.to, st.to + 1);
    if (b <= a) continue;
    const x0 = Math.max(M.l, x(a)), x1 = Math.min(R, x(b));
    if (x1 <= x0) continue;
    out += `<rect x="${x0.toFixed(1)}" y="${H-M.b}" width="${(x1-x0).toFixed(1)}" height="7"
             fill="${e.c}" opacity=".72"><title>${e.party}, ${Math.floor(e.from)}–${e.to>=2026?"present":Math.floor(e.to)}</title></rect>`;
  }
  return out + `</g>`;
}

function drawChart(lines){
  if (!lines.length) return emptyState();

  const shared = new Set(lines.map(l => l.unit)).size === 1;
  const x = y => M.l + (y - st.from) / Math.max(st.to - st.from, 1) * (W - M.l - M.r);
  const sc = scaleFor(lines, shared);
  const yOf = (v, l) => {
    const s = shared ? sc : l._sc;
    return H - M.b - 14 - (v - s.lo) / (s.hi - s.lo) * (H - M.t - M.b - 14);
  };
  if (!shared) for (const l of lines){
    const vs = l.pts.map(p => p.v).filter(v => v != null);
    let lo = Math.min(...vs), hi = Math.max(...vs);
    if (lo === hi) hi = lo + 1;
    l._sc = {lo: lo - (hi-lo)*0.08, hi: hi + (hi-lo)*0.12};
  }

  let g = `<svg viewBox="0 0 ${W} ${H}" role="img">`;

  // gridlines + y axis (only labelled when a single shared unit)
  if (shared && sc){
    for (const t of niceTicks(sc.lo, sc.hi)){
      const yy = yOf(t, lines[0]);
      g += `<line class="gridline" x1="${M.l}" x2="${W-M.r}" y1="${yy}" y2="${yy}"/>
            <text class="tick" x="${M.l-8}" y="${yy+3.5}" text-anchor="end">${fmt(t)}</text>`;
    }
    g += `<text class="axname" x="${M.l}" y="${M.t-2}">${esc(lines[0].unit)}</text>`;
  } else {
    for (let i = 0; i <= 4; i++){
      const yy = M.t + i * (H - M.t - M.b - 14) / 4;
      g += `<line class="gridline" x1="${M.l}" x2="${W-M.r}" y1="${yy}" y2="${yy}"/>`;
    }
    g += `<text class="axname" x="${M.l}" y="${M.t-2}">Each line on its own scale</text>`;
  }

  // x ticks
  const span = st.to - st.from;
  const stepY = span > 40 ? 10 : span > 18 ? 5 : span > 8 ? 2 : 1;
  for (let yr = Math.ceil(st.from/stepY)*stepY; yr <= st.to; yr += stepY)
    g += `<text class="tick" x="${x(yr)}" y="${H-M.b+16}" text-anchor="middle">${yr}</text>`;
  g += `<line class="axis" x1="${M.l}" x2="${W-M.r}" y1="${H-M.b-14}" y2="${H-M.b-14}"/>`;

  g += eraBand(x);

  // discontinuity markers
  for (const l of lines) for (const d of l.s.disc)
    if (d.y >= st.from && d.y <= st.to)
      g += `<line x1="${x(d.y)}" x2="${x(d.y)}" y1="${M.t}" y2="${H-M.b-14}"
             stroke="var(--warn-rule)" stroke-width="1" stroke-dasharray="3 3"/>
            <text class="tick" x="${x(d.y)+4}" y="${M.t+10}" fill="var(--warn)">${d.y} break</text>`;

  // series
  for (const l of lines){
    const segs = [];
    let cur = [];
    for (const p of l.pts){
      const brk = l.s.disc.some(d => d.y === p.y);
      if (p.v == null){ if (cur.length) segs.push(cur); cur = []; continue; }
      if (brk && cur.length){ segs.push(cur); cur = []; }
      cur.push(p);
    }
    if (cur.length) segs.push(cur);

    if (st.chart === "bar"){
      const bw = Math.max(1.5, (W-M.l-M.r) / (st.to-st.from+1) / lines.length - 1.5);
      const off = lines.indexOf(l) * (bw + 1.2);
      for (const p of l.pts) if (p.v != null){
        const yy = yOf(p.v, l), base = shared ? yOf(Math.max(sc.lo,0), l) : H-M.b-14;
        g += `<rect x="${x(p.y)-bw*lines.length/2+off}" y="${Math.min(yy,base)}"
               width="${bw}" height="${Math.abs(base-yy)}" fill="${l.c}" opacity=".85"/>`;
      }
    } else if (st.chart === "scatter"){
      for (const p of l.pts) if (p.v != null){
        const era = ERAS.find(e => p.y+0.5 >= e.from && p.y+0.5 < e.to);
        g += `<circle cx="${x(p.y)}" cy="${yOf(p.v,l)}" r="3.4"
               fill="${era ? era.c : l.c}" opacity=".85"><title>${l.label} ${p.y}: ${fmt(p.v)}</title></circle>`;
      }
    } else {
      for (const seg of segs){
        const d = seg.map((p,i) => `${i?"L":"M"}${x(p.y).toFixed(1)},${yOf(p.v,l).toFixed(1)}`).join(" ");
        if (st.chart === "area"){
          const base = shared ? yOf(sc.lo, l) : H-M.b-14;
          g += `<path d="${d} L${x(seg.at(-1).y)},${base} L${x(seg[0].y)},${base} Z"
                 fill="${l.c}" opacity=".13"/>`;
        }
        g += `<path d="${d}" fill="none" stroke="${l.c}" stroke-width="2"
               stroke-linejoin="round" stroke-linecap="round"/>`;
      }
      const last = l.pts.filter(p => p.v != null).at(-1);
      if (last) g += `<circle cx="${x(last.y)}" cy="${yOf(last.v,l)}" r="3" fill="${l.c}"/>`;
    }
  }
  g += `</svg>`;
  return g;
}

function drawSmall(lines){
  if (!lines.length) return emptyState();
  const cols = lines.length > 4 ? 3 : 2;
  return `<div style="display:grid;grid-template-columns:repeat(${cols},1fr);gap:14px;padding:6px">` +
    lines.map(l => {
      const vs = l.pts.map(p => p.v).filter(v => v != null);
      const lo = Math.min(...vs), hi = Math.max(...vs) || 1;
      const w = 300, h = 118, m = 6;
      const x = y => m + (y-st.from)/Math.max(st.to-st.from,1)*(w-2*m);
      const yy = v => h-m-14 - (v-lo)/((hi-lo)||1)*(h-2*m-14);
      let path = "", started = false;
      for (const p of l.pts){
        if (p.v == null){ started = false; continue; }
        path += `${started?"L":"M"}${x(p.y).toFixed(1)},${yy(p.v).toFixed(1)} `;
        started = true;
      }
      let era = "";
      if (st.ribbon) for (const e of ERAS){
        const a = Math.max(e.from, st.from), b = Math.min(e.to, st.to+1);
        if (b > a){
          const p0 = Math.max(m, x(a)), p1 = Math.min(w-m, x(b));
          if (p1 > p0) era += `<rect x="${p0.toFixed(1)}" y="${h-m-8}" width="${(p1-p0).toFixed(1)}" height="5" fill="${e.c}" opacity=".7"/>`;
        }
      }
      return `<div style="border:1px solid var(--rule);border-radius:var(--r);padding:9px 10px">
        <div style="font-size:12px;font-weight:500;line-height:1.3;margin-bottom:1px">${esc(l.label)}</div>
        <div style="font-family:'IBM Plex Mono';font-size:9.5px;color:var(--muted);margin-bottom:4px">
          ${esc(l.unit)} · ${fmt(lo)}–${fmt(hi)}</div>
        <svg viewBox="0 0 ${w} ${h}"><path d="${path}" fill="none" stroke="${l.c}" stroke-width="1.8"/>${era}</svg>
      </div>`;
    }).join("") + `</div>`;
}

function emptyState(){
  return `<div class="empty"><div class="big">Nothing selected</div>
    Pick an indicator on the left to start a chart.</div>`;
}

/* ══════════════════════════════════════════════════════════════
   MAP — schematic hex cartogram
   ══════════════════════════════════════════════════════════════ */
function drawMap(){
  const s = st.sel.map(id => byId[id]).find(s => availableAt(s, st.geo));
  if (!s) return `<div class="empty"><div class="big">No mappable indicator selected</div>
    None of the selected indicators is published at ${st.geo === "nation" ? "nation" : "region"} level.</div>`;

  const codes = AREAS.filter(a => a.lvl === (st.geo === "nation" ? 1 : 2)).map(a => a.code);
  const vals = {};
  for (const c of codes){
    const v = valueAt(s, c, st.mapYear);
    if (v != null) vals[c] = v;
  }
  const nums = Object.values(vals);
  if (!nums.length) return `<div class="empty">No values for ${st.mapYear}.</div>`;
  const lo = Math.min(...nums), hi = Math.max(...nums);

  const ramp = ["#F1EDFB","#D9D0F0","#B7A8E2","#8E79CE","#6851B8","#4633A8"];
  const bucket = v => Math.min(ramp.length-1, Math.floor((v-lo)/((hi-lo)||1) * ramp.length));
  const size = 40, hw = Math.sqrt(3)*size/2;
  const hexPath = (cx, cy) => Array.from({length:6}, (_,i) => {
    const a = Math.PI/180 * (60*i - 90);
    return `${(cx + size*Math.cos(a)).toFixed(1)},${(cy + size*Math.sin(a)).toFixed(1)}`;
  }).join(" ");

  let maxC = 0, maxR = 0;
  for (const c of codes){ maxC = Math.max(maxC, areaBy[c].col); maxR = Math.max(maxR, areaBy[c].row); }
  const vw = (maxC + 2) * hw * 2 + 20, vh = (maxR + 1) * size * 1.5 + size * 1.2;

  let g = `<svg viewBox="0 0 ${vw} ${vh}">`;
  for (const c of codes){
    const a = areaBy[c];
    const cx = 14 + hw + (a.col + (a.row % 2 ? 0.5 : 0)) * hw * 2;
    const cy = 14 + size + a.row * size * 1.5;
    const v = vals[c];
    const fill = v == null ? "var(--rule-2)" : ramp[bucket(v)];
    const dark = v != null && bucket(v) >= 3;
    const on = st.areas.includes(c);
    g += `<g class="hex" data-hex="${c}">
      <polygon points="${hexPath(cx,cy)}" fill="${fill}"
        stroke="${on ? "var(--ink)" : "#fff"}" stroke-width="${on ? 2.4 : 1.6}"/>
      <text class="hexlbl" x="${cx}" y="${cy-3}" text-anchor="middle"
        fill="${dark ? "rgba(255,255,255,.8)" : "var(--muted)"}">${esc(a.short)}</text>
      <text class="hexval" x="${cx}" y="${cy+12}" text-anchor="middle"
        fill="${dark ? "#fff" : "var(--ink)"}">${v == null ? "—" : fmt(v)}</text>
      <title>${esc(a.name)} — ${esc(s.name)}, ${st.mapYear}: ${fmt(v)} ${esc(s.unit)}</title>
    </g>`;
  }
  g += `</svg>`;

  const legend = ramp.map((c,i) => {
    const a = lo + (hi-lo) * i/ramp.length, b = lo + (hi-lo) * (i+1)/ramp.length;
    return `<div class="scalerow"><span class="scalesw" style="background:${c}"></span>
      ${fmt(a)} – ${fmt(b)}</div>`;
  }).reverse().join("");

  return `<div class="card">
    <div class="chead">
      <div class="ctitle">${esc(s.name)}</div>
      <div class="csub">${esc(s.unit)} · ${st.mapYear} · ${st.geo === "nation" ? "Nations" : "ITL1 regions"} · ${esc(s.source)}</div>
    </div>
    <div class="cbody">
      <div class="yearline">
        <span style="font-family:'IBM Plex Mono';font-size:11px;color:var(--muted)">Year</span>
        <input type="range" id="mapyear" min="${Math.max(s.start, st.from)}" max="${st.to}" value="${st.mapYear}">
        <span class="yearval">${st.mapYear}</span>
      </div>
      <div class="maprow">
        <div>${g}</div>
        <div>
          <div style="font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.11em;
            text-transform:uppercase;color:var(--muted)">Scale</div>
          <div class="scale">${legend}</div>
          <div style="font-size:11.5px;color:var(--muted);margin-top:16px;line-height:1.5">
            Click an area to add or remove it from the chart.
          </div>
        </div>
      </div>
    </div>
    <div class="cfoot">
      <span>Equal-interval classification</span>
      <span>Schematic layout — equal-size tiles, not land area</span>
    </div>
  </div>
  <div class="note" style="margin-top:12px">
    <b>On this map.</b> Every area is drawn the same size, so nothing is weighted by land
    area and London does not disappear. It is not a geographic map and should not be read as
    one — real ONS boundaries, and a geographic/schematic toggle, come with the boundary
    files. Equal-interval shading is the least editorialising default; quantile and Jenks
    tell visibly different stories from the same numbers.
  </div>`;
}

/* ══════════════════════════════════════════════════════════════
   TABLE + SOURCES
   ══════════════════════════════════════════════════════════════ */
function drawTable(lines){
  if (!lines.length) return emptyState();
  let h = `<div class="card"><div class="tblwrap"><table><thead><tr><th>Year</th>` +
    lines.map(l => `<th>${esc(l.label)}</th>`).join("") + `</tr><tr><th></th>` +
    lines.map(l => `<th style="font-weight:400;color:var(--faint);font-size:10px">${esc(l.unit)}</th>`).join("") +
    `</tr></thead><tbody>`;
  for (let y = st.from; y <= st.to; y++){
    h += `<tr><td>${y}</td>` + lines.map(l => {
      const p = l.pts.find(p => p.y === y);
      return `<td>${p && p.v != null ? fmt(p.v) : "—"}</td>`;
    }).join("") + `</tr>`;
  }
  return h + `</tbody></table></div></div>`;
}

function drawSources(){
  const sel = st.sel.map(id => byId[id]).filter(Boolean);
  if (!sel.length) return "";
  return sel.map(s => `<div class="src">
    <div class="srcname">${esc(s.name)}</div>
    <div class="srcgrid">
      <div><b>Publisher</b><span>${esc(s.source)}</span></div>
      <div><b>Unit</b><span>${esc(s.unit)}</span></div>
      <div><b>Measure</b><span>${KIND_LABEL[s.kind]}</span></div>
      <div><b>Year basis</b><span>${s.basis}</span></div>
      <div><b>Coverage</b><span>${({uk:"United Kingdom",nation:"Down to nation",region:"Down to ITL1 region"})[s.geo]}</span></div>
      <div><b>Available</b><span>${s.start}–${END}</span></div>
      <div><b>Licence</b><span>Open Government Licence v3.0</span></div>
    </div>
    ${s.disc.length ? `<div style="margin-top:9px;font-size:12px;color:var(--warn)">
      ${s.disc.map(d => `<div>${d.y} — ${esc(d.note)}</div>`).join("")}</div>` : ""}
  </div>`).join("");
}

/* ══════════════════════════════════════════════════════════════
   MAIN RENDER
   ══════════════════════════════════════════════════════════════ */
function render(){
  if (st.geo === "uk" && st.view === "map") st.view = "chart";
  if (st.geo !== "uk" && !st.areas.length)
    st.areas = st.geo === "nation" ? ["ENG"] : ["UKI"];
  if (st.geo === "uk") st.areas = ["UK"];

  const lines = buildLines();

  renderGeo(); renderFilters(); renderCat(); renderBar(); renderWarns(lines);

  const view = document.getElementById("view");
  if (st.view === "map")        view.innerHTML = drawMap();
  else if (st.view === "table") view.innerHTML = drawTable(lines);
  else if (st.view === "sources") view.innerHTML = drawSources() ||
    `<div class="empty">Select an indicator to see its sources.</div>`;
  else {
    const body = st.chart === "small" ? drawSmall(lines) : drawChart(lines);
    const sub = [
      st.geo === "uk" ? "United Kingdom" : `${st.areas.length} area${st.areas.length>1?"s":""}`,
      `${st.from}–${st.to}`,
      st.trans !== "none" ? TRANSFORMS.find(t=>t.id===st.trans).label : null,
    ].filter(Boolean).join(" · ");
    view.innerHTML = `<div class="card">
      <div class="chead">
        <div class="ctitle">${lines.length ? esc([...new Set(lines.map(l=>l.s.name))].join(" · ")) : "Explorer"}</div>
        <div class="csub">${esc(sub)}</div>
      </div>
      <div class="cbody">${body}</div>
      ${lines.length ? `<div class="legend">` + lines.map(l =>
        `<div class="lg"><span class="sw" style="background:${l.c}"></span>
         ${esc(l.label)} <span class="lu">${esc(l.unit)}</span></div>`).join("") +
        (st.ribbon ? `<div class="lg" style="color:var(--muted)">
          <span class="sw" style="background:var(--con)"></span>Con
          <span class="sw" style="background:var(--coa);margin-left:6px"></span>Coalition
          <span class="sw" style="background:var(--lab);margin-left:6px"></span>Lab</div>` : "") +
        `</div>` : ""}
      <div class="cfoot">
        <span>Placeholder figures</span>
        <span>Open Government Licence v3.0</span>
        <span>polyoptic.co</span>
      </div>
    </div>`;
  }

  writeHash();
}

/* ══════════════════════════════════════════════════════════════
   EVENTS
   ══════════════════════════════════════════════════════════════ */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-geo],[data-area],[data-topic],[data-id],[data-chart],[data-trans],[data-view],[data-act],[data-hex]");
  if (!t) return;
  if (t.classList.contains("off") || t.classList.contains("na")) return;

  if (t.dataset.geo){
    st.geo = t.dataset.geo;
    st.areas = st.geo === "uk" ? ["UK"] : st.geo === "nation" ? ["ENG","SCT"] : ["UKI","UKC"];
    st.sel = st.sel.filter(id => availableAt(byId[id], st.geo));
  }
  else if (t.dataset.area || t.dataset.hex){
    const c = t.dataset.area || t.dataset.hex;
    st.areas = st.areas.includes(c) ? st.areas.filter(x => x !== c) : [...st.areas, c];
    if (!st.areas.length) st.areas = [c];
  }
  else if (t.dataset.topic)  st.topic = t.dataset.topic;
  else if (t.dataset.id){
    const id = t.dataset.id;
    st.sel = st.sel.includes(id) ? st.sel.filter(x => x !== id) : [...st.sel, id].slice(-4);
  }
  else if (t.dataset.chart)  st.chart = t.dataset.chart;
  else if (t.dataset.trans)  st.trans = t.dataset.trans;
  else if (t.dataset.view)   st.view  = t.dataset.view;
  else if (t.dataset.act)    st.trans = t.dataset.act;

  render();
});

document.getElementById("q").addEventListener("input", e => { st.q = e.target.value; renderCat(); });
document.getElementById("clear").addEventListener("click", () => { st.sel = []; render(); });
document.getElementById("ribbon").addEventListener("change", e => { st.ribbon = e.target.checked; render(); });
for (const k of ["from","to"])
  document.getElementById(k).addEventListener("change", e => {
    const v = +e.target.value;
    if (v >= 1980 && v <= END) st[k] = v;
    if (st.from >= st.to) st.from = st.to - 1;
    if (st.mapYear < st.from) st.mapYear = st.from;
    if (st.mapYear > st.to)   st.mapYear = st.to;
    render();
  });
document.addEventListener("input", e => {
  if (e.target.id === "mapyear"){ st.mapYear = +e.target.value; render(); }
});

document.getElementById("copyLink").addEventListener("click", e => {
  navigator.clipboard.writeText(location.href);
  e.target.textContent = "Copied";
  setTimeout(() => e.target.textContent = "Copy link", 1400);
});

document.getElementById("dlCsv").addEventListener("click", () => {
  const lines = buildLines();
  if (!lines.length) return;
  const head = [
    "# Polyoptic — polyoptic.co",
    "# PLACEHOLDER DATA — these figures are invented and are not statistics.",
    ...lines.map(l => `# ${l.label} | ${l.unit} | ${l.s.source} | Open Government Licence v3.0`),
    `# Transform: ${TRANSFORMS.find(t=>t.id===st.trans).label}`,
    "",
  ].join("\n");
  let csv = head + "year," + lines.map(l => `"${l.label} (${l.unit})"`).join(",") + "\n";
  for (let y = st.from; y <= st.to; y++)
    csv += y + "," + lines.map(l => {
      const p = l.pts.find(p => p.y === y);
      return p && p.v != null ? p.v.toFixed(3) : "";
    }).join(",") + "\n";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
  a.download = "polyoptic-placeholder.csv";
  a.click();
});

/* ── boot ──────────────────────────────────────────────────────
   Prefer data/bundle.json (written by ingest.py). If it isn't there
   yet, fall back to the placeholder embedded above and say so.
   ───────────────────────────────────────────────────────────── */
async function boot(){
  readHash();
  render();
  try {
    const r = await fetch("data/bundle.json", {cache:"no-cache"});
    if (!r.ok) return;
    const live = await r.json();
    if (!live || !Array.isArray(live.series) || !live.series.length) return;
    BUNDLE = live;
    bind();
    st.sel = st.sel.filter(id => byId[id]);
    if (st.to > END) st.to = END;
    if (st.mapYear > END) st.mapYear = END;
    render();
  } catch (e) {
    /* no bundle yet — placeholder stays, banner stays */
  }
}
boot();
</script>
</body>
</html>
