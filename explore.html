<style>
:root{--paper:#EDEFF1;--surface:#fff;--surface-2:#FCFCFD;--hover:#F8F8FA;--ink:#0F1419;--muted:#5C6672;
--rule:#D3D8DD;--rule-soft:#EEF0F2;
--purple:#4633A8;--purple-dk:#3A2A8C;--soft:#F4F2FA;--soft-hover:#EAE5F6;--prule:#D8D2EC;
--warn:#B45309;--warnbg:#FFF8E6;--warnrule:#E8D9A8;--warn-ink:#6B4A0A;--warn-ink-b:#4A3306;
--shadow:0 18px 40px -10px rgba(15,20,25,.3)}
html[data-theme="dark"]{--paper:#0B0D12;--surface:#151823;--surface-2:#1A1E2A;--hover:#1C2130;--ink:#E8ECF1;--muted:#8A93A0;
--rule:#262B36;--rule-soft:#20242E;
--purple:#8B6BFF;--purple-dk:#7355E8;--soft:#241E3E;--soft-hover:#2C2450;--prule:#3A3260;
--warn:#E0B45C;--warnbg:#2A2107;--warnrule:#4C3B10;--warn-ink:#E3B65E;--warn-ink-b:#F0CC80;
--shadow:0 18px 44px -10px rgba(0,0,0,.65)}
html[data-theme="dark"] input{color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;transition:background-color .2s}
h1,h2,h3,h4{font-family:"IBM Plex Sans";margin:0;letter-spacing:-0.015em;line-height:1.05}
svg{display:block}
button{font-family:inherit}
body.dragging{user-select:none;cursor:grabbing}
body.resizing{user-select:none;cursor:ns-resize}

/* ── header ── */
header{position:sticky;top:0;z-index:40;background:#4633A8;color:#fff}
.hrow{padding:0 24px 0 20px;height:70px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none}
.brand svg{width:36px;height:26px}
.wm{font-family:"IBM Plex Sans";font-weight:800;font-size:21px;letter-spacing:-0.03em;color:#fff}
.wm .b{font-weight:500;color:rgba(255,255,255,.66)}
/* "Explorer" beside the wordmark, set off by a rule and centred on it: the
   capitals have no descenders, so a line-height of 1 keeps them on the
   wordmark's middle rather than sitting low in a taller line box */
.crumb{display:flex;align-items:center;height:24px;padding:1px 0 0 15px;margin-left:5px;border-left:1.5px solid rgba(255,255,255,.32);
  font-family:"IBM Plex Sans";font-weight:600;font-size:15px;line-height:1;color:rgba(255,255,255,.82);letter-spacing:.1em;text-transform:uppercase}
.hact{margin-left:auto;display:flex;gap:8px}
/* on a phone the header has room for the brand and the three buttons only */
@media(max-width:520px){.hrow{padding:0 16px;gap:10px}.crumb{display:none}.hb{padding:8px 11px}}
.hb{font-family:"IBM Plex Sans";font-size:12.5px;padding:8px 16px;border:1px solid rgba(255,255,255,.34);border-radius:2px;background:transparent;color:#fff;cursor:pointer;transition:.15s}
.hb:hover{background:#fff;color:var(--purple);border-color:#fff}
.hb.solid{background:#fff;color:var(--purple);border-color:#fff;font-weight:500}
.hb.solid:hover{background:#F1EEFA}
.hb.eye{display:inline-flex;align-items:center;justify-content:center;padding:7px 12px}
.hb.eye svg{width:24px;height:16px;display:block}

/* The panel hugs the left edge at full height and the charts take the rest
   of the screen, the way a video site's guide does. Close the panel and the
   sources move into a column on the right, so the charts still get the width
   and the provenance is still beside them. */
.shell{display:grid;grid-template-columns:300px minmax(0,1fr);align-items:start;transition:grid-template-columns .18s ease}
.main{padding:22px 26px 90px;min-width:0}
body.side-collapsed .shell{grid-template-columns:0 minmax(0,1fr)}
body.side-collapsed .side{visibility:hidden;pointer-events:none}
body.side-collapsed .main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start;padding-left:40px}
body.side-collapsed .rcol{position:sticky;top:92px;max-height:calc(100vh - 110px);overflow-y:auto;scrollbar-width:thin}
body.side-collapsed .srcpanel{margin-top:0}
/* the selected area's card, docked above the sources when they sit on the right */
.dock:empty{display:none}
.dock{margin-bottom:14px}
.dock .working{margin:0;padding:14px 16px}
.siderail{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:45;display:none}
body.side-collapsed .siderail{display:block}
.siderail button{width:26px;height:74px;border:1px solid var(--rule);border-left:0;background:var(--surface);
  color:var(--muted);cursor:pointer;border-radius:0 8px 8px 0;font-size:13px}
.siderail button:hover{color:var(--purple);border-color:var(--purple)}
.sidecollapse{width:26px;height:26px;border:1px solid var(--rule);background:var(--surface-2);color:var(--muted);
  cursor:pointer;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.sidecollapse:hover{color:var(--purple);border-color:var(--purple)}
.sidecollapse svg{width:12px;height:12px}
@media(max-width:1040px){
  .shell,body.side-collapsed .shell{grid-template-columns:1fr}
  .main,body.side-collapsed .main{display:block;padding:18px 16px 60px}
  body.side-collapsed .rcol{position:static;max-height:none}
  body.side-collapsed .srcpanel{margin-top:16px}
}

/* ── the panel ── */
.side{position:sticky;top:70px;height:calc(100vh - 70px);overflow-y:auto;overscroll-behavior:contain;
  background:var(--surface);border-right:1px solid var(--rule);scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
@media(max-width:1040px){.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--rule)}}
/* On a phone the chart comes first — it is what a shared link was sent for —
   and the panel becomes a full-screen sheet behind a button at the bottom. */
.mobpanel{display:none}
@media(max-width:760px){
  .shell,body.side-collapsed .shell{display:flex;flex-direction:column;align-items:stretch}
  .main,body.side-collapsed .main{order:-1;padding-bottom:90px;width:100%;min-width:0}
  .siderail,body.side-collapsed .siderail{display:none}
  .side,body.side-collapsed .side{position:fixed;inset:0;z-index:70;height:100%;border:0;visibility:hidden;pointer-events:none;
    transform:translateY(100%);transition:transform .3s ease,visibility 0s .3s}
  body.side-open .side{visibility:visible;pointer-events:auto;transform:none;transition:transform .3s ease}
  .mobpanel{display:flex;align-items:center;gap:8px;position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:65;
    padding:12px 20px;border-radius:100px;border:0;background:var(--purple);color:#fff;font:600 14px "IBM Plex Sans",sans-serif;
    box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:pointer;white-space:nowrap}
  body.side-open .mobpanel{display:none}
}
@media (max-width:760px) and (prefers-reduced-motion:reduce){.side{transition:none}}
/* The old look — small capitals for labels, thin rules, square-ish
   chips, purple for what's selected — in a panel that runs the full height
   of the left edge. */
.panelbox{padding:0 0 14px}
.psec{padding:16px 18px;border-bottom:1px solid var(--rule)}
.psec:last-child{border-bottom:0}
.phead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-4px 0 8px}
.plabel{font-family:"IBM Plex Sans";font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.phead .plabel{margin-bottom:0}

/* which chart am I editing */
.pswitch{display:flex;gap:5px;flex-wrap:wrap}
.ps{font-family:"IBM Plex Sans";font-size:12px;padding:6px 11px;border:1px solid var(--rule);background:transparent;color:var(--muted);cursor:pointer;border-radius:3px;transition:.13s}
.ps:hover{border-color:var(--ink);color:var(--ink)}
.ps[aria-pressed="true"]{background:var(--purple);border-color:var(--purple);color:#fff}

/* selected tray — survives topic filtering */
.tray{display:flex;flex-direction:column;gap:6px}
.trayitem{display:flex;align-items:center;gap:9px;padding:8px 10px;background:var(--soft);border:1px solid var(--prule);border-radius:3px}
.trayitem .sw{width:11px;height:11px;flex-shrink:0;border-radius:2px}
.trayitem .nm{flex:1;min-width:0;font-size:12.5px;font-weight:500;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trayitem .x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:0 2px}
.trayitem .x:hover{color:var(--purple)}
.trayempty{font-size:12.5px;color:var(--muted);padding:4px 0}

#q{width:100%;padding:9px 11px;border:1px solid var(--rule);font-family:inherit;font-size:13.5px;background:var(--paper);color:var(--ink);border-radius:3px}
#q:focus{outline:2px solid var(--purple);outline-offset:-1px}
.filters{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.frow{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.flabel{font-family:"IBM Plex Sans";font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);width:100%;margin-bottom:1px}
.f{font-family:"IBM Plex Sans";font-size:11.5px;padding:5px 11px 5px 8px;border:1px solid var(--rule);background:transparent;color:var(--muted);cursor:pointer;border-radius:100px;transition:.13s;
  display:inline-flex;align-items:center;gap:6px}
.f .fic{width:14px;height:14px;flex-shrink:0}
.f .fic.geo{width:11px;height:15px}
.f[aria-pressed="true"] .fic{color:#fff}
.f:hover{border-color:var(--ink);color:var(--ink)}
.f i{font-style:normal;opacity:.6;margin-left:2px}
.f:disabled{opacity:.35;cursor:default}
.f:disabled:hover{border-color:var(--rule);color:var(--muted)}
.f[aria-pressed="true"]{background:var(--purple);border-color:var(--purple);color:#fff}
.cat{border-bottom:1px solid var(--rule)}
/* the browse prompt where the long list used to be */
.browse{display:flex;flex-direction:column;gap:6px;padding:14px 18px 16px;border-bottom:1px solid var(--rule)}
.browse button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:10px 12px;border:1px solid var(--rule);
  border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-align:left}
.browse button:hover{border-color:var(--purple);color:var(--purple)}
.browse button span{font-family:"IBM Plex Sans";font-size:11.5px;font-weight:400;color:var(--muted)}
.browse .bhint{font-size:12px;color:var(--muted);line-height:1.4}

/* The drawer: one topic's indicators, opened from the filters and laid out
   wide, so finding one is a glance across a grid rather than a scroll down a
   single column of two hundred. */
.drawer{position:fixed;top:70px;left:300px;bottom:0;width:min(640px,calc(100vw - 340px));z-index:35;
  background:var(--surface);border-right:1px solid var(--rule);box-shadow:16px 0 40px rgba(15,20,25,.14);
  display:flex;flex-direction:column;animation:drawin .18s ease-out}
.drawer[hidden]{display:none}
@keyframes drawin{from{opacity:0;transform:translateX(-10px)}}
@media (prefers-reduced-motion: reduce){.drawer{animation:none}}
.dhead{display:flex;align-items:center;gap:12px;padding:16px 20px 12px;border-bottom:1px solid var(--rule)}
.dhead .dico{display:inline-flex;width:34px;height:34px;border-radius:100px;background:var(--soft);color:var(--purple);align-items:center;justify-content:center;flex-shrink:0}
.dhead .dico svg{width:19px;height:19px}
.dhead h3{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0}
.dhead .dsub{font-size:12px;color:var(--muted);margin-top:2px}
.dhead .dx{margin-left:auto;width:30px;height:30px;border:1px solid var(--rule);border-radius:100px;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;line-height:1}
.dhead .dx:hover{color:var(--purple);border-color:var(--purple)}
.dtabs{display:flex;gap:5px;flex-wrap:wrap;padding:10px 20px;border-bottom:1px solid var(--rule)}
.dbody{flex:1;overflow-y:auto;padding:6px 20px 24px;scrollbar-width:thin;overscroll-behavior:contain}
.dgrp{margin-top:14px}
.dgh{display:flex;align-items:center;gap:7px;font-family:"IBM Plex Sans";font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.dgh svg{width:13px;height:13px}.dgh .gicon{width:10px;height:14px}
.dgh i{font-style:normal;opacity:.7}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.dcard{display:flex;gap:9px;align-items:flex-start;text-align:left;padding:9px 11px;border:1px solid var(--rule);border-radius:8px;
  background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;transition:border-color .12s,background .12s;min-width:0}
.dcard:hover{border-color:var(--purple)}
.dcard[aria-pressed="true"]{background:var(--soft);border-color:var(--purple)}
.dcard .sw{width:11px;height:11px;flex-shrink:0;margin-top:3px;border:1.5px solid var(--rule);border-radius:3px}
.dcard .cn{display:block;font-size:12.5px;font-weight:600;line-height:1.3}
.dcard .cm{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.dcard .tag{display:inline-block;font-family:"IBM Plex Sans";font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--purple);
  border:1px solid var(--prule);border-radius:100px;padding:0 6px;margin-left:5px;vertical-align:1px}
.dfoot{padding:10px 20px;border-top:1px solid var(--rule);font-family:"IBM Plex Sans";font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
body.side-collapsed .drawer{display:none}
@media(max-width:1040px){.drawer{left:0;top:0;width:100vw;z-index:60}}
.ci{padding:11px 18px 11px 15px;border-bottom:1px solid var(--rule-soft);border-left:3px solid transparent;cursor:pointer;display:flex;gap:10px;align-items:flex-start;transition:background .12s}
.ci:last-child{border-bottom:0}
.ci:hover{background:var(--hover)}
.ci[aria-selected="true"]{background:var(--soft);border-left-color:var(--purple)}
.ci .sw{width:11px;height:11px;flex-shrink:0;margin-top:3px;border:1.5px solid var(--rule);background:transparent;border-radius:2px}
.ci .body{flex:1;min-width:0}
.ci .cn{display:block;font-size:13.5px;font-weight:600;line-height:1.35;color:var(--ink)}
.ci .cm{display:block;margin-top:3px;font-size:11.5px;line-height:1.4;color:var(--muted)}
.ci .cm .sep{opacity:.5;padding:0 3px}
.empty{padding:18px;font-size:13px;color:var(--muted)}
.foot{font-family:"IBM Plex Sans";font-size:11.5px;color:var(--muted);padding:12px 18px 0}

/* ── panels ── */
.stack{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;align-items:start}
.pcard{grid-column:span var(--span,12)}
@media(max-width:1040px){.pcard{grid-column:span 12}}
.pcard{background:var(--surface);border:1px solid var(--rule);position:relative;transition:border-color .15s,box-shadow .15s;min-width:0;container-type:inline-size}
/* On a wide chart the working sits beside the graph rather than under it,
   so picking a year doesn't push everything down; each sum then reads top
   to bottom. Narrower charts keep it underneath. */
@container (min-width:860px){
  .pmain.has-work{display:grid;grid-template-columns:minmax(0,1fr) 270px;align-items:start}
  .pmain.has-work .working{margin:14px 16px 12px 0;padding:11px 12px}
  .pmain.has-work .wyear{font-size:15px;margin-bottom:4px}
  .pmain.has-work .wyear span{display:block;margin:1px 0 0;font-size:11.5px}
  .pmain.has-work .wblks{grid-template-columns:1fr}
  .pmain.has-work .wblk{padding:8px 0 9px}
  .pmain.has-work .wname{font-size:12.5px;margin-bottom:5px}
  .pmain.has-work .wsum{gap:2px 6px;align-items:baseline}
  .pmain.has-work .wc b{font-size:14px}
  .pmain.has-work .wc span{display:none}
  .pmain.has-work .warea .wc span{display:block}
  .pmain.has-work .wc.wout{padding:2px 7px}
  .pmain.has-work .wo{font-size:13px;padding:0}
  .pmain.has-work .wcap{display:block}
  .pmain.has-work .wsrc{margin-top:5px;font-size:11.5px}
}
.pcard.is-focus{border-color:var(--purple);box-shadow:0 0 0 1px var(--purple)}

.pbar{display:flex;align-items:center;gap:11px;padding:12px 16px;border-bottom:1px solid var(--rule)}
/* the drag handle: a real button-sized target, not a faint glyph */
.grip{cursor:grab;width:28px;height:28px;flex-shrink:0;touch-action:none;display:inline-flex;align-items:center;justify-content:center;
  color:var(--muted);border-radius:6px;border:1px dashed var(--rule);background:transparent}
.grip svg{width:14px;height:14px;pointer-events:none}
.grip:hover{color:var(--purple);border-color:var(--purple);border-style:solid;background:var(--soft)}
.grip:focus-visible{outline:2px solid var(--purple);outline-offset:1px}
body.dragging,body.dragging *{cursor:grabbing!important}
.pnum{font-family:"IBM Plex Sans";font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;
  color:var(--purple);background:var(--soft);border:1px solid var(--prule);padding:3px 8px;border-radius:2px}
.pcard.is-focus .pnum{background:var(--purple);color:#fff;border-color:var(--purple)}
.pi.pen{width:24px;height:24px;border-color:transparent;background:transparent}
.pi.pen svg{opacity:.45}
.ptitle-in{font-family:inherit;font-weight:700;font-size:16px;flex:1;min-width:140px;
  border:1px dashed var(--purple);background:var(--surface-2);color:var(--ink);padding:3px 9px;border-radius:2px;outline:none}
.ptitle{font-size:16px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pacts{display:flex;gap:5px;flex-shrink:0}
.pa{font-family:"IBM Plex Sans";font-size:12px;padding:5px 9px;border:1px solid var(--rule);background:transparent;color:var(--muted);cursor:pointer;border-radius:2px}
.pa:hover{border-color:var(--purple);color:var(--purple)}
.pa.danger:hover{border-color:#B91C1C;color:#B91C1C}
/* icon-only panel buttons — quiet until hovered so the title stays the loudest thing */
.pi{width:28px;height:28px;padding:0;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--rule);background:var(--surface-2);color:var(--ink);cursor:pointer;border-radius:2px;flex-shrink:0}
.pi svg{width:15px;height:15px;opacity:.78}
.pi:hover{border-color:var(--purple);color:var(--purple)}
.pi:hover svg{opacity:1}
.pi.on{color:var(--purple);border-color:var(--purple);background:var(--soft)}
.pi.on svg{opacity:1}
/* actions menu behind the ⋯ button */
.menupanel{position:absolute;top:44px;right:12px;z-index:60;min-width:190px;
  background:var(--surface);border:1px solid var(--rule);box-shadow:var(--shadow);padding:5px;border-radius:2px}
.menupanel[hidden]{display:none}
.mi{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;border:0;background:transparent;
  color:var(--ink);cursor:pointer;font-family:"IBM Plex Sans";font-size:12.5px;border-radius:2px}
.mi:hover{background:var(--soft);color:var(--purple)}
.mi.danger:hover{background:#FEF2F2;color:#B91C1C}
html[data-theme="dark"] .mi.danger:hover{background:#3A1214}
.mi svg{width:13px;height:13px;flex-shrink:0}
.msep{height:1px;background:var(--rule-soft);margin:4px 6px}

/* settings popover — label + control pairs on one aligned grid, anchored to
   the management cluster at the top-left of the card */
/* Chart picker. Tiles rather than a dropdown: fourteen types in a select is a
   list you scroll past, and the area views live at the bottom of it. */
.ctgroup{grid-column:1/-1}
.ctghead{display:block;font-family:"IBM Plex Sans";font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin:0 0 7px}
.ctgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.ct{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 2px 6px;
  border:1px solid var(--rule);background:var(--surface);color:var(--muted);
  border-radius:3px;cursor:pointer;font:inherit;font-size:9.5px;line-height:1.15;text-align:center}
.ct svg{width:26px;height:18px;display:block}
.ct span{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct:hover:not(:disabled){border-color:var(--purple);color:var(--ink)}
.ct.on{background:var(--purple);border-color:var(--purple);color:#fff}
.ct:disabled{opacity:.35;cursor:not-allowed}
.ct:focus-visible{outline:2px solid var(--purple);outline-offset:1px}
.cfgpanel{position:absolute;top:44px;left:12px;z-index:60;width:min(340px,90vw);
  background:var(--surface);border:1px solid var(--rule);box-shadow:var(--shadow);
  padding:14px 16px;display:grid;grid-template-columns:max-content 1fr;gap:10px 12px;align-items:center;border-radius:2px}
.cfgpanel[hidden]{display:none}
.cfgpanel .plabel{margin:0;text-align:right}
.cfgrule{grid-column:1/-1;height:1px;background:var(--rule-soft)}
.dd{position:relative;display:flex;width:100%}
.dd select{appearance:none;-webkit-appearance:none;width:100%;
  font-family:"IBM Plex Sans";font-size:12.5px;padding:7px 26px 7px 10px;
  border:1px solid var(--rule);background:var(--surface-2);color:var(--ink);cursor:pointer;border-radius:2px}
.dd select:hover{border-color:var(--ink)}
.dd select:focus{outline:2px solid var(--purple);outline-offset:-1px}
.dd::after{content:'';position:absolute;right:10px;top:50%;width:6px;height:6px;pointer-events:none;
  border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:translateY(-70%) rotate(45deg)}
.dd select option{background:var(--surface);color:var(--ink)}
.dd select option:disabled{color:var(--muted)}
.rng{display:flex;align-items:center;gap:8px;font-family:"IBM Plex Sans";font-size:12px;color:var(--muted)}
.rng input{width:64px;padding:6px 7px;border:1px solid var(--rule);font-family:"IBM Plex Sans";font-size:12px;background:var(--surface-2);color:var(--ink);border-radius:2px}
.pa.on{background:var(--purple);border-color:var(--purple);color:#fff}
.pa.on:hover{border-color:var(--purple);color:#fff}

/* locking */
.pcard.locked{border-color:var(--purple)}
.pcard.locked .grip{opacity:.3;cursor:not-allowed}

/* drag: the card follows the pointer, a dashed slot marks where it lands */
.pcard.drag-live{position:fixed;z-index:120;pointer-events:none;margin:0;
  box-shadow:var(--shadow);transform:rotate(.4deg) scale(1.01);border-color:var(--purple)}
.dropslot{grid-column:span var(--span,12);border:2px dashed var(--purple);background:var(--soft);
  display:flex;align-items:center;justify-content:center;color:var(--purple);
  font-family:"IBM Plex Sans";font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}

.warn{background:var(--warnbg);border-bottom:1px solid var(--warnrule);padding:9px 16px;font-size:12.5px;color:var(--warn-ink)}
/* Show-your-working. Even-width figures and selectable: the numbers are meant to be
   read against the source and copied out, not just glanced at. */
.hit{fill:transparent;cursor:pointer}
.hit:hover{fill:currentColor;fill-opacity:.14}
.working{margin:2px 16px 12px;padding:10px 12px;background:var(--soft);
  border:1px solid var(--prule);border-radius:3px;
  font-family:"IBM Plex Sans";font-size:12.5px;line-height:1.7;color:var(--ink);
  user-select:text;position:relative}
.working .wtop{font-weight:600;font-size:12.5px}
.working .wop{display:block;overflow-wrap:anywhere}
.working .wmut{color:var(--muted)}
.working .wnote{display:block;color:var(--warn-ink);margin-top:3px}
.working a{color:var(--purple);text-underline-offset:2px}
.working .wx{position:absolute;top:5px;right:6px;border:0;background:transparent;
  color:var(--muted);cursor:pointer;font:inherit;font-size:14px;line-height:1;padding:3px 5px}
.working .wx:hover{color:var(--ink)}
.pickable{cursor:crosshair}
.probeline{stroke:var(--purple);stroke-width:1.5;stroke-dasharray:4 3}
.probedot{stroke:var(--surface);stroke-width:2}
.hovline{stroke:var(--muted);stroke-width:1;opacity:0;pointer-events:none}
.hovline.on{opacity:.45}
/* the year working: a sum per series, numbers large, labels small */
.working:has(.wyear){font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.4;padding:12px 14px}
.working .wyear{font-family:"IBM Plex Sans",sans-serif;font-weight:700;font-size:17px;letter-spacing:-.01em;margin-bottom:8px}
.working .wyear span{font-family:"IBM Plex Sans",sans-serif;font-weight:400;font-size:12.5px;color:var(--muted);letter-spacing:0;margin-left:6px}
/* a receipt per line: label left, figure right, the plotted figure last */
.working .wblks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));column-gap:22px}
.working .wblk{padding:9px 0 10px;border-top:1px solid var(--prule)}
.working .wname{display:flex;align-items:flex-start;gap:8px;font-weight:600;font-size:13px;line-height:1.3;margin-bottom:6px}
.working .wdot{width:13px;height:3px;flex-shrink:0;margin-top:.55em}
.wrows{display:grid;gap:3px}
.wr{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:12px;line-height:1.35;color:var(--muted)}
.wr > span i{display:block;font-style:normal;font-size:11px;line-height:1.3;opacity:.85}
.wr.wtot > span i{font-weight:400;color:var(--muted)}
.wr b{font-size:13.5px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.wr.wtot{margin-top:2px;padding-top:5px;border-top:1px dashed var(--prule);color:var(--ink);font-weight:600}
.wr.wtot b{font-size:18px;font-weight:700;letter-spacing:-.01em;color:var(--c,var(--purple))}
.wsum{display:flex;align-items:flex-start;flex-wrap:wrap;gap:6px 10px}
.wc{display:flex;flex-direction:column;min-width:0;max-width:220px}
.wc b{font-family:"IBM Plex Sans";font-size:18px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.wc span{font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:2px}
.wc.wstep b{color:var(--muted)}
.wc.wout{background:var(--surface);border:1px solid var(--prule);border-radius:3px;padding:4px 9px}
.wc.wout b{color:var(--purple)}
.wo{font-family:"IBM Plex Sans";font-size:16px;color:var(--muted);padding-top:2px}
.working .wsrc{font-size:11.5px;color:var(--muted);margin-top:7px}
.working .wcap{display:none;font-size:11px;color:var(--muted);line-height:1.35;margin-top:4px}
.working .wnote{font-size:12px;margin-top:6px}
.workhint{margin:0 16px 10px;font-family:"IBM Plex Sans";font-size:11px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.warn b{color:var(--warn-ink-b)}
.warn button,.warn .wlink{margin-left:8px;font-family:"IBM Plex Sans";font-size:11.5px;background:transparent;border:1px solid var(--warnrule);padding:3px 8px;cursor:pointer;color:var(--warn-ink);border-radius:2px;text-decoration:none;display:inline-block;white-space:nowrap}
.warn button:hover,.warn .wlink:hover{background:var(--warnrule);color:var(--warn-ink-b)}
.pbody{padding:14px 16px 6px}
.pbody.scrolls{overflow:auto;scrollbar-width:thin;padding-top:0}
.pbody.scrolls .areahd{padding-top:14px;box-sizing:content-box}
.tbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 16px 0;
  font-size:12px;color:var(--muted)}
.tbar button{margin-left:auto;display:inline-flex;align-items:center;gap:6px;
  font-family:"IBM Plex Sans";font-size:11.5px;background:var(--soft);color:var(--purple);
  border:1px solid var(--prule);padding:5px 10px;border-radius:2px;cursor:pointer}
.tbar button:hover{border-color:var(--purple)}
.tbar button svg{width:13px;height:13px}
.ptable{width:100%;border-collapse:collapse;font-size:12.5px}
.ptable th{position:sticky;top:0;background:var(--surface);text-align:left;font-weight:600;
  padding:7px 10px;box-shadow:inset 0 -1px 0 var(--rule);white-space:nowrap;z-index:1}
/* the header is a solid strip: nothing scrolling under it shows above it */
.pbody.scrolls .ptable{margin-top:0}
.thsort{font:inherit;font-weight:600;color:inherit;background:transparent;border:0;padding:0;cursor:pointer}
.thsort:hover{color:var(--purple)}
.thsort.on{color:var(--purple)}
.ptable th i{display:block;font-family:"IBM Plex Sans";font-size:10.5px;font-style:normal;
  color:var(--muted);font-weight:400;letter-spacing:.04em}
.ptable td{padding:5px 10px;border-bottom:1px solid var(--rule-soft)}
.ptable td.num,.ptable th.num{text-align:right;font-family:"IBM Plex Sans";font-variant-numeric:tabular-nums}
.ptable td.mono{font-family:"IBM Plex Sans";color:var(--muted)}
.ptable tr.brk td{border-bottom:1px dashed var(--warn)}
.ptable tr:hover td{background:var(--hover)}
/* the area views scale with the card down to a floor, below which the panel
   scrolls sideways rather than the names shrinking past reading size */
.areasvg{width:100%;min-width:720px;max-width:940px;height:auto;display:block}
/* the scale stays put while the areas scroll under it */
.areahd{position:sticky;top:0;z-index:2;background:var(--surface)}
/* the map */
.mapwrap{display:flex;gap:40px;align-items:flex-start;justify-content:center;padding:6px 0 10px}
.mapsvg{display:block;flex:none;width:auto;max-width:66%}
.mapa{stroke:var(--surface);stroke-width:.6;vector-effect:non-scaling-stroke;cursor:pointer;transition:opacity .12s}
.mapa:hover{stroke:var(--ink);stroke-width:1.5}
.mapna{fill:var(--rule);opacity:.55;stroke:var(--surface);stroke-width:.6;vector-effect:non-scaling-stroke}
.mapsel{fill:none;stroke:var(--purple);stroke-width:2;vector-effect:non-scaling-stroke;pointer-events:none}
.mapring{fill:none;stroke:var(--purple);stroke-width:2;vector-effect:non-scaling-stroke;pointer-events:none}
.mapring.halo{stroke:var(--surface);stroke-width:5}
.mapbox{fill:none;stroke:var(--muted);stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:3 3}
.maplbl{font-family:"IBM Plex Sans",system-ui,sans-serif;fill:var(--muted)}
.mapside{flex:1;min-width:220px;max-width:340px;display:flex;flex-direction:column;gap:2px;padding-top:4px}
.msfind{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.mslbl{font-family:"IBM Plex Sans";font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.msfind{position:relative}
.msfind label{font-family:"IBM Plex Sans";font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mfq{font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:3px;width:100%}
.mfq:focus{outline:2px solid var(--purple);outline-offset:-1px}
.mfq::placeholder{color:var(--muted)}
.mfres{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:20;background:var(--surface);border:1px solid var(--rule);
  border-radius:3px;box-shadow:0 8px 24px rgba(0,0,0,.14);max-height:280px;overflow-y:auto;padding:4px}
.mfhit{display:flex;justify-content:space-between;gap:10px;width:100%;padding:7px 9px;border:0;background:transparent;color:var(--ink);
  font:inherit;font-size:12.5px;text-align:left;cursor:pointer;border-radius:2px}
.mfhit b{font-family:"IBM Plex Sans";font-weight:400;font-size:12px;color:var(--muted)}
.mfhit:hover,.mfhit.on{background:var(--soft)}
.mfnone{padding:8px 9px;font-size:12.5px;color:var(--muted)}
.mslbl{margin:10px 0 4px}
.msrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border:0;background:transparent;color:var(--ink);font:inherit;font-size:12.5px;
  text-align:left;cursor:pointer;border-radius:3px;border-left:3px solid transparent}
.msrow:hover{background:var(--hover)}
.msrow.on{background:var(--soft);border-left-color:var(--purple)}
.msw{width:11px;height:11px;border-radius:2px;flex-shrink:0}
.msn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msv{font-family:"IBM Plex Sans";font-size:12px;color:var(--muted)}
.msnote{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:12px}
@container (max-width:620px){.mapwrap{flex-direction:column}.mapsvg{max-width:100%;margin:0 auto}.mapside{max-width:none;width:100%}}
/* the area views: names and values in the text face, faint stripes */
.arealbl{font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:12px;fill:var(--ink)}
.areaval{font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:11.5px;fill:var(--muted)}
.areahead{font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:11px;fill:var(--muted)}
.azebra{fill:var(--ink);opacity:.025}
.asel{fill:var(--purple);opacity:.12}
.aref{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:4 3;opacity:.55}
.arefl{font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:11px;fill:var(--ink)}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:0 16px 12px}
.lg{display:flex;align-items:center;gap:7px;font-size:12.5px}
.lg .d{width:13px;height:3px;flex-shrink:0}
.lg .u{font-family:"IBM Plex Sans";font-size:11px;color:var(--muted)}
/* Sources read as prose; metadata recedes. No all-caps mono — small caps at
   low contrast is the least legible treatment available, and this is the
   component carrying the site's entire trust claim. */
.pfoot{padding:10px 16px 12px;border-top:1px solid var(--rule);display:flex;
  flex-direction:column;gap:3px}
.phnote{font-size:12px;color:var(--warn);font-weight:600}

/* resize grip along the bottom edge */
.rgrip{height:16px;cursor:ns-resize;display:flex;align-items:center;justify-content:center;
  border-top:1px solid var(--rule);background:var(--surface-2);touch-action:none}
.rgrip:hover{background:var(--soft)}
.rgrip::after{content:"";width:44px;height:4px;border-radius:2px;background:var(--rule);transition:.12s}
.rgrip:hover::after{background:var(--purple)}
.cgrip{position:absolute;right:0;bottom:0;width:28px;height:28px;cursor:nwse-resize;touch-action:none;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 6px 6px 0}
.cgrip::after{content:"";width:11px;height:11px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);border-bottom-right-radius:2px;transition:.12s}
.cgrip:hover::after{border-color:var(--purple);width:13px;height:13px}
.cgrip:hover{background:linear-gradient(135deg,transparent 46%,var(--purple) 46%,var(--purple) 56%,transparent 56%,
             transparent 68%,var(--purple) 68%,var(--purple) 78%,transparent 78%)}
.stackempty{grid-column:span 12;background:var(--surface);border:1px dashed var(--prule);
  padding:52px 24px;text-align:center;color:var(--muted)}
.stackempty h3{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:8px}
.hpill{position:absolute;right:12px;bottom:18px;font-family:"IBM Plex Sans";font-size:11px;
  background:var(--ink);color:var(--paper);padding:3px 7px;border-radius:2px;opacity:0;transition:opacity .15s;pointer-events:none}
.pcard.is-resizing .hpill{opacity:1;background:var(--purple);color:#fff;font-size:12px;padding:5px 11px;bottom:22px;right:16px}

/* headline numbers on a gap chart */
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:0 0 10px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:"IBM Plex Sans",sans-serif;font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.stat .d{width:13px;height:3px;flex-shrink:0}

.blank{padding:56px 24px;text-align:center;color:var(--muted)}
.blank h3{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:8px}
.sug{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.sg{font-family:"IBM Plex Sans";font-size:12.5px;padding:8px 13px;border:1px solid var(--prule);background:var(--soft);color:var(--purple);cursor:pointer;border-radius:2px}
.sg:hover{background:var(--soft-hover)}

.addbar{display:flex;justify-content:center;align-items:center;gap:14px;padding:16px 0 0;flex-wrap:wrap}
.addbtn{font-family:"IBM Plex Sans";font-size:13px;padding:11px 24px;border:1px dashed var(--prule);
  background:var(--surface);color:var(--purple);cursor:pointer;border-radius:2px;width:100%;transition:.14s}
.addbtn:hover{background:var(--soft);border-color:var(--purple);border-style:solid}

.srcpanel{background:var(--surface);border:1px solid var(--rule);padding:14px 16px;margin-top:16px;container-type:inline-size}
.srcitem{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:8px 28px;padding:12px 0;border-bottom:1px solid var(--rule-soft);align-items:start}
.srcitem:last-child{border-bottom:0;padding-bottom:2px}
.srcitem .srcdet{grid-column:1/-1}
.srcname{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink)}
.srcname .d{width:13px;height:3px;flex-shrink:0}
.srcfrom,.srcflags,.srcx{margin-left:21px}
.srcfrom{font-size:12.5px;color:var(--muted);margin-top:3px}
.srcflags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.srclink{color:var(--purple);text-decoration:none;border-bottom:1px solid var(--prule)}
.srclink:hover{border-bottom-color:var(--purple)}
.srcx{display:block;border:0;background:none;color:var(--purple);cursor:pointer;padding:0;margin-top:7px;font:inherit;font-size:12px}
.srcx:hover{text-decoration:underline}
.srcfacts{display:grid;grid-template-columns:.8fr 1.3fr 1.1fr .8fr 1.2fr;gap:8px 20px;margin:0}
.srcfacts dt{font-size:11px;color:var(--muted)}
.srcfacts dd{margin:0;font-size:13px;color:var(--ink)}
.srcoff{font-size:12.5px;color:var(--muted);margin:10px 0 0}
@media (max-width:1000px){.srcitem{grid-template-columns:1fr}.srcfacts{margin-left:21px}}
@media (max-width:560px){.srcfacts{grid-template-columns:1fr 1fr}}
/* in the narrow right-hand column the facts stack under each name */
@container (max-width:620px){.srcitem{grid-template-columns:1fr}.srcfacts{margin-left:21px;grid-template-columns:1fr 1fr}}
.fchip{font-family:"IBM Plex Sans";font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;
  padding:1px 5px;border-radius:2px;border:1px solid var(--rule);color:var(--muted)}
.fchip.f-discontinued{color:#9B1C1C;border-color:#E9B7B7;background:#FDF0F0}
.fchip.f-definition{color:#92400E;border-color:#EBCFA6;background:#FFF6EA}
.fchip.f-partial{color:#7A5A0A;border-color:#E4D4A0;background:#FFFAEC}
.fchip.f-development{color:#2B4A6F;border-color:#CFDDED;background:#EEF4FB}
html[data-theme="dark"] .fchip.f-discontinued{color:#F0A0A0;border-color:#5A2323;background:#301414}
html[data-theme="dark"] .fchip.f-definition{color:#EDBE86;border-color:#553C13;background:#2E2109}
html[data-theme="dark"] .fchip.f-partial{color:#E4CE88;border-color:#4A3E14;background:#2A2308}
html[data-theme="dark"] .fchip.f-development{color:#A9C2DE;border-color:#2C3C50;background:#17222F}
.srcdet{padding:4px 0 2px 21px}

/* ── the getting-started guide ───────────────────────────────────
   Bottom right, first visit only. Every colour is a theme var, so it follows
   light and dark without extra rules. */
.guide{position:fixed;right:24px;bottom:24px;z-index:70;width:min(370px,calc(100vw - 40px));
  background:var(--surface);border:1px solid var(--rule);box-shadow:var(--shadow);
  display:none;flex-direction:column;overflow:hidden}
.guide.on{display:flex}
/* Anchored to whatever the step is about. left/top are set in script, so the
   corner offsets have to be cleared or they fight each other. */
.guide.anchored{right:auto;bottom:auto;transition:left .32s cubic-bezier(.4,0,.2,1),top .32s cubic-bezier(.4,0,.2,1)}
@media (prefers-reduced-motion:reduce){.guide.anchored{transition:none}}

/* The ring is drawn with a spread shadow and the scrim with a second, huge
   one on the same element — one box, no overlay stack to keep in sync. */
#gspot{position:fixed;z-index:68;border-radius:4px;pointer-events:none;display:none;
  box-shadow:0 0 0 2px var(--purple), 0 0 0 6px color-mix(in srgb,var(--purple) 26%,transparent),
             0 0 0 9999px rgba(8,10,16,.34);
  transition:left .32s cubic-bezier(.4,0,.2,1),top .32s cubic-bezier(.4,0,.2,1),

html[data-theme="dark"] #gspot{box-shadow:0 0 0 2px var(--purple), 0 0 0 6px color-mix(in srgb,var(--purple) 30%,transparent), 0 0 0 9999px rgba(0,0,0,.56)}
#gspot.on{display:block}
@media (prefers-reduced-motion:reduce){#gspot{transition:none}}
/* Pointer-events off throughout: the guide explains the page, it doesn't
   take it away — you can still click the thing being described. */
#garrow{position:fixed;inset:0;z-index:69;pointer-events:none;display:none}
#garrow.on{display:block}

/* ══════════════════════════════════════════════
   STATE — a list of panels, one of them active
   ══════════════════════════════════════════════ */
let DB = PLACEHOLDER;

/* theme — applied before first render so charts draw in the right palette */
(function(){ try{
  if(localStorage.getItem("polyoptic-theme")==="dark") document.documentElement.dataset.theme="dark";
}catch(e){} })();
/* Categorical slots, violet-led so a chart reads as this site's.
   The two modes are the SAME four hues stepped for their own surface, not a
   light set brightened — that is what makes them read as one system.
   Both were validated rather than eyeballed: lightness band, chroma floor,
   colour-blind separation, normal-vision floor and contrast, against #fff and
   #151823. The set these replace failed two checks — the brand purple sat
   below the light band, and the teal was under the chroma floor, which means
   it was rendering as grey. */
const PAL=CK.pal;   /* the categorical palette lives in chartkit.js */

/* Sequential ramp for magnitude — the heatmap. One hue, light to dark, built
   from slot 1 so a value scale is visibly the same family as the categorical
   set rather than a second colour system. Each mode's lightest step sits near
   its own surface, which is what makes "near zero" recede. */
const RAMP_LIGHT=["#F2EEFD","#DCD3F8","#C3B4F2","#A68DEA","#8A69E4","#6D4AE0","#4B2FA8"];
const RAMP_DARK =["#1D1A2E","#2A2447","#3A3068","#4C3F90","#6250B8","#7A63DC","#9B84F0"];
const RAMP=()=>document.documentElement.dataset.theme==="dark"?RAMP_DARK:RAMP_LIGHT;

/* Chart types, grouped by what they answer. The grouping is not decoration:
   the area views were previously the last entries of a flat dropdown inside a
   collapsed panel, which is a good way to ship a feature nobody finds. */
const CHART_GROUPS = [
  ["Over time", [
    ["line","Line"],["step","Step"],["dots","Dots"],["area","Area"],["gap","Gap"],
    ["bar","Columns"],["stack","Stacked area"],["colstack","Stacked columns"],
    ["slope","Slope"],["scatter","Scatter"],["small","Small multiples"]]],
  ["By area", [
    ["map","Map"],["areas","Ranking"],["arrow","Change"],["range","Range"],["heat","Heatmap"]]],
];
const CHART_TYPES = CHART_GROUPS.flatMap(([,xs])=>xs);
