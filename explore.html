/* ══════════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════════ */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function buildSets(p){
  return p.sel.map((id,i)=>{
    const s=S(id); if(!s) return null;
    return {id,name:s.name,meta:s,colour:PAL(i),unit:unitLabel(s,p),pts:transform(s,p)};
  }).filter(Boolean);
}

function warningsFor(p,sets){
  const w=[];
  /* The area view is a cross-section, so most of the warnings below are about
     things it does not do. It gets its own set instead. */
  if(AREA_CHARTS.has(p.chart)){
    const set=areaSet(sets);
    if(!set) return w;
    if(sets.length>1)
      w.push({html:`<b>Showing ${esc(set.name)} only.</b> The area views draw one indicator; the other ${sets.length>2?"indicators are":"indicator is"} still on the chart's other views.`});
    if(p.trans!=="none")
      w.push({html:`<b>Figures as published.</b> Rebasing, year-on-year and the per-person transforms describe movement over time and are not applied here.`});
    const ix=AREAIX, d=AREADATA.get(set.id);
    if(ix&&ix!=="error"&&d&&d!=="error"){
      const lvl=areaLevel(p,set.id);
      if(p.chart==="areas"){
        const {year,end}=areaRows(p,d,ix,lvl);
        if(year!==Math.min(p.to,end))
          w.push({html:`<b>Showing ${year}.</b> No area at this level carries a figure for ${p.to}; ${year} is the most recent that does.`});
      } else if(p.chart==="arrow"||p.chart==="range"){
        const {y0,y1}=areaPair(p,d,ix,lvl);
        if(y0!==Math.min(p.from,p.to)||y1!==Math.max(p.from,p.to))
          w.push({html:`<b>Comparing ${y0} with ${y1}.</b> The years asked for are not both published at this level, so the nearest that are have been used.`});
        w.push({html:`<b>Two moments, not a trend.</b> Everything between the two years is left out, so an area that rose and fell back looks unchanged.`});
      }
      w.push({html:`<b>Areas as they are drawn today.</b> Local authorities merge and split, and ONS restates the back series onto current boundaries — so a long run for one area is a run for the ground it now covers, not for the council that used to run it.`});
    }
    return w;
  }
  if(p.gran!=="years"&&sets.length)
    w.push({html:`<b>Interpolated detail.</b> These series are published annually. The ${esc(p.gran)} view estimates points between the annual figures — the shape is real, the fine detail is not.`});
  const geos=[...new Set(sets.map(s=>s.meta.geography))];
  if(geos.length>1) w.push({html:`<b>Different geographies.</b> Comparing ${esc(geos.join(" with "))}. These cover different populations and are not like for like.`});
  const bases=[...new Set(sets.map(s=>s.meta.year_basis))];
  if(bases.length>1) w.push({html:`<b>Different year bases.</b> Mixing ${esc(bases.join(", "))} years. Academic and financial years plot at their starting calendar year, so a point can be up to twelve months out.`});
  const units=[...new Set(sets.map(s=>s.unit))];
  if(units.length>1&&p.trans!=="index"&&p.trans!=="yoy")
    w.push({html:`<b>Different units.</b> Each series is on its own axis, which can make any two lines appear to move together.`,act:"rebase"});
  const skipped=sets.filter(s=>["real","percap","pctgdp"].includes(p.trans)&&!applies(p.trans,s.meta));
  if(skipped.length) w.push({html:`<b>Transform skipped for ${esc(skipped.map(s=>s.name).join(", "))}.</b> Already a rate, ratio or index — deflating or dividing by population would be meaningless.`});
  sets.flatMap(s=>(s.meta.discontinuities||[]).filter(d=>d.year>=p.from&&d.year<=p.to).map(d=>({s:s.name,...d})))
      .forEach(d=>w.push({html:`<b>Break in ${esc(d.s)} at ${d.year}.</b> ${esc(d.note)}`}));
  return w;
}

function chartFor(p,sets){
  if(AREA_CHARTS.has(p.chart)) return renderAreaChart(p,sets);
  if(p.chart==="slope") return renderSlope(p,sets);
  if(p.chart==="colstack") return sets.length>=2 ? renderColStack(p,sets)
    : `<div class="blank"><h3>Stacking needs at least two</h3><div>Add another indicator to stack them.</div></div>`;
  if(p.chart==="scatter") return sets.length===2 ? renderScatter(p,sets)
    : `<div class="blank"><h3>Scatter needs exactly two</h3><div>Points are coloured by the government of the day.</div></div>`;
  if(p.chart==="small") return renderSmall(p,sets);
  if(p.chart==="bar") return renderBar(p,sets);
  if(p.chart==="stack") return sets.length>=2 ? renderStack(p,sets)
    : `<div class="blank"><h3>Stacking needs at least two</h3><div>Add another indicator to stack them.</div></div>`;
  return renderLine(p,sets,p.chart);
}

function panelHtml(p,i){
  const sets=buildSets(p);
  const anyApplies=t=>p.sel.some(id=>applies(t,S(id)));
  const open = state.openCfg===p.key;
  const menuOpen = state.openMenu===p.key;
  const lk = lockedKeys.has(p.key);

  const sel=(act,opts,cur,disFn)=>`<div class="dd"><select data-act="${act}" aria-label="${act}">${
    opts.map(([k,l])=>`<option value="${k}"${cur===k?" selected":""}${disFn&&disFn(k)?" disabled":""}>${l}</option>`).join("")
  }</select></div>`;

  /* Level and order only exist for the area view, and the level list is the
     one this particular indicator publishes — no offering districts for a
     series that stops at regions. */
  const aset=AREA_CHARTS.has(p.chart)?areaSet(sets):null;
  const alvls=aset?areaLevels(aset.id):[];
  const areaCtrl = !aset||!alvls.length ? "" :
    `<span class="plabel">Level</span>${sel("lvl",alvls.map(k=>[k,((AREAIX||{}).levelNames||{})[k]||k]),areaLevel(p,aset.id))}
     <span class="plabel">Order</span>${sel("asort",AREA_SORTS,p.asort)}`;

  /* Why a type is unavailable belongs on the tile, not in a silent disable —
     "Scatter needs exactly two" is the answer to the question the greyed-out
     tile provokes. */
  const chartWhy = k =>
      k==="scatter" && p.sel.length!==2                      ? "Scatter needs exactly two indicators"
    : (k==="stack"||k==="colstack") && p.sel.length<2        ? "Stacking needs at least two indicators"
    : AREA_CHARTS.has(k) && p.sel.length && !areaSet(sets)   ? "No local figures for these indicators"
    : "";
  const picker = CHART_GROUPS.map(([head,items])=>
    `<div class="ctgroup"><span class="ctghead">${head}</span><div class="ctgrid">${
      items.map(([k,label])=>{ const why=chartWhy(k);
        return `<button class="ct${p.chart===k?" on":""}" data-act="charttile" data-v="${k}"`+
          `${why?` disabled title="${esc(why)}"`:""} aria-pressed="${p.chart===k}">`+
          `${CHART_ICON[k]}<span>${esc(label)}</span></button>`;
      }).join("")}</div></div>`).join("");

  const ctrl=`<div class="cfgpanel" ${open?"":"hidden"}>
    ${picker}
    <div class="cfgrule"></div>
    <span class="plabel">Transform</span>${sel("trans",TRANSFORMS,p.trans,k=>p.sel.length&&!anyApplies(k))}
    ${areaCtrl}
    <div class="cfgrule"></div>
    <span class="plabel">Government</span>${sel("era",ERA_MODES,p.era)}
    <span class="plabel">Time</span>${sel("gran",GRANS,p.gran)}
    <span class="plabel">Width</span>${sel("widthsel",WIDTHS.map(([k,l])=>[String(k),l]),String(p.w))}
    <span class="plabel">Range</span><div class="rng">
      <input type="number" data-act="from" value="${p.from}" min="1980" max="2026" aria-label="From year"> — <input type="number" data-act="to" value="${p.to}" min="1980" max="2026" aria-label="To year">
    </div>
  </div>`;

  let body,foot="",legend="";
  if(!sets.length){
    body=`<div class="blank"><h3>Nothing on this chart</h3>
      <div>Pick indicators from the left, or start with a pairing:</div>
      <div class="sug">
        <button class="sg" data-act="pair" data-v="rents,pay">Rents × pay</button>
        <button class="sg" data-act="pair" data-v="absence,gap">Absence × attainment gap</button>
        <button class="sg" data-act="pair" data-v="psnd,debtint">Net debt × debt interest</button>
      </div></div>`;
  } else {
    const chart=chartFor(p,sets);
    const showRibbon = p.era!=="off" && p.chart!=="scatter" && p.chart!=="small"
                       && p.chart!=="slope" && !AREA_CHARTS.has(p.chart);
    /* A ranking is as tall as the number of areas, which at local-authority
       level is a few hundred rows. The panel's height becomes the window onto
       it rather than a cap on what is drawn — the PNG export still gets the
       whole thing, because it reads the SVG and not the scrolled view. */
    const tall=AREA_CHARTS.has(p.chart);
    body=`<div class="pbody${tall?" scrolls":""}"${tall?` style="max-height:${p.h}px"`:""}>${chart}${showRibbon?renderRibbon(p):""}</div>`;
    /* The area view draws one series and ignores the transform, so it gets a
       legend that says so. Left to the general one it would caption a chart of
       published pounds as "index, 1997=100" — the chart and its own key
       disagreeing, which is the failure this site exists to avoid. */
    const lgSets = aset ? [{...aset, unit:aset.meta.unit}] : sets;
    legend=`<div class="legend">${lgSets.map(s=>`<span class="lg"><span class="d" style="background:${s.colour}"></span>${esc(s.name)} <span class="u">${esc(s.unit)}</span></span>`).join("")}</div>`;
    /* Harvard citations are sentences, not chips — they get their own rows so
       they stay readable, while short keeps the original single-line strip. */
    const lines=srcLines(sets);
    const attrib = SRCSTYLE==="off" ? ""
      : SRCSTYLE==="harvard"
        ? lines.map(c=>`<span class="cite">${esc(c)}</span>`).join("")+`<span>LICENCE · OGL v3.0</span>`
        : `<span>SOURCES · ${esc(lines[0]).toUpperCase()}</span><span>LICENCE · OGL v3.0</span>`;
    foot=`<div class="pfoot${SRCSTYLE==="harvard"?" stacked":""}">${attrib}
      <span>DATA · ${DB.meta.provenance.toUpperCase()}</span></div>`;
  }

  /* The working, or an invitation to open one. The hint sits in the same slot
     so the card does not jump when a point is clicked. */
  const wh=sets.length?workingHtml(p,sets):"";
  const work = wh || (sets.length&&PROBEABLE.has(p.chart)
    ? `<div class="workhint">Click a point to show the working</div>` : "");

  const warns=warningsFor(p,sets).map(w=>
    `<div class="warn">${w.html}${w.act==="rebase"?`<button data-act="rebase">Rebase</button>`:""}</div>`).join("");

  return `<div class="pcard ${state.focus===i?"is-focus":""} ${lk?"locked":""}" style="--span:${p.w}" data-i="${i}" data-key="${p.key}">
    <div class="pbar">
      <span class="grip" data-act="grip" title="${lk?"Locked — unlock to move":"Drag to reorder"}">⠿</span>
      <button class="pi ${open?"on":""}" data-act="cfg" aria-expanded="${open}" title="Chart settings" aria-label="Chart settings">${IC.sliders}</button>
      <button class="pi ${lk?"on":""}" data-act="lock" aria-pressed="${lk}" title="${lk?"Unlock — let this chart move":"Lock this chart in place"}" aria-label="${lk?"Unlock chart":"Lock chart"}">${lk?IC.lock:IC.unlock}</button>
      <button class="pi ${p.era!=="off"?"on":""}" data-act="eratoggle" aria-pressed="${p.era!=="off"}" title="${p.era!=="off"?"Hide the government-in-power ribbon":"Show the government-in-power ribbon"}" aria-label="Toggle government ribbon">${IC.flag}</button>
      <span class="pnum">Chart ${i+1}</span>
      ${state.renaming===p.key
        ? `<input class="ptitle-in" data-act="title" value="${esc(p.title??(sets.length?sets.map(s=>s.name).join(" × "):""))}" maxlength="90" aria-label="Chart title">`
        : `<h2 class="ptitle" data-act="rename" title="Click to rename">${esc(p.title??(sets.length?sets.map(s=>s.name).join(" × "):"Empty chart"))}</h2>
           <button class="pi pen" data-act="rename" title="Rename this chart" aria-label="Rename this chart">${IC.pen}</button>`}
      <div class="pacts">
        <button class="pi ${menuOpen?"on":""}" data-act="menu" aria-expanded="${menuOpen}" title="More actions" aria-label="More actions for this chart">${IC.kebab}</button>
      </div>
    </div>
    <div class="menupanel" ${menuOpen?"":"hidden"}>
      <button class="mi" data-act="csv">${IC.csv} Download CSV</button>
      <button class="mi" data-act="png">${IC.png} Download PNG</button>
      <div class="msep"></div>
      <button class="mi" data-act="dup">${IC.dup} Duplicate chart</button>
      <button class="mi danger" data-act="del">${IC.del} Remove chart</button>
    </div>
    ${ctrl}${warns}${body}${work}${legend}${foot}
    <div class="rgrip" data-act="rgrip" title="Drag to change height"></div>
    <div class="cgrip" data-act="cgrip" title="Drag to resize"></div>
    <span class="hpill">${wLabel(p.w)} · ${p.h}px</span>
  </div>`;
}

function renderPanels(){
  const stack=document.getElementById("stack");
  stack.innerHTML = state.panels.length
    ? state.panels.map(panelHtml).join("")
    : `<div class="stackempty"><h3>No charts</h3>
       <div>Add one below, or pick an indicator on the left and we'll start a chart for you.</div></div>`;
}

function renderSidebar(){
  /* which chart am I editing */
  document.getElementById("pswitch").innerHTML =
    state.panels.length
      ? state.panels.map((p,i)=>{
          const label = p.title ? (p.title.length>22?p.title.slice(0,21)+"…":p.title) : "Chart "+(i+1);
          return `<button class="ps" data-sw="${i}" aria-pressed="${i===state.active}" title="${esc(p.title||"Chart "+(i+1))}">${esc(label)}</button>`;
        }).join("")
      : `<span class="trayempty">No charts yet.</span>`;
  document.querySelectorAll("[data-sw]").forEach(b=>b.onclick=()=>{
    state.active=+b.dataset.sw; state.focus=state.active; render();
    document.querySelector(`.pcard[data-i="${state.active}"]`)?.scrollIntoView({behavior:"smooth",block:"nearest"});
  });

  /* selected tray — independent of the topic filter */
  const p=P0();
  const tray=document.getElementById("tray");
  tray.innerHTML = !p ? `<div class="trayempty">No chart yet — pick an indicator and one appears.</div>`
    : p.sel.length
    ? p.sel.map((id,i)=>{const s=S(id); if(!s) return "";
        return `<div class="trayitem"><span class="sw" style="background:${PAL(i)}"></span>
          <span class="nm" title="${esc(s.name)}">${esc(s.name)}</span>
          <button class="x" data-drop="${id}" aria-label="Remove ${esc(s.name)}">×</button></div>`;}).join("")
    : `<div class="trayempty">Nothing selected yet.</div>`;
  tray.querySelectorAll("[data-drop]").forEach(b=>b.onclick=()=>{
    const q=P0(); if(!q) return; q.sel=q.sel.filter(x=>x!==b.dataset.drop); render();
  });

  /* filters */
  const inMode=catalogue();
  const topics=["all",...new Set(inMode.flatMap(s=>s.topics))];
  document.getElementById("filters").innerHTML=topics.map(t=>
    `<button class="f" data-topic="${t}" aria-pressed="${state.topic===t}">${t.charAt(0).toUpperCase()+t.slice(1)}</button>`).join("");
  document.querySelectorAll("[data-topic]").forEach(b=>b.onclick=()=>{state.topic=b.dataset.topic;renderSidebar();});

  /* catalogue */
  const q=state.q.toLowerCase();
  const list=inMode.filter(s=>(state.topic==="all"||s.topics.includes(state.topic))&&
    (!q||s.name.toLowerCase().includes(q)||s.source.toLowerCase().includes(q)));
  const cat=document.getElementById("cat");
  cat.innerHTML=list.length?list.map(s=>{
    const i=p?p.sel.indexOf(s.id):-1, on=i>=0, end=s.start+s.values.length-1;
    return `<div class="ci" data-id="${s.id}" aria-selected="${on}">
      <span class="sw" style="${on?`background:${PAL(i)};border-color:${PAL(i)}`:""}"></span>
      <span class="body"><span class="cn">${esc(s.name)}</span>
      <span class="cm"><span class="tag">${esc(s.geography)}</span><span class="tag">${esc(s.unit)}</span><span class="yr">${s.start}–${end}</span></span>
      </span></div>`;}).join("") : `<div class="empty">Nothing matches that.</div>`;
  cat.querySelectorAll(".ci").forEach(el=>el.onclick=()=>{
    const id=el.dataset.id;
    if(!P0()){ addPanel([id]); return; }          /* no charts yet — start one */
    const q=P0(), i=q.sel.indexOf(id);
    if(i>=0) q.sel.splice(i,1);
    else if(q.sel.length<4) q.sel.push(id);
    else { q.sel.shift(); q.sel.push(id); }
    render();
  });
  document.getElementById("count").textContent = p
    ? `${p.sel.length} of 4 on Chart ${state.active+1} · ${inMode.length} indicators available`
    : `${inMode.length} indicators available`;
}

/* The style control lives here rather than in the header: this is the panel
   about sourcing, and the setting governs how sourcing is written everywhere. */
function srcStyleControl(){
  return `<div class="srcstyle">
    <span class="plabel">Sourcing</span>
    <div class="segs" role="group" aria-label="Sourcing style">${
      SRC_STYLES.map(([k,l])=>`<button data-src="${k}" aria-pressed="${SRCSTYLE===k}">${l}</button>`).join("")
    }</div>
    ${SRCSTYLE==="harvard"?`<button class="copycite" id="copyCite">Copy citations</button>`:""}
  </div>`;
}

function renderSources(){
  const p=P0(), el=document.getElementById("srcs");
  const sets=p?buildSets(p):[];
  if(!sets.length){
    el.innerHTML=`<div class="srchd"><div class="plabel">Provenance</div>${srcStyleControl()}</div>
      <div class="trayempty">Select something to see where it came from.</div>`;
    bindSrcStyle(); return;
  }
  const body = SRCSTYLE==="harvard"
    ? sets.map(s=>`<div class="srcrow cite">${esc(citeHarvard(s.meta))}
        ${DB.meta.provenance==="placeholder"?'<span class="ph">PLACEHOLDER</span>':''}</div>`).join("")
    : SRCSTYLE==="off"
    ? `<div class="trayempty">Attribution is switched off — including on CSV and PNG exports.
        The data is still OGL v3.0, which asks for a source statement when you republish it.</div>`
    : sets.map(s=>`
      <div class="srcrow"><b>${esc(s.name)}</b>
        <span class="mono">${esc(s.meta.source)}</span><span class="mono">${esc(s.meta.geography)}</span>
        <span class="mono">${esc(s.meta.year_basis)} years</span><span class="mono">${esc(s.meta.unit)}</span>
        <span class="mono">${esc(s.meta.licence)}</span>
        ${DB.meta.provenance==="placeholder"?'<span class="ph">PLACEHOLDER</span>':''}
      </div>`).join("");
  el.innerHTML=`<div class="srchd"><div class="plabel">Provenance · Chart ${state.active+1}</div>${srcStyleControl()}</div>${body}`;
  bindSrcStyle(sets);
}

function bindSrcStyle(sets){
  document.querySelectorAll("[data-src]").forEach(b=>b.onclick=()=>{
    SRCSTYLE=b.dataset.src;
    try{ localStorage.setItem("polyoptic-srcstyle",SRCSTYLE); }catch(e){}
    render();
  });
  const cp=document.getElementById("copyCite");
  if(cp) cp.onclick=()=>{
    const text=srcLines(sets||[]).join("\n");
    if(!text) return;
    navigator.clipboard?.writeText(text).then(()=>{
      cp.textContent="Copied"; setTimeout(()=>{cp.textContent="Copy citations";},1400);
    });
  };
}

function render(){ renderPanels(); renderSidebar(); renderSources(); writeHash(); }

/* ══════════════════════════════════════════════
   PANEL ACTIONS
   ══════════════════════════════════════════════ */
function addPanel(sel=[]){
  state.panels.push(mkPanel(sel));
  state.active=state.panels.length-1;
  state.focus=state.active;
  render();
  document.querySelector(`.pcard[data-i="${state.active}"]`)?.scrollIntoView({behavior:"smooth",block:"center"});
}
document.getElementById("addBottom").onclick=()=>addPanel();

document.getElementById("stack").addEventListener("click",e=>{
  const card=e.target.closest(".pcard"); if(!card) return;
  const i=+card.dataset.i, p=state.panels[i];
  /* A data point beats the generic card click: clicking a mark should open its
     working, not just focus the panel. */
  const mark=e.target.closest("[data-probe]");
  if(mark){
    const id=mark.dataset.probe, code=mark.dataset.area, x=mark.dataset.x;
    const same = state.probe && state.probe.key===p.key && state.probe.id===id &&
                 (code ? state.probe.code===code : state.probe.x===+x);
    state.probe = same ? null : (code ? {key:p.key,id,code} : {key:p.key,id,x:+x});
    state.active=i; state.focus=i; render(); return;
  }

  /* clicks land on the SVG inside icon buttons, so resolve to the button */
  const actEl=e.target.closest("[data-act]");
  const act=actEl?actEl.dataset.act:undefined;

  if(!act){ state.active=i; state.focus=i; render(); return; }
  state.active=i; state.focus=i;

  /* selects and inputs inside the settings popover are handled on change */
  if(["chart","trans","era","gran","from","to","title","widthsel"].includes(act)) return;

  if(act==="cfg"){ state.openCfg = state.openCfg===p.key ? null : p.key; state.openMenu=null; }
  else if(act==="menu"){ state.openMenu = state.openMenu===p.key ? null : p.key; state.openCfg=null; }
  else if(act==="lock"){ lockedKeys.has(p.key) ? lockedKeys.delete(p.key) : lockedKeys.add(p.key); }
  else if(act==="eratoggle"){
    if(p.era==="off") p.era = p.eraPrev||"pm";
    else { p.eraPrev=p.era; p.era="off"; }
  }
  else if(act==="rename"){
    state.renaming=p.key; state.openCfg=null; state.openMenu=null;
    render();
    const inp=document.querySelector('.ptitle-in'); if(inp){ inp.focus(); inp.select(); }
    return;
  }
  else if(act==="rebase") p.trans="index";
  else if(act==="unprobe") state.probe=null;
  else if(act==="charttile") p.chart=actEl.dataset.v;
  else if(act==="pair") p.sel=actEl.dataset.v.split(",");
  else if(act==="dup"){ state.openMenu=null; state.panels.splice(i+1,0,mkPanel(p.sel,{chart:p.chart,trans:p.trans,from:p.from,to:p.to,era:p.era,gran:p.gran,h:p.h,w:p.w,lvl:p.lvl,asort:p.asort,title:p.title?p.title+" (copy)":null})); state.active=i+1; }
  else if(act==="del"){ state.openMenu=null; state.panels.splice(i,1); lockedKeys.delete(p.key); if(state.openCfg===p.key) state.openCfg=null; state.active=Math.max(0,Math.min(state.active,state.panels.length-1)); state.focus=null; }
  else if(act==="csv"){ state.openMenu=null; exportCsv(i); render(); return; }
  else if(act==="png"){ state.openMenu=null; exportPng(i); render(); return; }
  render();
});
document.getElementById("stack").addEventListener("focusout",e=>{
  if(e.target.dataset.act!=="title") return;
  const card=e.target.closest(".pcard"); if(!card) return;
  if(e.target.dataset.cancel==="1"){ state.renaming=null; render(); return; }
  const p=state.panels[+card.dataset.i];
  const v=e.target.value.trim();
  const auto=buildSets(p).map(s=>s.name).join(" × ");
  p.title = (v && v!==auto) ? v : null;   /* typing the auto title back clears the override */
  state.renaming=null; render();
});
document.getElementById("stack").addEventListener("keydown",e=>{
  if(e.target.dataset.act!=="title") return;
  if(e.key==="Enter") e.target.blur();
  if(e.key==="Escape"){ e.stopPropagation(); e.target.dataset.cancel="1"; e.target.blur(); }
});
document.getElementById("stack").addEventListener("change",e=>{
  const card=e.target.closest(".pcard"); if(!card) return;
  const p=state.panels[+card.dataset.i], act=e.target.dataset.act;
  if(act==="from") p.from=+e.target.value;
  else if(act==="to") p.to=+e.target.value;
  else if(act==="chart") p.chart=e.target.value;
  else if(act==="trans") p.trans=e.target.value;
  else if(act==="lvl") p.lvl=e.target.value;
  else if(act==="asort") p.asort=e.target.value;
  else if(act==="era"){ p.era=e.target.value; if(p.era!=="off") p.eraPrev=p.era; }
  else if(act==="widthsel"){ p.w=+e.target.value; }
  else if(act==="gran"){
    p.gran=e.target.value;
    /* fine detail over a long window is unreadable and slow — pull the window in */
    if(p.gran==="days"   && p.to-p.from>3)  p.from=p.to-3;
    if(p.gran==="months" && p.to-p.from>12) p.from=p.to-12;
  }
  else return;
  render();
});

/* click outside any panel clears the selection outline and closes settings */
document.addEventListener("pointerdown",e=>{
  if(e.target.closest(".pcard")||e.target.closest(".side")) return;
  if(state.focus!==null||state.openCfg!==null||state.openMenu!==null){ state.focus=null; state.openCfg=null; state.openMenu=null; renderPanels(); }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&(state.openCfg!==null||state.openMenu!==null)){ state.openCfg=null; state.openMenu=null; renderPanels(); }
});

/* ── drag to reorder ──
   The lifted card follows the pointer; a dashed slot shows exactly where it
   will land. Locked charts are skipped as landing targets and keep their
   position in the stack when everything else moves around them. */
let drag=null;

function orderAfterDrop(movingKey, targetSlot){
  const keys=state.panels.map(p=>p.key);
  const lockedAt=new Map(); keys.forEach((k,i)=>{ if(lockedKeys.has(k)) lockedAt.set(i,k); });
  const movers=keys.filter(k=>!lockedKeys.has(k)&&k!==movingKey);
  const freeSlots=keys.map((_,i)=>i).filter(i=>!lockedAt.has(i));
  const at=Math.max(0,freeSlots.indexOf(targetSlot));
  movers.splice(at,0,movingKey);
  const next=[]; let mi=0;
  for(let i=0;i<keys.length;i++) next.push(lockedAt.has(i)?lockedAt.get(i):movers[mi++]);
  state.panels = next.map(k=>state.panels.find(p=>p.key===k));
  state.active = state.panels.findIndex(p=>p.key===movingKey);
}

document.getElementById("stack").addEventListener("pointerdown",e=>{
  if(e.target.dataset.act!=="grip") return;
  const card=e.target.closest(".pcard");
  const key=+card.dataset.key;
  if(lockedKeys.has(key)) return;
  e.preventDefault();
  e.target.setPointerCapture(e.pointerId);
  const r=card.getBoundingClientRect();
  drag={key, el:card, started:false, x0:e.clientX, y0:e.clientY,
        offX:e.clientX-r.left, offY:e.clientY-r.top, w:r.width, h:r.height,
        index:+card.dataset.i, target:{kind:"pos", i:+card.dataset.i}, slot:null};
});

document.addEventListener("pointermove",e=>{
  if(!drag) return;
  if(!drag.started){
    if(Math.hypot(e.clientX-drag.x0, e.clientY-drag.y0)<5) return;
    drag.started=true;
    state.openCfg=null; state.openMenu=null;
    const slot=document.createElement("div");
    slot.className="dropslot";
    slot.style.setProperty("--span", state.panels[drag.index].w);
    slot.style.height=drag.h+"px";
    slot.textContent="Drop here";
    drag.el.parentNode.insertBefore(slot, drag.el);
    drag.slot=slot;
    drag.el.classList.add("drag-live");
    drag.el.style.width=drag.w+"px";
    document.body.classList.add("dragging");
  }
  drag.el.style.left=(e.clientX-drag.offX)+"px";
  drag.el.style.top =(e.clientY-drag.offY)+"px";

  /* two kinds of landing target:
     — a position another chart occupies (swap into its place), or
     — the empty grid space beside a part-width chart, so dragging next to a
       half-width chart snaps in 50/50 instead of being pushed to a new row */
  const keys=state.panels.map(p=>p.key);
  const free=keys.map((_,i)=>i).filter(i=>!lockedKeys.has(keys[i]));
  const stackR=document.getElementById("stack").getBoundingClientRect();
  let best=null, bestD=Infinity;

  free.forEach(i=>{
    const node = i===drag.index ? drag.slot : document.querySelector(`.pcard[data-i="${i}"]`);
    if(!node) return;
    const rr=node.getBoundingClientRect();
    const d=Math.hypot(e.clientX-(rr.left+rr.width/2), e.clientY-(rr.top+rr.height/2));
    if(d<bestD){ bestD=d; best={kind:"pos", i}; }
  });

  /* gap targets: rows whose spans don't add to 12 leave space on the right */
  const statics=[...document.querySelectorAll(".pcard:not(.drag-live)")];
  statics.forEach(node=>{
    const i=+node.dataset.i, rr=node.getBoundingClientRect();
    /* span used by this visual row = every static card sharing this row's top */
    const rowSpan = statics.reduce((a,n2)=>{
      const r2=n2.getBoundingClientRect();
      return Math.abs(r2.top-rr.top)<12 ? a+(+state.panels[+n2.dataset.i].w||12) : a;
    },0);
    const gap = 12-rowSpan;
    if(gap<4) return;                                   /* nothing usable left in the row */
    const rightmost = statics.filter(n2=>Math.abs(n2.getBoundingClientRect().top-rr.top)<12)
      .sort((a2,b2)=>b2.getBoundingClientRect().right-a2.getBoundingClientRect().right)[0];
    if(rightmost!==node) return;                        /* only offer the gap once per row */
    const gx=(rr.right+stackR.right)/2, gy=rr.top+rr.height/2;
    const d=Math.hypot(e.clientX-gx, e.clientY-gy)*0.9; /* slight bias: filling a gap is usually the intent */
    if(d<bestD){ bestD=d; best={kind:"gap", i, span:gap, h:rr.height}; }
  });

  if(best && JSON.stringify(best)!==JSON.stringify(drag.target)){
    drag.target=best;
    if(best.kind==="pos"){
      const ref = best.i===drag.index ? null : document.querySelector(`.pcard[data-i="${best.i}"]`);
      if(ref) ref.parentNode.insertBefore(drag.slot, best.i>drag.index ? ref.nextSibling : ref);
      const tp = state.panels[best.i];
      drag.slot.style.setProperty("--span", tp.w);
      drag.slot.style.height = (ref?ref.getBoundingClientRect().height:drag.h)+"px";
    } else {
      const ref=document.querySelector(`.pcard[data-i="${best.i}"]`);
      if(ref) ref.parentNode.insertBefore(drag.slot, ref.nextSibling);
      drag.slot.style.setProperty("--span", best.span);
      drag.slot.style.height = best.h+"px";
    }
  }
});

function placeAfter(movingKey, afterKey){
  const idx=state.panels.findIndex(pp=>pp.key===movingKey);
  const [mv]=state.panels.splice(idx,1);
  const at=state.panels.findIndex(pp=>pp.key===afterKey);
  state.panels.splice(at+1,0,mv);
  state.active=state.panels.findIndex(pp=>pp.key===movingKey);
}

document.addEventListener("pointerup",()=>{
  if(!drag) return;
  const wasDrag=drag.started, key=drag.key, target=drag.target, from=drag.index;
  if(wasDrag){
    drag.el.classList.remove("drag-live");
    drag.el.style.cssText="";
    drag.slot?.remove();
    document.body.classList.remove("dragging");
    if(target && target.kind==="gap"){
      /* slot into the empty space beside that chart, at the gap's width,
         matching its height so the pair tiles as one row */
      const beside=state.panels[target.i];
      placeAfter(key, beside.key);
      const mv=state.panels.find(pp=>pp.key===key);
      if(mv){ mv.w=target.span; mv.h=beside.h; }
    } else if(target && target.kind==="pos"){
      const adoptW = target.i!==from && state.panels[target.i] ? state.panels[target.i].w : null;
      orderAfterDrop(key, target.i);
      if(adoptW!==null){ const mv=state.panels.find(pp=>pp.key===key); if(mv) mv.w=adoptW; }
    }
  }
  drag=null;
  if(wasDrag) render();
});

/* ── drag to resize ── */
let rz=null;
document.getElementById("stack").addEventListener("pointerdown",e=>{
  const mode=e.target.dataset.act;
  if(mode!=="rgrip"&&mode!=="cgrip") return;
  const card=e.target.closest(".pcard"), i=+card.dataset.i;
  rz={i,mode,y0:e.clientY,x0:e.clientX,h0:state.panels[i].h,w0:state.panels[i].w,card};
  card.classList.add("is-resizing");
  document.body.classList.add("resizing");
  e.target.setPointerCapture(e.pointerId);
  e.preventDefault();
});
let rzRaf=0;
document.addEventListener("pointermove",e=>{
  if(!rz) return;
  const p=state.panels[rz.i];
  p.h=Math.max(H_MIN,Math.min(H_MAX,Math.round((rz.h0+(e.clientY-rz.y0))/10)*10));
  if(rzRaf) return;                      /* one chart rebuild per frame, not per event */
  rzRaf=requestAnimationFrame(()=>{ rzRaf=0; });

  const card=document.querySelector(`.pcard[data-i="${rz.i}"]`);
  if(!card) return;

  /* corner drag also sets width — snaps to half or full so the grid always tiles */
  if(rz.mode==="cgrip"){
    const stackW=document.getElementById("stack").getBoundingClientRect().width;
    const want=Math.max(3,Math.min(12,(rz.w0/12*stackW + (e.clientX-rz.x0)) / stackW * 12));
    let w=W_SNAPS[0];
    W_SNAPS.forEach(s=>{ if(Math.abs(s-want)<Math.abs(w-want)) w=s; });
    if(w!==p.w){ p.w=w; card.style.setProperty("--span",w); }
  }
  const sets=buildSets(p);
  if(sets.length){
    const holder=card.querySelector(".pbody");
    const chart=chartFor(p,sets);
    if(chart&&holder) holder.innerHTML=chart+((p.era!=="off"&&p.chart!=="scatter"&&p.chart!=="small")?renderRibbon(p):"");
  }
  const pill=card.querySelector(".hpill"); if(pill) pill.textContent=wLabel(p.w)+" · "+p.h+"px";
});
document.addEventListener("pointerup",()=>{
  if(!rz) return;
  const wasWidth = rz.mode==="cgrip" && state.panels[rz.i] && state.panels[rz.i].w!==rz.w0;
  document.querySelector(`.pcard[data-i="${rz.i}"]`)?.classList.remove("is-resizing");
  document.body.classList.remove("resizing");
  rz=null;
  if(wasWidth) render(); else writeHash();   /* width change needs a redraw at the new size */
});

/* ══════════════════════════════════════════════
   EXPORT — per chart, CSV and PNG
   ══════════════════════════════════════════════ */
const dl=(blob,name)=>{const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);};
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60)||"chart";

/* SVG text doesn't wrap, so a Harvard citation would run off the edge of an
   exported image. Break on words at a character budget — monospace at 10px
   is close enough to 6px a character to measure it that way. */
function wrapText(s,max){
  const out=[]; let cur="";
  /* a source URL is one unbreakable token and routinely longer than the
     line budget, so hard-break anything that can't fit on its own */
  const words=String(s).split(/\s+/).filter(Boolean).flatMap(w=>{
    if(w.length<=max) return [w];
    const bits=[]; for(let i=0;i<w.length;i+=max) bits.push(w.slice(i,i+max));
    return bits;
  });
  words.forEach(w=>{
    if(!cur) cur=w;
    else if((cur+" "+w).length<=max) cur+=" "+w;
    else { out.push(cur); cur=w; }
  });
  if(cur) out.push(cur);
  return out.length?out:[""];
}

/* The area export carries the area code as well as the name, because the name
   alone will not join to anything and a rankings CSV is exactly the file
   someone will want to join. Attribution follows SRCSTYLE like every other
   surface — see the note on SRC_STYLES. */
function exportAreaCsv(p,sets){
  const set=areaSet(sets), ix=AREAIX, d=set&&AREADATA.get(set.id);
  if(!set||!ix||ix==="error"||!d||d==="error") return;
  const lvl=areaLevel(p,set.id);
  const q=s=>`"${String(s).replace(/"/g,'""')}"`;
  const lines=srcLines([set]);
  const attrib = lines.length
    ? lines.map(c=>`# ${SRCSTYLE==="harvard"?"":"Sources: "}${c}\n`).join("")+
      `# Licence: OGL v3.0 — contains public sector information\n`
    : "";
  const head=(what)=>`# Polyoptic — ${set.name} by area, ${what}\n`+attrib+
    `# Level: ${(ix.levelNames||{})[lvl]||lvl}\n`+
    `# Areas are on current boundaries; ONS restates the back series when they change\n`;

  let body="", name="";
  /* Each view exports what it actually shows — a change view whose file held
     only the end year would not reproduce the chart it came from. */
  if(p.chart==="arrow"||p.chart==="range"){
    const {rows,y0,y1}=areaPair(p,d,ix,lvl);
    if(!rows.length) return;
    rows.sort(areaSortPair(p.chart==="arrow"&&p.asort==="desc"?"change":p.asort));
    body=head(`${y0} and ${y1}`)+
      `area_code,area_name,level,${y0},${y1},change\n`+
      rows.map(r=>`${r[0]},${q(r[1])},${lvl},${r[2]},${r[3]},${+r[4].toFixed(6)}`).join("\n");
    name=`${set.name}-by-area-${y0}-${y1}`;
  } else if(p.chart==="heat"){
    const len=Math.max(...Object.values(d.values).map(v=>v.length));
    const lo=Math.max(p.from,d.start), hi=Math.min(p.to,d.start+len-1);
    if(hi<lo) return;
    const years=[]; for(let y=lo;y<=hi;y++) years.push(y);
    const codes=Object.keys(d.values).filter(c=>(ix.areas[c]||{}).l===lvl).sort();
    body=head(`${lo} to ${hi}`)+
      `area_code,area_name,level,${years.join(",")}\n`+
      codes.map(c=>`${c},${q(areaName(ix,c))},${lvl},`+
        years.map(y=>{const v=d.values[c][y-d.start];return v==null?"":v;}).join(",")).join("\n");
    name=`${set.name}-by-area-${lo}-${hi}`;
  } else {
    const {rows,year}=areaRows(p,d,ix,lvl);
    if(!rows.length) return;
    rows.sort(p.asort==="name" ? (a,b)=>a[1].localeCompare(b[1])
            : p.asort==="asc"  ? (a,b)=>a[2]-b[2]
            :                    (a,b)=>b[2]-a[2]);
    body=head(String(year))+
      `area_code,area_name,level,year,${q(set.name+" ("+set.unit+")")}\n`+
      rows.map(r=>`${r[0]},${q(r[1])},${lvl},${year},${r[2]}`).join("\n");
    name=`${set.name}-by-area-${year}`;
  }
  dl(new Blob([body],{type:"text/csv"}), slug(name)+".csv");
}

function exportCsv(i){
  const p=state.panels[i], sets=buildSets(p);
  if(!sets.length) return;
  if(AREA_CHARTS.has(p.chart)) return exportAreaCsv(p,sets);
  const years=[...new Set(sets.flatMap(s=>s.pts.map(q=>q[0])))].sort();
  const head=["year",...sets.map(s=>`"${s.name} (${s.unit})"`)].join(",");
  const rows=years.map(y=>[y,...sets.map(s=>{const q=s.pts.find(q=>q[0]===y);return q&&q[1]!=null?q[1].toFixed(4):"";})].join(","));
  const warn=DB.meta.provenance==="placeholder"?"# WARNING: placeholder data, not real statistics\n":"";
  /* off strips the source and licence lines from the file as well as the
     screen — see the note on SRC_STYLES. */
  const lines=srcLines(sets);
  const attrib = lines.length
    ? lines.map(c=>`# ${SRCSTYLE==="harvard"?"":"Sources: "}${c}\n`).join("")+
      `# Licence: OGL v3.0 — contains public sector information\n`
    : "";
  const csv=warn+`# Polyoptic — ${sets.map(s=>s.name).join(" x ")}\n`+attrib+
    `# Geography: ${[...new Set(sets.map(s=>s.meta.geography))].join("; ")}\n`+
    head+"\n"+rows.join("\n");
  dl(new Blob([csv],{type:"text/csv"}), slug(sets.map(s=>s.name).join("-"))+".csv");
}

/* Styles have to travel with the SVG — a serialised node gets no page CSS,
   and web fonts don't load in a detached image, so fall back to system stacks.
   The palette follows the theme the person is looking at, so a dark-mode
   export is a dark image rather than dark-mode lines on a white card. */
const EXPORT_THEMES={
  light:{bg:"#ffffff", grid:"#D3D8DD", muted:"#5C6672", ink:"#0F1419", warn:"#B45309"},
  dark: {bg:"#151823", grid:"#262B36", muted:"#8A93A0", ink:"#E8ECF1", warn:"#E0B45C"},
  /* Brexit mode needs its own entry, not a fall-through to light: one of its
     four line colours is white, which would export invisibly onto a white card. */
  brexit:{bg:"#012169", grid:"#1B3E8C", muted:"#A8BDE4", ink:"#FFFFFF", warn:"#F0C24B"}
};
const exportCss=th=>`
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .gridline{stroke:${th.grid};stroke-width:1;opacity:.7}
  .axlabel{font-size:10px;fill:${th.muted}}
  .line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .disc{stroke:${th.warn};stroke-width:1;stroke-dasharray:3 3;opacity:.6}
  .sm-t{font-size:10px;font-weight:500}
  .era text{font-size:9px;fill:#fff;font-weight:500}
  .pmtick{stroke:${th.ink};stroke-width:1;stroke-dasharray:2 2;opacity:.3}
  .etick{stroke:${th.ink};stroke-width:1.5}
  .pmlabel{font-size:8.5px;fill:${th.muted}}
  .eralabel{font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;fill:${th.muted}}
  .ttl{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:700;font-size:19px;fill:${th.ink}}
  .sub{font-size:11px;fill:${th.muted}}
  .cred{font-size:10px;fill:${th.muted}}`;

function exportPng(i){
  const p=state.panels[i], sets=buildSets(p);
  const card=document.querySelector(`.pcard[data-i="${i}"]`);
  if(!sets.length||!card) return;
  const svgs=[...card.querySelectorAll(".pbody svg")];
  if(!svgs.length) return;
  const TH = EXPORT_THEMES[document.documentElement.dataset.theme] || EXPORT_THEMES.light;

  const PAD=26, TOP=74, LEGEND=26, SCALE=2, CRED_LH=13;
  const inner=svgs.map(s=>{
    const vb=s.getAttribute("viewBox").split(/\s+/).map(Number);
    return {markup:s.innerHTML, w:vb[2], h:vb[3]};
  });
  const bodyH=inner.reduce((a,s)=>a+s.h+8,0);

  /* The credit block is measured before the canvas is sized: Harvard puts a
     full citation per series down there, so the image has to grow to fit it
     rather than clipping it. */
  const attribLines = SRCSTYLE==="off" ? ["polyoptic.co"]
    : SRCSTYLE==="harvard" ? [...srcLines(sets), "OGL v3.0 · polyoptic.co"]
    : [`Source: ${srcLines(sets)[0]} · OGL v3.0 · polyoptic.co`];
  const credit = (DB.meta.provenance==="placeholder"
      ? ["PLACEHOLDER DATA — NOT REAL STATISTICS"] : [])
    .concat(attribLines.flatMap(t=>wrapText(t, Math.max(40,Math.floor(W/6.3)))));
  const FOOT = 30 + Math.max(0,credit.length-1)*CRED_LH;

  const totalW=W+PAD*2, totalH=TOP+bodyH+LEGEND+FOOT+PAD;

  let y=TOP, parts="";
  inner.forEach(s=>{
    parts+=`<svg x="${PAD}" y="${y}" width="${W}" height="${s.h}" viewBox="0 0 ${s.w} ${s.h}">${s.markup}</svg>`;
    y+=s.h+8;
  });
  const legend=sets.map((s,k)=>{
    const x=PAD+k*Math.min(300,(W)/sets.length);
    return `<rect x="${x}" y="${y+6}" width="13" height="3" fill="${s.colour}"/>`+
           `<text class="cred" x="${x+18}" y="${y+11}">${esc(s.name)} — ${esc(s.unit)}</text>`;
  }).join("");

  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${totalW}" height="${totalH}" viewBox="0 0 ${totalW} ${totalH}">
    <style>${exportCss(TH)}</style>
    <rect width="100%" height="100%" fill="${TH.bg}"/>
    <text class="ttl" x="${PAD}" y="${PAD+14}">${esc(p.title??sets.map(s=>s.name).join(" × "))}</text>
    <text class="sub" x="${PAD}" y="${PAD+34}">${p.from}–${p.to} · ${esc(TRANSFORMS.find(x=>x[0]===p.trans)[1])} · ${esc([...new Set(sets.map(s=>s.meta.geography))].join(", "))}</text>
    ${parts}${legend}
    ${credit.map((ln,k)=>`<text class="cred" x="${PAD}" y="${totalH-PAD+4-(credit.length-1-k)*CRED_LH}">${esc(ln)}</text>`).join("")}
  </svg>`;

  const img=new Image();
  img.onload=()=>{
    const c=document.createElement("canvas");
    c.width=totalW*SCALE; c.height=totalH*SCALE;
    const ctx=c.getContext("2d");
    ctx.fillStyle=TH.bg; ctx.fillRect(0,0,c.width,c.height);
    ctx.setTransform(SCALE,0,0,SCALE,0,0);
    ctx.drawImage(img,0,0);
    c.toBlob(b=>{ if(b) dl(b, slug(sets.map(s=>s.name).join("-"))+".png"); },"image/png");
  };
  img.onerror=()=>alert("Couldn't render the image in this browser.");
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}

/* ══════════════════════════════════════════════
   PERMALINK
   ══════════════════════════════════════════════ */
function writeHash(){
  /* Fields are positional and append-only: lvl and asort go on the end so a
     link made before the area view existed still reads, and gets the
     defaults for the two it does not carry. */
  const enc=state.panels.map(p=>[p.sel.join(","),p.chart,p.trans,p.from,p.to,p.era,p.h,p.w,p.gran,encodeURIComponent(p.title||""),p.lvl,p.asort].join("~")).join(";");
  history.replaceState(null,"","#p="+encodeURIComponent(enc)+"&a="+state.active+
    (SRCSTYLE!=="short"?"&src="+SRCSTYLE:""));
}
function readHash(){
  if(!location.hash) return;
  const q=new URLSearchParams(location.hash.slice(1));
  /* a shared link carries the citation style, so the recipient sees the chart
     credited the way the person who sent it credited it */
  if(SRC_STYLES.some(s=>s[0]===q.get("src"))) SRCSTYLE=q.get("src");
  if(q.get("p")){
    const panels=decodeURIComponent(q.get("p")).split(";").map(chunk=>{
      const [sel,chart,trans,from,to,era,h,w,gran,ttl,lvl,asort]=chunk.split("~");
      /* old links stored the ribbon as 1/0 — map those onto the era modes */
      const eraMode = era==="1"?"pm" : era==="0"?"off" : (ERA_MODES.some(m=>m[0]===era)?era:"pm");
      return mkPanel((sel||"").split(",").filter(id=>S(id)),
        {chart:chart||"line",trans:trans||"index",from:+from||1997,to:+to||2026,
         era:eraMode,eraPrev:eraMode==="off"?"pm":eraMode,gran:(GRANS.some(g=>g[0]===gran)?gran:"years"),
         title:ttl?decodeURIComponent(ttl):null,
         lvl:lvl||"", asort:(AREA_SORTS.some(a=>a[0]===asort)?asort:"desc"),
         h:Math.max(H_MIN,Math.min(H_MAX,+h||H_DEF)),w:(W_SNAPS.includes(+w)?+w:12)});
    });
    if(panels.length) state.panels=panels;
  } else if(q.get("t")){                       /* topic deep-link from the homepage tiles */
    const topic=q.get("t");
    if(catalogue().some(s=>s.topics.includes(topic))) state.topic=topic;
  }
  state.active=Math.max(0,Math.min(+q.get("a")||0,state.panels.length-1));
}

/* sidebar collapse — persisted like the theme */
(function(){
  try{ if(localStorage.getItem("polyoptic-side")==="collapsed") document.body.classList.add("side-collapsed"); }catch(e){}
  const set=c=>{ document.body.classList.toggle("side-collapsed",c);
    try{ localStorage.setItem("polyoptic-side", c?"collapsed":"open"); }catch(e){} };
  document.getElementById("sideHide").onclick=()=>set(true);
  document.getElementById("sideHideTop").onclick=()=>set(true);
  document.getElementById("sideOpen").onclick=()=>set(false);
})();

const themeBtn=document.getElementById("themeBtn");
function syncThemeBtn(){
  const dark=document.documentElement.dataset.theme==="dark";
  /* the polyoptic eye: open when the lights are on, shut when they're off */
  themeBtn.innerHTML = dark?IC.eyeShut:IC.eyeOpen;
  themeBtn.title = dark ? "Switch to light mode" : "Switch to dark mode";
  themeBtn.setAttribute("aria-label", themeBtn.title);
}
themeBtn.onclick=()=>{
  const dark=document.documentElement.dataset.theme==="dark";
  if(dark) delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme="dark";
  try{ localStorage.setItem("polyoptic-theme", dark?"light":"dark"); }catch(e){}
  if(MODE!=="default") setMode("default");    /* light/dark is a different axis to mode */
  syncThemeBtn(); render();   /* charts re-render so lines pick up the theme palette */
};
syncThemeBtn();

/* ── mode switching ─────────────────────────────────────────────
   Modes have disjoint catalogues, so anything on a chart when you switch
   would be an id the new catalogue does not contain. Clear rather than
   half-render, and put the reason on screen. */
function applyThemeForMode(){
  const el=document.documentElement;
  if(MODE!=="default"){ el.dataset.theme="brexit"; return; }
  let dark=false; try{ dark=localStorage.getItem("polyoptic-theme")==="dark"; }catch(e){}
  if(dark) el.dataset.theme="dark"; else delete el.dataset.theme;
}
function setMode(next){
  if(next===MODE) return;
  MODE=next;
  try{ localStorage.setItem("polyoptic-mode", MODE); }catch(e){}
  state.panels=[]; state.active=0; state.topic="all"; state.q="";
  const box=document.getElementById("q"); if(box) box.value="";
  applyThemeForMode(); syncThemeBtn(); syncModeBtn(); render();
  /* TEMPORARY — see the party trick block below. Deliberately only on a real
     click: setMode is never called when the mode is restored from storage on
     load, so a reload doesn't start playing music at you. */
  /* the geezer lives in the same bottom-right corner as the guide */
  if(MODE==="brexit"){ closeGuide(false); playAnthem(); showGeezer(); }
  else { stopAnthem(); hideGeezer(); }
}
const modeBtn=document.getElementById("modeBtn");
function syncModeBtn(){
  const on=MODE!=="default";
  modeBtn.setAttribute("aria-pressed",String(on));
  modeBtn.title = on ? "Leave Brexit mode" : "";
  const bar=document.getElementById("modebar"), m=modeDef();
  bar.innerHTML = m
    ? `<b>${esc(m.name||MODE)}</b><span>${esc(m.blurb||"")}</span>
       <button id="modeOff">Back to the full catalogue</button>` : "";
  const off=document.getElementById("modeOff");
  if(off) off.onclick=()=>setMode("default");
}
modeBtn.onclick=()=>setMode(MODE==="default"?"brexit":"default");

/* ══════════════════════════════════════════════
   GETTING STARTED
   Shown once, on a first visit, then only when the reader asks for it from the
   header. The "seen" flag lives in localStorage rather than a cookie: nothing
   here is sent to a server, and a cookie would be a consent question we don't
   otherwise have to answer.
   ══════════════════════════════════════════════ */
const GUIDE_KEY="polyoptic-guide";
const gi=svg=>`<span class="gi">${svg}</span>`;
/* Each step points at ONE thing. `sel` is tried in order and the first match
   wins, so a step survives a chart type that doesn't draw its target. `setup`
   runs before the target is looked for — that is how the steps about the
   settings popover and the ⋯ menu can point inside something that has to be
   opened first. */
const GUIDE=[
  {t:"Every indicator, here", sel:["#cat"],
   li:[["",`The catalogue. Search or filter, then click to put an indicator on the chart you're editing — up to <b>four</b> at once. Click a selected one again to drop it.`]]},
  {t:"What's on this chart", sel:["#tray"],
   li:[["",`The indicators on the chart you're editing right now. The <span class="kbd">×</span> on each one removes it.`]]},
  {t:"Chart settings", sel:['.pcard [data-act="cfg"]'], setup:()=>{state.openCfg=null;},
   li:[[gi(IC.sliders),`Everything about how this chart looks lives behind this button — chart type, transforms, the year range and the width.`]]},
  {t:"Fourteen ways to draw it", sel:['.cfgpanel .ctgrid','.cfgpanel'],
   setup:()=>{const p=P0(); if(p) state.openCfg=p.key;},
   li:[["",`Lines, columns, slopes and small multiples under <b>Over time</b>. Under <b>By area</b>, the same indicator broken down to local authorities — a ranking, the change between two years, or a heatmap.`],
       ["",`Below these: transforms that rebase to 100, show year-on-year change, real terms, per person or % of GDP.`]]},
  {t:"Who was in power", sel:['.pcard [data-act="eratoggle"]'], setup:()=>{state.openCfg=null;},
   li:[[gi(IC.flag),`Puts a ribbon under the chart showing the governing party, with prime ministers or elections marked.`]]},
  {t:"Show the working", sel:['.pcard .workhint','.pcard .working','.pcard .hit'],
   li:[["",`Click any point on a chart and it shows you the published figure, the figure being plotted, and the arithmetic in between — with a link to the release it came from.`]]},
  {t:"Export and duplicate", sel:['.pcard [data-act="menu"]'], setup:()=>{const p=P0(); if(p) state.openMenu=p.key;},
   li:[[gi(IC.png),`Download the chart as a <b>PNG</b> or its numbers as a <b>CSV</b> — both carry their source attribution. Duplicate and remove live here too.`]]},
  {t:"Rename it", sel:['.pcard .ptitle'], setup:()=>{state.openMenu=null;},
   li:[[gi(IC.pen),`Click a chart's title to rename it. Your own title survives changing the indicators underneath it.`]]},
  {t:"Move, size and pin", sel:['.pcard .grip'],
   li:[[gi(IC.dup),`Drag this handle to reorder the stack. Drag a chart's <b>right</b> or <b>bottom</b> edge to resize it, and the padlock pins it so neither happens by accident.`]]},
  {t:"More charts", sel:["#addBottom"],
   li:[["",`Start a fresh chart. They stack down the page and each one keeps its own settings.`]]},
  {t:"Room to work", sel:["#sideHide"],
   li:[["",`Collapses the indicator panel and gives the charts the full width. The rail on the left edge brings it back.`]]},
  {t:"Where it all came from", sel:["#srcs"],
   li:[["",`Every source on the page, and a <b>Sourcing</b> setting that switches attribution between short, full Harvard citations, or off. It applies to the exports as well as the screen.`]]},
  {t:"Take it with you", sel:["#copyLink"],
   li:[["",`<b>Copy link</b> puts your whole layout in the URL — every chart, transform and year range. The eye beside it switches light and dark, and <span class="kbd">?</span> reopens this tour.`]]},

let gAt=0;
const gEl=document.getElementById("guide");
const gSpot=document.getElementById("gspot");
const gArrow=document.getElementById("garrow");
const gArrowP=document.getElementById("garrowp");
let gTarget=null;

/* Below this width there is nowhere to stand beside anything, so the card goes
   back to being a card in the corner. */
const gRoomy=()=>innerWidth>=820;

function gFind(sels){
  for(const s of (sels||[])){ const el=document.querySelector(s); if(el) return el; }
  return null;
}

/* Card first, then ring, then arrow — each needs the one before it measured. */
function gPlace(){
  if(!gTarget||!gTarget.isConnected||!gRoomy()){
    gEl.classList.remove("anchored");
    gEl.style.left=gEl.style.top="";
    gSpot.classList.remove("on"); gArrow.classList.remove("on");
    return;
  }
  const t=gTarget.getBoundingClientRect();
  if(t.width===0&&t.height===0){ gSpot.classList.remove("on"); gArrow.classList.remove("on"); return; }

  const PAD=6;
  gSpot.style.left=(t.left-PAD)+"px"; gSpot.style.top=(t.top-PAD)+"px";
  gSpot.style.width=(t.width+PAD*2)+"px"; gSpot.style.height=(t.height+PAD*2)+"px";
  gSpot.classList.add("on");

  gEl.classList.add("anchored");
  const c=gEl.getBoundingClientRect(), GAP=34, M=14, vw=innerWidth, vh=innerHeight;
  const spots=[
    {k:"right",x:t.right+GAP,               y:t.top+t.height/2-c.height/2},
    {k:"left", x:t.left-GAP-c.width,        y:t.top+t.height/2-c.height/2},
    {k:"below",x:t.left+t.width/2-c.width/2,y:t.bottom+GAP},
    {k:"above",x:t.left+t.width/2-c.width/2,y:t.top-GAP-c.height},
  ];
  const fits=s=>s.x>=M&&s.y>=M&&s.x+c.width<=vw-M&&s.y+c.height<=vh-M;
  /* Fall back to whichever placement overflows least rather than to a fixed
     side — on a short window "below" can be the only survivor. */
  const over=s=>Math.max(0,M-s.x)+Math.max(0,M-s.y)+
                Math.max(0,s.x+c.width-(vw-M))+Math.max(0,s.y+c.height-(vh-M));
  const pick=spots.find(fits)||spots.reduce((a,b)=>over(a)<=over(b)?a:b);
  const x=Math.max(M,Math.min(pick.x,vw-M-c.width));
  const y=Math.max(M,Math.min(pick.y,vh-M-c.height));
  gEl.style.left=x+"px"; gEl.style.top=y+"px";

  /* Arrow from the card's edge to the ring, bowed slightly so it reads as a
     pointer rather than a table rule. */
  const cx=x+c.width/2, cy=y+c.height/2;
  const tx=t.left+t.width/2, ty=t.top+t.height/2;
  const dx=tx-cx, dy=ty-cy, len=Math.hypot(dx,dy)||1;
  const ux=dx/len, uy=dy/len;
  const sx=cx+ux*Math.min(c.width/2+6,len/2), sy=cy+uy*Math.min(c.height/2+6,len/2);
  const ex=tx-ux*(Math.min(t.width,120)/2+PAD+11), ey=ty-uy*(Math.min(t.height,80)/2+PAD+11);
  const mx2=(sx+ex)/2-uy*22, my2=(sy+ey)/2+ux*22;   /* perpendicular bow */
  const ah=Math.atan2(ey-my2,ex-mx2), A=9;
  gArrowP.setAttribute("d",
    `M${sx.toFixed(1)} ${sy.toFixed(1)} Q${mx2.toFixed(1)} ${my2.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}`+
    ` M${(ex-A*Math.cos(ah-0.42)).toFixed(1)} ${(ey-A*Math.sin(ah-0.42)).toFixed(1)}`+
    ` L${ex.toFixed(1)} ${ey.toFixed(1)}`+
    ` L${(ex-A*Math.cos(ah+0.42)).toFixed(1)} ${(ey-A*Math.sin(ah+0.42)).toFixed(1)}`);
  gArrow.classList.add("on");
}

function drawGuide(){
  const s=GUIDE[gAt];
  if(s.setup){ s.setup(); render(); }
  document.getElementById("gstep").textContent=`${gAt+1} of ${GUIDE.length}`;
  document.getElementById("gbody").innerHTML=
    `<h3>${s.t}</h3><ul>${s.li.map(([icon,txt])=>`<li>${icon||'<span class="gi"></span>'}<span>${txt}</span></li>`).join("")}</ul>`;
  document.getElementById("gdots").innerHTML=
    GUIDE.map((_,i)=>`<i class="${i===gAt?"on":""}" data-g="${i}" title="Step ${i+1}"></i>`).join("");
  document.getElementById("gback").disabled=gAt===0;
  document.getElementById("gnext").textContent=gAt===GUIDE.length-1?"Got it":"Next";
  document.querySelectorAll("#gdots i").forEach(d=>d.onclick=()=>{gAt=+d.dataset.g;drawGuide();});

  gTarget=gRoomy()?gFind(s.sel):null;
  if(gTarget){
    const r=gTarget.getBoundingClientRect();
    /* Bring the target into view first; the scroll handler re-places the card
       as it moves, so there is no wait-then-guess. */
    if(r.top<70||r.bottom>innerHeight-70)
      gTarget.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});
  }
  gPlace();
}
const gReflow=()=>{ if(gEl.classList.contains("on")) gPlace(); };
addEventListener("scroll",gReflow,{passive:true});
addEventListener("resize",gReflow);
function openGuide(at){ gAt=at||0; gEl.hidden=false; gEl.classList.add("on"); drawGuide(); }
/* hoisted, so setMode can call it regardless of where it sits in the file */
function closeGuide(remember){
  gEl.classList.remove("on","anchored"); gEl.hidden=true;
  gEl.style.left=gEl.style.top="";
  gSpot.classList.remove("on"); gArrow.classList.remove("on"); gTarget=null;
  /* The tour opens popovers to point inside them; leaving one open after it
     ends would look like the page had been left mid-click. */
  if(state.openCfg!==null||state.openMenu!==null){ state.openCfg=null; state.openMenu=null; render(); }
  if(remember){ try{ localStorage.setItem(GUIDE_KEY,"seen"); }catch(e){} }
}
document.getElementById("gclose").onclick=()=>closeGuide(true);
document.getElementById("gback").onclick =()=>{ if(gAt>0){ gAt--; drawGuide(); } };
document.getElementById("gnext").onclick =()=>{
  if(gAt<GUIDE.length-1){ gAt++; drawGuide(); } else closeGuide(true);
};
document.getElementById("helpBtn").onclick=()=>
  gEl.classList.contains("on")?closeGuide(true):openGuide(0);
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&gEl.classList.contains("on")) closeGuide(true);
});
/* first visit only — and never on top of a mode that owns this same corner */
(function(){
  let seen=true;
  try{ seen=localStorage.getItem(GUIDE_KEY)==="seen"; }catch(e){}
  if(!seen && MODE==="default") openGuide(0);
})();

/* ══════════════════════════════════════════════
   TEMPORARY — Brexit mode party trick
   Delete this block and its two calls in setMode() to remove.

   The tune is Parry's setting of 1916, which is public domain, and it is
   SYNTHESISED rather than played from a file: any actual recording carries
   its own separate copyright, and the site loads no external assets anyway.
   ══════════════════════════════════════════════ */

/* Reconstructed by ear, so treat it as a first draft — the shape and key are
   right, individual intervals may not be. It is a plain array: fix it here. */
const TUNE=[["A4",1],["D5",1],["D5",1],["F#5",1],["F#5",1],["E5",1],["D5",1],["B4",2],
            ["E5",1],["E5",1],["A5",1],["G5",1],["F#5",1],["E5",1],["D5",3]];
const BEAT=0.62;                                   /* stately, as it should be */

const freq=n=>{
  const step={C:0,D:2,E:4,F:5,G:7,A:9,B:11}, m=/^([A-G])(#|b)?(\d)$/.exec(n);
  if(!m) return 0;
  const semi=step[m[1]]+(m[2]==="#"?1:m[2]==="b"?-1:0)+(+m[3]+1)*12;
  return 440*Math.pow(2,(semi-69)/12);
};

let AC=null, anthem=null;
function playAnthem(){
  stopAnthem();
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    AC.resume();
  }catch(e){ return; }                             /* no audio, no problem */

  const out=AC.createGain(); out.gain.value=.16; out.connect(AC.destination);
  anthem={gain:out, nodes:[]};
  let t=AC.currentTime+.08;

  for(const [note,beats] of TUNE){
    const dur=beats*BEAT, f=freq(note);
    /* two oscillators an octave apart reads as vaguely organ-ish, which is
       as close to a parish church as an oscillator is going to get */
    for(const [type,mult,level] of [["triangle",1,.7],["sine",2,.22],["sine",.5,.35]]){
      const o=AC.createOscillator(), g=AC.createGain();
      o.type=type; o.frequency.value=f*mult;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(level,t+.06);
      g.gain.setValueAtTime(level,t+dur*.75);
      g.gain.linearRampToValueAtTime(0,t+dur*.98);
      o.connect(g); g.connect(out); o.start(t); o.stop(t+dur);
      anthem.nodes.push(o);
    }
    t+=dur;
  }
}
function stopAnthem(){
  if(!anthem) return;
  const {gain,nodes}=anthem; anthem=null;
  try{                                             /* fade, don't clip */
    gain.gain.cancelScheduledValues(AC.currentTime);
    gain.gain.setValueAtTime(gain.gain.value,AC.currentTime);
    gain.gain.linearRampToValueAtTime(0,AC.currentTime+.25);
    nodes.forEach(o=>{ try{ o.stop(AC.currentTime+.3); }catch(e){} });
  }catch(e){}
}
addEventListener("pagehide",stopAnthem);
document.addEventListener("visibilitychange",()=>{ if(document.hidden) stopAnthem(); });

let geezerTimer=null;
function showGeezer(){
  document.getElementById("geezer")?.remove();
  clearTimeout(geezerTimer);
  const el=document.createElement("div");
  el.id="geezer"; el.className="geezer"; el.innerHTML=GEEZER;
  document.body.appendChild(el);
  geezerTimer=setTimeout(()=>{
    el.classList.add("out");
    setTimeout(()=>el.remove(),800);
  },2600);

/* no-cache means revalidate, not refetch — the browser still sends the ETag,
   so this costs a 304 and stops a rebuilt bundle sitting invisible behind a
   cached copy. */
fetch("data/bundle.json",{cache:"no-cache"}).then(r=>r.ok?r.json():Promise.reject()).then(d=>{DB=d;})
  .catch(()=>{}).finally(()=>{
    /* a stored mode the bundle no longer defines must not strand the catalogue */
    if(MODE!=="default" && !modeDef()) MODE="default";
    applyThemeForMode(); syncThemeBtn(); syncModeBtn();
    readHash(); render();
  });
