/* ── sourcing style ─────────────────────────────────────────────
   Each chart has one setting for how attribution is rendered (p.src), applied
   in every place that chart's sources appear: its footer, the provenance
   panel while it is the active chart, its CSV header and its PNG credit. A
   chart whose footer disagrees with its own export is worse than either.

   `off` strips attribution from the exports too, which is a deliberate
   choice by the site owner. OGL v3.0 asks for an attribution statement
   when you redistribute, so an exported chart with no source line is on
   whoever publishes it.

   The author is `publisher_full` from the bundle, not `source`: `source` is
   a release name, and "ONS Index of Private Housing Rental Prices (2026)"
   would be citing a title as if it were an author. */

const ukDate=iso=>{ const d=new Date(iso||""); return isNaN(d)?"" :
  d.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"}); };

/* Harvard for a continuously-revised online dataset. The year is the
   version consulted — the fetch year — unless the series declares a real
   edition year in `published`, which is why the pipeline never guesses it. */
function citeHarvard(m){
  const author=m.publisher_full||m.publisher||m.source||"Unknown";
  const year=m.published||String(m.fetched||"").slice(0,4)||"n.d.";
  const url=m.source_url||m.source_api||"";
  const acc=ukDate(m.fetched);
  let out=`${author} (${year}) ${m.name}`;
  if(!/[.?!]$/.test(out)) out+=".";
  if(url) out+=` Available at: ${url}`;
  if(acc) out+=` (Accessed: ${acc}).`;
  else if(url) out+=".";
  return out;
}

/* The attribution lines for a style: none when off, one compact line when
   short, one full citation per series when Harvard. Every series a chart draws
   on counts, including the denominator of a "relative to" chart. */
const metasOf=sets=>[...new Set(sets.flatMap(s=>s.metas||[s.meta]))];
function srcLines(sets,style){
  if(style==="off"||!sets.length) return [];
  const ms=metasOf(sets);
  if(style==="harvard") return ms.map(citeHarvard);
  return [[...new Set(ms.map(m=>m.source))].join("; ")];
}

/* ── transforms ── */
const applies=(t,s)=>(t==="real"||t==="percap"||t==="pctgdp") ? (s.kind==="money_cash"||s.kind==="count") : true;

/* Annual values expanded to the panel's granularity with a smooth
   (Catmull-Rom) interpolation. No invented noise — the finer points are
   estimates between real annual figures, and a warning says so on screen. */
const _h=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;};
const _rng=seed=>{let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let x=Math.imul(a^(a>>>15),1|a);x=(x+Math.imul(x^(x>>>7),61|x))^x;return((x^(x>>>14))>>>0)/4294967296;};};
const _ptsCache=new Map();
function seriesPts(s, gran){
  const per = GRAN_PER[gran] || 1;
  if(per===1) return yearsOf(s).map((y,i)=>[y, s.values[i]]);
  const ck=s.id+"|"+gran;
  if(_ptsCache.has(ck)) return _ptsCache.get(ck);
  /* Smooth interpolation between the annual figures, plus a small
     deterministic walk + seasonal cycle so sub-annual views show plausible
     structure instead of a suspiciously perfect curve. Same shape on every
     load, and the on-screen warning says this detail is illustrative. */
  const n=s.values.length, pts=[], rand=_rng(_h(s.id));
  const vals=s.values.filter(v=>v!=null);
  const vol=(Math.max(...vals)-Math.min(...vals))*0.011;
  let walk=0;
  for(let i=0;i<=(n-1)*per;i++){
    const pos=i/per, i0=Math.min(Math.floor(pos), n-2), f=pos-i0;
    const p0=s.values[Math.max(i0-1,0)], p1=s.values[i0], p2=s.values[i0+1], p3=s.values[Math.min(i0+2,n-1)];
    const base = p1 + 0.5*f*((p2-p0) + f*(2*p0-5*p1+4*p2-p3 + f*(3*(p1-p2)+p3-p0)));
    walk = walk*0.85 + (rand()-0.5)*vol;
    const seasonal = Math.sin(pos*Math.PI*2 + _h(s.id)%7) * vol * (per>=365?0.5:0.85);
    pts.push([+(s.start+pos).toFixed(4), base + walk + seasonal]);   /* rounded key so series align across different start years */
  }
  _ptsCache.set(ck, pts);
  return pts;
}

function transform(s,p){
  const t=p.trans==="rel"?"index":p.trans, per=GRAN_PER[p.gran]||1;
  let pts = seriesPts(s, p.gran);
  if(t==="real"&&applies(t,s)){const base=refAt("deflator",2024);
    pts=pts.map(([y,v])=>{const d=refAt("deflator",Math.floor(y));return [y,d?v*base/d:null];});}
  if(t==="percap"&&applies(t,s)) pts=pts.map(([y,v])=>{const q=refAt("population",Math.floor(y));return [y,q?v/q:null];});
  if(t==="pctgdp"&&applies(t,s)) pts=pts.map(([y,v])=>{const g=refAt("gdp",Math.floor(y));return [y,g?v/g*100:null];});
  if(t==="yoy") pts=pts.map(([y,v],i)=>i<per?[y,null]:[y,pts[i-per][1]?(v/pts[i-per][1]-1)*100:null]);
  if(t==="roll3") pts=pts.map(([y,_],i)=>{const w=pts.slice(Math.max(0,i-(3*per-1)),i+1).map(q=>q[1]).filter(v=>v!=null);
    return [y,w.length?w.reduce((a,b)=>a+b,0)/w.length:null];});
  if(t==="index"){
    /* One base for the whole panel, not one per series. Basing each series on
       its own first available year silently rebases two lines to years that
       can be a decade apart, and then labels them with a third — which is
       exactly the incomparability rebasing is supposed to remove. */
    const base=indexBase(p);
    const b = base!=null ? pts.find(q=>q[0]>=base&&q[1]!=null)
                         : pts.find(q=>q[0]>=p.from&&q[1]!=null);
    if(b) pts=pts.map(([y,v])=>[y,v!=null?v/b[1]*100:null]);
  }
  return pts.filter(q=>q[0]>=p.from&&q[0]<=p.to);
}

/* The earliest period at or after `from` where EVERY selected series has a
   value — the only year they can all honestly be set to 100 at. null when
   they never overlap, which the panel warns about rather than papering over. */
function indexBase(p){
  const ids=(p.sel||[]).filter(id=>S(id));
  if(!ids.length) return null;
  let base=-Infinity;
  for(const id of ids){
    const first=seriesPts(S(id),p.gran).find(q=>q[0]>=p.from&&q[1]!=null);
    if(!first) return null;
    if(first[0]>base) base=first[0];
  }
  return base>p.to ? null : base;
}

function unitLabel(s,p){
  const t=p.trans;
  if(t==="index"||t==="rel"){ const b=indexBase(p); return `index, ${b==null?p.from:Math.floor(b)}=100`; }
  if(t==="yoy") return "% change on year";
  if(t==="real"&&applies(t,s)) return s.unit.replace(/,?\s*cash/,"")+", 2024 prices";
  if(t==="percap"&&applies(t,s)) return s.unit+" per person";
  if(t==="pctgdp"&&applies(t,s)) return "% of GDP";
  return s.unit;
}

/* ── show your working ──────────────────────────────────────────
   Click a point and get the published figure, the figure on the chart, and
   the arithmetic between them. The site's argument is that official numbers
   should be checkable; the moment someone wants to check one is while they
   are looking at it, not on a separate page.

   Everything below MIRRORS transform() above. If a transform changes there,
   it changes here — a working panel that describes an operation the chart did
   not perform would be worse than no panel at all. */

const REF_META={
  gdp:       {name:"Nominal GDP",   note:"nominal GDP"},
  population:{name:"UK population", note:"mid-year population estimate"},
  deflator:  {name:"GDP deflator",  note:"GDP deflator, 2024 = base"},
};
const refCdid=k=>{
  const m=((DB.refs||{})[k]||{}).source_api?.match(/timeseries\/([a-z0-9]+)\//i);
  return m?m[1].toUpperCase():"";
};
const refHref=k=>(((DB.refs||{})[k]||{}).source_api||"").replace(/\/data$/,"");

/* The published figure, the plotted figure, and the steps between. Returns
   null when the point is no longer on the chart, so a stale probe just
   disappears rather than describing a value nobody can see. */
function working(p,set,xk){
  if(set.metas) return null;    /* a ratio line — its working is in Check the numbers */
  const s=set.meta, t=p.trans, per=GRAN_PER[p.gran]||1;
  const raw=seriesPts(s,p.gran);
  const i=raw.findIndex(q=>q[0]===xk);
  if(i<0) return null;
  const shownPt=transform(s,p).find(q=>q[0]===xk);
  if(!shownPt) return null;

  const year=Math.floor(xk), pub=raw[i][1], shown=shownPt[1];
  const skipped=(t==="real"||t==="percap"||t==="pctgdp")&&!applies(t,s);
  const step={};

  if(t==="index"){
    const base=indexBase(p);
    const b=raw.find(q=>q[0]>=(base??p.from)&&q[1]!=null);
    if(b&&pub!=null) step.op=`${vfmt(pub)} ÷ ${vfmt(b[1])} × 100`,
                     step.why=`rebased on the ${Math.floor(b[0])} figure`,
                     step.mid=["÷",`${vfmt(b[1])} × 100`], step.cap=`its ${Math.floor(b[0])} value, set to 100`,
                     step.rows=[[`÷ the ${Math.floor(b[0])} figure, × 100`,vfmt(b[1])]];
  } else if(t==="yoy"){
    const prev=raw[i-per];
    if(prev&&prev[1]!=null&&pub!=null)
      step.op=`(${vfmt(pub)} − ${vfmt(prev[1])}) ÷ ${vfmt(prev[1])} × 100`,
      step.why=`against ${Math.floor(prev[0])}`,
      step.mid=["vs",vfmt(prev[1])], step.cap=`the ${Math.floor(prev[0])} value; % change`,
      step.rows=[[`against ${Math.floor(prev[0])}, as a % change`,vfmt(prev[1])]];
  } else if(t==="roll3"){
    const w=raw.slice(Math.max(0,i-(3*per-1)),i+1).filter(q=>q[1]!=null);
    if(w.length) step.op=`mean of ${w.length} ${w.length===1?"point":"points"}, ${Math.floor(w[0][0])}–${year}`,
      step.mid=["→",`mean of ${w.map(q=>vfmt(q[1])).join(", ")}`], step.cap=`${Math.floor(w[0][0])}–${year}`,
      step.rows=w.slice(0,-1).map(q=>[`averaged with ${Math.floor(q[0])}`,vfmt(q[1])]);
  } else if(!skipped&&t==="real"){
    const b=refAt("deflator",2024), d=refAt("deflator",year);
    if(b&&d&&pub!=null) step.op=`${vfmt(pub)} × (${vfmt(b)} ÷ ${vfmt(d)})`, step.ref="deflator",
      step.mid=["×",`${vfmt(b)} ÷ ${vfmt(d)}`], step.cap=`GDP deflator, 2024 ÷ ${year}`,
      step.rows=[[`× inflation, ${year} to 2024`,(b/d).toFixed(3)]];
  } else if(!skipped&&t==="percap"){
    const q=refAt("population",year);
    if(q&&pub!=null) step.op=`${vfmt(pub)} ÷ ${vfmt(q)}`, step.ref="population",
      step.mid=["÷",vfmt(q)], step.cap=`UK population, ${year}`,
      step.rows=[[`÷ UK population, ${year}`,vfmt(q)]];
  } else if(!skipped&&t==="pctgdp"){
    const gv=refAt("gdp",year);
    if(gv&&pub!=null) step.op=`${vfmt(pub)} ÷ ${vfmt(gv)} × 100`, step.ref="gdp",
      step.mid=["÷",`${vfmt(gv)} × 100`], step.cap=`nominal GDP, ${year}`,
      step.rows=[[`÷ GDP in ${year}, × 100`,vfmt(gv)]];
  }
  return {year, xk, pub, shown, step, skipped,
          interpolated: per!==1 && Math.abs(xk-year)>1e-9,
          unitShown: unitLabel(s,p), unitPub: s.unit, s};
}

function workingHtml(p,sets){
  const pr=state.probe;
  if(!pr||pr.key!==p.key) return "";
  const set=sets.find(x=>x.id===pr.id);
  if(!set) return "";

  /* The area views apply no transform at all, so their "working" is the
     shorter and more important statement: this is the published figure. */
  if(AREA_CHARTS.has(p.chart)){
    const code=pr.code, ix=AREAIX, d=AREADATA.get(set.id);
    if(!code||!ix||ix==="error"||!d||d==="error"||!d.values[code]) return "";
    /* the area's own level: on the council map a shire county sits beside
       the unitaries, and is ranked against the other counties */
    const lvl=(ix.areas[code]||{}).l||areaLevel(p,set.id);
    const s=set.meta, lvlName=((ix.levelNames||{})[lvl]||lvl);
    const src=`As published — the area views apply no transform. ${esc(s.source)}${s.source_url?` · <a href="${esc(s.source_url)}" target="_blank" rel="noopener">Source release ↗</a>`:""}${
        d.source_api?` · <a href="${esc(d.source_api)}" target="_blank" rel="noopener">API ↗</a>`:""} · <a href="data/areas/${esc(set.id)}.json">Local figures ↗</a>`;
    let sum, cap;
    if(p.chart==="arrow"||p.chart==="range"){
      /* Read the years back out of the data rather than carrying them on the
         mark, so the card follows the chart when the range or level moves. */
      const {y0,y1}=areaPair(p,d,ix,lvl), a=d.values[code][y0-d.start], b=d.values[code][y1-d.start];
      if(a==null||b==null) return "";
      const ch=b-a, pc=a?ch/Math.abs(a)*100:null;
      sum=cell(vfmt(a),String(y0))+opc("→")+cell(vfmt(b),String(y1))+opc("=")+
          cell(`${ch>=0?"+":"−"}${vfmt(Math.abs(ch))}`,pc==null?"change":`change, ${pc>=0?"+":"−"}${Math.abs(pc).toFixed(1)}%`,"wout");
      cap=esc(s.unit);
    } else {
      const {year,map}=areaYear(d,ix,lvl,p.to), v=map[code];
      if(v==null) return "";
      const ranked=Object.entries(map).sort((x,y)=>y[1]-x[1]), n=ranked.length;
      const rank=ranked.findIndex(r=>r[0]===code)+1;
      const vals=ranked.map(r=>r[1]), count=areaIsCount(set,d,year,vals);
      const natCode=["K02000001","E92000001","K03000001"].find(c=>d.values[c]&&d.values[c][year-d.start]!=null);
      const ref=count?median(vals):natCode?d.values[natCode][year-d.start]:null;
      const refName=count?"the typical area":(ix.areas[natCode]||{}).n||"national";
      const ord=k=>k+(["th","st","nd","rd"][((k%100)-20)%10]||["th","st","nd","rd"][k%100]||"th");
      sum=cell(vfmt(v),`${year}, ${esc(s.unit)}`,"wout")+
          cell(ord(rank),`of ${n} ${esc(lvlName.toLowerCase())}, highest first`)+
          (ref!=null?cell(`${v-ref>=0?"+":"−"}${vfmt(Math.abs(v-ref))}`,`against ${esc(refName)}, ${vfmt(ref)}`):"");
      cap="";
    }
    return `<div class="working warea"><button class="wx" data-act="unprobe" title="Close" aria-label="Close working">×</button>
      <div class="wyear">${esc(areaName(ix,code))}<span>${esc(lvlName)} · ${esc(code)}</span></div>
      <div class="wblk"><div class="wname"><span class="wdot" style="background:${set.colour}"></span>${esc(set.name)}</div>
      <div class="wsum">${sum}</div>${cap?`<div class="wcap">${cap}</div>`:""}<div class="wsrc">${src}</div></div>
    </div>`;
  }

  return "";
}

/* The working for a whole year: one block per series, so lines that are
   being compared are checked together. A "relative to" line shows the two
   rebased figures it divides. */
/* The working for a whole year, drawn as a sum rather than a sentence: for
   each series, the published figure, the step applied to it, and the figure
   on the chart, each number with a short label underneath. The source links
   sit quietly below. A "relative to" line divides the two rebased figures. */
const cell=(v,cap,cls="")=>`<div class="wc ${cls}"><b>${v}</b><span>${cap}</span></div>`;
const opc=t=>`<div class="wo">${t}</div>`;
function yearWorkingHtml(p,sets){
  const pr=state.probe;
  if(!pr||pr.key!==p.key||pr.code||pr.x==null) return "";
  const year=Math.floor(pr.x);
  const link=(m,label)=>[m.source_url?`<a href="${esc(m.source_url)}" target="_blank" rel="noopener" title="${esc(m.source)}">${label||esc(m.source)} ↗</a>`:esc(m.source),
    m.source_api?`<a href="${esc(m.source_api)}" target="_blank" rel="noopener">API ↗</a>`:""].filter(Boolean).join(" · ");
  /* Each line's working reads like a receipt: the published figure, the
     step applied to it, and the number on the chart, in that line's colour.
     How the year was made and the source links share one quiet line. */
  const row=(label,v,cls="")=>`<div class="wr ${cls}"><span>${label}</span><b>${v}</b></div>`;
  const srcLine=(bits,m)=>`<div class="wsrc">${[...bits,link(m,"Source")].filter(Boolean).join(" · ")}</div>`;
  const blocks=sets.map(set=>{
    const head=`<div class="wname"><span class="wdot" style="background:${set.colour}"></span><span>${esc(set.name)}</span></div>`;
    if(set.metas){
      const [m0,m1]=set.metas, ip={...p,trans:"index"};
      const at=m=>{const q=transform(m,ip).find(q=>q[0]===pr.x); return q?q[1]:null;};
      const v=(set.pts.find(q=>q[0]===pr.x)||[])[1], a=at(m0), b=at(m1);
      if(v==null) return "";
      const by=indexBase(p), byl=by==null?"first year":Math.floor(by);
      return `<div class="wblk" style="--c:${set.colour}">${head}<div class="wrows">
        ${row(`${esc(m0.name)}, ${byl} = 100`,vfmt(a))}
        ${row(`÷ ${esc(m1.name)}, ${byl} = 100, × 100`,vfmt(b))}
        ${row("On the chart",vfmt(v),"wtot")}</div>
        <div class="wsrc">${link(m0,"Source")} · ${link(m1,"Source")}</div></div>`;
    }
    const w=working(p,set,pr.x);
    if(!w) return "";
    const s=set.meta;
    const steps=w.step.rows||[];
    const rows = steps.length
      ? row(`Published<i>${esc(w.unitPub)}</i>`,vfmt(w.pub))+steps.map(([l,v])=>row(esc(l),v)).join("")+
        row("On the chart",vfmt(w.shown),"wtot")
      : row(`Published, plotted as is<i>${esc(w.unitPub)}</i>`,vfmt(w.shown),"wtot");
    const ref=w.step.ref&&refHref(w.step.ref)?`<a href="${esc(refHref(w.step.ref))}" target="_blank" rel="noopener" title="${esc(REF_META[w.step.ref].name)}">${w.step.ref==="deflator"?"Deflator":w.step.ref==="gdp"?"GDP":"Population"} ↗</a>`:"";
    const warn=[];
    if(w.skipped) warn.push(`Not adjusted: ${esc(s.name)} is already a rate or index, so this is the published figure.`);
    if(w.interpolated) warn.push(`Between two annual figures — estimated for the ${esc(p.gran)} view, not published.`);
    /* how this year's figure was made from a monthly or quarterly source */
    let how="";
    if(s.annual){ const a=s.annual, per=a.per===12?"monthly":"quarterly",
        endM={financial:"March",academic:"August"}[s.year_basis]||"December";
      how=a.how==="mean"?`Average of the ${per} figures`:
          a.how==="sum"?`Total of the ${per} figures`:
          a.how==="last"?(a.per===12?`The ${endM} figure`:"The last quarter"):""; }
    return `<div class="wblk" style="--c:${set.colour}">${head}<div class="wrows">${rows}</div>
      ${warn.map(n=>`<div class="wnote">${n}</div>`).join("")}
      ${srcLine([how,ref],s)}</div>`;
  }).filter(Boolean);
  if(!blocks.length) return "";
  const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"], fr=pr.x-year;
  const label=p.gran==="quarters"?`${year} Q${Math.round(fr*4)+1}`
            : p.gran==="months"?`${MON[Math.round(fr*12)%12]} ${year}`
            : p.gran==="days"?`${year}, day ${Math.round(fr*365)+1}`
            : String(year);
  return `<div class="working"><button class="wx" data-act="unprobe" title="Close" aria-label="Close working">×</button>
    <div class="wyear">${label} <span>the working behind each line</span></div><div class="wblks">${blocks.join("")}</div></div>`;
}

/* Charts that show the working. The time charts take a click anywhere and
   pick the nearest period, drawing a line down the chart there; the area
   views take a click on a row. */
const YEARPICK=new Set(["line","step","dots","area","gap","bar","stack","colstack"]);
const PROBEABLE=new Set([...YEARPICK,"map","areas","arrow","range","heat"]);

/* ══════════════════════════════════════════════
   CHART ENGINE — height comes from the panel
   ══════════════════════════════════════════════ */
/* Margins depend on what the chart carries (see setLayout), so M is set per
   panel before its chart is drawn. */
/* W is the drawing width. On a phone the chart is drawn narrower, so it is
   not a 940-wide picture shrunk to a strip: text stays readable and the chart
   keeps its height. It is set before every render (see chartWidth). */
let W=940;
const M={t:26,r:66,b:26,l:58};
const chartWidth=()=>{ W=innerWidth<=760?Math.max(420,Math.min(940,Math.round((innerWidth-32)*1.3))):940; };
const M0={...M};
const px=(p,y)=>M.l+((y-p.from)/Math.max(1,p.to-p.from))*(W-M.l-M.r);
function scale(vals){
  const v=vals.filter(x=>x!=null);
  if(!v.length) return [0,1];
  let a=Math.min(...v),b=Math.max(...v);
  if(a===b){a-=1;b+=1;}
  const pad=(b-a)*0.12; return [a-pad,b+pad];
}
/* Two decimals is right down to about 0.01 and wrong below it: a per-person
   figure off a £m series is genuinely 0.00066, and rendering that as "0.00"
   turns a real number into an apparent zero — on the axis as well as here. */
const fmt=n=>n==null?"–":Math.abs(n)>=1000?n.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,","):
             Math.abs(n)>=100?n.toFixed(0):Math.abs(n)>=10?n.toFixed(1):
             (n!==0&&Math.abs(n)<0.01)?(+n.toPrecision(3)).toString():n.toFixed(2);

/* Ticks a person would have chosen — the standard 1-2-5 step. Used by the
   small multiples; the main charts use yAxis below, which also snaps the
   domain to whole steps. */
const fmtTick=v=>fmt(v).replace(/\.0+$/,"");
function niceTicks(mn,mx,want=5){
  if(!(mx>mn)) return [mn];
  const raw=(mx-mn)/Math.max(1,want-1);
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const n=raw/mag;
  const step=(n<1.5?1:n<3?2:n<7?5:10)*mag;
  const out=[];
  for(let v=Math.ceil(mn/step)*step; v<=mx+step*1e-9; v+=step) out.push(+v.toPrecision(12));
  return out.length?out:[mn,mx];
}

/* Line-type charts name each series at its end instead of in a legend */
const LINEISH=["line","step","dots","area","gap"];
const isLineish=p=>LINEISH.includes(p.chart);
const BANDED=new Set(["line","step","dots","area","gap","bar","stack","colstack"]);

/* End labels need a right gutter wide enough for the longest name; government
   bands need room above the plot for prime ministers' names. Set once per
   panel, before its chart is drawn. */
function setLayout(p,sets){
  Object.assign(M,M0);
  if(isLineish(p)&&sets.length) M.r=CK.gutterFor(sets.map(s=>s.name),M0.r);
  if(p.era==="bands"&&BANDED.has(p.chart)) M.t+=CK.BANDS_TOP;
  /* key events: one or two rows of names above the plot, laid out now so the
     margin fits them */
  evItems=null;
  if(p.ev==="marks"&&BANDED.has(p.chart)){
    evItems=CK.eventLayout({x0:p.from,x1:p.to,sx:y=>px(p,y),l:M.l,r:W-M.r});
    evLblBot=M.t-(p.era==="bands"?CK.BANDS_TOP:0)-4;
    const rows=CK.eventRows(evItems);
    M.t+=rows*CK.EVENTS_ROW;
    evLblBot+=rows*CK.EVENTS_ROW;
  }
}
let evItems=null, evLblBot=0;

/* The drawing rules are shared with the homepage — see chartkit.js. These
   wrappers give them the panel's own scale. */
const yAxis=(vals,p,incl)=>CK.yAxis(vals,p.h-M.t-M.b,incl);
const yOf=(p,ax)=>v=>M.t+(1-(v-ax.mn)/(ax.mx-ax.mn))*(p.h-M.t-M.b);

const frame=(p,g,ax,label,base)=>CK.frame({g,ax,Y:yOf(p,ax),x0:p.from,x1:p.to,sx:y=>px(p,y),
  l:M.l,r:W-M.r,H:p.h,label,base});
/* The time charts carry their x scale on the element, so a click anywhere can
   be turned back into a period. The chosen period gets a line down the chart
   and a marker on each series (drawn by the chart); a fainter line follows the
   pointer so it is clear which period a click will pick. */
const wrapSvg=(p,g)=>{
  const pick=YEARPICK.has(p.chart);
  if(!pick) return `<svg viewBox="0 0 ${W} ${p.h}" style="width:100%;height:auto;overflow:visible" role="img" aria-label="Chart">${g.join("")}</svg>`;
  const pr=state.probe;
  if(pr&&pr.key===p.key&&pr.x!=null&&!pr.code&&pr.x>=p.from&&pr.x<=p.to){
    const x=px(p,pr.x).toFixed(1);
    /* under the series, so the markers the chart drew sit on top of it */
    g.unshift(`<line class="probeline" x1="${x}" y1="${M.t-2}" x2="${x}" y2="${p.h-M.b}"/>`);
  }
  g.unshift(`<line class="hovline" x1="0" y1="${M.t}" x2="0" y2="${p.h-M.b}"/>`);
  return `<svg class="pickable" data-act="pick" data-l="${M.l}" data-r="${M.r}" data-from="${p.from}" data-to="${p.to}" data-per="${GRAN_PER[p.gran]||1}"
    viewBox="0 0 ${W} ${p.h}" style="width:100%;height:auto;overflow:visible" role="img" aria-label="Chart">${g.join("")}</svg>`;
};

function bandsLayer(p,g){
  if(p.era==="bands")
    CK.bands({g,x0:p.from,x1:p.to,sx:y=>px(p,y),top:M.t,bot:p.h-M.b,eras:DB.eras,pms:DB.pms});
  if(p.ev==="marks"&&evItems)
    CK.events({g,items:evItems,top:M.t,bot:p.h-M.b,lblBot:evLblBot});
}

const lastPt=s=>[...s.pts].reverse().find(q=>q[1]!=null);

function renderLine(p,sets,mode){
  const g=[],H=p.h;
  const shared=sets.every(s=>s.unit===sets[0].unit);
  const rel=p.trans==="rel", indexed=rel||p.trans==="index";
  const ax=yAxis(sets.flatMap(s=>s.pts.map(q=>q[1])),p,indexed?100:null);
  const base=indexed?100:(ax.mn<0&&ax.mx>0?0:null);
  bandsLayer(p,g);
  let unit=shared?sets[0].unit:"";
  if(rel&&shared) unit+=` · above 100: rose faster than ${sets[0].den}`;
  frame(p,g,ax,unit,base);
  const Ys=sets.map(s=>shared?yOf(p,ax):yOf(p,yAxis(s.pts.map(q=>q[1]),p)));
  const B=H-M.b;
  /* Say that the data is missing rather than leaving white space that reads
     as a rendering failure. */
  const firstData=Math.min(...sets.map(s=>{const f=s.pts.find(q=>q[1]!=null); return f?f[0]:Infinity;}));
  if(isFinite(firstData)&&firstData>p.from+0.5){
    const x0=px(p,p.from), x1=px(p,firstData);
    g.push(`<rect class="nodata" x="${x0.toFixed(1)}" y="${M.t}" width="${(x1-x0).toFixed(1)}" height="${H-M.t-M.b}"/>`);
    if(x1-x0>108) g.push(`<text class="axlabel nodatat" x="${((x0+x1)/2).toFixed(1)}" y="${(M.t+14)}" text-anchor="middle">no data before ${Math.floor(firstData)}</text>`);
  }

  /* Gap: shade between the two lines so the difference is the subject */
  if(mode==="gap"&&sets.length===2){
    const [a,b]=sets, bm=new Map(b.pts.map(q=>[q[0],q[1]]));
    const both=a.pts.filter(q=>q[1]!=null&&bm.get(q[0])!=null);
    if(both.length>1){
      const lead=both[both.length-1][1]>=bm.get(both[both.length-1][0])?a:b;
      const d="M"+both.map(q=>px(p,q[0]).toFixed(1)+" "+Ys[0](q[1]).toFixed(1)).join(" L")+" L"+
        [...both].reverse().map(q=>px(p,q[0]).toFixed(1)+" "+Ys[1](bm.get(q[0])).toFixed(1)).join(" L")+" Z";
      g.push(`<path d="${d}" fill="${lead.colour}" opacity=".14"/>`);
    }
  }
  sets.forEach((s,si)=>{
    const Y=Ys[si], seg=s.pts.filter(q=>q[1]!=null);
    if(mode==="area"&&seg.length)
      g.push(`<path d="M${px(p,seg[0][0])} ${B} ${seg.map(q=>`L${px(p,q[0])} ${Y(q[1])}`).join("")} L${px(p,seg[seg.length-1][0])} ${B} Z" fill="${s.colour}" opacity="0.13"/>`);
    /* Relative: shade between the line and 100, so which side it is on reads
       without the axis */
    if(rel&&sets.length===1&&mode!=="area"&&seg.length){
      const b0=Y(100).toFixed(1);
      g.push(`<path d="M${px(p,seg[0][0]).toFixed(1)} ${b0} ${seg.map(q=>`L${px(p,q[0]).toFixed(1)} ${Y(q[1]).toFixed(1)}`).join(" ")} L${px(p,seg[seg.length-1][0]).toFixed(1)} ${b0} Z" fill="${s.colour}" opacity=".12"/>`);
    }
    if(mode==="dots"){
      s.pts.forEach(q=>{ if(q[1]==null) return;
        g.push(`<circle cx="${px(p,q[0]).toFixed(1)}" cy="${Y(q[1]).toFixed(1)}" r="2.6" fill="${s.colour}" opacity=".85"><title>${(+q[0].toFixed(2))}: ${fmt(q[1])}</title></circle>`); });
    } else {
      g.push(`<path class="line" d="${CK.linePath(s.pts,y=>px(p,y),Y,mode==="step")}" stroke="${s.colour}"/>`);
    }
  });

  /* Breaks sit on the line they belong to. A series that stops at a break
     gets a hollow end point and the reason beside its label; a break part
     way along gets a marker at that year, with the full note on hover. */
  const labels=[];
  sets.forEach((s,si)=>{
    const Y=Ys[si], last=lastPt(s); if(!last) return;
    const endBreak=CK.breaks({g,ds:(s.metas||[s.meta]).flatMap(m=>m.discontinuities||[]),pts:s.pts,
      sx:y=>px(p,y),Y,colour:s.colour,x0:p.from,x1:p.to});
    const cx=px(p,last[0]), cy=Y(last[1]);
    CK.endPoint(g,cx,cy,s.colour,endBreak);
    const yr=Math.floor(last[0]);
    /* a final year the source is part-way through says which months it covers */
    const part=(s.meta||{}).partial, partEnd=part&&part.plotted&&yr===part.year;
    labels.push({colour:s.colour,cx,cy,name:s.name,
      val:fmt(last[1])+(partEnd?` · ${part.label||"part of"} ${yr} only`:(yr<p.to?` in ${yr}`:"")),endBreak});
  });
  /* the chosen period: a marker where each series crosses it */
  const pr=state.probe;
  if(pr&&pr.key===p.key&&pr.x!=null&&!pr.code) sets.forEach((s,si)=>{
    const q=s.pts.find(q=>q[0]===pr.x);
    if(q&&q[1]!=null) g.push(`<circle class="probedot" cx="${px(p,q[0]).toFixed(1)}" cy="${Ys[si](q[1]).toFixed(1)}" r="5" fill="${s.colour}"/>`);
  });
  CK.endLabels({g,labels,lx:W-M.r+12,floorY:H-M.b+4});
  return wrapSvg(p,g);
}

function renderBar(p,sets){
  const g=[],H=p.h;
  const ax=yAxis(sets.flatMap(s=>s.pts.map(q=>q[1])),p,0);
  bandsLayer(p,g);
  frame(p,g,ax,sets.every(s=>s.unit===sets[0].unit)?sets[0].unit:"",0);
  const Y=yOf(p,ax);
  /* Placed by year, not by index. An index layout puts the first bar under the
     axis's first year even when the series doesn't start for another fifteen —
     the bar says 2015 in its tooltip while sitting above a tick reading 2000. */
  const years=[...new Set(sets.flatMap(s=>s.pts.map(q=>q[0])))].sort((a,b)=>a-b);
  const slot=(W-M.l-M.r)/Math.max(1,p.to-p.from+1);
  const bw=Math.max(1.5,(slot*0.78)/sets.length);
  years.forEach(yr=>sets.forEach((s,si)=>{
    const q=s.pts.find(q=>q[0]===yr), v=q&&q[1]; if(v==null)return;
    const x=px(p,yr)-(bw*sets.length)/2+si*bw, y0=Y(Math.max(0,v)), y1=Y(Math.min(0,v));
    /* Rounded at the data end, full-strength fill, and a hair of surface
       between neighbours so adjacent columns stay separate marks. */
    g.push(`<rect x="${x.toFixed(1)}" y="${y0.toFixed(1)}" width="${Math.max(1,bw-1).toFixed(1)}" height="${Math.max(0.5,y1-y0).toFixed(1)}" rx="1.5" fill="${s.colour}"><title>${yr}: ${fmt(v)}</title></rect>`);
  }));
  return wrapSvg(p,g);
}

function renderStack(p,sets){
  const g=[],H=p.h;
  /* align by period across every series; only stack where all have values */
  const xs=[...new Set(sets.flatMap(s=>s.pts.map(q=>q[0])))].sort((a,b)=>a-b)
    .filter(x=>sets.every(s=>{const q=s.pts.find(q=>q[0]===x);return q&&q[1]!=null;}));
  if(!xs.length) return `<div class="blank"><h3>Nothing to stack</h3><div>These series don't overlap in this range.</div></div>`;
  const tot=xs.map(x=>sets.reduce((a,s)=>a+s.pts.find(q=>q[0]===x)[1],0));
  const ax=yAxis([...tot,0],p);
  bandsLayer(p,g);
  frame(p,g,ax,sets.every(s=>s.unit===sets[0].unit)?sets[0].unit:"",0);
  const Y=yOf(p,ax);
  let below=xs.map(()=>0);
  sets.forEach(s=>{
    const top=xs.map((x,i)=>below[i]+s.pts.find(q=>q[0]===x)[1]);
    const d="M"+xs.map((x,i)=>px(p,x).toFixed(1)+" "+Y(top[i]).toFixed(1)).join(" L")
      +" L"+[...xs].reverse().map((x)=>{const i=xs.indexOf(x);return px(p,x).toFixed(1)+" "+Y(below[i]).toFixed(1);}).join(" L")+" Z";
    g.push(`<path d="${d}" fill="${s.colour}" opacity="0.55"/>`);
    g.push(`<path class="line" d="M${xs.map((x,i)=>px(p,x).toFixed(1)+" "+Y(top[i]).toFixed(1)).join(" L")}" stroke="${s.colour}" style="stroke-width:1.6"/>`);
    below=top;
  });
  const li=xs.length-1;
  g.push(`<text class="sm-t" x="${W-M.r+7}" y="${Y(tot[li])+3.5}" fill="${sets[sets.length-1].colour}">${fmt(tot[li])}</text>`);
  return wrapSvg(p,g);
}

/* Stacked columns. The same composition question as the stacked area, asked of
   discrete years — which is the honest form when the periods are annual counts
   rather than a continuous flow. A 2px gap between segments keeps them reading
   as separate marks instead of one wash. */
function renderColStack(p,sets){
  const g=[],H=p.h;
  const xs=[...new Set(sets.flatMap(s=>s.pts.map(q=>q[0])))].sort((a,b)=>a-b)
    .filter(x=>sets.every(s=>{const q=s.pts.find(q=>q[0]===x);return q&&q[1]!=null;}));
  if(!xs.length) return `<div class="blank"><h3>Nothing to stack</h3><div>These series don't overlap in this range.</div></div>`;
  const tot=xs.map(x=>sets.reduce((a,s)=>a+s.pts.find(q=>q[0]===x)[1],0));
  const ax=yAxis([...tot,0],p);
  bandsLayer(p,g);
  frame(p,g,ax,sets.every(s=>s.unit===sets[0].unit)?sets[0].unit:"",0);
  const Y=yOf(p,ax);
  const slot=(W-M.l-M.r)/Math.max(1,p.to-p.from+1), bw=Math.max(2,slot*0.7);
  xs.forEach(x=>{
    let below=0;
    sets.forEach(s=>{
      const v=s.pts.find(q=>q[0]===x)[1];
      const y0=Y(below+v), y1=Y(below), h=Math.max(0.5,y1-y0-2);
      g.push(`<rect x="${(px(p,x)-bw/2).toFixed(1)}" y="${y0.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" fill="${s.colour}"><title>${x} ${esc(s.name)}: ${fmt(v)}</title></rect>`);
      below+=v;
    });
  });
  return wrapSvg(p,g);
}

/* Slope. Two moments, one line each — the form that answers "who moved, and
   which way" without the noise of everything in between.

   It insists on one unit rather than quietly giving each series its own axis.
   Two scales on one plot is the single most misleading thing a chart can do,
   and on a slope it is worse than usual: the crossing point would be an
   artefact of the scaling rather than anything that happened. */
function renderSlope(p,sets){
  if(!sets.every(s=>s.unit===sets[0].unit))
    return `<div class="blank"><h3>Slope needs one unit</h3>
      <div>These series are on different scales, and giving each its own axis would invent a crossing point. Rebase them to compare the movement.</div>
      <div class="sug"><button class="sg" data-act="rebase">Rebase to 100</button></div></div>`;
  const pick=(s,want)=>s.pts.reduce((best,q)=>
    q[1]==null?best:(!best||Math.abs(q[0]-want)<Math.abs(best[0]-want)?q:best),null);
  const rows=sets.map(s=>({s,a:pick(s,p.from),b:pick(s,p.to)}))
                 .filter(o=>o.a&&o.b&&o.a[0]!==o.b[0]);
  if(!rows.length) return `<div class="blank"><h3>Not enough to compare</h3><div>These series don't have values at both ends of this range.</div></div>`;

  const g=[],H=p.h;
  const [mn,mx]=scale(rows.flatMap(o=>[o.a[1],o.b[1]]));
  const xa=M.l+150, xb=W-M.r-80, top=M.t+16, bot=H-M.b-6;
  const Y=v=>top+(1-(v-mn)/Math.max(1e-9,mx-mn))*(bot-top);
  [[xa,rows[0].a[0]],[xb,rows[0].b[0]]].forEach(([x,yr])=>{
    g.push(`<line class="gridline" x1="${x}" y1="${top-6}" x2="${x}" y2="${bot+6}"/>`);
    g.push(`<text class="axlabel" x="${x}" y="${top-12}" text-anchor="middle">${yr}</text>`);
  });
  /* Nudge labels apart where two series land on nearly the same value. Without
     it a slope's whole point — which line ended where — is the first thing to
     become unreadable. */
  const declutter=vals=>{
    const order=vals.map((v,i)=>[i,Y(v)]).sort((a,b)=>a[1]-b[1]);
    for(let k=1;k<order.length;k++)
      if(order[k][1]-order[k-1][1]<12) order[k][1]=order[k-1][1]+12;
    const out=[]; order.forEach(([i,y])=>out[i]=y); return out;
  };
  const ly=declutter(rows.map(o=>o.a[1])), ry=declutter(rows.map(o=>o.b[1]));
  rows.forEach((o,i)=>{
    g.push(`<path class="line" d="M${xa} ${Y(o.a[1]).toFixed(1)} L${xb} ${Y(o.b[1]).toFixed(1)}" stroke="${o.s.colour}"/>`);
    g.push(`<circle cx="${xa}" cy="${Y(o.a[1]).toFixed(1)}" r="4" fill="${o.s.colour}"/>`);
    g.push(`<circle cx="${xb}" cy="${Y(o.b[1]).toFixed(1)}" r="4" fill="${o.s.colour}"/>`);
    /* Four series at most on a panel, so every line is named on the chart and
       identity never rests on colour alone. */
    const nm=o.s.name.length>16?o.s.name.slice(0,15)+"…":o.s.name;
    g.push(`<text class="sm-t" x="${xa-9}" y="${(ly[i]+3.5).toFixed(1)}" text-anchor="end" fill="${o.s.colour}">${esc(nm)} ${fmt(o.a[1])}</text>`);
    g.push(`<text class="sm-t" x="${xb+9}" y="${(ry[i]+3.5).toFixed(1)}" fill="${o.s.colour}">${fmt(o.b[1])}</text>`);
  });
  return wrapSvg(p,g);
}

function renderScatter(p,sets){
  const g=[],H=p.h,[X,Yv]=sets,pairs=[];
  const ym=new Map(Yv.pts.map(q=>[q[0],q[1]]));
  X.pts.forEach(q=>{const r=ym.get(q[0]); if(q[1]!=null&&r!=null) pairs.push([q[0],q[1],r]);});
  const [ax,bx]=scale(pairs.map(q=>q[1])), [ay,by]=scale(pairs.map(q=>q[2]));
  const PX=v=>M.l+((v-ax)/(bx-ax))*(W-M.l-M.r), PY=v=>M.t+(1-(v-ay)/(by-ay))*(H-M.t-M.b);
  for(let i=0;i<=4;i++){
    const y=M.t+i*(H-M.t-M.b)/4;
    g.push(`<line class="gridline" x1="${M.l}" y1="${y}" x2="${W-M.r}" y2="${y}"/>`);
    g.push(`<text class="axlabel" x="${M.l-9}" y="${y+3.5}" text-anchor="end">${fmt(by-(by-ay)*i/4)}</text>`);
  }
  /* Four ticks, not five: the axis name is right-aligned on this same
     baseline, and the fifth tick lands underneath it. */
  for(let i=0;i<4;i++)
    g.push(`<text class="axlabel" x="${M.l+i*(W-M.l-M.r)/4}" y="${H-6}" text-anchor="middle">${fmt(ax+(bx-ax)*i/4)}</text>`);
  pairs.forEach(([yr,vx,vy])=>{
    const era=DB.eras.find(e=>yr>=e.from&&yr<e.to);
    g.push(`<circle cx="${PX(vx).toFixed(1)}" cy="${PY(vy).toFixed(1)}" r="4.5" fill="${era?era.colour:"#5C6672"}" opacity="0.82"><title>${yr}\n${X.name}: ${fmt(vx)}\n${Yv.name}: ${fmt(vy)}</title></circle>`);
  });
  g.push(`<text class="axlabel" transform="translate(13 ${(M.t+(H-M.b))/2}) rotate(-90)" text-anchor="middle">${Yv.name}</text>`);
  g.push(`<text class="axlabel" x="${W-M.r}" y="${H-6}" text-anchor="end">${X.name} →</text>`);
  return wrapSvg(p,g);
}

function renderSmall(p,sets){
  const cols=Math.min(2,sets.length), rows=Math.ceil(sets.length/cols);
  const pw=W/cols, ph=Math.max(140,p.h/rows), g=[];
  sets.forEach((s,i)=>{
    const cx=(i%cols)*pw, cy=Math.floor(i/cols)*ph;
    const [a,b]=scale(s.pts.map(q=>q[1])), m={t:26,r:14,b:20,l:46};
    const PX=y=>cx+m.l+((y-p.from)/Math.max(1,p.to-p.from))*(pw-m.l-m.r);
    const PY=v=>cy+m.t+(1-(v-a)/(b-a))*(ph-m.t-m.b);
    g.push(`<text class="sm-t" x="${cx+m.l}" y="${cy+14}" fill="${s.colour}">${s.name}</text>`);
    niceTicks(a,b,3).forEach(val=>{
      const y=cy+m.t+(1-(val-a)/(b-a))*(ph-m.t-m.b);
      g.push(`<line class="gridline" x1="${cx+m.l}" y1="${y.toFixed(1)}" x2="${cx+pw-m.r}" y2="${y.toFixed(1)}"/>`);
      g.push(`<text class="axlabel" x="${cx+m.l-6}" y="${(y+3).toFixed(1)}" text-anchor="end" style="font-size:9px">${fmtTick(val)}</text>`);});
    let d="",pen=false;
    s.pts.forEach(q=>{ if(q[1]==null){pen=false;return;} d+=(pen?"L":"M")+PX(q[0]).toFixed(1)+" "+PY(q[1]).toFixed(1)+" "; pen=true;});
    g.push(`<path class="line" d="${d}" stroke="${s.colour}" stroke-width="2"/>`);
    g.push(`<text class="axlabel" x="${cx+m.l}" y="${cy+ph-6}" style="font-size:9px">${p.from}</text>`);
    g.push(`<text class="axlabel" x="${cx+pw-m.r}" y="${cy+ph-6}" text-anchor="end" style="font-size:9px">${p.to}</text>`);
  });
  return `<svg viewBox="0 0 ${W} ${rows*ph}" style="width:100%;height:auto" role="img" aria-label="Small multiples">${g.join("")}</svg>`;
}

/* ── areas ───────────────────────────────────────────────────────
   Local detail is not in the bundle. data/areas/index.json carries the area
   registry and which series have local figures; data/areas/<id>.json carries
   one series' values for every area. Together they are thirty times the
   bundle's size, for a view most visits never open, so both are fetched on
   first use and kept.

   The panel's Range "to" year is the year shown. Reusing it rather than
   adding a control means the ranking and the time chart it came from stay in
   step, and an existing permalink already carries the right year.

   Values are drawn as dots on a shared scale, not bars. A ranked bar chart
   whose axis does not start at zero — and an employment rate between 68 and
   82 per cent cannot start at zero and stay readable — makes length mean
   nothing while still looking like it means something. */
const AREA_ROW=22, AREA_ML=220, AREA_MR=86, AREA_HEAD=54, AREA_PAD=4;
let AREAIX=null;
const AREADATA=new Map();
const areaPending=new Set();

function areaGet(url,store){
  if(areaPending.has(url)) return;
  areaPending.add(url);
  fetch(url,{cache:"no-cache"})
    .then(r=>r.ok?r.json():Promise.reject())
    .then(d=>{ store(d); render(); })
    .catch(()=>{ store("error"); render(); });   /* stored, so it is not retried on every render */
}
function areaIndex(){
  if(!AREAIX) areaGet("data/areas/index.json",d=>{AREAIX=d;});
  return AREAIX;
}
function areaData(id){
  if(AREADATA.has(id)) return AREADATA.get(id);
  areaGet(`data/areas/${id}.json`,d=>AREADATA.set(id,d));
  return null;
}
/* The series a given area panel is actually showing: the first selection with
   local detail, so adding a second indicator to compare over time does not
   silently blank the area view. */
const areaSet = sets => sets.find(s=>s.meta.areas) || null;
function areaLevels(id){
  const ix=AREAIX; return (ix&&ix!=="error"&&ix.series[id]||{}).levels||[];
}
const areaLevel = (p,id) => {
  const lv=areaLevels(id);
  return lv.includes(p.lvl) ? p.lvl : (lv.includes("la") ? "la" : lv[lv.length-1]||"");
};

/* One year's values at one level. ELS publishes different levels on different
   schedules, so the requested year can be empty at one level and full at the
   next — step back rather than showing nothing. */
function areaYear(d,ix,lvl,want){
  const len=Math.max(...Object.values(d.values).map(v=>v.length));
  const end=d.start+len-1;
  let y=Math.min(Math.max(want,d.start),end);
  const at=yy=>{
    const m={};
    for(const [c,v] of Object.entries(d.values)){
      if((ix.areas[c]||{}).l!==lvl) continue;
      const x=v[yy-d.start]; if(x!=null) m[c]=x;
    }
    return m;
  };
  let map=at(y);
  while(!Object.keys(map).length && y>d.start) map=at(--y);
  return {year:y,map,end};
}
const areaName=(ix,c)=>(ix.areas[c]||{}).n||c;

function areaRows(p,d,ix,lvl){
  const {year,map,end}=areaYear(d,ix,lvl,p.to);
  return {rows:Object.entries(map).map(([c,v])=>[c,areaName(ix,c),v]), year, end};
}

/* Every area view needs the same four things before it can draw anything.
   Doing it once means the loading, error and empty states are identical
   across them instead of four near-copies drifting apart. */
const areaBlank=(h,b)=>`<div class="blank"><h3>${h}</h3><div>${b}</div></div>`;
function areaPrep(p,sets){
  const set=areaSet(sets);
  if(!set) return {err:areaBlank("No local detail here",
    "Local figures come from ONS Explore Local Statistics. Pick an indicator that carries them — most of the population, economy and wellbeing series do.")};
  const ix=areaIndex(), d=areaData(set.id);
  if(ix==="error"||d==="error") return {err:areaBlank("Local detail unavailable","The area files could not be loaded. The other views are unaffected.")};
  if(!ix||!d) return {err:areaBlank("Loading local detail…","One file per indicator, fetched the first time you ask for it.")};
  return {set,ix,d,lvl:areaLevel(p,set.id)};
}

function renderAreaChart(p,sets){
  const a=areaPrep(p,sets);
  if(a.err) return a.err;
  return p.chart==="arrow" ? renderAreaArrow(p,a)
       : p.chart==="range" ? renderAreaRange(p,a)
       : p.chart==="heat"  ? renderAreaHeat(p,a)
       : p.chart==="map"   ? renderAreaMap(p,a)
       :                     renderAreaRanking(p,a);
}

/* The frame every row-per-area view draws into: a gutter of names on the
   left, a value scale with round-number ticks, faint striping so a row can be
   followed across, and a highlight on the area last clicked. The scale, the
   units and the reference label live in a separate header strip (`gh`) that
   stays pinned while the list of areas scrolls under it. `zero` pins the
   scale to 0, for bars. */
function areaFrame(p,set,rows,lo,hi,head,zero){
  const H=AREA_PAD+rows.length*AREA_ROW+6;
  const ax=CK.yAxis([lo,hi],5*55,zero?0:null);
  const x=v=>AREA_ML+((v-ax.mn)/Math.max(1e-9,ax.mx-ax.mn))*(W-AREA_ML-AREA_MR);
  const g=[], gh=[];
  const pr=state.probe, sel=pr&&pr.key===p.key&&pr.code;
  rows.forEach((r,i)=>{
    const y=AREA_PAD+i*AREA_ROW;
    if(r[0]===sel) g.push(`<rect class="asel" x="0" y="${y}" width="${W}" height="${AREA_ROW}"/>`);
    else if(i%2) g.push(`<rect class="azebra" x="0" y="${y}" width="${W}" height="${AREA_ROW}"/>`);
  });
  ax.ticks.forEach(v=>{
    const gx=x(v).toFixed(1), cls=Math.abs(v)<ax.st/1e6&&zero?"baseline":"gridline";
    g.push(`<line class="${cls}" x1="${gx}" y1="0" x2="${gx}" y2="${H}"/>`);
    gh.push(`<line class="${cls}" x1="${gx}" y1="${AREA_HEAD-5}" x2="${gx}" y2="${AREA_HEAD}"/>`);
    gh.push(`<text class="axlabel" x="${gx}" y="${AREA_HEAD-9}" text-anchor="middle">${CK.tickFmt(v,ax.st)}</text>`);
  });
  if(head) gh.push(`<text class="areahead" x="0" y="13">${esc(head)}</text>`);
  gh.push(`<line class="gridline" x1="0" y1="${AREA_HEAD-0.5}" x2="${W}" y2="${AREA_HEAD-0.5}"/>`);
  return {g,gh,H,x,ax,rowY:i=>AREA_PAD+i*AREA_ROW+AREA_ROW/2};
}
/* the line every row is read against, labelled in the pinned header so the
   label is there wherever the list is scrolled to */
function areaRef(f,v,name){
  const rx=f.x(v), left=rx<W*0.62, t=rx.toFixed(1);
  f.g.push(`<line class="aref" x1="${t}" y1="0" x2="${t}" y2="${f.H}"/>`);
  f.gh.push(`<line class="aref" x1="${t}" y1="25" x2="${t}" y2="${AREA_HEAD}"/>`);
  f.gh.push(`<text class="arefl" x="${(left?rx+6:rx-6).toFixed(1)}" y="29" text-anchor="${left?"start":"end"}">${esc(name)}: ${fmt(v)}</text>`);
}
const areaLabel=(g,y,name)=>g.push(
  `<text class="arealbl" x="${AREA_ML-12}" y="${(y+4).toFixed(1)}" text-anchor="end">${esc(name.length>32?name.slice(0,31)+"…":name)}</text>`);
const areaVal=(g,y,txt)=>g.push(`<text class="areaval" x="${W-AREA_MR+12}" y="${(y+4).toFixed(1)}">${txt}</text>`);
const areaHit=(g,set,code,y)=>g.push(`<rect class="hit" data-probe="${esc(set.id)}" data-area="${code}" x="0" y="${(y-AREA_ROW/2).toFixed(1)}" width="${W}" height="${AREA_ROW}"/>`);
const areaSvg=(H,g,label,gh)=>
  `<svg class="areasvg areahd" viewBox="0 0 ${W} ${AREA_HEAD}" aria-hidden="true">${gh.join("")}</svg>`+
  `<svg class="areasvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g.join("")}</svg>`;
const median=a=>{const s=[...a].sort((x,y)=>x-y), m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2;};

function renderAreaRanking(p,{set,ix,d,lvl}){
  const {rows,year}=areaRows(p,d,ix,lvl);
  if(!rows.length) return areaBlank("Nothing at this level","No areas at this level carry a figure for this indicator.");
  rows.sort(p.asort==="name" ? (a,b)=>a[1].localeCompare(b[1])
          : p.asort==="asc"  ? (a,b)=>a[2]-b[2]
          :                    (a,b)=>b[2]-a[2]);
  const vals=rows.map(r=>r[2]);

  /* What each area is read against. For a rate or an average the national
     figure is the natural reference. For a count it is not — the UK total of
     active businesses is three million, every council is under sixty
     thousand, and drawing both on one scale squashes every area into the
     corner. Counts get the typical area, the median, instead. */
  const natCode=["K02000001","E92000001","K03000001"].find(c=>d.values[c]&&d.values[c][year-d.start]!=null);
  const nat=natCode?d.values[natCode][year-d.start]:null;
  const isCount=set.meta.kind==="count" || (nat!=null && nat>Math.max(...vals)*1.5);
  const ref = isCount ? median(vals) : nat;
  const refName = isCount ? "Typical area (median)" : (natCode?(ix.areas[natCode]||{}).n||"National":"");
  /* counts are amounts, so they are bars from zero; rates and averages are
     dots, because their scale need not start at zero to be honest */
  const bars = isCount && Math.min(...vals)>=0;

  const lo=Math.min(...vals, ref??Infinity), hi=Math.max(...vals, ref??-Infinity);
  const f=areaFrame(p,set,rows,bars?0:lo,hi,`${year} · ${set.meta.unit}`,bars), {g,H,x,rowY}=f;

  rows.forEach((r,i)=>{
    const y=rowY(i);
    areaLabel(g,y,r[1]);
    if(bars){
      g.push(`<rect x="${x(0).toFixed(1)}" y="${(y-5).toFixed(1)}" width="${Math.max(1,x(r[2])-x(0)).toFixed(1)}" height="10" rx="2" fill="${set.colour}" opacity=".85"><title>${esc(r[1])}: ${fmt(r[2])}</title></rect>`);
    } else {
      /* a stalk from the reference to the dot reads as distance from it */
      if(ref!=null) g.push(`<line x1="${x(ref).toFixed(1)}" y1="${y.toFixed(1)}" x2="${x(r[2]).toFixed(1)}" y2="${y.toFixed(1)}" stroke="${set.colour}" stroke-width="2" opacity=".28" stroke-linecap="round"/>`);
      g.push(`<circle cx="${x(r[2]).toFixed(1)}" cy="${y.toFixed(1)}" r="4.2" fill="${set.colour}" class="enddot"><title>${esc(r[1])}: ${fmt(r[2])}</title></circle>`);
    }
    areaVal(g,y,fmt(r[2]));
    areaHit(g,set,r[0],y);
  });
  if(ref!=null) areaRef(f,ref,refName);
  return areaSvg(H,g,`${set.name} by area, ${year}`,f.gh);
}

/* Both two-year views read the same pair of snapshots; only the mark differs.
   Areas missing from either year are dropped rather than drawn as a change
   from nothing. */
function areaPair(p,d,ix,lvl){
  const a=areaYear(d,ix,lvl,Math.min(p.from,p.to));
  const b=areaYear(d,ix,lvl,Math.max(p.from,p.to));
  const rows=Object.keys(b.map)
    .filter(c=>a.map[c]!=null)
    .map(c=>[c,areaName(ix,c),a.map[c],b.map[c],b.map[c]-a.map[c]]);
  return {rows, y0:a.year, y1:b.year};
}
const areaSortPair = asort =>
    asort==="name" ? (r,s)=>r[1].localeCompare(s[1])
  : asort==="asc"  ? (r,s)=>r[3]-s[3]
  : asort==="change"?(r,s)=>s[4]-r[4]
  :                  (r,s)=>s[3]-r[3];

function renderAreaArrow(p,{set,ix,d,lvl}){
  const {rows,y0,y1}=areaPair(p,d,ix,lvl);
  if(!rows.length) return areaBlank("No change to show",
    `Not enough areas carry a figure for both ${Math.min(p.from,p.to)} and ${Math.max(p.from,p.to)} at this level. Widen the range.`);
  if(y0===y1) return areaBlank("One year on both ends","Widen the chart's range so the arrows have two different years to span.");
  rows.sort(areaSortPair(p.asort==="desc"?"change":p.asort));
  const all=rows.flatMap(r=>[r[2],r[3]]);
  const f=areaFrame(p,set,rows,Math.min(...all),Math.max(...all),`${y0} → ${y1} · ${set.meta.unit}`), {g,H,x,rowY}=f;
  rows.forEach((r,i)=>{
    const y=rowY(i), x0=x(r[2]), x1=x(r[3]);
    areaLabel(g,y,r[1]);
    /* One colour, and direction carried by the arrowhead. Colouring rises green
       and falls red would be this site taking a view: a fall in emissions and a
       fall in life expectancy are not the same news. */
    const dir=x1>=x0?1:-1, tip=x1;
    if(Math.abs(x1-x0)>6) g.push(`<line x1="${x0.toFixed(1)}" y1="${y.toFixed(1)}" x2="${(tip-dir*5).toFixed(1)}" y2="${y.toFixed(1)}" stroke="${set.colour}" stroke-width="2" opacity=".6" stroke-linecap="round"/>`);
    g.push(`<path d="M${(tip-dir*6).toFixed(1)} ${(y-4).toFixed(1)} L${tip.toFixed(1)} ${y.toFixed(1)} L${(tip-dir*6).toFixed(1)} ${(y+4).toFixed(1)}" fill="none" stroke="${set.colour}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`);
    g.push(`<circle cx="${x0.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="${set.colour}" opacity=".45"><title>${esc(r[1])}: ${fmt(r[2])} in ${y0}, ${fmt(r[3])} in ${y1}</title></circle>`);
    areaVal(g,y,`${r[4]>=0?"+":"−"}${fmt(Math.abs(r[4]))}`);
    areaHit(g,set,r[0],y);
  });
  return areaSvg(H,g,`${set.name} by area, change ${y0} to ${y1}`,f.gh);
}

function renderAreaRange(p,{set,ix,d,lvl}){
  const {rows,y0,y1}=areaPair(p,d,ix,lvl);
  if(!rows.length) return areaBlank("Nothing to span",
    `Not enough areas carry a figure for both ${Math.min(p.from,p.to)} and ${Math.max(p.from,p.to)} at this level. Widen the range.`);
  rows.sort(areaSortPair(p.asort));
  const all=rows.flatMap(r=>[r[2],r[3]]);
  const f=areaFrame(p,set,rows,Math.min(...all),Math.max(...all),`${y0} ○  ● ${y1} · ${set.meta.unit}`), {g,H,x,rowY}=f;
  rows.forEach((r,i)=>{
    const y=rowY(i);
    areaLabel(g,y,r[1]);
    g.push(`<line x1="${x(r[2]).toFixed(1)}" y1="${y.toFixed(1)}" x2="${x(r[3]).toFixed(1)}" y2="${y.toFixed(1)}" stroke="${set.colour}" stroke-width="3" opacity=".25" stroke-linecap="round"/>`);
    /* hollow for the earlier year, solid for the later: shape carries which
       is which, not an opacity the reader has to remember */
    g.push(`<circle cx="${x(r[2]).toFixed(1)}" cy="${y.toFixed(1)}" r="3.6" class="hollow" stroke="${set.colour}" stroke-width="1.8"><title>${y0}: ${fmt(r[2])}</title></circle>`);
    g.push(`<circle cx="${x(r[3]).toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${set.colour}"><title>${y1}: ${fmt(r[3])}</title></circle>`);
    areaVal(g,y,fmt(r[3]));
    areaHit(g,set,r[0],y);
  });
  return areaSvg(H,g,`${set.name} by area, ${y0} and ${y1}`,f.gh);
}

/* ── the map ───────────────────────────────────────────────────────
   One indicator, one year, every area coloured by where it falls. Shapes are
   ONS "ultra generalised" boundaries (ingest/geo.py), fetched the first time
   a map is asked for. Colours are in seven bins of equal count rather than
   equal width: local figures are skewed — Westminster has eight times the
   businesses of a typical council — and equal-width bins would paint almost
   every area the same pale shade. The legend prints each bin's range, so the
   reader is never left guessing what a shade means. */
const GEO=new Map();
/* each map's searchable list of areas, kept outside the markup so typing in
   the search box never redraws the chart (a redraw would drop the focus) */
const MAPFIND=new Map();
function mapFindShow(input){
  const card=input.closest(".pcard"), p=state.panels[+card.dataset.i], f=MAPFIND.get(p.key), box=input.nextElementSibling;
  if(!f){ box.hidden=true; return; }
  const q=input.value.trim().toLowerCase();
  const hits=(q?f.list.filter(r=>r[1].toLowerCase().includes(q)).sort((a,b)=>
    (b[1].toLowerCase().startsWith(q))-(a[1].toLowerCase().startsWith(q))):f.list).slice(0,8);
  box.innerHTML=hits.length
    ? hits.map((r,i)=>`<button type="button" class="mfhit${i===0?" on":""}" role="option" data-probe="${esc(f.id)}" data-area="${r[0]}">
        <span>${esc(r[1])}</span><b>${fmt(r[2])}</b></button>`).join("")
    : `<div class="mfnone">No area matches “${esc(input.value.trim())}”</div>`;
  box.hidden=false;
}
function geoData(name){
  if(GEO.has(name)) return GEO.get(name);
  areaGet(`data/geo/${name}.json`,d=>GEO.set(name,d));
  return null;
}
const ITL1_RGN={TLC:"E12000001",TLD:"E12000002",TLE:"E12000003",TLF:"E12000004",TLG:"E12000005",
                TLH:"E12000006",TLI:"E12000007",TLJ:"E12000008",TLK:"E12000009"};
const ITL1_CTRY={TLL:"W92000004",TLM:"S92000003",TLN:"N92000002"};
/* per level: the shapes that give the whole UK outline (base), any shapes
   drawn on top (over), and how a shape's code maps to a code in the data */
const MAP_CFG={
  la:      {base:"lad", over:"cty"},
  district:{base:"lad"},
  county:  {base:"lad", over:"cty"},
  cauth:   {base:"lad", over:"cauth"},
  region:  {base:"itl1", key:c=>ITL1_RGN[c]},
  country: {base:"itl1", key:c=>ITL1_CTRY[c]||"E92000001"},
  itl2:    {base:"itl2"},
  itl3:    {base:"itl3"}
};
/* London, in the drawing's units, and where its enlargement sits: in the
   North Sea, clear of the coast */
const LDN={x:2052,y:3436,w:236,h:184}, LDN_AT={x:2440,y:1420,s:4}, MAP_W=3400, KEY_AT={x:2740,y:2420};
/* the box round a path, read from its absolute start and relative steps */
function pathBox(d){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const ring of d.split("M").slice(1)){
    const n=ring.replace(/[lz]/g," ").trim().split(/\s+|(?=-)/).map(Number);
    let x=n[0],y=n[1];
    for(let i=0;i<n.length;i+=2){ if(i){x+=n[i];y+=n[i+1];}
      if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  }
  return {x0,y0,x1,y1};
}
const firstPt=d=>{const m=/^M(-?\d+) (-?\d+)/.exec(d); return m?[+m[1],+m[2]]:[0,0];};

/* A count of things (businesses, people) is not comparable between areas of
   different sizes. Reads the bundle's own "kind" first, and falls back to the
   shape of the data: a national figure far above every area is a total. */
function areaIsCount(set,d,year,vals){
  if(set.meta.kind==="count") return true;
  const nat=["K02000001","E92000001","K03000001"].map(c=>d.values[c]&&d.values[c][year-d.start]).find(v=>v!=null);
  return nat!=null && vals.length>0 && nat>Math.max(...vals)*1.5;
}

function mapBins(vals){
  const s=[...vals].sort((a,b)=>a-b), n=s.length, k=Math.min(7,new Set(s).size);
  const cuts=[];
  for(let i=1;i<k;i++){ const c=s[Math.floor(i*n/k)]; if(!cuts.length||c>cuts[cuts.length-1]) cuts.push(c); }
  return {cuts, min:s[0], max:s[n-1], bin:v=>{let i=0; while(i<cuts.length&&v>=cuts[i]) i++; return i;}};
}

function renderAreaMap(p,{set,ix,d,lvl}){
  const cfg=MAP_CFG[lvl];
  if(!cfg) return areaBlank("Nothing to map at this level",
    "The UK totals are a single figure each. Pick countries, regions or a local level in the chart's settings.");
  const base=geoData(cfg.base), over=cfg.over?geoData(cfg.over):null;
  if(base==="error"||over==="error") return areaBlank("Map unavailable","The boundary files could not be loaded. The other area views are unaffected.");
  if(!base||(cfg.over&&!over)) return areaBlank("Loading the map…","Boundaries for this level, fetched the first time you ask for them.");

  const {year,map}=areaYear(d,ix,lvl,p.to);
  if(!Object.keys(map).length) return areaBlank("Nothing at this level","No areas at this level carry a figure for this indicator.");
  const count=areaIsCount(set,d,year,Object.values(map));
  /* Councils: two-tier England is run by counties as well as districts, so a
     map of unitary councils alone has holes across the shires. Rates fill
     them with the county's figure, which compares fairly; counts do not,
     since a county's total dwarfs any single council's. */
  let extra={};
  if(lvl==="la"&&!count){
    const c=areaYear(d,ix,"county",year);
    if(c.year===year) for(const [k,v] of Object.entries(c.map)) if(k.startsWith("E10")) extra[k]=v;
  }
  /* only what is drawn: Inner and Outer London are filed as regions but sit
     inside the London region, and areas with no current boundary have no shape */
  const drawn=new Set();
  for(const c of Object.keys(base.areas)) drawn.add(cfg.key?cfg.key(c):c);
  if(over) for(const c of Object.keys(over.areas)) drawn.add(c);
  for(const m of [map,extra]) for(const c of Object.keys(m)) if(!drawn.has(c)) delete m[c];
  if(!Object.keys(map).length) return areaBlank("Nothing to map","None of the areas with a figure at this level have a current boundary to draw.");
  const all={...map,...extra};
  const B=mapBins(Object.values(all)), ramp=RAMP();
  const colourOf=v=>ramp[Math.round(B.bin(v)*(ramp.length-1)/Math.max(1,B.cuts.length))];

  const pr=state.probe, selCode=pr&&pr.key===p.key&&pr.code;
  const shapes=[];   /* [dataCode|null, path, layer] */
  for(const [c,path] of Object.entries(base.areas)){
    const k=cfg.key?cfg.key(c):c;
    shapes.push([k in all && (!cfg.over||lvl==="la"&&k in map)?k:null, path]);
  }
  if(over) for(const [c,path] of Object.entries(over.areas)) if(c in all) shapes.push([c,path]);

  const VW=MAP_W, VH=base.h;
  const Hpx=Math.max(600,Math.min(820,p.h+320)), k=Hpx/VH, u=px=>(px/k).toFixed(0);
  const pathEl=([code,dd])=> code
    ? `<path class="mapa" d="${dd}" fill="${colourOf(all[code])}" data-probe="${esc(set.id)}" data-area="${code}"><title>${esc(areaName(ix,code))}: ${fmt(all[code])}</title></path>`
    : `<path class="mapna" d="${dd}"/>`;
  const g=[];
  g.push(`<g class="mapg">${shapes.map(pathEl).join("")}</g>`);
  const selPaths=shapes.filter(s=>s[0]&&s[0]===selCode);
  if(selPaths.length){
    g.push(selPaths.map(s=>`<path class="mapsel" d="${s[1]}"/>`).join(""));
    /* a small area is a speck at this scale, so a ring says where it is */
    const bx=selPaths.map(s=>pathBox(s[1])).reduce((a,b)=>({x0:Math.min(a.x0,b.x0),y0:Math.min(a.y0,b.y0),x1:Math.max(a.x1,b.x1),y1:Math.max(a.y1,b.y1)}));
    if(Math.max(bx.x1-bx.x0,bx.y1-bx.y0)<+u(16)){
      const cx=((bx.x0+bx.x1)/2).toFixed(0), cy=((bx.y0+bx.y1)/2).toFixed(0);
      g.push(`<circle class="mapring halo" cx="${cx}" cy="${cy}" r="${u(10)}"/><circle class="mapring" cx="${cx}" cy="${cy}" r="${u(10)}"/>`);
    }
  }

  /* London, enlarged, where the boroughs can be clicked */
  const inLdn=shapes.filter(([code,dd])=>{const [x,y]=firstPt(dd); return x>=LDN.x-20&&x<=LDN.x+LDN.w+20&&y>=LDN.y-20&&y<=LDN.y+LDN.h+20;});
  if(inLdn.some(s=>s[0])&&["la","itl2","itl3"].includes(lvl)){
    const T=`translate(${LDN_AT.x} ${LDN_AT.y}) scale(${LDN_AT.s}) translate(${-LDN.x} ${-LDN.y})`;
    g.push(`<clipPath id="ldn${p.key}"><rect x="${LDN.x}" y="${LDN.y}" width="${LDN.w}" height="${LDN.h}"/></clipPath>`);
    g.push(`<rect class="mapbox" x="${LDN_AT.x}" y="${LDN_AT.y}" width="${LDN.w*LDN_AT.s}" height="${LDN.h*LDN_AT.s}"/>`);
    g.push(`<g transform="${T}" clip-path="url(#ldn${p.key})">${inLdn.map(pathEl).join("")}${
      inLdn.filter(s=>s[0]&&s[0]===selCode).map(s=>`<path class="mapsel" d="${s[1]}"/>`).join("")}</g>`);
    g.push(`<text class="maplbl" x="${LDN_AT.x}" y="${LDN_AT.y-u(7)}" font-size="${u(11)}">London</text>`);
    g.push(`<rect class="mapbox" x="${LDN.x}" y="${LDN.y}" width="${LDN.w}" height="${LDN.h}"/>`);
  }

  /* the key, in the open sea east of England: one row per shade with the
     range it covers, and the grey for areas with no figure */
  const nb=B.cuts.length+1, rh=+u(17), kx=KEY_AT.x, ky=KEY_AT.y;
  const lows=[B.min,...B.cuts], rows=lows.map((lo,i)=>[ramp[Math.round(i*(ramp.length-1)/Math.max(1,nb-1))],
    `${fmtShort(lo)} – ${fmtShort(i<nb-1?lows[i+1]:B.max)}`]);
  g.push(`<text class="maplbl" x="${kx}" y="${ky-rh*0.6}" font-size="${u(10.5)}">${year}${set.meta.unit.length<=8?" · "+esc(set.meta.unit):""}</text>`);
  [...rows,[null,"No figure"]].forEach(([c,t],i)=>{
    const y=ky+i*rh;
    g.push(`<rect ${c?`fill="${c}"`:`class="mapna"`} x="${kx}" y="${y}" width="${u(11)}" height="${u(11)}" rx="${u(2)}"/>`);
    g.push(`<text class="maplbl" x="${kx+ +u(17)}" y="${(y+ +u(9.5)).toFixed(0)}" font-size="${u(10.5)}">${esc(t)}</text>`);
  });

  const svg=`<svg class="mapsvg" viewBox="0 0 ${VW} ${VH}" style="height:${Hpx}px" role="img" aria-label="${esc(set.name)} by area, ${year}, map">${g.join("")}</svg>`;

  /* beside the map: find an area, and the top and bottom five */
  const ranked=Object.entries(map).sort((a,b)=>b[1]-a[1]);
  const row=([c,v])=>`<button class="msrow${c===selCode?" on":""}" data-probe="${esc(set.id)}" data-area="${c}">
      <span class="msw" style="background:${colourOf(v)}"></span><span class="msn">${esc(areaName(ix,c))}</span><span class="msv">${fmt(v)}</span></button>`;
  MAPFIND.set(p.key,{id:set.id, list:Object.keys(all).map(c=>[c,areaName(ix,c),all[c]]).sort((a,b)=>a[1].localeCompare(b[1]))});
  const lvlName=((ix.levelNames||{})[lvl]||lvl).toLowerCase();
  const notes=[];
  if(Object.keys(extra).length) notes.push("Shire counties are shown as a whole, with the county's figure.");
  else if(lvl==="la") notes.push("Grey areas are two-tier counties: their councils are under Districts and Counties.");
  if(lvl==="region"||lvl==="cauth"||lvl==="county"||lvl==="district") notes.push(`Grey areas are not ${lvlName}.`);
  const side=`<div class="mapside">
    <div class="msfind"><label for="mfq${p.key}">Find an area</label>
      <input id="mfq${p.key}" class="mfq" type="search" data-act="mapq" autocomplete="off" spellcheck="false"
        placeholder="${selCode?esc(areaName(ix,selCode)):"Type an area name"}" aria-controls="mfr${p.key}">
      <div class="mfres" id="mfr${p.key}" role="listbox" hidden></div></div>
    ${ranked.length<=12 ? `<div class="mslbl">Highest first</div>${ranked.map(row).join("")}`
      : `<div class="mslbl">Highest</div>${ranked.slice(0,5).map(row).join("")}
         <div class="mslbl">Lowest</div>${ranked.slice(-5).reverse().map(row).join("")}`}
    <div class="msnote">${["Click an area to see its figure, its rank and how it compares.",...notes].map(esc).join(" ")}</div>
    <div class="msnote">Boundaries: Office for National Statistics, OGL v3.0. Contains OS data © Crown copyright and database right ${new Date().getFullYear()}.</div>
  </div>`;
  return `<div class="mapwrap">${svg}${side}</div>`;
}
/* short numbers for the key, where space is tight */
function fmtShort(v){
  const a=Math.abs(v);
  return a>=1e6?(v/1e6).toFixed(a>=1e7?0:1)+"m" : a>=1e4?(v/1e3).toFixed(0)+"k" : a>=1000?(v/1e3).toFixed(1)+"k" : fmt(v);
}

function renderAreaHeat(p,{set,ix,d,lvl}){
  const len=Math.max(...Object.values(d.values).map(v=>v.length));
  const lo=Math.max(p.from,d.start), hi=Math.min(p.to,d.start+len-1);
  if(hi<lo) return areaBlank("Outside the published range",
    `This indicator runs ${d.start}–${d.start+len-1}. Move the chart's range into it.`);
  const years=[];
  for(let y=lo;y<=hi;y++) years.push(y);

  const codes=Object.keys(d.values).filter(c=>(ix.areas[c]||{}).l===lvl);
  const rows=codes.map(c=>[c,areaName(ix,c),years.map(y=>d.values[c][y-d.start])])
                  .filter(r=>r[2].some(v=>v!=null));
  if(!rows.length) return areaBlank("Nothing at this level","No areas at this level carry figures across this range.");

  const last=r=>[...r[2]].reverse().find(v=>v!=null);
  rows.sort(p.asort==="name" ? (a,b)=>a[1].localeCompare(b[1])
          : p.asort==="asc"  ? (a,b)=>(last(a)??0)-(last(b)??0)
          :                    (a,b)=>(last(b)??0)-(last(a)??0));

  const flat=rows.flatMap(r=>r[2]).filter(v=>v!=null);
  const mn=Math.min(...flat), mx=Math.max(...flat);
  const ramp=RAMP();
  /* Sequential, one hue: the lightest step means "near the bottom of the range"
     and is allowed to recede toward the surface. */
  const fill=v=>v==null?"none":ramp[Math.max(0,Math.min(ramp.length-1,
    Math.round(((v-mn)/Math.max(1e-9,mx-mn))*(ramp.length-1))))];

  const ROW=16, TOP=AREA_PAD;
  const cw=(W-AREA_ML-AREA_MR)/years.length;
  const H=TOP+rows.length*ROW+6;
  const g=[], gh=[];
  /* Legend first — a value scale with no key is a picture, not a chart. */
  gh.push(`<text class="areahead" x="0" y="13">${esc(set.meta.unit)}</text>`);
  ramp.forEach((c,i)=>gh.push(`<rect x="${(AREA_ML+i*16).toFixed(1)}" y="20" width="15" height="7" fill="${c}"/>`));
  gh.push(`<text class="axlabel" x="${(AREA_ML-10)}" y="26.5" text-anchor="end">${fmt(mn)}</text>`);
  gh.push(`<text class="axlabel" x="${(AREA_ML+ramp.length*16+6)}" y="26.5">${fmt(mx)}</text>`);
  years.forEach((y,i)=>{ if(years.length<=14 || i%Math.ceil(years.length/12)===0)
    gh.push(`<text class="axlabel" x="${(AREA_ML+i*cw+cw/2).toFixed(1)}" y="${AREA_HEAD-9}" text-anchor="middle">${String(y).slice(2)}</text>`); });
  gh.push(`<line class="gridline" x1="0" y1="${AREA_HEAD-0.5}" x2="${W}" y2="${AREA_HEAD-0.5}"/>`);
  rows.forEach((r,i)=>{
    const y=TOP+i*ROW;
    areaLabel(g,y+ROW/2-2,r[1]);
    r[2].forEach((v,j)=>{
      if(v==null) return;
      /* 2px surface gap between cells, so adjacent tones read as separate
         marks rather than one continuous wash. */
      g.push(`<rect x="${(AREA_ML+j*cw).toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1,cw-2).toFixed(1)}" height="${ROW-2}" fill="${fill(v)}" rx="1"><title>${esc(r[1])} ${years[j]}: ${fmt(v)}</title></rect>`);
    });
    g.push(`<rect class="hit" data-probe="${esc(set.id)}" data-area="${r[0]}" x="0" y="${y.toFixed(1)}" width="${W}" height="${ROW-2}"/>`);
  });
  return areaSvg(H,g,`${set.name} by area and year, ${lo} to ${hi}`,gh);
}

  /* the polyoptic eye — open for light, lidded shut for dark */
  eyeOpen:'<svg viewBox="0 0 100 70" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round"><path d="M8 35 Q50 -12 92 35 Q50 82 8 35 Z"/><g fill="currentColor" stroke="none"><rect x="33" y="31" width="6" height="16" rx="1"/><rect x="44" y="23" width="6" height="24" rx="1"/><rect x="55" y="28" width="6" height="19" rx="1"/><rect x="66" y="19" width="6" height="28" rx="1"/></g></svg>',
