# ingest/series.yaml — catalogue metadata for Polyoptic
#
# Names, units, kinds, sources, year bases, geographic coverage and known
# discontinuities are as published. The `id` under `source:` is a PLACEHOLDER
# in every entry — resolve each one against the live catalogue before trusting it.
#
# kind decides transform legality in the browser:
#   cash  -> real terms, per person, % of GDP
#   count -> per person, rebase
#   level -> per person, rebase
#   index -> rebase only
#   rate / pct / ratio -> year-on-year and moving average only

