  # ── TRANSPORT ────────────────────────────────────────────
  # DfT's road safety tables carry deaths, all casualties and traffic volume on
  # one sheet, which is why all three come from the same workbook. Note the
  # geography: these are Great Britain, not UK — Northern Ireland reports
  # separately, and the explorer's mismatch warning should fire when they are
  # put next to a UK series.
  - id: roaddeaths
    name: Road deaths
    topics: [transport]
    unit: deaths per year
    kind: count
    geography: Great Britain
    year_basis: calendar
    source: DfT road safety statistics
    source_url: https://www.gov.uk/government/statistical-data-sets/road-safety-statistics-data-tables
    source_type: spreadsheet
    fetch: &ras
      url: https://assets.publishing.service.gov.uk/media/6a6398df9a419980593b2bdf/ras0101.ods
      sheet: Casualties
      year_column: Year
      value_column: All road users (killed)
    notes:
      - "Deaths reported to the police on the STATS19 form. Fatalities are near-completely reported, so this is the most reliable series in the road safety set"
      - "The 1926 start predates driving tests, MOTs and speed limits on most roads; deaths peaked in 1966 at over 7,900 with a fraction of today's traffic"

  - id: casualties
    name: Road casualties, all severities
    topics: [transport]
    unit: casualties per year
    kind: count
    geography: Great Britain
    year_basis: calendar
    source: DfT road safety statistics
    source_url: https://www.gov.uk/government/statistical-data-sets/road-safety-statistics-data-tables
    source_type: spreadsheet
    fetch:
      <<: *ras
      value_column: All road users (all severities)
    notes:
      - "Police-reported casualties only. DfT says plainly that non-fatal injuries are substantially under-reported — comparison with survey and hospital data suggests a large share never reaches a STATS19 form — so treat the level as a floor and the trend as the useful part"
      - "Slight-injury counts are also affected by forces changing their injury-reporting systems from 2016, which raised recorded severity without any change on the road"

  - id: traffic
    name: Road traffic
    topics: [transport]
    unit: billion vehicle miles
    kind: count
    geography: Great Britain
    year_basis: calendar
    source: DfT road safety statistics
    source_url: https://www.gov.uk/government/statistical-data-sets/road-safety-statistics-data-tables
    source_type: spreadsheet
    fetch:
      <<: *ras
      value_column: All traffic (billion vehicle miles)
    notes:
      - "The denominator the casualty figures should usually be read against: traffic has roughly quadrupled since 1950 while deaths have fallen by around three quarters"

  - id: busjourneys
    name: Local bus passenger journeys
    topics: [transport]
    unit: million journeys per year
    kind: count
    geography: Great Britain
    year_basis: financial
    source: DfT bus statistics
    source_url: https://www.gov.uk/government/statistical-data-sets/bus-statistics-data-tables
    source_type: spreadsheet
    fetch:
      url: https://assets.publishing.service.gov.uk/media/69c11f97cfa346b9d4704a50/bus01.ods
      sheet: BUS01a
      year_column: Year ending March
      value_column: Great Britain
    notes:
      - "Years ending March, so the year labelled 2021 is the one the pandemic hit hardest — journeys roughly halved and have not returned to the 2005 level"

  # ── ENVIRONMENT & ENERGY ─────────────────────────────────
  # Three shares off the same Energy Trends table. They deliberately do not sum
  # to 100: low-carbon includes renewables plus nuclear, and net imports sit
  # outside all three.
  - id: renewshare
    name: Renewable share of electricity generation
    topics: [environment]
    unit: "% of generation"
    kind: rate
    geography: UK
    year_basis: calendar
    source: DESNZ Energy Trends
    source_url: https://www.gov.uk/government/statistics/electricity-section-5-energy-trends
    source_type: spreadsheet
    fetch: &et51
      url: https://assets.publishing.service.gov.uk/media/6a6a0f222607fd81ff068812/ET_5.1_JUL_26.xlsx
      sheet: Annual
      layout: wide
      label_column: 1
      year_header_row: 133
      row_match: Renewable generation share [note 2]
    notes:
      - "Share of electricity *generated*, not of energy consumed. Electricity is roughly a fifth of UK final energy use, so a renewables share above half does not mean half the country's energy is renewable"
      - "Includes biomass, which is counted as renewable in this series but is contested as a carbon-neutral fuel"

  - id: lowcarbon
    name: Low-carbon share of electricity generation
    topics: [environment]
    unit: "% of generation"
    kind: rate
    geography: UK
    year_basis: calendar
    source: DESNZ Energy Trends
    source_url: https://www.gov.uk/government/statistics/electricity-section-5-energy-trends
    source_type: spreadsheet
    fetch:
      <<: *et51
      row_match: Low-carbon generation share [note 2]
    notes:
      - "Renewables plus nuclear. Overlaps the renewables series rather than adding to it"

  - id: fossilshare
    name: Fossil fuel share of electricity generation
    topics: [environment]
    unit: "% of generation"
    kind: rate
    geography: UK
    year_basis: calendar
    source: DESNZ Energy Trends
    source_url: https://www.gov.uk/government/statistics/electricity-section-5-energy-trends
    source_type: spreadsheet
    fetch:
      <<: *et51
      row_match: Fossil fuel generation share [note 2]
    notes:
      - "Coal, oil and gas. Coal's share went from around a third of generation in 1998 to nil when the last coal plant closed in 2024, so most of what remains here is gas"

  # ══════════════════════════════════════════════════════════
  # ONS Explore Local Statistics
  #
  # One endpoint, one indicator slug per series (see fetch_els in
  # ingest.py). These are the UK-level rows of a service whose real
  # subject is local geography — the same slugs drive data/areas.json,
  # so anything added here gains a map's worth of detail for free.
  #
  # Generated with `python ingest/ingest.py --els-catalogue` and then
  # edited: short ids, this catalogue's topic tags, and the notes that
  # tie a new series to one already here. Most notes below are ONS's
  # own caveats, carried through rather than paraphrased.
  # ══════════════════════════════════════════════════════════

  # ── ECONOMY — from ONS Explore Local Statistics ─────────────

  - id: firms
    name: Active businesses
    topics: [economy]
    unit: "number of enterprises"
    kind: count
    geography: UK
    year_basis: calendar
    source: ONS Explore Local Statistics
    source_url: https://www.ons.gov.uk/businessindustryandtrade/business/activitysizeandlocation/bulletins/businessdemography/previousreleases
    publisher: ONS
    source_type: els
    fetch: {indicator: active-businesses}
    notes:
      - "The starting point for demography is the concept of a population of active businesses in a reference year (t). These are defined as businesses that had either turnover or employment at any time during the reference period."

  - id: firmbirths
    name: Business births
    topics: [economy]
    unit: "%"
    kind: rate
    geography: UK
    year_basis: calendar
    source: ONS Explore Local Statistics
    source_url: https://www.ons.gov.uk/businessindustryandtrade/business/activitysizeandlocation/bulletins/businessdemography/previousreleases
    publisher: ONS
    source_type: els
    fetch: {indicator: business-births}
    notes:
      - "A birth is identified as a business that was present in year t, but did not exist in year t-1 or t-2. Births are identified by making comparison of annual active population files and identifying those present in the latest file, but not the two previous ones."
      - "The birth rate is calculated using the number of births as a proportion of the active businesses."

  - id: firmdeaths
    name: Business deaths
    topics: [economy]
    unit: "%"
    kind: rate
    geography: UK
    year_basis: calendar
    source: ONS Explore Local Statistics
    source_url: https://www.ons.gov.uk/businessindustryandtrade/business/activitysizeandlocation/bulletins/businessdemography/previousreleases
    publisher: ONS
    source_type: els
    fetch: {indicator: business-deaths}
    notes:
      - "A death is defined as a business that was on the active file in year t, but was no longer present in the active file in t+1 and t+2. In order to provide an early estimate of deaths, an adjustment has been made to the latest two years deaths to allow for reactivations. These figures are provisional and subject to revision."
      - "The death rate is calculated using the number of deaths as a proportion of the active businesses."

  - id: claimants
    name: Claimant Count
    topics: [work]
    unit: "%"
    kind: rate
    geography: UK
    year_basis: calendar
    source: ONS Explore Local Statistics
    source_url: https://www.ons.gov.uk/employmentandlabourmarket/peopleinwork/employmentandemployeetypes/bulletins/regionallabourmarket/previousreleases
    publisher: ONS
    source_type: els
    fetch: {indicator: claimant-count}
    notes:
      - "Not the unemployment rate: it counts benefit claims, which respond to eligibility rules as well as to the labour market. Read it against the LFS unemployment series rather than instead of it"
      - "Published by ONS as an experimental statistic — the method is still under development"
      - "Proportions of people claiming are the number of claimants in a year divided by the population aged from 16 to 64 from mid-year 2023 population estimates."
      - "The experimental Claimant Count consists of claimants of Jobseekers Allowance (JSA) and some Universal Credit (UC) Claimants. The UC claimants that are included are 1) those that were recorded as not in employment (May 2013-April 2015), and 2) those claimants of Universal Credit who are required to search for work, i.e. within the Searching for Work conditionality regime as defined by the Department for Work & Pensions (from April 2015 onwards)."
      - "The count is based on live claims on the second Thursday of the reference month."
      - "Under certain circumstances, some people are able to claim both contribution-based JSA and UC at the same time. Consequently, there has been a small amount of double counting. Information from DWP suggests this double counting increased at the start of the pandemic and has stabilised at approximately 1.0 to 1.5% of the Claimant Count."
      - "Northern Ireland local government districts Claimant Count figures are only available from 2013 onwards."

  - id: inactive
    name: Economic inactivity rate
    topics: [work]
    unit: "%"
    kind: rate
    geography: Great Britain
    year_basis: calendar
    source: ONS Explore Local Statistics
    source_url: https://www.ons.gov.uk/employmentandlabourmarket/peopleinwork/employmentandemployeetypes/datasets/li01regionallabourmarketlocalindicatorsforcountieslocalandunitaryauthorities
    publisher: ONS
    source_type: els
    fetch: {indicator: economic-inactivity-rate}
    notes:
      - "ONS titles this indicator Great Britain but serves the top-level row as 'United Kingdom'. Published here on the narrower claim in the title"
      - "Published by ONS as an experimental statistic — the method is still under development"
      - "Calculation of economic inactivity rate: number of economically inactive people aged 16 to 64 years divided by the population aged 16 to 64 years. Population is the sum of employed plus unemployed plus inactive."
      - "The ongoing challenges with response rates, response levels and weighting approach mean that labour market statistics based on both the Labour Force Survey (LFS) and Annual Population Survey (APS) will be considered [official statistics in development](https://osr.statisticsauthority.gov.uk/policies/official-statistics-policies/official-statistics-in-development/) until further review. Because of increased volatility of LFS and APS estimates, estimates of change should be treated with additional caution."
      - "Updates to this indicator have been temporarily suspended until the APS reweighting is implemented in 2026."

  - id: emprate
    name: Employment rate
    topics: [work]
    unit: "%"
    kind: rate
    geography: Great Britain
    year_basis: calendar
    source: ONS Explore Local Statistics
    source_url: https://www.ons.gov.uk/employmentandlabourmarket/peopleinwork/employmentandemployeetypes/datasets/li01regionallabourmarketlocalindicatorsforcountieslocalandunitaryauthorities
    publisher: ONS
    source_type: els
    fetch: {indicator: employment-rate}
    notes:
      - "ONS titles this indicator Great Britain but serves the top-level row as 'United Kingdom'. Published here on the narrower claim in the title"
      - "Published by ONS as an experimental statistic — the method is still under development"
      - "Calculation of employment rate: number of employed people aged 16 to 64 years divided by the population aged 16 to 64 years. Population is the sum of employed plus unemployed plus inactive."
      - "The ongoing challenges with response rates, response levels and weighting approach mean that labour market statistics based on both the Labour Force Survey (LFS) and Annual Population Survey (APS) will be considered [official statistics in development](https://osr.statisticsauthority.gov.uk/policies/official-statistics-policies/official-statistics-in-development/) until further review. Because of increased volatility of LFS and APS estimates, estimates of change should be treated with additional caution."
      - "Updates to this indicator have been temporarily suspended until the APS reweighting is implemented in 2026."

  - id: foodoutlets
    name: Food outlets
    topics: [health, economy]
    unit: "per 1,000 population"
    kind: rate
    geography: UK
    year_basis: calendar
    source: ONS Explore Local Statistics
    source_url: https://www.ons.gov.uk/businessindustryandtrade/business/activitysizeandlocation/bulletins/ukbusinessactivitysizeandlocation/previousreleases
    publisher: ONS
    source_type: els
    fetch: {indicator: food-outlets}
    notes:
      - "The data for this indicator is sourced from [Nomis](https://www.nomisweb.co.uk/query/construct/summary.asp?reset=yes&mode=construct&dataset=142&version=0), based on an extract from the Inter-Departmental Business Register (IDBR). This dataset records the number of enterprises that were live at a reference point in March each year."
      - "An enterprise can be thought of as the overall business, made up of all the individual sites or workplaces. It is defined as the smallest combination of legal units (generally based on VAT and/or PAYE records) that has a certain degree of autonomy within an enterprise group."
      - "Please refer to the [UK business; activity, size and location quality and methods guide](https://www.ons.gov.uk/businessindustryandtrade/business/activitysizeandlocation/methodologies/ukbusinessactivitysizeandlocationqmi) for more information."
      - "Mid-year population estimates for the period 2010 to 2024 have been used to calculate rates per 1,000 population (sourced from [Nomis](https://www.nomisweb.co.uk/datasets/pestsyoala)). The most recent (2024) population estimates have been used to produce rates for the 2025 data."

  - id: gdhi
    name: Gross disposable household income per head
    topics: [work, housing]
    unit: "£"
    kind: money_cash
    geography: UK
    year_basis: calendar
    source: ONS Explore Local Statistics
    source_url: https://www.ons.gov.uk/economy/regionalaccounts/grossdisposablehouseholdincome/bulletins/regionalgrossdisposablehouseholdincomegdhi/previousreleases
    publisher: ONS
    source_type: els
    fetch: {indicator: gross-disposable-household-income-per-head}
    notes:
      - "Figures for 2023 are provisional, as national estimates have not been through supply and use balancing at the time of the data source publication."

  - id: gdpheadreal
    name: Gross domestic product per head in chained volume measures
    topics: [economy]
    unit: "£"
    kind: money_real
    geography: UK
    year_basis: calendar
    source: ONS Explore Local Statistics
    source_url: https://www.ons.gov.uk/economy/grossdomesticproductgdp/bulletins/regionaleconomicactivitybygrossdomesticproductuk/previousreleases
    publisher: ONS
    source_type: els
    fetch: {indicator: gross-domestic-product-per-head-chained-volume-measure}
    notes:
      - "Chained volume measures — real terms, and the series to use for 'are we better off', with the cash series alongside to show how much of the nominal rise was prices"
      - "This time series has the effects of inflation removed by considering changes in quantity between consecutive periods, holding prices from previous periods constant and is most useful for monitoring growth over time within any given area."
      - "2023 data are provisional."
      - "Data for the City of London has been excluded from the visualisations on this service due to its very high GDP figures and very low population, which distort the overall representation. Please refer to the accompanying dataset below or the [data source](https://www.ons.gov.uk/economy/grossdomesticproductgdp/bulletins/regionaleconomicactivitybygrossdomesticproductuk/previousreleases) for this information."

  - id: gdphead
    name: Gross domestic product per head at current market prices
    topics: [economy]
    unit: "£"
    kind: money_cash
    geography: UK
    year_basis: calendar
    source: ONS Explore Local Statistics
    source_url: https://www.ons.gov.uk/economy/grossdomesticproductgdp/bulletins/regionaleconomicactivitybygrossdomesticproductuk/previousreleases
    publisher: ONS
    source_type: els
    fetch: {indicator: gross-domestic-product-per-head-current-market-price}
    notes:
      - "Cash prices, so most of the rise before the mid-2000s is inflation. The chained volume series is the real-terms answer to the same question"
      - "This time series includes the effects of inflation and is most useful for comparison of levels between different areas."
      - "2023 data are provisional."
      - "Data for the City of London has been excluded from the visualisations on this service due to its very high GDP figures and very low population, which distort the overall representation. Please refer to the accompanying dataset below or the [data source](https://www.ons.gov.uk/economy/grossdomesticproductgdp/bulletins/regionaleconomicactivitybygrossdomesticproductuk/previousreleases) for this information."

  - id: paymed
    name: Gross median weekly pay
    topics: [work]
    unit: "£"
    kind: money_cash
    geography: UK
    year_basis: calendar
    source: ONS Explore Local Statistics
    source_url: https://www.ons.gov.uk/employmentandlabourmarket/peopleinwork/earningsandworkinghours/bulletins/annualsurveyofhoursandearnings/previousreleases
    publisher: ONS
    source_type: els
    fetch: {indicator: gross-median-weekly-pay}
    notes:
      - "The median, and residence-based — the existing average weekly earnings series is a workplace-based mean over a different population, so the two are not alternative estimates of the same thing and the gap between them is the point"
      - "Assembled by ONS from more than one collection (Office for National Statistics, Northern Ireland Statistics and Research Agency), so the nations are not always on identical definitions"
