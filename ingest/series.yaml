      - "A snapshot of live cases, not receipts minus disposals. It leaves out cases where a defendant has absconded and has a live bench warrant"
      - "The whole series was re-stated in 2025 on MoJ's new One Crown data pipeline, so it will not match figures quoted from earlier editions. Data before 2016 is on an older method and not in this table"
      - "The backlog was falling until 2018, jumped when jury trials stopped in the pandemic, and has kept rising since to a record above 80,000"

