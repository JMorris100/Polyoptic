# ══════════════════════════════════════════════════════════════
# Polyoptic series catalogue
#
# Adding an indicator means adding an entry here. No code changes.
# That's the whole point of the series-first model: the catalogue is
# data, the pipeline is generic, and the front end is a view over both.
#
# Every identifier below was verified against the live catalogues on
# 2026-08-05 (ONS website timeseries, ONS CMD/beta API, DfE EES API)
# and 2026-08-06 (the spreadsheet sources).
#
# The `spreadsheet` adapter landed on 2026-08-06, which is what makes the
# borders / crime / tax block below possible: the Home Office, MoJ, HMRC
# and FCDO publish .xlsx and .ods workbooks and nothing else.
#
# Optional per-series keys, beyond the required ones:
#
#   publisher:       short agency used by the verify page's Source facet.
#   publisher_full:  corporate author used by the explorer's Harvard
#                    citations.
#   published:       edition year, for sources where a specific edition is
#                    the right thing to cite (the Pink Book, say). Leave it
#                    out for continuously-revised datasets — the front end
#                    then cites the version consulted, via the fetch date.
#
# The first two are derived from the leading agency in `source` (see
# PUBLISHERS in ingest.py) and only need setting when that derivation is
# wrong. `published` is never derived.
# ══════════════════════════════════════════════════════════════

eras:
  - {from: 1997, to: 2010, party: Labour,       colour: "#E4003B"}
  - {from: 2010, to: 2015, party: Coalition,    colour: "#7E6FA8"}
  - {from: 2015, to: 2024, party: Conservative, colour: "#0087DC"}
  - {from: 2024, to: 2026, party: Labour,       colour: "#E4003B"}

# Institute for Government Ministers Database (CC-BY-4.0) is the source
# to automate this from once you want Secretary of State markers too.
pms:
  - [1997, Blair]
  - [2007, Brown]
  - [2010, Cameron]
  - [2016, May]
  - [2019, Johnson]
  - [2022, Truss]
  - [2023, Sunak]
  - [2024, Starmer]

# ──────────────────────────────────────────────────────────────
# Reference series. These power the transforms and must be present
# for real-terms, per-person and %-of-GDP to work anywhere.
#
# The deflator is the ONS *implied* GDP deflator (L8GG, quarterly,
# calendar years) rather than the HMT financial-year deflator, which
# is only published as a spreadsheet. The difference is small but
# real; swap it once a spreadsheet adapter exists.
# ──────────────────────────────────────────────────────────────
references:
  population:
    source_type: ons_timeseries
    fetch: {path: peoplepopulationandcommunity/populationandmigration/populationestimates, cdid: UKPOP, dataset: pop, granularity: years}
  deflator:
    source_type: ons_timeseries
    fetch: {path: economy/grossdomesticproductgdp, cdid: L8GG, dataset: qna, granularity: quarters, aggregate: mean}
  gdp:
    source_type: ons_timeseries
    fetch: {path: economy/grossdomesticproductgdp, cdid: YBHA, dataset: qna, granularity: years}

# ──────────────────────────────────────────────────────────────
# Launch set. Deliberately awkward pairs — different geographies,
# different year bases, different units — so the schema gets
# exercised properly from day one rather than at series fifty.
# ──────────────────────────────────────────────────────────────
series:

  # ── HOUSING ──────────────────────────────────────────────
  - id: rents
    name: Private rents index (IPHRP)
    topics: [housing, work]
    unit: index, Jan 2015=100
    kind: index
    geography: UK
    year_basis: calendar
    source: ONS Index of Private Housing Rental Prices
    source_url: https://www.ons.gov.uk/economy/inflationandpriceindices/bulletins/indexofprivatehousingrentalprices/previousReleases
    licence: OGL v3.0
    source_type: ons_beta
    fetch:
      dataset: index-private-housing-rental-prices
      edition: time-series
      version: latest
      dimensions:
        administrative-geography: K02000001
        index-and-year-change: index
    discontinuities:
      - {year: 2025, label: "IPHRP ends Mar 2025, replaced by PIPR", note: "IPHRP was discontinued in March 2025 and replaced by the Price Index of Private Rents (PIPR); the final year is a partial one"}

  # ── ECONOMY ──────────────────────────────────────────────
  - id: cpih
    name: CPIH
    topics: [work]
    unit: index, 2015=100
    kind: index
    geography: UK
    year_basis: calendar
    source: ONS
    source_url: https://www.ons.gov.uk/economy/inflationandpriceindices/timeseries/l522/mm23
    source_type: ons_timeseries
    fetch: {path: economy/inflationandpriceindices, cdid: L522, dataset: mm23, granularity: years}

  - id: unemp
    name: Unemployment rate
    topics: [work]
    unit: "% of workforce"
    kind: rate
    geography: UK
    year_basis: calendar
    source: ONS Labour Force Survey
    source_url: https://www.ons.gov.uk/employmentandlabourmarket/peoplenotinwork/unemployment/timeseries/mgsx/lms
    source_type: ons_timeseries
    fetch: {path: employmentandlabourmarket/peoplenotinwork/unemployment, cdid: MGSX, dataset: lms, granularity: months}
    discontinuities:
      - {year: 2024, label: "Switch to Transformed LFS", note: "Transition from the Labour Force Survey to the Transformed LFS changes the basis"}

  - id: pay
    name: Average weekly earnings (total pay)
    topics: [work]
    unit: "£ per week, cash"
    kind: money_cash
    geography: UK
    year_basis: calendar
    source: ONS Average Weekly Earnings
    source_url: https://www.ons.gov.uk/employmentandlabourmarket/peopleinwork/earningsandworkinghours/timeseries/kab9/emp
    source_type: ons_timeseries
    fetch: {path: employmentandlabourmarket/peopleinwork/earningsandworkinghours, cdid: KAB9, dataset: emp, granularity: months, aggregate: mean}
    notes:
      - "Whole-economy seasonally adjusted total pay, mean not median; the series starts in 2000"

  - id: debtint
    name: Public sector debt interest
    topics: [economy]
    unit: "£m, cash"
    kind: money_cash
    geography: UK
    year_basis: calendar
    source: ONS Public Sector Finances
    source_url: https://www.ons.gov.uk/economy/governmentpublicsectorandtaxes/publicsectorfinance/timeseries/jw2p/pusf
    source_type: ons_timeseries
    fetch: {path: economy/governmentpublicsectorandtaxes/publicsectorfinance, cdid: JW2P, dataset: pusf, granularity: years}
    notes:
      - "Interest and dividends paid to the private sector and rest of world, excluding public sector banks"

  - id: psnd
    name: Public sector net debt
    topics: [economy]
    unit: "% of GDP"
    kind: ratio
    geography: UK
    year_basis: calendar
    source: ONS Public Sector Finances
    source_url: https://www.ons.gov.uk/economy/governmentpublicsectorandtaxes/publicsectorfinance/timeseries/hf6x/pusf
    source_type: ons_timeseries
    fetch: {path: economy/governmentpublicsectorandtaxes/publicsectorfinance, cdid: HF6X, dataset: pusf, granularity: years}
    notes:
      - "Excluding public sector banks"

  # ── EDUCATION ────────────────────────────────────────────
  # England only, academic years. Both of those differ from most of the
  # economy series above, which is exactly why these belong in the
  # launch set — the mismatch warnings need something to fire on.
  - id: absence
    name: Persistent absence rate
    topics: [education]
    unit: "% of pupil enrolments"
    kind: rate
    geography: England
    year_basis: academic
    source: DfE Explore Education Statistics
    source_url: https://explore-education-statistics.service.gov.uk/find-statistics/pupil-absence-in-schools-in-england
    source_type: dfe_ees
    fetch:
      data_set_id: 019d209c-08dc-74b6-9edb-52d521406fcf
      indicator: TuAuP
      criteria:
        and:
          - {filters: {eq: qYfzj}}       # absence type: persistent absence
          - {filters: {eq: X5Vmf}}       # school type: total
          - {geographicLevels: {eq: NAT}}
    discontinuities:
      - {year: 2020, label: "Recording rules changed", note: "Attendance recording rules and school opening changed; the series is not comparable across this point"}

  - id: gap
    name: Disadvantage attainment gap index (KS2)
    topics: [education]
    unit: index
    kind: index
    geography: England
    year_basis: academic
    source: DfE Explore Education Statistics
    source_url: https://explore-education-statistics.service.gov.uk/find-statistics/key-stage-2-attainment
    source_type: dfe_ees
    fetch:
      data_set_id: 102f9901-7628-f374-bc64-906d075ee072
      indicator: CJeId
      criteria:
        and:
          - {geographicLevels: {eq: NAT}}
    discontinuities:
      - {year: 2020, label: "No KS2 tests 2020, 2021", note: "No KS2 assessments in 2019/20 and 2020/21; the gap on either side is not measured on identical cohorts"}

  - id: pupils
    name: Pupils in schools
    topics: [education]
    unit: pupils
    kind: count
    geography: England
    year_basis: academic
    source: DfE Explore Education Statistics
    source_url: https://explore-education-statistics.service.gov.uk/find-statistics/school-pupils-and-their-characteristics
    source_type: dfe_ees
    fetch:
      data_set_id: 019e7404-df19-71ce-90a8-f2e3db7dd7fa
      indicator: Dbx4Q
      criteria:
        and:
          - {filters: {eq: f0yKY}}       # FSM breakdown: all pupils
          - {filters: {eq: AFuxG}}       # FSM eligibility: total
          - {filters: {eq: UZb0R}}       # school type: total
          - {geographicLevels: {eq: NAT}}

  # ══════════════════════════════════════════════════════════════
  # BORDERS AND MIGRATION
  #
  # Home Office quarterly detailed datasets. Every one of these is a
  # published count, not a modelled estimate, and every one of them is
  # routinely quoted without its denominator — which is the whole reason
  # for putting them next to each other on one axis.
  # ══════════════════════════════════════════════════════════════

  - id: netmig
    name: Net migration (LTIM)
    topics: [migration]
    unit: people per year
    kind: count
    geography: UK
    year_basis: calendar
    source: ONS Long-term international migration
    source_url: https://www.ons.gov.uk/peoplepopulationandcommunity/populationandmigration/internationalmigration/datasets/longterminternationalimmigrationemigrationandnetmigrationflowsprovisional
    source_type: spreadsheet
    fetch:
      url: https://www.ons.gov.uk/file?uri=/peoplepopulationandcommunity/populationandmigration/internationalmigration/datasets/longterminternationalimmigrationemigrationandnetmigrationflowsprovisional/yearendingdecember2025/may2026publicationspreadsheet.xlsx
      sheet: "1"
      header_row: 6
      year_column: Period
      period_column: Period
      value_column: All Nationalities
      filter: {Flow: Net migration}
      aggregate: last
    notes:
      - "Each point is the year ending December, taken from a rolling four-quarter series"
      - "The most recent years are provisional and have been revised substantially in the past — YE June 2024 was first published at 906,000 and now stands well below that"
    discontinuities:
      - {year: 2020, label: "New ONS method", note: "ONS moved from the International Passenger Survey to an administrative-data method; estimates before and after are not produced the same way, and the series only starts in 2012 on the current basis"}

  - id: smallboats
    name: Small boat arrivals
    topics: [migration]
    unit: people detected per year
    kind: count
    geography: UK
    year_basis: calendar
    source: Home Office irregular migration statistics
    source_url: https://www.gov.uk/government/statistical-data-sets/immigration-system-statistics-data-tables
    source_type: spreadsheet
    fetch:
      url: https://assets.publishing.service.gov.uk/media/6a05e3b7ee62840dba48a2c7/illegal-entry-routes-to-the-uk-dataset-mar-2026.xlsx
      sheet: Data_IER_D01
      year_column: Year
      period_column: Quarter
      value_column: Number of detections
      filter: {Method of entry: Small boat arrivals}
    notes:
      - "Detections only. This is not a count of everyone who entered without permission, and the Home Office says so explicitly"
      - "The final year is partial — the release covers quarters up to the year ending March 2026"

  - id: asylumbacklog
    name: Asylum cases awaiting an initial decision
    topics: [migration]
    unit: claims
    kind: count
    geography: UK
    year_basis: calendar
    source: Home Office asylum statistics
    source_url: https://www.gov.uk/government/statistical-data-sets/immigration-system-statistics-data-tables
    source_type: spreadsheet
    fetch:
      url: https://assets.publishing.service.gov.uk/media/6a05df3d5f39105e0848a2be/asylum-claims-awaiting-decision-datasets-mar-2026.xlsx
      sheet: Data_Asy_D03
      year_column: Date (as at...)
      period_column: Date (as at...)
      value_column: Claims
      filter: {Application stage: Pending initial decision}
      aggregate: last
    notes:
      - "A stock, not a flow — the number of claims sitting undecided at the end of the year, so it falls when decisions speed up as well as when claims fall"
      - "Excludes cases pending further review, which are counted separately"

  - id: asylumgrant
    name: Asylum grant rate at initial decision
    topics: [migration]
    unit: "% of initial decisions"
    kind: rate
    geography: UK
    year_basis: calendar
    source: Home Office asylum statistics
    source_url: https://www.gov.uk/government/statistical-data-sets/immigration-system-statistics-data-tables
    source_type: spreadsheet
    fetch:
      url: https://assets.publishing.service.gov.uk/media/6a05df9d97000cb6073e4e25/asylum-claims-datasets-mar-2026.xlsx
      sheet: Data_Asy_D02
      year_column: Year
      value_column: Decisions
      filter:
        Applicant type: Main Applicant
        Case outcome group: [Grant of Protection, Grant of Other Leave, Refused]
      rate:
        Case outcome group: [Grant of Protection, Grant of Other Leave]
    notes:
      - "Main applicants only. Withdrawn and administrative outcomes are excluded from both halves of the fraction"
      - "Initial decisions only — it says nothing about what happens on appeal, where a large share of refusals are overturned"

  - id: hotels
    name: Asylum seekers in hotel accommodation
    topics: [migration]
    unit: people
    kind: count
    geography: UK
    year_basis: calendar
    source: Home Office asylum support statistics
    source_url: https://www.gov.uk/government/statistical-data-sets/immigration-system-statistics-data-tables
    source_type: spreadsheet
    fetch:
      url: https://assets.publishing.service.gov.uk/media/6a05dfcb5f39105e0848a2c2/asylum-seekers-receipt-support-datasets-mar-2026.xlsx
      sheet: Data_Asy_D09
      year_column: Date (as at...)
      period_column: Date (as at...)
      value_column: People
      filter: {Accommodation Type: Contingency Accommodation - Hotel}
      aggregate: last
    notes:
      - "The population in hotels, not the bill. Hotel SPEND is only published in the Home Office annual report and accounts, as a PDF, so it cannot be fetched — see the aid-funded refugee-cost series for the part of it that is machine-readable"
      - "Hotel is identified separately only from December 2022; earlier hotel use is inside a combined Section 98 category"

  - id: returns
    name: Enforced removals
    topics: [migration]
    unit: returns per year
    kind: count
    geography: UK
    year_basis: calendar
    source: Home Office returns statistics
    source_url: https://www.gov.uk/government/statistical-data-sets/immigration-system-statistics-data-tables
    source_type: spreadsheet
    fetch:
      url: https://assets.publishing.service.gov.uk/media/6a05e53022977ebc82cb3fb7/returns-datasets-mar-2026.xlsx
      sheet: Data_Ret_D01
      year_column: Year
      period_column: Quarter
      value_column: Number of returns
      filter: {Return type group: Enforced return}
    notes:
      - "Enforced returns only. Voluntary returns are the larger number and are counted separately — quoting either alone overstates or understates the total"

  - id: returnsall
    name: Returns, all types
    topics: [migration]
    unit: returns per year
    kind: count
    geography: UK
    year_basis: calendar
    source: Home Office returns statistics
    source_url: https://www.gov.uk/government/statistical-data-sets/immigration-system-statistics-data-tables
    source_type: spreadsheet
    fetch:
      url: https://assets.publishing.service.gov.uk/media/6a05e53022977ebc82cb3fb7/returns-datasets-mar-2026.xlsx
      sheet: Data_Ret_D01
      year_column: Year
      period_column: Quarter
      value_column: Number of returns

  # Visa grants by route. The interesting thing about the post-2021 net
  # migration surge is that it is almost entirely visible here, in routes
  # the government designed and controlled, rather than in irregular arrivals.
  - id: visastudy
    name: Study visas granted
    topics: [migration]
    unit: visas granted
    kind: count
    geography: UK
    year_basis: calendar
    source: Home Office entry clearance visa statistics
    source_url: https://www.gov.uk/government/statistical-data-sets/immigration-system-statistics-data-tables
    source_type: spreadsheet
    fetch: &visas
      url: https://assets.publishing.service.gov.uk/media/6a1d5a9f916cd732dcdaad5c/entry-clearance-visa-outcomes-datasets-mar-2026.xlsx
      sheet: Data_Vis_D02
      header_row: 4
      year_column: Year
      period_column: Quarter
      value_column: Decisions
      filter: {Visa type group: Study, Case outcome: Issued}
    notes:
      - "Main applicants and dependants combined"

  - id: visastudydep
    name: Study visas granted to dependants
    topics: [migration]
    unit: visas granted
    kind: count
    geography: UK
    year_basis: calendar
    source: Home Office entry clearance visa statistics
    source_url: https://www.gov.uk/government/statistical-data-sets/immigration-system-statistics-data-tables
    source_type: spreadsheet
    fetch:
      <<: *visas
      filter: {Visa type group: Study, Applicant type: Dependant, Case outcome: Issued}
    notes:
      - "Dependants of students went from roughly 13,000 a year to 143,000 in three years, then collapsed after the January 2024 rule change. Almost nobody predicts this line correctly"

  - id: visawork
    name: Work visas granted
    topics: [migration]
    unit: visas granted
    kind: count
    geography: UK
    year_basis: calendar
    source: Home Office entry clearance visa statistics
    source_url: https://www.gov.uk/government/statistical-data-sets/immigration-system-statistics-data-tables
    source_type: spreadsheet
    fetch:
      <<: *visas
      filter: {Visa type group: Work, Case outcome: Issued}

  - id: visahcw
    name: Health and Care Worker visas granted
    topics: [migration, health]
    unit: visas granted
    kind: count
    geography: UK
    year_basis: calendar
    source: Home Office entry clearance visa statistics
    source_url: https://www.gov.uk/government/statistical-data-sets/immigration-system-statistics-data-tables
    source_type: spreadsheet
    fetch:
      <<: *visas
      filter: {Visa type subgroup: Health and Care Worker, Case outcome: Issued}
    notes:
      - "A route created in August 2020. It went from nothing to the single largest work route and back down again inside five years, entirely through policy decisions"

  # ══════════════════════════════════════════════════════════════
  # MONEY
  # ══════════════════════════════════════════════════════════════

  - id: oda
    name: Overseas aid as a share of national income
    topics: [economy]
    unit: "% of GNI"
    kind: ratio
    geography: UK
    year_basis: calendar
    source: FCDO Statistics on International Development
    source_url: https://www.gov.uk/government/statistics/statistics-on-international-development-provisional-uk-official-development-assistance-spend-2025
    source_type: spreadsheet
    fetch:
      url: https://assets.publishing.service.gov.uk/media/69d4cb4d826d774e7b263e3c/Tables-Statistics-on-International-Development-provisional-UK-ODA-spend-2025.ods
      sheet: Fig1
      header_row: 3
      year_column: Year
      value_column: ODA:GNI ratio (%) Current methodology in given year
    notes:
      - "The 0.7% target was met from 2013 to 2020 and cut to 0.5% in 2021"
      - "The ratio has been propped up since 2022 by aid spent inside the UK on refugees, which counts as ODA under OECD rules — see the in-donor refugee cost series"

  - id: odarefugee
    name: Aid spent on refugees inside the UK
    topics: [economy, migration]
    unit: "£m, cash"
    kind: money_cash
    geography: UK
    year_basis: calendar
    source: FCDO Statistics on International Development
    source_url: https://www.gov.uk/government/statistics/statistics-on-international-development-provisional-uk-official-development-assistance-spend-2025
    source_type: spreadsheet
    fetch:
      url: https://assets.publishing.service.gov.uk/media/69d4cb4d826d774e7b263e3c/Tables-Statistics-on-International-Development-provisional-UK-ODA-spend-2025.ods
      sheet: Fig3
      layout: wide
      year_header_row: 3
      label_column: 0
      row_match: Total in-donor refugee costs in the UK
    notes:
      - "This is the machine-readable slice of asylum accommodation spend: the aid budget charged for housing asylum seekers in the UK, most of it Home Office hotel costs"
      - "It peaked at 28% of the entire aid budget in 2022"

  - id: eugross
    name: Payments to EU institutions, gross
    topics: [economy]
    unit: "£m, cash"
    kind: money_cash
    geography: UK
    year_basis: calendar
    source: ONS Pink Book
    source_url: https://www.ons.gov.uk/economy/nationalaccounts/balanceofpayments/timeseries/gcsm/pb
    source_type: ons_timeseries
    fetch: {path: economy/nationalaccounts/balanceofpayments, cdid: GCSM, dataset: pb, granularity: years}
    notes:
      - "Total UK payments to EU institutions, after the rebate is deducted. The rebate was never actually sent — it came off the bill at source — which is why the £350m a week figure, which added it back on, was never money that could have been spent elsewhere"

  - id: eureceipts
    name: Receipts from EU institutions
    topics: [economy]
    unit: "£m, cash"
    kind: money_cash
    geography: UK
    year_basis: calendar
    source: ONS Pink Book
    source_url: https://www.ons.gov.uk/economy/nationalaccounts/balanceofpayments/timeseries/gcsl/pb
    source_type: ons_timeseries
    fetch: {path: economy/nationalaccounts/balanceofpayments, cdid: GCSL, dataset: pb, granularity: years}
    notes:
      - "Money coming back — farm payments, structural funds, research grants. The gap between this and the gross payment is the net contribution"

  - id: eunet
    name: Net position with EU institutions
    topics: [economy]
    unit: "£m, cash"
    kind: money_cash
    geography: UK
    year_basis: calendar
    source: ONS Pink Book
    source_url: https://www.ons.gov.uk/economy/nationalaccounts/balanceofpayments/timeseries/blzs/pb
    source_type: ons_timeseries
    fetch: {path: economy/nationalaccounts/balanceofpayments, cdid: BLZS, dataset: pb, granularity: years}
    notes:
      - "Negative means the UK paid in more than it got back"

  - id: nondoms
    name: Non-domiciled taxpayers
    topics: [economy]
    unit: individuals
    kind: count
    geography: UK
    year_basis: financial
    source: HMRC statistics on non-domiciled taxpayers
    source_url: https://www.gov.uk/government/statistics/statistics-on-non-domiciled-taxpayers-in-the-uk
    source_type: spreadsheet
    fetch: &nondom
      url: https://assets.publishing.service.gov.uk/media/6a5a3d5b5ca06bf11ccb43fe/NONDOMTABLES.ods
      sheet: Table_2
      header_row: 7
      year_column: Tax Year Ending
      value_column: Number of individuals
      year_offset: -1                    # 'tax year ending 2008' is the 2007-08 year
    notes:
      - "Individuals rounded to the nearest 100 by HMRC"
      - "Non-dom status was abolished from April 2025, so this series ends as a measure of the old regime"

  - id: nondomtax
    name: Tax and NICs paid by non-domiciled taxpayers
    topics: [economy]
    unit: "£m, cash"
    kind: money_cash
    geography: UK
    year_basis: financial
    source: HMRC statistics on non-domiciled taxpayers
    source_url: https://www.gov.uk/government/statistics/statistics-on-non-domiciled-taxpayers-in-the-uk
    source_type: spreadsheet
    fetch:
      <<: *nondom
      value_column: Total Tax and NICs liabilities (£ million)
    notes:
      - "Liabilities, not receipts, and it is the total tax these people pay — not a measure of what the non-dom regime costs, which is a different and much harder number"

  # ══════════════════════════════════════════════════════════════
  # CRIME AND JUSTICE
  # ══════════════════════════════════════════════════════════════

  - id: fno
    name: Foreign nationals in prison
    topics: [crime, migration]
    unit: prisoners
    kind: count
    geography: England and Wales
    year_basis: calendar
    source: MoJ Offender Management Statistics Quarterly
    source_url: https://www.gov.uk/government/statistics/offender-management-statistics-quarterly-january-to-march-2026
    source_type: spreadsheet
    fetch:
      url: https://assets.publishing.service.gov.uk/media/6a69e0e116bc92f51e1a4310/prison-population-2026.ods
      sheet: Table_1_A_26
      layout: wide
      year_header_row: 5
      label_column: 1
      row_match: Foreign nationals
      row_filter: {0: Male and female}
    notes:
      - "The population as at 30 June each year, both sexes, all custody types"
      - "A count, not a share. It has been roughly flat at ten to eleven thousand for a decade while the prison population itself moved, so the percentage and the number tell different stories"

  - id: csew
    name: Crime Survey estimate of crime
    topics: [crime]
    unit: incidents (thousands)
    kind: count
    geography: England and Wales
    year_basis: financial
    source: ONS Crime in England and Wales
    source_url: https://www.ons.gov.uk/peoplepopulationandcommunity/crimeandjustice/datasets/crimeinenglandandwalesappendixtables
    source_type: spreadsheet
    fetch:
      url: https://www.ons.gov.uk/file?uri=/peoplepopulationandcommunity/crimeandjustice/datasets/crimeinenglandandwalesappendixtables/yearendingmarch2026/appendixtablesyemar2026.xlsx
      sheet: Table A1a
      layout: wide
      year_header_row: 8
      label_column: 0
      row_match: ALL CSEW HEADLINE CRIME EXCLUDING FRAUD AND COMPUTER MISUSE
    notes:
      - "Asks people what happened to them, so it counts crime whether or not it was reported. This is the series that shows crime falling by around two thirds since the mid-1990s"
      - "Excludes fraud and computer misuse, which would otherwise dominate the total"
    discontinuities:
      - {year: 2020, label: "Survey paused in pandemic", note: "Face-to-face interviewing stopped during the pandemic; the telephone survey that replaced it is not comparable, so there is a genuine hole here rather than a zero"}

  - id: prc
    name: Police recorded crime
    topics: [crime]
    unit: offences
    kind: count
    geography: England and Wales
    year_basis: financial
    source: ONS Crime in England and Wales (Home Office police recorded crime)
    source_url: https://www.ons.gov.uk/peoplepopulationandcommunity/crimeandjustice/datasets/crimeinenglandandwalesappendixtables
    source_type: spreadsheet
    fetch:
      url: https://www.ons.gov.uk/file?uri=/peoplepopulationandcommunity/crimeandjustice/datasets/crimeinenglandandwalesappendixtables/yearendingmarch2026/appendixtablesyemar2026.xlsx
      sheet: Table A5a
      layout: wide
      year_header_row: 9
      label_column: 1
      row_match: TOTAL RECORDED CRIME - ALL OFFENCES EXCLUDING FRAUD AND COMPUTER MISUSE
