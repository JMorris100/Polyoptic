  # Charge rates by offence type. These come from the open data tables, which
  # are published one workbook per financial year at ~40MB each, so the span is
  # deliberately short — add more URLs below to extend it, at the cost of a
  # slower first build. (Parsed sheets are cached, so only the first run pays.)
  - id: chargeviolence
    name: Charge rate, violence against the person
    topics: [crime]
    unit: "% of recorded offences"
    kind: rate
    geography: England and Wales
    year_basis: financial
    source: Home Office police recorded crime and outcomes open data
    source_url: https://www.gov.uk/government/statistical-data-sets/police-recorded-crime-and-outcomes-open-data-tables
    source_type: spreadsheet
    fetch: &outcomes
      urls:
        - https://assets.publishing.service.gov.uk/media/6a5e57d624d44672cf1b4648/prc-outcomes-open-data-mar2023-tables-230726.xlsx
        - https://assets.publishing.service.gov.uk/media/6a5e57ef30f5842e1f5a5ecf/prc-outcomes-open-data-mar2024-tables-230726.xlsx
        - https://assets.publishing.service.gov.uk/media/6a5e580ec7c34404041b4648/prc-outcomes-open-data-mar2025-tables-230726.xlsx
        - https://assets.publishing.service.gov.uk/media/6a5e586e4763c49e9be693fb/prc-outcomes-open-data-mar2026-tables-230726.xlsx
      sheet: Outcomes open data
      header_row: 1
      year_column: Financial Year
      period_column: Financial Quarter
      value_column: Outcomes for offences that were recorded in the quarter
      filter: {Offence Group: Violence against the person}
      rate: {Outcome Group: Charged/Summonsed}
    notes:
      - "Measured against the offences recorded in the same period, which is the basis the headline charge rate uses. The most recent year is therefore understated — a lot of those investigations are still open, and their outcomes get assigned later"
      - "That lag is not even across offence types. Sexual offences take the longest to investigate, so they are depressed the most in the latest year: on the closed-investigations basis the same year reads roughly twice as high"

