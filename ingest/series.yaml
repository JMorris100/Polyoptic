    geography: England
    year_basis: calendar
    source: MHCLG Rents, lettings and tenancies live tables
    source_url: https://www.gov.uk/government/statistical-data-sets/live-tables-on-rents-lettings-and-tenancies
    publisher: MHCLG
    source_type: spreadsheet
    fetch:
      url: https://assets.publishing.service.gov.uk/media/6a2be263e50716856ed4afc4/Live_Table_600.ods
      sheet: Regional_Data
      layout: wide
      year_header_row: 4
      label_column: 3
      row_match: England
    notes:
      - "Households on local authority housing registers as at 31 March (1 April up to 2018), from live table 600"
      - "Not the number of households waiting for social housing. Councils purge their lists at different intervals, and a household can be on more than one council's list"
      - "Choice-based lettings from 2003 pushed the lists up, because applicants had a reason to register. Since 2012 councils have been able to set their own rules on who qualifies, and many shut people out"
    discontinuities:
      - {year: 2013, label: "Localism Act qualification rules", note: "The Localism Act 2011 let councils decide who qualifies for their register from June 2012. Many removed households with no priority, so most of the fall over the next two years is a change in who counts rather than in need"}

  # ══════════════════════════════════════════════════════════════
  # CRIME AND JUSTICE — national
  # ══════════════════════════════════════════════════════════════

  # Same workbook as `fno`. Table 1.A.1 runs monthly from June 2015;
  # column_match keeps the 30 June column for each year.
  - id: prisonpop
    name: Prison population
    topics: [crime]
    unit: prisoners
    kind: count
    geography: England and Wales
    year_basis: calendar
    source: MoJ Offender Management Statistics Quarterly
    source_url: https://www.gov.uk/government/statistics/offender-management-statistics-quarterly-january-to-march-2026
    publisher: MoJ
    source_type: spreadsheet
    fetch:
      url: https://assets.publishing.service.gov.uk/media/6a69e0e116bc92f51e1a4310/prison-population-2026.ods
      sheet: Table_1_A_1
      layout: wide
      year_header_row: 5
      label_column: 2
      row_match: All custody types
      row_filter: {0: Male and female, 1: All ages}
      column_match: June
    notes:
