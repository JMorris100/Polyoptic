    notes:
      - "Territorial emissions: what is emitted within the UK's borders. Emissions embodied in imports are not counted, and nor are international aviation and shipping"
      - "Covers the seven Kyoto gases, weighted by global warming potential into million tonnes of CO2 equivalent, net of removals by forests and soils"
      - "DESNZ re-estimates the whole series back to 1990 with every release as methods improve, so earlier years change from one edition to the next. The series is always internally consistent; it just won't match older publications"

  - id: recycling
    name: Household recycling rate
    topics: [environment]
    unit: "% of household waste"
    kind: rate
    geography: UK
    year_basis: calendar
    source: Defra UK statistics on waste
    source_url: https://www.gov.uk/government/statistics/uk-waste-data
    publisher: Defra
    publisher_full: Department for Environment, Food & Rural Affairs
    source_type: spreadsheet
    fetch:
      url: https://assets.publishing.service.gov.uk/media/6aac00ba2f29b3888481867d/UK_Statistics_on_Waste_dataset_Sept_2026_accessible.ods
      sheet: Waste_from_Households
      year_column: Year
      value_column: UK
      filter: {Measure: Recycling rate (including IBAm)}
      scale: 100
    notes:
      - "Waste from households sent for recycling, composting or reuse, as a share of all waste from households. This is the UK's headline measure, and the one used for the old EU 50% target"
      - "Includes metal recovered from incinerator bottom ash, which Defra only counts from 2015. A version without it runs back to 2010 and is about one point lower"
      - "Wales recycles well above the UK average (over 55%), so England's rate is a little below the UK figure"

  - id: stormspills
    name: Storm overflow spill events
    topics: [environment]
    unit: monitored spills per year
    kind: count
    geography: England
    year_basis: calendar
    source: Environment Agency event duration monitoring annual returns
    source_url: https://environment.data.gov.uk/dataset/21e15f12-0df8-4bfc-b763-45226c16a8ac
    publisher: Environment Agency
    publisher_full: Environment Agency
    source_type: spreadsheet
    fetch:
      url: https://environment.data.gov.uk/api/file/download?fileDataSetId=c55e170e-3c75-49a5-8026-a961ff94c8e0&fileName=EDM%20Storm%20Overflow%20Annual%20Return%20-%20Long-term%20Trends.zip
      member: EDM Storm Overflow Annual Return - Long-term Trends 2016-2025.xlsx
      sheet: Long-term trends
      layout: wide
      label_column: 1
      year_header_row: 4
      row_match: Total number of monitored spill events3
    notes:
      - "Spills recorded by the monitors water companies fit to storm overflows, counted the EA's way: once a spill starts, everything in the next 12 hours is one spill, and every 24 hours after that is another"
      - "Monitoring was rolled out over these years: 862 overflows reported spill data in 2016, about 12,000 in 2020 and over 14,000 from 2023. Most of the rise before 2020 is more monitors, not more sewage"
      - "Spill counts follow rainfall closely. 2023 and 2024 were very wet years, and 2025 was dry, so year-to-year changes say as much about the weather as about the sewers"
      - "England only, including Welsh Water's overflows in England"
    discontinuities:
      - {year: 2020, label: "Near-full monitoring", note: "Before 2020 only part of the overflow network had event duration monitors, so earlier totals are not comparable; from 2020 most overflows were covered"}
      - {year: 2021, label: "All overflows reported", note: "From 2021 companies had to list every storm overflow, whether or not it had a monitor, and give reasons for low monitor uptime"}

    # ── ECONOMY ─────────────────────────────────────────────
  - id: bankrate
    name: Bank Rate
    topics: [economy]
    unit: "% a year"
    kind: rate
    geography: UK
    year_basis: calendar
    source: Bank of England Bankstats database (IUMABEDR)
    source_url: https://www.bankofengland.co.uk/boeapps/database/fromshowcolumns.asp?Travel=NIxAZxSUx&FromSeries=1&ToSeries=50&DAT=RNG&FD=1&FM=Jan&FY=1975&TD=31&TM=Dec&TY=2026&FNY=Y&CSVF=TT&html.x=66&html.y=26&SeriesCodes=IUMABEDR&UsingCodes=Y&Filter=N&title=IUMABEDR&VPD=Y
    publisher: Bank of England
    publisher_full: Bank of England
    source_type: csv
    fetch:
      url: https://www.bankofengland.co.uk/boeapps/database/_iadb-fromshowcolumns.asp?csv.x=yes&Datefrom=01/Jan/1975&Dateto=31/Dec/2099&SeriesCodes=IUMABEDR&CSVF=TN&UsingCodes=Y&VPD=Y&VFD=N
      year_column: DATE
      value_column: IUMABEDR
      aggregate: mean
    notes:
      - "Annual average: the mean of the Bank's monthly averages of daily Bank Rate. It is not the rate at the end of the year, so a year with cuts late on shows a higher figure than the rate people were paying by December"
      - "The current year is partial — the average of the months published so far"
      - "Before 1981 the Bank's policy rate was Minimum Lending Rate; the Bank publishes the series as one continuous history"
      - "The Monetary Policy Committee has set Bank Rate since 1997, when the Bank became operationally independent"

    # ── POPULATION ──────────────────────────────────────────
  - id: births
    name: Live births
    topics: [migration]
    unit: births per year
    kind: count
    geography: England and Wales
    year_basis: calendar
    source: ONS Births in England and Wales
    source_url: https://www.ons.gov.uk/peoplepopulationandcommunity/birthsdeathsandmarriages/livebirths/datasets/birthsinenglandandwalesbirthregistrations
    source_type: spreadsheet
    fetch:
      url: https://www.ons.gov.uk/file?uri=/peoplepopulationandcommunity/birthsdeathsandmarriages/livebirths/datasets/birthsinenglandandwalesbirthregistrations/2025/2025birthregistrations.xlsx
      sheet: Table_6
      year_column: Year
      value_column: Number of Live births
      filter:
        Country: England, Wales and Elsewhere
        Registration type: [All registration types, All registrations]
        Age of Mother at birth (years): All ages
        Age of Father at birth (years): All ages
    notes:
      - "Births occurring in each year and registered in England and Wales, including a few hundred to mothers usually resident outside England and Wales"
      - "Births peaked at 881,000 in the 1947 baby boom and at 876,000 in 1964. The 2025 figure, 585,000, is the lowest since 1977"
      - "Birth registration was suspended for several months during the 2020 lockdown; ONS counts births by when they happened, so late-registered 2020 births are included"

  - id: deaths
    name: Deaths registered
    topics: [migration]
    unit: deaths per year
    kind: count
    geography: England and Wales
    year_basis: calendar
    source: ONS Deaths registered in England and Wales
    source_url: https://www.ons.gov.uk/peoplepopulationandcommunity/birthsdeathsandmarriages/deaths/datasets/deathsregisteredinenglandandwalesseriesdrreferencetables
    source_type: spreadsheet
    fetch:
      url: https://www.ons.gov.uk/file?uri=/peoplepopulationandcommunity/birthsdeathsandmarriages/deaths/datasets/deathsregisteredinenglandandwalesseriesdrreferencetables/2025/annualdeathregistrations2025.xlsx
      sheet: Table_1
      year_column: Year of registration
      value_column: Number of deaths
      filter:
        Country: England, Wales and Non-residents
        Sex: All People
    notes:
      - "Deaths by the year they were registered, not the year they happened. Most deaths are registered within days, but those referred to a coroner can take months, so a few fall into the following year"
      - "Includes deaths of non-residents that occurred in England and Wales"
      - "A count, not a rate. The population has grown and aged, so a flat number of deaths still means mortality rates have fallen"
      - "The series starts with civil registration in 1838; registration was not compulsory until 1875, so the earliest years undercount"
    discontinuities:
      - {year: 1875, label: "Registration compulsory", note: "Death registration became compulsory under the Births and Deaths Registration Act 1874; earlier years undercount"}

  - id: tfr
    name: Total fertility rate
    topics: [migration]
    unit: children per woman
    kind: ratio
    geography: England and Wales
    year_basis: calendar
    source: ONS Births in England and Wales
    source_url: https://www.ons.gov.uk/peoplepopulationandcommunity/birthsdeathsandmarriages/livebirths/datasets/birthsinenglandandwalesbirthregistrations
    source_type: spreadsheet
    fetch:
      url: https://www.ons.gov.uk/file?uri=/peoplepopulationandcommunity/birthsdeathsandmarriages/livebirths/datasets/birthsinenglandandwalesbirthregistrations/2025/2025birthregistrations.xlsx
      sheet: Table_10
      year_column: Year
      value_column: Age-specific fertility rate
      filter:
        Country: England, Wales and Elsewhere
        Parent: Mother
        Age group (years): [Under 20, 20 to 24, 25 to 29, 30 to 34, 35 to 39, 40 and over]
      # TFR = 5 x the sum of the six five-year age-specific rates (per 1,000 women) / 1,000
      scale: 0.005
    notes:
      - "The average number of children a woman would have if she lived through her childbearing years at this year's birth rates. About 2.1 is needed to replace the population without migration"
      - "Calculated here from ONS's five-year age-specific fertility rates, because ONS no longer publishes the headline rate as a time series. It matches ONS's own figure to within about 0.01 in most years (1.39 for 2025), but can differ by up to 0.05 in a few wartime years"
      - "Rates from 2012 to 2020 were revised in 2023 after the 2021 Census showed more women of childbearing age than previously estimated, so older publications show slightly higher figures for those years"

