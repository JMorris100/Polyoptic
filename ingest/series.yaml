  # ══════════════════════════════════════════════════════════════
  # NATIONAL INDICATORS ADDED OCTOBER 2026
  # Each from the department that publishes it. Most are England only,
  # because the policy area is devolved, and say so in `geography`.
  # ══════════════════════════════════════════════════════════════

  # ── NHS PERFORMANCE (England) ───────────────────────────────
  #
  # The NHS is devolved, so there is no single UK waiting-list or A&E
  # figure; Scotland, Wales and Northern Ireland count differently. These
  # are England only, and say so.

  - id: rttwaitlist
    name: NHS waiting list (RTT incomplete pathways)
    topics: [health]
    unit: pathways waiting
    kind: count
    geography: England
    year_basis: calendar
    source: NHS England Referral to Treatment waiting times
    source_url: https://www.england.nhs.uk/statistics/statistical-work-areas/rtt-waiting-times/
    publisher: NHS England
    source_type: spreadsheet
    fetch:
      url: https://www.england.nhs.uk/statistics/wp-content/uploads/sites/2/2026/10/RTT-Overview-Timeseries-Including-Estimates-for-Missing-Trusts-Aug26-XLS-139K-vjgRdG.xlsx
      sheet: Full Time Series
      header_row: 12
      year_column: 2          # column C, 'Month' — its label sits a row above the header
      period_column: 2
      value_column: Total waiting (mil) with estimates for missing data
      aggregate: last
    notes:
      - "A stock, not a flow — the number of referral-to-treatment pathways still open at the end of the month. Each point is the December figure, except the latest year, which is a partial year taken at the most recent month published"
      - "Counts pathways, not people. One patient waiting for two treatments counts twice; NHS England estimates the number of unique patients is roughly 10–15% lower"
      - "The collection began in 2007; the steep fall through 2008 is real — trusts were clearing long waits ahead of the 18-week target that came in at the end of that year"
      - "Includes NHS England's estimates for trusts that did not submit data in a given month, so the series is not distorted by missing returns"
      - "Consultant-led elective care only. It does not include A&E, cancer, mental health or community waits"
    discontinuities:
      - {year: 2013, label: "Sexual health removed", note: "From April 2013 consultant-led sexual health services were no longer commissioned by the NHS and dropped out of RTT reporting. These were mostly short, week-long pathways"}
      - {year: 2020, label: "COVID-19", note: "Referrals collapsed during the pandemic and elective activity was paused, so the list rose sharply afterwards as delayed demand returned"}
      - {year: 2024, label: "Community services removed", note: "From February 2024 data, community service pathways should no longer be reported in RTT data, which took a small number of pathways off the list. Figures before and after are not on quite the same basis"}

  - id: ae4hour
    name: A&E attendances seen within 4 hours
    topics: [health]
    unit: "% of attendances"
    kind: rate
    geography: England
    year_basis: financial
    source: NHS England A&E attendances and emergency admissions
    source_url: https://www.england.nhs.uk/statistics/statistical-work-areas/ae-waiting-times-and-activity/
    publisher: NHS England
    source_type: spreadsheet
    fetch:
      url: https://www.england.nhs.uk/statistics/wp-content/uploads/sites/2/2026/10/Quarterly-Annual-Time-Series-Sw39Tc.xls   # legacy .xls, read with xlrd
      sheet: Annual Data
      header_row: 17
      year_column: Year
      value_column: Percentage in 4 hours or less (all)
      scale: 100
    notes:
      - "Share of all A&E attendances — major emergency departments, single-specialty units, minor injury units and walk-in centres — that ended in admission, transfer or discharge within four hours of arrival. The operational standard is 95%, and the interim target has been 76–78%"
      - "Including minor injury units flatters the figure. Type 1 (major A&E) performance alone runs far lower: about 61% in 2025-26"
      - "Measures time spent in A&E, not how long patients waited to be seen by a clinician"
    discontinuities:
      - {year: 2015, label: "Monthly collection", note: "The data source switched from the weekly WSitAE return to the monthly MSitAE return from July 2015"}
      - {year: 2019, label: "CRS trial sites excluded", note: "From May 2019 to May 2023, 14 trusts testing new A&E standards (the Clinical Review of Standards) stopped reporting four-hour performance and are excluded from the figure. NHS England warns these years are not directly comparable with others"}
      - {year: 2020, label: "COVID-19", note: "Attendances fell by around a third in 2020-21, which flattered four-hour performance. Booked A&E appointments were also counted from August 2020"}

  - id: gpfte
    name: Fully qualified GPs (full-time equivalent)
    topics: [health]
    unit: full-time equivalent GPs
    kind: count
    geography: England
    year_basis: calendar
    source: NHS England General Practice Workforce statistics
    source_url: https://digital.nhs.uk/data-and-information/publications/statistical/general-and-personal-medical-services
    publisher: NHS England
    source_type: spreadsheet
    fetch:
      url: https://files.digital.nhs.uk/BA/ADF4E3/GPW%20Bulletin%20Tables%20-%20August%202026.xlsx
      sheet: 1a
      layout: wide
      label_column: 0
      row_match: All Fully Qualified GPs (excludes GPs in Training Grade)
      column_match: March
    notes:
      - "Each point is the position at 31 March. Full-time equivalent counts a 37.5-hour week as one, so it falls when GPs cut their hours even if headcount holds steady"
      - "Fully qualified GPs only: partners, salaried GPs, retainers and regular locums. GPs in training are excluded, as are ad-hoc locums, which have been removed from the whole time series since June 2021"
      - "Traditional general practices only — GPs working in walk-in centres, urgent treatment centres, prisons and similar settings are not counted"
      - "Includes NHS England's estimates for practices that did not submit full records. Early years of the collection had lower submission rates and may understate the true figure"
      - "Published by NHS Digital until its 2023 merger with NHS England, and by NHS England since"
    discontinuities:
      - {year: 2017, label: "Locum recording", note: "Recorded GP locum numbers jumped in March 2017 after new recording guidance. NHS England has since estimated the missing locum FTE back to 2015, but the early years rest partly on those estimates"}
      - {year: 2025, label: "Leaver records cleaned", note: "From April 2025, a data-quality measure removed records of staff who had left a practice but not been closed down. NHS England says this may have reduced headline figures from that point"}

  - id: ambcat2
    name: Ambulance Category 2 mean response time
    topics: [health]
    unit: minutes
    kind: ratio
    geography: England
    year_basis: financial
    source: NHS England Ambulance Quality Indicators
    source_url: https://www.england.nhs.uk/statistics/statistical-work-areas/ambulance-quality-indicators/
    publisher: NHS England
    source_type: spreadsheet
    fetch:
      url: https://www.england.nhs.uk/statistics/wp-content/uploads/sites/2/2026/10/AmbSYS-Time-Series-to-20260930-as6t8.xlsx
      sheet: Raw
      header_row: 5
      year_column: Year
      period_column: Month
      value_column: A31
      filter: {Area: ENG, Trust: ""}
      aggregate: mean
      scale: 0.016666666666666666
    notes:
      - "Mean time from a 999 call to an ambulance arriving for Category 2 calls — emergencies such as suspected heart attacks and strokes. The target is 18 minutes, with an interim goal of 30 minutes"
      - "Each year is the simple average of the monthly means, not NHS England's incident-weighted annual figure. The two usually agree to within about ten seconds (2024-25: 35.2 minutes here, 35.4 published), but the gap reaches about 20 seconds in 2020-21 and a minute in the part-year 2017-18"
      - "The first year covers August 2017 to March 2018 only, and the latest year is partial — it runs to the most recent month published"
    discontinuities:
      - {year: 2017, label: "New response standards", note: "The Ambulance Response Programme replaced the old Red 1 and Red 2 targets from August 2017. There is no comparable figure before then"}
      - {year: 2020, label: "COVID-19", note: "Demand fell in the first months of the pandemic, then hospital handover delays drove response times to record highs in 2022-23"}

  # ══════════════════════════════════════════════════════════════
  # HOUSING — national
  #
  # MHCLG live tables. All England only: housing is devolved, and the
  # Welsh, Scottish and Northern Irish equivalents are collected on
  # different definitions, so there is no honest UK total to add up.
  # ══════════════════════════════════════════════════════════════

  # The time-series workbook is quarterly, and the adapter's `aggregate: last`
  # would take December for every year except the latest, which only runs to
  # March. Filtering on the 31 March rows keeps every point on the same date.
  # Add next year's "31 March" label when the file is refreshed.
  - id: tempaccom
    name: Households in temporary accommodation
    topics: [housing]
    unit: households
    kind: count
    geography: England
    year_basis: calendar
    source: MHCLG Statutory homelessness live tables
    source_url: https://www.gov.uk/government/statistical-data-sets/live-tables-on-homelessness
    publisher: MHCLG
    source_type: spreadsheet
    fetch:
      url: https://assets.publishing.service.gov.uk/media/6a82eee63bd75b81e2329a7b/Statutory_Homelessness_England_Time_Series_202603.ods
      sheet: TA1
      header_row: 6
      year_column: Time period
      period_column: Time period
      value_column: Households in TA Total
      filter:
        Time period: ["31 March 1998", "31 March 1999", "31 March 2000", "31 March 2001",
                      "31 March 2002", "31 March 2003", "31 March 2004", "31 March 2005",
                      "31 March 2006", "31 March 2007", "31 March 2008", "31 March 2009",
                      "31 March 2010", "31 March 2011", "31 March 2012", "31 March 2013",
                      "31 March 2014", "31 March 2015", "31 March 2016", "31 March 2017",
                      "31 March 2018", "31 March 2019", "31 March 2020", "31 March 2021",
                      "31 March 2022", "31 March 2023", "31 March 2024", "31 March 2025",
                      "31 March 2026"]
    notes:
      - "Households living in accommodation arranged by their council while it decides or discharges a homelessness duty, as at 31 March each year. A stock, not a flow"
      - "Counts households, not people. Roughly half of them include children, and the number of children in temporary accommodation is published alongside"
      - "Councils that miss a return are estimated by MHCLG from their earlier figures and similar areas, so the national total is partly imputed in some quarters. The latest quarter is provisional"
      - "It more than halved between 2005 and 2011, after a 2005 target to halve it by 2010, and has risen almost every year since to a series high"
    discontinuities:
      - {year: 2018, label: "Homelessness Reduction Act", note: "From April 2018 the Homelessness Reduction Act changed the duties councils owe, and the collection moved from the P1E return to case-level H-CLIC data. MHCLG publishes the total as one series, but the households it covers are not defined identically either side"}

  - id: roughsleep
    name: People sleeping rough on a single night
    topics: [housing]
    unit: people
    kind: count
    geography: England
    year_basis: calendar
    source: MHCLG Rough sleeping snapshot in England
    source_url: https://www.gov.uk/government/statistics/rough-sleeping-snapshot-in-england-autumn-2025
    publisher: MHCLG
    source_type: spreadsheet
    fetch:
      url: https://assets.publishing.service.gov.uk/media/699daa5807d7bff3604d6c20/Rough_sleeping_snapshot_in_England__autumn_2025.ods
      sheet: Table_1_Total
      layout: wide
      year_header_row: 5
      label_column: 3
      row_match: England
    notes:
      - "A snapshot of people seen, or thought to be, sleeping rough on one night between October and November. It is not everyone who sleeps rough over a year, which is several times higher"
      - "Each council chooses whether to count on the street or to estimate with local partners, and picks its own night, so the method is not uniform across areas or years"
      - "Excludes people in hostels, night shelters and other temporary accommodation, who are homeless but not sleeping rough"
    discontinuities:
      - {year: 2020, label: "Everyone In", note: "In March 2020 councils were told to bring everyone sleeping rough indoors during the pandemic. The autumn 2020 and 2021 snapshots are depressed by that emergency programme rather than reflecting the usual pressures"}

  # Table 244 is the calendar-year version of table 213. Both are building-
  # control "indicators of new supply", not the net additions measure.
