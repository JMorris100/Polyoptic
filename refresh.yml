name: Refresh data

on:
  schedule:
    - cron: "17 6 * * 1"    # 06:17 UTC every Monday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r ingest/requirements.txt

      - name: Run ingest
        run: python ingest/ingest.py

      - name: Commit if anything changed
        run: |
          git config user.name  "polyoptic-bot"
          git config user.email "actions@github.com"
          if git diff --quiet -- data/bundle.json; then
            echo "No change this week."
            exit 0
          fi
          git add data/bundle.json
          git commit -m "Refresh data — $(date -u +%Y-%m-%d)"
          git push
